# 九宝量化 v8.0 — 构建 + 部署（GitHub 云端 ubuntu-latest）
#
# 2026-08-01 周末改造：
#   1) push 事件（cn runner 推 raw_data 或 v6 算法端推 post_close raw_data）
#      改用 --detect-changes：只构建发生变化的那几个 data/*.js，不全站重部署。
#   2) 保留 17:00 CST 盘后算法换算调度：对 post_close 类别做一次 selective build，
#      确保 v6 算法端在非 push 场景下也能被构建到。
#   3) concurrency 保持 serial，防止并发 push 冲突。
#
# 触发策略（2026-08-01 审计修正，2026-08-03 修正 auto-deploy，2026-08-03 扩展风险温度计）：
#   - push raw_data/**  → 检测变化 → 只构建受影响类别（v6 算法端推 raw_data 由此触发）
#   - workflow_run: 🇨🇳 v8 中国数据抓取(cn) / 🌍 v8 实时风险温度计 成功完成后 → 自动构建部署
#     原因：cn runner / 云端 workflow 用 GITHUB_TOKEN push raw_data 不会触发 push 类 workflow，
#     用 workflow_run 原生机制绕过该限制，实现"抓取完成即自动部署"，无需小九手动 dispatch。
#   - workflow_dispatch → 全量构建（人工兜底）
#
# ⚠️ 已移除原 17:00 schedule：它会与 19:15 前尚未完成的算法链竞态，用旧 raw_data
#   先构建部署一版陈旧数据；而算法链 19:15 推送 raw_data 时会经 push 触发本工作流
#   自动重新构建，schedule 纯属冗余且有害，故删除。

name: "☁️ v8 构建部署(云端ubuntu)"

on:
  push:
    branches: [main]
    paths:
      - 'raw_data/**'
      - 'data/**'
      - '!data/freshness_status.json'
      - 'index.html'
      - 'update_v8.py'
      - 'v8_health_check.py'
      - 'v8_cloud_watchdog.py'
      - 'guard_index_sections.py'
      - 'guard_v8_freshness.py'
      - 'v8_deploy_guard.py'
      - 'algorithms/**'
      - 'v8_postclose_guard.py'
      - 'data/.workbuddy/**'   # 自愈调度锁文件改动也会触发重新构建 HEALTH_CHECK.js
  workflow_run:
    workflows:
      - "🇨🇳 v8 中国数据抓取(cn·应急)"
      - "🇨🇳 v8 中国数据抓取(云端)"
      - "☁️ v8 盘后算法链(云端)"
      - "🌍 v8 实时风险温度计"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # v8_health_check.py 查 /actions/runners 需要此权限；不加则 401

concurrency:
  group: v8-build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run 触发时，仅在上游 cn_fetch 成功后才构建；push / workflow_dispatch 始终构建
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # ★ 2026-08-15 根治 build clobber：必须全量克隆（fetch-depth: 0），否则浅克隆
          #   reset --hard FETCH_HEAD 拉不到 cn 单独推送的 5 个 extra 文件（STOCK_RPS 等）
          #   最新 blob，本地副本落后 → ?v 算成陈旧值 → CDN 吐旧副本。全量克隆保证
          #   reset 后本地 data/*.js 与线上严格一致，?v 一律取本地文件即权威。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🛡️ 确保 .nojekyll 存在（防 Jekyll 因 _ 前缀目录报错致整站构建失败）"
        run: |
          if [ ! -f .nojekyll ]; then touch .nojekyll; echo "rebuild missing .nojekyll"; else echo ".nojekyll ok"; fi
          git add -f .nojekyll

      - name: "🛡️ 护栏：校验关键板块未被误删/清空"
        run: python guard_index_sections.py

      - name: "🛡️ 护栏：v6备忘录 防覆盖（缺失/截断自愈 + 缓存击穿）"
        run: python guard_v6_memo.py

      - name: "🏗️ 构建 data/*.js（selective）"
        env:
          # V8_GH_TOKEN 是含 actions:read+list runners 权限的 PAT（已存为 repo secret）。
          # GHA 默认 GITHUB_TOKEN 即便声明 actions:read 也无权列 self-hosted runners。
          # v8_health_check.py 通过 _load_token() 优先选 V8_GITHUB_TOKEN > GITHUB_TOKEN > 本地文件。
          V8_GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
          # ★ 2026-08-15 根治 build clobber：update_v8.py 的 ?v 计算需 GITHUB_TOKEN 才能
          #   取线上真实 data/*.js 内容（git blobs API），避免用落后本地 checkout 算陈旧 ?v。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "调度触发：构建 post_close 类别"
            python update_v8.py --category post_close
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发：全量构建"
            python update_v8.py
          else
            echo "raw_data push 触发：检测变化并 selective build"
            python update_v8.py --detect-changes
          fi

      - name: "🛡️ 部署前校验：关键 data/*.js 非空（防空 raw_data 覆盖成 shell 致整站空）"
        run: python v8_deploy_guard.py

      - name: "📤 部署到 main（GitHub Pages 源）"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ★ 2026-08-15 根治 build clobber：update_v8.py 的 ?v 计算需 GITHUB_TOKEN 才能
          #   取线上真实 data/*.js 内容（git blobs API）对齐 ?v（仅用于 cn 单独推送的 5 个
          #   extra 文件；构建机自身重写的文件用本地新鲜内容）。reconcile_cache_busters.py
          #   步骤已从 build 移除——它在单提交构建里无法同时正确服务「本地新文件」与「线上
          #   extra 文件」，会 clobber update_v8.py 已写对的 ?v。独立 reconcile workflow 仍用
          #   线上做全局自愈（每 15 分钟 + 推送触发）。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # push 被拒后重试时会重新跑 update_v8.py -> v8_health_check.py，必须同样带 token
          V8_GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          git config user.name "v8-cloud-bot"
          git config user.email "v8-bot@users.noreply.github.com"
          REPO="https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git"
          # ⚠️ 不要改回 git rebase：data/*.js 是构建产物，两趟构建并发时 rebase 必然
          #   在生成文件上产生 content conflict -> rebase --abort -> 整个部署失败
          #   （2026-08-04 23:50 实例：data/HEALTH_CHECK.js CONFLICT，部署挂掉）。
          #   正确做法：push 被拒 = 远端已前进，同步远端后用最新 raw_data 重新全量构建，
          #   产物由构建决定而非由合并决定，天然无冲突且不会用旧产物覆盖新数据。
          for i in 1 2 3; do
            # 🔒 取远端最新 main（含阿狸咪/cn 直接推仓的 data/*.js），消除 push 事件
            #   checkout 滞后导致的 ?v 陈旧失配：先 sync 远端再 reconcile，确保 ?v 对齐到
            #   「当前线上最新数据」而非构建机滞后副本（2026-08-15 缓存戳铁律根因修复·续）。
            #   这 5 个文件(FOUR_VOLUME/FOUR_VOLUME_60M/STOCK_RPS/STOCK_STOP_DATA/
            #   FINAL_RECOMMEND_DATA) 只由 cn 直接推，update_v8 不重建，构建机 checkout
            #   若落后 cn 最新推送就会拿到旧内容算旧 ?v → CDN 吐旧副本。先 reset 到
            #   FETCH_HEAD 即拿到 cn 最新版，reconcile 即可对齐。
            git fetch "$REPO" main
            # ★★ 2026-08-18 根因修复：build bot 不要擦除人工前端改动 ★★
            #   `git reset --hard FETCH_HEAD` 会把 index.html 上的人工 UI 修改（如 v6备忘录
            #   iframe 加载兜底、子 tab 顺序调整、卡片增删）全部擦回远端旧版。此处先备份
            #   本地 index.html，reset 后立即恢复；后续 update_v8.py 只会更新 data/*.js
            #   的 ?v 戳、guard_v6_memo.py 只会刷新 v6_memo.html 的戳，不会破坏人工改动。
            cp index.html /tmp/index.html.manual
            git reset --hard FETCH_HEAD
            cp /tmp/index.html.manual index.html
            # 同步 cn runner 单独推送的 5 个 extra 文件（update_v8.py 不重建这些），
            #   确保 ?v 计算基于线上真实最新内容。
            git checkout FETCH_HEAD -- data/FOUR_VOLUME.js data/FOUR_VOLUME_60M.js data/STOCK_RPS.js data/STOCK_STOP_DATA.js data/FINAL_RECOMMEND_DATA.js
            # ★ update_v8.py 是 build 内 ?v 的唯一权威：自身重写过的文件用本地新鲜内容，
            #   cn 单独推送的 5 个 extra 文件用线上真实内容（GITHUB_TOKEN 经 git blobs API）。
            #   二者都已中性化 republish_time 后取 sha1 前 10 位，与独立 reconcile 完全一致。
            #   —— 此处不再跑 reconcile_cache_busters.py（单提交构建里它无法同时正确，会 clobber）。
            # 🔴 2026-08-18 根因修复：sync 远端后必须全量构建。原 --detect-changes 在
            #   `git reset --hard FETCH_HEAD` 后，HEAD~1..HEAD 的 diff 已经看不到 raw_data
            #   变化（变化被包含在更早的远端提交里），导致 detect_changes 返回 0 个变化、
            #   跳过所有 data/*.js 重建 → 盘中数据永远停留在旧版本。注释已要求"全量重建"，
            #   实现却用了 detect_changes，这是实现与注释不一致的致命 bug。
            python update_v8.py
            # ★★ 2026-08-16 根治「逻辑详解页 v6备忘录 一直打不开」★★
            #   根因：上面第 85 行的 guard_v6_memo.py 已正确把 index.html 的
            #   iframe 戳改成 sha10(v6_memo.html)，但紧接着的 `git reset --hard FETCH_HEAD`
            #   把该修正整个擦回远端旧值；而 update_v8.py 只重算 data/*.js 的 ?v、
            #   完全不碰 v6_memo.html 的戳 → 提交出去的 v6 戳永远停在远端旧值，
            #   浏览器/CDN 便一直按旧 URL 吐早已作废的旧副本 → 页面空白。
            #   （独立 reconcile workflow 的正则只匹配 data/[A-Z0-9_]+\.js，也不覆盖 v6_memo，
            #    故此戳无任何自愈网 —— 必须在 reset 之后重跑 guard 才能对齐。）
            #   修复：reset 之后重新执行 guard，使 v6 戳与实际落库内容严格一致。
            python guard_v6_memo.py
            git add -f data/ index.html .nojekyll v6_memo.html v6_memo.golden.html guard_v6_memo.py
            if git diff --cached --quiet; then
              echo "ℹ️ 无数据变化，跳过部署（远端已是最新构建）"
              exit 0
            fi
            git commit -m "v8 build: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            if git push "$REPO" HEAD:main; then
              echo "✅ 已部署 main（第 $i 次尝试，GitHub Pages 自动重建）"; exit 0
            fi
            echo "⚠️ push 被拒（远端已前进），同步远端并按最新 raw_data 全量重建后重试 ($i/3)"
            git fetch "$REPO" main
            # 重试路径同样备份/恢复 index.html，避免人工前端改动被擦除
            cp index.html /tmp/index.html.manual
            git reset --hard FETCH_HEAD
            cp /tmp/index.html.manual index.html
            git checkout FETCH_HEAD -- data/FOUR_VOLUME.js data/FOUR_VOLUME_60M.js data/STOCK_RPS.js data/STOCK_STOP_DATA.js data/FINAL_RECOMMEND_DATA.js
            # 🔴 2026-08-18 根因修复：重试路径同样必须全量构建，不能用 --detect-changes
            #   （原因同上：reset 后 HEAD~1..HEAD 已无法反映 raw_data 的真实变化）。
            python update_v8.py
            # ★ 同上：reset 已擦掉 v6 戳修正，重试路径也必须重跑 guard 对齐（否则重试成功的
            #   那一趟提交仍带旧 v6 戳，v6备忘录继续打不开）。
            python guard_v6_memo.py
          done
          echo "❌ 3 次重试后仍失败"; exit 1
