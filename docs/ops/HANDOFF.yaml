      （`v8_build_deploy.yml` L394：`python v8_verify_layer_parity.py || { echo "::error::跨层一致性校验失败…"; exit 1; }`），
      一旦 `v8_verify_layer_parity.py` 判出「陈旧静默上线」即 `exit 1` ⇒ 整个部署步失败、
      step14「🩺 发布后体检 index.html」连带走 `skipped` ⇒ **本轮构建的产物一律不落地**。
      触发条件是 `STALE_DAYS = 3`（`v8_verify_layer_parity.py` L35）且**与时段无关**
      （L234 注明「data 层陈旧静默上线（stale_data）→ 恒失败（>STALE_DAYS 天，与时段无关）」——
      即盘前/盘中的时段白名单**救不了**这一类）。
      远端实测（2026-09-29 00:40–00:55 CST，全部取 GitHub API + job 原始日志，禁读本机 clone）：
      `v8_build_deploy` 近 12 档 = #8668…#8679，其中 **4 档失败且失败步完全相同（step13）**：
      #8670（head `f56daf1eda`，09-28 15:39:32Z）/ #8674（`25f425528a`，15:52:32Z）/
      #8676（`e1973bbe30`，16:32:00Z）/ #8677（`19509351a9`，16:41:38Z）。
      四档日志判词逐字一致：
      `❌ data 层超过 3 天未更新（raw 无日期字段，属陈旧静默上线）：`
      `- HB_XIAOJIU: data=2026-09-25 21:21:45 已陈旧 4 天`
      `- HB_ALIMI: data=2026-09-25 21:21:45 已陈旧 4 天`
      `- IMA_STRONG_BACKTEST: data=2026-09-25 21:31:06 已陈旧 4 天` + `🛑 陈旧静默上线 3 项，阻断部署/推送。`
