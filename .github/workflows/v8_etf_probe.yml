# 九宝量化 v8.0 — ETF clist 定罪探针（第6版·一次性诊断，验完即删）
#
# 为什么必须用「矩阵 × 独立 runner」：v4/v5 已两次实证**第 1 个请求之后就连续 502**
#   ⇒ 同一 runner 内做多组对照 = 后面全部被自己污染（v4 因此得出全表 502 的废结论）。
#   本版让**每种配置各占一个全新 runner、只发 1 个请求**，从根上消除顺序污染。
#
# v5 已确证的两件事（不再重复测）：
#   ① pz=5000 打在 push2delay 上**真被硬截 100 行**（docstring 说的"硬截"属实）⇒
#      生产必须分页（现为 16 页）⇒ 每页都是一次撞 502 的机会。
#   ② 502 窗口实测：连续 12 次 × 5 秒 **全部 502**（60 秒全程不可用），窗口以分钟计。
#
# 本版要回答：**有没有「1 个请求拿全市场」的稳定组合？**
#   A push2delay + m:1+t:9,m:0+t:9 + pz=5000   （复现基线：预期 100）
#   B push2      + m:1+t:9,m:0+t:9 + pz=5000   （主站是否也截 100？）
#   C push2      + b:MK0021..MK0024 + pz=50000 （akshare 口径：能否一次拿全 1600 只？）
#   D push2delay + b:MK0021..MK0024 + pz=50000 （同上，但走镜像）
#   E akshare fund_etf_spot_em()               （生产改造前的原方案，今日 11:31 曾成功出 1602 只）
#   F push2      + m:1+t:9,m:0+t:9 + po=0      （升序方向是否可用）
#   → 记录 data.total（东财自报总数）与 diff 行数：两者不等即为"被截"的硬证据。

name: "🔬 v8 ETF clist 探针v6(矩阵×独立runner·1请求取全判定)"

on:
  workflow_dispatch: {}

concurrency:
  group: v8_etf_probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A_delay_cmb_f62_pz5000
            base: "https://push2delay.eastmoney.com"
            fs: "m:1+t:9,m:0+t:9"
            fid: "f62"
            pz: "5000"
            po: "1"
          - name: B_push2_cmb_f62_pz5000
            base: "https://push2.eastmoney.com"
            fs: "m:1+t:9,m:0+t:9"
            fid: "f62"
            pz: "5000"
            po: "1"
          - name: C_push2_bmk_f62_pz50000
            base: "https://push2.eastmoney.com"
            fs: "b:MK0021,b:MK0022,b:MK0023,b:MK0024"
            fid: "f62"
            pz: "50000"
            po: "1"
          - name: D_delay_bmk_f62_pz50000
            base: "https://push2delay.eastmoney.com"
            fs: "b:MK0021,b:MK0022,b:MK0023,b:MK0024"
            fid: "f62"
            pz: "50000"
            po: "1"
          - name: E_akshare_fund_etf_spot_em
            base: "AKSHARE"
            fs: ""
            fid: ""
            pz: ""
            po: ""
          - name: F_push2_cmb_f62_pz5000_po0
            base: "https://push2.eastmoney.com"
            fs: "m:1+t:9,m:0+t:9"
            fid: "f62"
            pz: "5000"
            po: "0"
    steps:
      - name: "📥 checkout"
        uses: actions/checkout@v4

      - name: "🐍 装依赖"
        run: python3 -m pip install --quiet --disable-pip-version-check requests pandas akshare

      - name: "🔬 单请求实测（本 runner 只发这一个请求）"
        shell: bash
        env:
          CFG_NAME: ${{ matrix.name }}
          CFG_BASE: ${{ matrix.base }}
          CFG_FS: ${{ matrix.fs }}
          CFG_FID: ${{ matrix.fid }}
          CFG_PZ: ${{ matrix.pz }}
          CFG_PO: ${{ matrix.po }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time, sys

          name = os.environ["CFG_NAME"]
          print("══════════════ %s ══════════════" % name, flush=True)
          res = {"cfg": name}
          t0 = time.time()
          try:
              if os.environ["CFG_BASE"] == "AKSHARE":
                  import akshare as ak
                  df = ak.fund_etf_spot_em()
                  res["type"] = "akshare"
                  res["rows"] = int(len(df))
                  res["cols"] = list(df.columns)[:14]
                  netcol = next((c for c in df.columns if "主力净流入" in str(c) and "净额" in str(c)), None)
                  if netcol is None:
                      netcol = next((c for c in df.columns if "主力净流入" in str(c)), None)
                  res["net_col"] = netcol
                  if netcol:
                      v = df[netcol].astype(float)
                      res["sum_net_yi"] = round(float(v.sum()) / 1e8, 3)
                  codes = df["代码"].astype(str).tolist() if "代码" in df.columns else []
                  res["sh"] = sum(1 for c in codes if c[:1] in ("5", "6"))
                  res["sz"] = sum(1 for c in codes if c[:1] in ("1", "0", "3"))
                  res["sample"] = codes[:8]
              else:
                  import requests
                  try:
                      requests.packages.urllib3.disable_warnings()
                  except Exception:
                      pass
                  p = {"pn": "1", "pz": os.environ["CFG_PZ"], "po": os.environ["CFG_PO"], "np": "1",
                       "fltt": "2", "invt": "2", "ut": "b2884a393a59ad64002292a3e90d46a5",
                       "fid": os.environ["CFG_FID"], "fs": os.environ["CFG_FS"], "stat": "1",
                       "fields": "f12,f14,f62", "_": int(time.time() * 1000)}
                  url = os.environ["CFG_BASE"].rstrip("/") + "/api/qt/clist/get"
                  r = requests.get(url, params=p, timeout=25, verify=False,
                                   headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                                            "Referer": "https://quote.eastmoney.com/"})
                  res["http"] = r.status_code
                  res["bytes"] = len(r.content)
                  try:
                      d = r.json()
                      data = d.get("data") or {}
                      diff = data.get("diff")
                      rows = diff if isinstance(diff, list) else []
                      res["rc"] = d.get("rc")
                      res["api_total"] = data.get("total")
                      res["rows"] = len(rows)
                      codes = [str(x.get("f12")) for x in rows if isinstance(x, dict)]
                      res["sh"] = sum(1 for c in codes if c[:1] in ("5", "6"))
                      res["sz"] = sum(1 for c in codes if c[:1] in ("1", "0", "3"))
                      res["sample"] = codes[:8]
                      nets = []
                      for x in rows:
                          try:
                              nets.append(float(x.get("f62") or 0.0))
                          except Exception:
                              pass
                      res["sum_net_yi"] = round(sum(nets) / 1e8, 3)
                  except Exception:
                      res["json"] = False
                      res["head"] = r.text[:90].replace("\n", " ")
          except Exception as e:
              res["err"] = "%s: %s" % (type(e).__name__, str(e)[:120])
          res["secs"] = round(time.time() - t0, 1)
          print("RESULT " + json.dumps(res, ensure_ascii=False), flush=True)
          print("══════════════ END %s ══════════════" % name, flush=True)
          PYEOF
