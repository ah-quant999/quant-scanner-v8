# 九宝量化 v8.0 — STOCK_QUOTE 轻量 refresh
#
# 🆕 2026-08-18 阿狸咪新建：解决"STOCK_QUOTE.js 0 字节 → 全站个股查询无报价"问题。
#   背景：fetch_stock_quote_v8.py 仅在 v8_algo_cloud 整套算法链（cron 18:30 每天）里跑一次，
#   8/15 周五 18:30 最后一次成功后，8/16-17 调度丢触发或写入失败 → data/STOCK_QUOTE.js 0 字节。
#   表现：TOP5_TRACK 前 3 只（06862/301583/002552）9 天 last_pct=null + 全站个股查询无报价。
#   解决：本 workflow 单独跑 fetch_stock_quote_v8.py（5-10 分钟），cron 兜底 17:00 盘后
#   + workflow_dispatch 手动触发应急。比 v8_algo_cloud 整套 1-2h 轻量得多。
#
# 调度策略：
#   - 每天 17:00 盘后（cn_fetch 17:20 龙虎榜之前，akshare 抓当日收盘数据）
#   - workflow_dispatch 应急手动触发
#   - 内部走 A 股交易日历 gate，非交易日自动跳过（与 v8_algo_cloud 一致）
#
# ⚠️ 必须用 [self-hosted, cn] runner：中国 IP 才能稳定抓 akshare 新浪/东财接口
#   （境外 runner 会被连接重置或限流）。
# ⚠️ 同步源码走 GitHub REST API（api.github.com 畅通），绕开 cn runner 的 git 协议墙。
#   模板完全复用 v8_algo_cloud.yml 的 sync_src_v8cloud.py。
#
# 输出：
#   - raw_data/stock_quote.json  (5.25MB / 9915 只)
#   - data/STOCK_QUOTE.js  (供前端嵌入)

name: "📈 v8 STOCK_QUOTE 轻量 refresh"

schedule:
  # 盘后兜底：17:00 CST（早于 cn_fetch 17:20 龙虎榜，akshare 当日收盘已稳定）
  - cron: '0 9 * * *'
workflow_dispatch:
    inputs:
      skip_trading_day_gate:
        description: '跳过交易日历 gate（应急手动触发时用）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: v8-stock-quote-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, cn]
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # safe-delete 守卫：cn runner 默认 50 会被拦，抬到 1000
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 1000
    defaults:
      run:
        shell: bash
    steps:
      # 复用 v8_algo_cloud 的源码同步代码（绕开 cn runner git 墙）
      - name: "📥 经 GitHub API 同步源码（绕开 cn git 墙）"
        run: |
          set -e
          cat > "$RUNNER_TEMP/sync_src_v8cloud.py" <<'PYEOF'
          import os, base64, json, hashlib, urllib.request, time, sys
          token = os.environ["GITHUB_TOKEN"]
          REPO = "ah-quant999/quant-scanner-v8"
          H = {"Authorization": "Bearer " + token,
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28"}

          def local_blob_sha(path):
              try:
                  data = open(path, "rb").read()
              except Exception:
                  return None
              h = hashlib.sha1()
              h.update(("blob %d\0" % len(data)).encode())
              h.update(data)
              return h.hexdigest()

          def sha_of(data):
              h = hashlib.sha1()
              h.update(("blob %d\0" % len(data)).encode())
              h.update(data)
              return h.hexdigest()

          def get_json(url, tries=6):
              last = None
              for i in range(tries):
                  try:
                      return json.load(urllib.request.urlopen(
                          urllib.request.Request(url, headers=H), timeout=120))
                  except Exception as e:
                      last = e
                      print("  retry %d: %s" % (i + 1, e), flush=True)
                      time.sleep(min(2 ** i, 20))
              raise SystemExit("API fetch failed: %s (%s)" % (url, last))

          def fetch_blob(sha, tries=6):
              url = "https://api.github.com/repos/%s/git/blobs/%s" % (REPO, sha)
              raw_h = dict(H); raw_h["Accept"] = "application/vnd.github.raw"
              last = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=raw_h)
                      with urllib.request.urlopen(req, timeout=180) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      print("  blob retry %d: %s" % (i + 1, e), flush=True)
                      time.sleep(min(2 ** i, 20))
              raise SystemExit("blob fetch failed: %s (%s)" % (url, last))

          ref_data = get_json("https://api.github.com/repos/%s/git/ref/heads/main" % REPO)
          head_sha = ref_data["object"]["sha"]
          commit = get_json("https://api.github.com/repos/%s/git/commits/%s" % (REPO, head_sha))
          tree = get_json("https://api.github.com/repos/%s/git/trees/%s?recursive=1" % (REPO, commit["tree"]["sha"]))
          for item in tree.get("tree", []):
              if item["type"] != "blob":
                  continue
              path = item["path"]
              l_sha = local_blob_sha(path)
              if l_sha == item["sha"]:
                  continue
              data = fetch_blob(item["sha"])
              if sha_of(data) != item["sha"]:
                  raise SystemExit("blob sha mismatch: %s" % path)
              os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
              with open(path, "wb") as f:
                  f.write(data)
              print("  synced: %s (%d bytes)" % (path, len(data)))
          print("sync_src OK, HEAD=%s" % head_sha)
          PYEOF
          python "$RUNNER_TEMP/sync_src_v8cloud.py"

      - name: "🐍 安装 akshare 依赖（轻量：仅本次需要的）"
        run: |
          set -e
          ok=0
          for src in "" "-i https://pypi.tuna.tsinghua.edu.cn/simple" "-i https://mirrors.aliyun.com/pypi/simple/"; do
            for try in 1 2; do
              if pip install -q --retries 2 --timeout 40 $src akshare pandas numpy requests; then
                ok=1; break 2
              fi
              echo "  pip retry $try (src='$src')"
            done
          done
          if [ "$ok" != "1" ]; then
            echo "::error::依赖安装失败"
            exit 1
          fi
          python -c "import akshare, pandas, numpy, requests; print('deps ready')"

      - name: "📅 交易日历 gate（非交易日自动跳过）"
        id: trading
        run: |
          if [ "${{ github.event.inputs.skip_trading_day_gate }}" = "true" ]; then
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
            echo "  ⚡ 应急模式：跳过交易日历 gate（手动触发 + skip=true）"
          else
            python algorithms/check_trading_day.py
          fi

      - name: "🧮 跑 fetch_stock_quote_v8.py（5-10 分钟）"
        if: steps.trading.outputs.is_trading_day == 'true'
        run: |
          set +e
          cd algorithms && python fetch_stock_quote_v8.py
          rc=$?
          echo "fetch_stock_quote_v8 exit: $rc"
          # 单独跑 fetch 时，merge_fundamental_quality 可能因 raw_data/fundamental_quality.json
          # 缺失而跳过（脚本内已 try/except），不影响主产物。我们对失败也兜底：raw_data 有内容即可。
          if [ ! -s ../raw_data/stock_quote.json ] || [ ! -s ../data/STOCK_QUOTE.js ]; then
            echo "::error::输出缺失：raw_data/stock_quote.json 或 data/STOCK_QUOTE.js 之一为空"
            ls -la ../raw_data/stock_quote.json ../data/STOCK_QUOTE.js 2>&1 || true
            exit 1
          fi
          echo "✅ raw_data/stock_quote.json: $(wc -c < ../raw_data/stock_quote.json) bytes"
          echo "✅ data/STOCK_QUOTE.js:       $(wc -c < ../data/STOCK_QUOTE.js) bytes"
          exit 0

      - name: "📤 推送 raw_data/stock_quote.json + data/STOCK_QUOTE.js（Contents API，绕开 cn git 墙）"
        if: steps.trading.outputs.is_trading_day == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request, urllib.error, hashlib, time
          TOK = os.environ["GITHUB_TOKEN"]
          REPO = "ah-quant999/quant-scanner-v8"
          H = {"Authorization": "Bearer " + TOK,
               "Content-Type": "application/json",
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28"}

          def api(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=H, method=method)
              for i in range(5):
                  try:
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code in (409, 422) and method == "GET":
                          # GET should not 409; re-raise
                          raise
                      if e.code in (409, 422) and method == "PUT":
                          # sha mismatch, refetch and retry
                          pass
                      if i == 4:
                          raise
                      time.sleep(2 ** i)
                  except Exception:
                      if i == 4:
                          raise
                      time.sleep(2 ** i)

          files = [
              ("raw_data/stock_quote.json", "raw_data/stock_quote.json"),
              ("data/STOCK_QUOTE.js", "data/STOCK_QUOTE.js"),
          ]
          for local, remote in files:
              if not os.path.exists(local):
                  print(f"  ❌ {local} 不存在，跳过")
                  continue
              with open(local, "rb") as f:
                  content = f.read()
              print(f"  push {remote}  ({len(content)} bytes)")
              # get existing sha
              get_url = f"https://api.github.com/repos/{REPO}/contents/{remote}"
              try:
                  existing = api("GET", get_url)
                  sha = existing.get("sha")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      sha = None
                  else:
                      raise
              payload = {
                  "message": "chore(stock-quote): refresh STOCK_QUOTE via v8_stock_quote_refresh",
                  "content": base64.b64encode(content).decode(),
                  "branch": "main",
              }
              if sha:
                  payload["sha"] = sha
              put_url = f"https://api.github.com/repos/{REPO}/contents/{remote}"
              api("PUT", put_url, payload)
              print(f"    ✅ pushed {remote}")
          print("push done")
          PY

      # 🔴 2026-08-18 与 v8_algo_cloud 一致：刷新 data/STOCK_QUOTE.js 后，必须更新
      #   index.html 里 ?v= 内容 sha，否则 CDN 继续吐旧 STOCK_QUOTE 副本。
      - name: "🔄 同步 STOCK_QUOTE.js 缓存戳 ?v 并推送 index.html"
        if: steps.trading.outputs.is_trading_day == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, re, json, base64, urllib.request, urllib.error
          TOK = os.environ["GITHUB_TOKEN"]
          REPO = "ah-quant999/quant-scanner-v8"
          H = {"Authorization": "Bearer " + TOK,
               "Content-Type": "application/json",
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28"}

          def api(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=H, method=method)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)

          # 1) 算 STOCK_QUOTE.js 内容 sha1（取前 10 位，?v= 约定）
          with open("data/STOCK_QUOTE.js", "rb") as f:
              content_sha = __import__("hashlib").sha1(f.read()).hexdigest()[:10]
          print(f"  new STOCK_QUOTE.js sha10 = {content_sha}")

          # 2) 读 index.html，找 STOCK_QUOTE.js?v=xxxxxx 替换
          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()
          # 匹配: <script src="data/STOCK_QUOTE.js?v=..."></script>
          pattern = r'(<script[^>]*src=["\']data/STOCK_QUOTE\.js\?v=)([a-f0-9]+)(["\'])'
          new_html, n = re.subn(pattern, lambda m: m.group(1) + content_sha + m.group(3), html)
          if n == 0:
              print("  ⚠️ index.html 中未找到 STOCK_QUOTE.js?v= 引用，可能已被外链替换；跳过 ?v 更新")
          elif new_html == html:
              print(f"  STOCK_QUOTE.js?v= 已是 {content_sha}，无需变更")
          else:
              print(f"  替换了 {n} 处 STOCK_QUOTE.js?v= → {content_sha}")
              # 3) 推送 index.html
              idx_url = f"https://api.github.com/repos/{REPO}/contents/index.html"
              try:
                  existing = api("GET", idx_url)
                  sha = existing.get("sha")
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      sha = None
                  else:
                      raise
              payload = {
                  "message": f"chore(cache): STOCK_QUOTE.js?v={content_sha}",
                  "content": base64.b64encode(new_html.encode("utf-8")).decode(),
                  "branch": "main",
              }
              if sha:
                  payload["sha"] = sha
              api("PUT", idx_url, payload)
              print(f"  ✅ index.html 已推送（?v={content_sha}）")
          PY

      - name: "✅ 完成摘要"
        if: steps.trading.outputs.is_trading_day == 'true'
        run: |
          echo "=== STOCK_QUOTE 轻量 refresh 完成 ==="
          ls -la data/STOCK_QUOTE.js raw_data/stock_quote.json
          echo "==="
          echo "下次 v8_build_deploy 会自动把新 STOCK_QUOTE.js 嵌入 index.html（?v 已对齐）"
