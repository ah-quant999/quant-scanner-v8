  - id: factorlab-conflict-tree-pollution
    priority: P2
    owner: 小九
    status: todo
    what: >
      **上项（`factorlab-commit-pathspec`）的次生风险**，补 pathspec 后**仍未消除**（小九 12:02 实读 L708–L747 发现）：
      L725 `git checkout --theirs .` 会把 **stale 的 stash 版本写回整个工作树**
      （不只是 3 个目标文件）。补 pathspec 只保证「不被提交出去」，
      **救不了「本地工作树被污染」**。
      二次致害路径：`v8_build_deploy.yml` 的构建步用 `--detect-changes`
      ⇒ 它读的是**工作树变更集** ⇒ 被写回的 stale 文件会被判为「有变化」而**触发重建**，
      重建产物把 stale 内容带回线上（绕开了 pathspec 的保护）。
      ⚠️ 触发条件同前：需 `stash push` 成功 **且** `stash pop` 冲突（苛刻，故 P2）。
    fix: >
      结构性解耦「产物保护」与「脏树处理」：
      ① 脚本算出产物后先 `cp` 到**仓库外**临时目录；
      ② `stash push` 不再需要保护它们 ⇒ 冲突分支可**直接 `stash drop` + `reset --hard FETCH_HEAD`**，
         不再需要 `checkout --theirs .`（该行是污染源）；
      ③ 从仓外临时目录 `cp` 回 3 个产物，`add` + 带 pathspec 的 `commit`。
      ⇒ 一次性消除「污染工作树」与「stale 覆盖」两个形态。
    verify_how: >
      ① 静态：确认改写后代码中不再有 `checkout --theirs .` 与裸 `add .`；
      ② 真跑：造一次 `stash pop` 冲突（本地留一个与远端冲突的同名改动 + 运行脚本），
         断言冲突分支后 `git status --porcelain` 里**只**有 3 个目标文件被改。
    updated: "2026-09-21 12:02"

