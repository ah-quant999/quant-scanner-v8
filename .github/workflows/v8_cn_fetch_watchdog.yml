# 九宝量化 v8.0 — 数据抓取云端看门狗（自愈·兜底）
#
# 🔴 2026-09-01 根因修复（一劳永逸）：
#   主 workflow v8_cn_fetch_cloud.yml 的 5 条 cron 长期被 GitHub schedule 高负载整段漏触发
#   （实测 2026-09-01 全天 0 次 schedule 触发，而 08-31 正常）。单靠 workflow 内置 cron 不可靠。
#   本看门狗不依赖"准点"，而是**基于状态（线上数据是否陈旧）**自愈：
#     - 每 30 分（交易日 08:00-17:30 CST）跑一次轻量检查；
#     - 拉取线上 data/HEALTH_CHECK.js，取最新 last_update 与当前 CST 比较；
#     - 若处于交易时段且对应类别数据陈旧（盘中>35min / 盘前盘后>60min），
#       直接在云端用 gh workflow run 派发 v8_cn_fetch_cloud.yml（category 自适应）。
#   全云端（ubuntu-latest），小九机仅在云端连续失败时才作人工后备，不依赖其定时。
#   与主 workflow 的 cron 互为冗余：只要任意一条触发，数据就不会长时间空窗。

name: "🐕 v8 数据抓取看门狗(云端自愈)"

on:
  schedule:
    # 交易日 08:00-21:30 CST 每 30 分（UTC 00:00-13:30）。覆盖盘前/盘中/盘后+晚间全窗口。
    - cron: '*/30 0-13 * * 1-5'
  workflow_dispatch:
    inputs:
      force_category:
        description: '强制派发类别（留空=按陈旧度自适应）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write   # 用于 gh workflow run 派发主抓取

concurrency:
  group: v8-cn-fetch-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 自检数据新鲜度并兜底派发
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, re, subprocess, datetime, sys

          # 当前 CST 时间
          cst = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          dow = cst.weekday()            # 0=周一
          hhmm = cst.hour * 60 + cst.minute
          print(f"[watchdog] CST={cst.strftime('%Y-%m-%d %H:%M')} dow={dow} hhmm={hhmm}")

          force = "${{ github.event.inputs.force_category }}".strip()

          # 仅交易日（周一至周五）
          if dow >= 5 and not force:
              print("[watchdog] 非交易日，跳过"); sys.exit(0)

          def in_window(a, b):
              return a <= hhmm <= b

          # 交易时段 → 自适应类别
          cat = None
          if force:
              cat = force
          elif in_window(8*60+25, 9*60):        # 08:25-09:00 盘前
              cat = "premarket"
          elif in_window(9*60, 11*60+30):       # 09:00-11:30 上午盘中
              cat = "intraday"
          elif in_window(13*60, 15*60+30):      # 13:00-15:30 下午盘中
              cat = "intraday"
          elif in_window(17*60, 17*60+40):      # 17:00-17:40 盘后
              cat = "post_close"
          elif in_window(17*60+41, 21*60+30):   # 17:41-21:30 晚间盘后（2026-09-03 阿狸咪：补晚间空窗）
              cat = "post_close"
          else:
              print("[watchdog] 非交易时段，跳过"); sys.exit(0)

          # 🔴 2026-09-02 根治（涨停热力静默陈旧近 3 小时事故）：
          #    原逻辑只读 HEALTH_CHECK.js 单一时间戳判断"数据是否新鲜"，存在系统性盲区——
          #    HEALTH_CHECK 由 cn_fetch 每轮**结尾**刷新，即使该轮个别数据文件 blob 上传
          #    HTTP 500 失败被跳过（见 api_push_raw.py 的 failed_paths 分支），
          #    HEALTH_CHECK 依然"新鲜"，看门狗于是永远判定"无需派发"，坏文件持续陈旧无人察觉。
          #    实测 2026-09-02：涨停热力卡 08:45 盘前值近 3 小时，而 HEALTH_CHECK 刷到 10:18。
          #    改为：按类别并行抽查多个代表性数据文件，取【最旧】者作为判据，
          #          任一文件陈旧即派发 —— 杜绝"整体健康、局部坏死"。
          BASE_URL = "https://ah-quant999.github.io/quant-scanner-v8/data/"
          PROBE = {
              "intraday": ["LIMIT_UP_HEATMAP.js", "CONCEPT_RANKING.js", "CAPITAL_FLOW_DATA.js",
                           "SECTOR_FUND_FLOW.js", "INDEX_QUOTES.js"],
              "premarket": ["JUDGMENT_DATA.js", "CRISIS_DATA.js", "LIMIT_UP_HEATMAP.js"],
              "post_close": ["LHB_DATA.js", "CANDIDATE_QUOTES.js", "CAPITAL_FLOW_DATA.js"],
          }
          files = PROBE.get(cat) or ["LIMIT_UP_HEATMAP.js"]
          thr = 35 if cat == "intraday" else 60
          PAT = re.compile(r'"?update_time"?\s*[:=]\s*"([^"]+)"')

          def already_running():
              """派发前确认没有正在跑/排队的 cn_fetch run，避免重复排队互相拖累。"""
              try:
                  import os as _os
                  rq = urllib.request.Request(
                      "https://api.github.com/repos/ah-quant999/quant-scanner-v8"
                      "/actions/workflows/v8_cn_fetch_cloud.yml/runs?per_page=5",
                      headers={"User-Agent": "Mozilla/5.0",
                               "Authorization": "Bearer " + _os.environ.get("GH_TOKEN", "")})
                  j = json.loads(urllib.request.urlopen(rq, timeout=20).read())
                  return sum(1 for x in j.get("workflow_runs", []) if x.get("status") != "completed")
              except Exception:
                  return 0

          stale, newest = [], None
          for fn in files:
              try:
                  r2 = urllib.request.Request(BASE_URL + fn, headers={"User-Agent": "Mozilla/5.0"})
                  t2 = urllib.request.urlopen(r2, timeout=20).read().decode("utf-8", "replace")
                  mm = PAT.search(t2)
                  if not mm:
                      print(f"[watchdog]   ? {fn}: 无 update_time 字段，跳过"); continue
                  dt = datetime.datetime.strptime(mm.group(1)[:19], "%Y-%m-%d %H:%M:%S")
                  if newest is None or dt > newest: newest = dt
                  age = (cst.replace(tzinfo=None) - dt).total_seconds() / 60
                  if age > thr:
                      stale.append((fn, age))
                      print(f"[watchdog]   ✗ {fn}: {dt} ({age:.0f}min 陈旧)")
                  else:
                      print(f"[watchdog]   ✓ {fn}: {dt} ({age:.0f}min)")
              except Exception as e:
                  print(f"[watchdog]   ! {fn}: 读取失败 {e}")

          if newest is None:
              print(f"[watchdog] 无法解析任何数据时间戳，保守派发 {cat}")
              if not already_running():
                  subprocess.run(["gh", "workflow", "run", "v8_cn_fetch_cloud.yml",
                                  "-f", f"category={cat}"], check=False)
              sys.exit(0)

          if stale:
              print(f"[watchdog] ❌ {len(stale)}/{len(files)} 个文件陈旧（阈值 {thr}min），准备派发 {cat}")
              n = already_running()
              if n:
                  print(f"[watchdog]    云端已有 {n} 个 run 在跑/排队，本轮不重复派发")
              else:
                  r = subprocess.run(["gh", "workflow", "run", "v8_cn_fetch_cloud.yml",
                                      "-f", f"category={cat}"], capture_output=True, text=True, check=False)
                  print(r.stdout.strip(), r.stderr.strip())
              # ::error 注解：坏死文件在 Actions UI 直接标红，不再静默（原代码只 print，无人知晓）
              print("::error title=数据陈旧::" +
                    ", ".join(f"{fn}({a:.0f}min)" for fn, a in stale))
          else:
              print(f"[watchdog] ✅ {len(files)} 个文件全部新鲜（最新 {newest}，阈值 {thr}min），无需派发")
          PY
