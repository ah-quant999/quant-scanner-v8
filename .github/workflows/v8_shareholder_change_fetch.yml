# 九宝量化 v8.0 — 股东增减持·结构化监控 fetcher 调度（cn runner）
#
# 2026-11-08 主人令：新增「股东增减持·结构化监控」卡（盘后数据页），数据由本链定时抓取。
#   数据源 = 东方财富数据中心·股东增减持（RPT_SHARE_HOLDER_INCREASE，与 fetch_dajijin_reduction.py
#   同源报表），但**不加 HOLDER_NAME 过滤**，拉全市场增减持并聚合成 增持榜/减持榜/行业聚焦。
#   与「重要公告速览」（公告标题标签）互补，非重复。
#
# 时点：工作日 20:30 CST（= UTC 12:30）。选此点理由同 v8_dajijin_fetch：
#   ① 减持/增持公告披露高峰 16:00–19:00 ⇒ 20:30 当日基本发完；
#   ② 避开盘中写仓窗口，不碰 index.html；
#   ③ 与 LHB 链(17:30)/algo_run 链(18:30)/dajijin 链(20:30) 错开，降低推仓竞争。
#
# 安全铁律（与 v8_dajijin_fetch.yml 同步）：
#   1. 严禁 actions/checkout / rm -rf / git clean -fdx（cn runner 系统级拦截，会挂 job）；
#   2. 严禁 git clone/fetch（cn runner 到 github.com:443 被连接重置），源码同步走 Contents API；
#   3. 单一职责：只产出并推送 data/SHAREHOLDER_CHANGE.js，不动任何其他文件。
#
# ⚠️ 空提交保护：推送前比对线上 blob 与本地内容，相同即 SKIP（见「内容比对」步骤），
#   防空提交触发 v8_build_deploy 全量重建。
name: "📊 v8 股东增减持 fetcher (cn runner)"

on:
  schedule:
    # 工作日 20:30 CST（UTC 12:30）。周末不触发（公告极少且非交易口径）。
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_trading_day_gate:
        description: "应急手动调用时绕过交易日闸（true 仅供非交易日补算）"
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: write

concurrency:
  group: v8-shc-fetch
  cancel-in-progress: false

jobs:
  shc-only:
    runs-on: [self-hosted, cn]
    # 🔴 safe-delete 批量删除守卫阈值必须显式设 2000（cn runner 为 Windows，不设则吃默认 50）。
    env:
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 2000
      # 🔴 cn runner（Windows）默认 GBK —— 本脚本打印中文会 UnicodeEncodeError('gbk') 崩链。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    timeout-minutes: 20
    steps:
      - name: "📝 Sync source (Contents API)"
        shell: powershell
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'ah-quant999/quant-scanner-v8'
          $headers = @{
            'User-Agent'    = 'v8-shc-fetcher'
            'Accept'        = 'application/vnd.github+json'
            'Authorization' = "Bearer $env:GH_PAT"
          }
          # [ascii] Do NOT use `Accept: application/vnd.github.raw`: it 302-redirects to
          #   raw.githubusercontent.com, which may be wholly unreachable => guaranteed failure.
          $files = @('algorithms/fetch_shareholder_change.py', 'scripts/api_put_file.py', 'scripts/shareholder_change_need_push.py')
          foreach ($f in $files) {
            $url = "https://api.github.com/repos/$repo/contents/$f`?ref=main"
            try {
              $r = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 60 -Method Get
              $b64 = ($r.content -replace "\s", "")
              $bytes = [Convert]::FromBase64String($b64)
              $dir = Split-Path $f -Parent
              if ($dir) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
              [System.IO.File]::WriteAllBytes($f, $bytes)
              Write-Host "[ok] fetched $f ($($bytes.Length) bytes)"
            } catch {
              Write-Host "[warn] API fetch failed for $f : $_" -ForegroundColor Yellow
            }
          }
          if (-not (Test-Path 'algorithms/fetch_shareholder_change.py')) {
            Write-Host "[fatal] fetcher scripts not present; chain cannot continue" -ForegroundColor Red
            exit 1
          }

      - name: "📊 Run fetch_shareholder_change.py"
        id: gen
        shell: powershell
        run: |
          $skip = "${{ github.event.inputs.skip_trading_day_gate || 'false' }}"
          if ($skip -eq 'true') {
            Write-Host "skip_trading_day_gate=true: force run"
          } else {
            $dow = (Get-Date).DayOfWeek.value__
            if ($dow -eq 0 -or $dow -ge 6) { Write-Host "[skip] weekend, exit ok"; exit 0 }
          }
          cd $env:GITHUB_WORKSPACE
          python algorithms/fetch_shareholder_change.py --window 120
          if ($LASTEXITCODE -ne 0) { Write-Host "[fatal] fetcher returned non-zero" -ForegroundColor Red; exit 1 }
          if (-not (Test-Path 'data/SHAREHOLDER_CHANGE.js')) {
            Write-Host "[skip] no output file (no records today; script deliberately writes no empty shell, keeps existing online data)"
            exit 0
          }
          Write-Host "[ok] data/SHAREHOLDER_CHANGE.js ready"

      - name: "🔍 Content diff (skip if identical)"
        id: diff
        shell: powershell
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          cd $env:GITHUB_WORKSPACE
          $out = python scripts/shareholder_change_need_push.py 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'NEED_PUSH=1') { "need=1" | Out-File -FilePath "_shc_need.txt" -Encoding ascii }
          else { "need=0" | Out-File -FilePath "_shc_need.txt" -Encoding ascii }

      - name: "📤 Push data/SHAREHOLDER_CHANGE.js"
        if: always()
        shell: powershell
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          cd $env:GITHUB_WORKSPACE
          $need = (Get-Content '_shc_need.txt' -ErrorAction SilentlyContinue) -join ''
          if ($need -notmatch 'need=1') {
            Write-Host "[skip] content identical to remote; no push (avoid an empty commit triggering a full rebuild)"
            exit 0
          }
          python scripts/api_put_file.py data/SHAREHOLDER_CHANGE.js "data: shareholder change monitor refresh ($(Get-Date -Format 'yyyy-MM-dd HH:mm') CST)"
          if ($LASTEXITCODE -ne 0) { Write-Host "[warn] push failed (non-blocking; retried next round)" -ForegroundColor Yellow }
