  - id: diagnostics-info-status-leak
    priority: P1
    owner: 小九
    status: done
    what: >
      运维面板「失败/诊断详情」把**第五态 `info`** 误渲染成「待更新」。
      后端 `v8_health_check.py::build_report` 于 2026-09-15 新增 info 桶（其注释原文
      「info 桶（真·不适用，非失败）」，不计 fail、不拉红 overall），但前端
      `index.html::_renderOpDiagnostics` 的状态过滤仍停在「四态」（ok/limited/warn/fail），
      **漏接 info** ⇒ info 项落进 `else` 分支被显示成「待更新」。
      实测病灶（2026-09-21 12:43:32 线上 `HEALTH_CHECK.js`）：`local_sync` status=info、
      message「CI 环境（一次性浅克隆）内本项语义不成立，跳过」，被渲染成
      「文件 local_sync 待更新：最后更新 -- · CI 环境（一次性浅克隆）内本项语义不成立，跳过」
      —— **文案自带「跳过」却被列为「待更新」**，自相矛盾且常驻诊断区。
      属「后端发了前端没接的 status」家族（后端注释自己就警告过 `other>0` 即此症）。
      同族普查（2026-09-21 线上真身实测）发现**逻辑详解页更严重**：`logic.html` 对第五态的
      处理**一处都没有**（`status === 'info'` 与 `status === 'limited'` 计数均为 0），后果三连：
      ① `renderHealthCheck` 网格四色三元链把 info/limited/未知全落 else ⇒ 渲染成**红色 ✗**
      （比 index.html 的「待更新」更误）；② summary 只列 ok/warn/fail ⇒ 分项之和 ≠ total
      （后端特意算 limited/info/other 就是为了对账）；③ 诊断区黑名单只排除 ok
      ⇒ warn/limited/info 全进诊断区。
      另有独立真 bug（与 info 无关）：两页 `setRow` 均用 class `s-fail`，而 CSS 里
      **只有 .s-ok/.s-warn/.s-err/.s-off**（`.s-fail` 定义数 = 0）⇒ **失败时圆点无色**。
      ⚠️ 与本批另一项（baihechou）性质相反：那条是**真红**，本条是**真误显**。
    fix: >
      **六处同修**（两页各三处 + 后端一处）。核心纪律：**黑名单 → 白名单** —— 本 bug 的
      复发机制正是「后端一加状态、前端黑名单就漏一个」⇒ 一律改为「诊断区只列 fail、
      颜色/文案走五态映射表 + 中性灰兜底」，未来新增状态默认不误红、也不静默漏掉。
      index.html（3 处）：
      ① `_renderOpDiagnostics` 过滤行由黑名单（只排除 ok/limited/warn）改为
         `if(!it || it.status !== 'fail') return;`；
      ② 同函数 `setRow` 改五态映射：`.s-err` 真红（取代无定义的 `s-fail`）、
         `info`→`.s-off`+「不适用」、`limited`→「受限」、未知→中性「未知」；
      ③ 上方注释「状态列另有 s-ok/s-fail/s-warn 三色点」类名同步更正为 s-ok/s-warn/s-err。
      logic.html（4 处）：
      ④ **补入与 index.html 逐字同源的** `V8_STATUS_VISUAL` + `_v8StatusVisual()`——
         logic.html 此前完全没有这套机制（实测计数 = 0），网格四色改为消费它；
      ⑤ 同函数 summary 行补 `🔒 limited · ⓘ info · ‼ other`（与 index.html 同口径），
         overall 兜底 `unknown` 由红改中性灰；
      ⑥ 诊断区过滤行同样白名单化；`setRow` 五态化（limited/info/skip = 灰、unknown = 红）。
      🔴 自我纠错记录（本轮）：初版曾自造 `_hsc` 映射，把 limited 定为金色、unknown 定为灰 `?`，
      与该文件早已存在的权威常量 `V8_STATUS_VISUAL`（2026-09-15 主人令「状态视觉单一真相源」）
      **正好相反** ⇒ 已废弃自造表、改为逐字复用，并加「两页逐字一致」+「不得出现 _hsc」双断言防再犯。
      ⚠️ 该常量在 index.html 是**单一真相源**：将来改配色/加状态，**必须两页同改**，否则
      「同一状态在运维页与逻辑页显示成不同颜色」——这正是本次要根治的「特立独行」家族。
      v8_health_check.py（1 处 · 源头）：
      ⑦ `check_local_head_sync` 的 CI 分支由「返回 1 个 status=info 项」改为 `return []`
         ——「语义不成立」的正确表达是**无此项**，不是「一个会被误显的项」。
         （self_heal 按 iid 匹配派发，本项不在报告里即不派发；CI 内本就不该做本地 git 对齐。）
      死代码同步清理：白名单化后诊断区 `'待更新'` 分支不可达 ⇒ 两页均已**彻底删除**，
      不留半截引用（该分支正是把 info 显成「待更新」的执行体）。
      ⚠️ 行尾纪律：`logic.html` 恒 CRLF（裸 LF 必须为 0），`index.html` 恒纯 LF —— 两页不同，
      改错一侧会造成整文件行尾翻转的巨型 diff。
      仅修前端会留下「后端仍发已知无意义的项」这一冗余源 ⇒ ⑦ 必须同批。
    evidence: >
      改前线上 `HEALTH_CHECK.js`（2026-09-21 12:43:32）summary=`{ok:120, warn:0, fail:1, limited:2, info:1, total:124}`，
      items 中 `local_sync` 实际存在且 status=info（另一条 fail 即 baihechou 项）。
      同族普查（2026-09-21 13:1x 取线上真身实测计数）：`index.html` 含 info 判定 0 处；
      `logic.html` 含 `status === 'info'` / `status === 'limited'` 各 0 处；
      两文件均出现 `s-fail` 而 CSS 中 `.s-fail` 定义数 = 0。
      真跑（node 执行**从产物抽出的真实代码**，非手写复现）：
      `index.html` setRow 8/8、诊断区 7/7；`logic.html` 网格 8/8、setRow 8/8、诊断区 8/8
      —— 全部为「仅 fail 进诊断区、limited/info/skip 灰、unknown 红 ‼（接线缺口可见）」。
      两页 `V8_STATUS_VISUAL` 逐字一致（真源 = index.html）；两页均无自造映射 `_hsc`。
      另：`index.html` 改前/改后均 34/34 保护锚点齐备（不阻断 Pre-deploy audit）；
      `logic.html` 不在该锚点门禁范围内（pre_deploy_audit 仅扫 index.html），
      但其 4 页 `<script src>` 断链检查仍覆盖 logic.html，本批未增删任何 script 标签。
    verify_how: >
