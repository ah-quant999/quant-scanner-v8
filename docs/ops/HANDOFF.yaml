  - id: cnfetch-api-quota-403-exhausted
    priority: P1
    owner: shared
    status: todo
    what: >-
      2026-09-24 上午盘中，**GitHub 安装级 API 配额耗尽（HTTP 403）**导致 `cn_fetch` 整批上传失败：
      小九 11:09 交接件记「10:21 起 27 个 `data/*.js` 上传失败，根因 `API rate limit exceeded for installation`，
      线上保留旧版本、卡片时间戳冻结；dispatch 类自愈已确认无效且会加剧消耗」。
      🔴 **机制（结构性）**：`cn_fetch` 单轮用**逐文件** `POST /repos/.../git/blobs`（本轮实测含 27 个文件），
      叠加 relay 自接力（今日实测 39 档 `workflow_dispatch`）⇒ 安装级 5,000/h 配额可被**结构性打满**。
    impact: >-
      · 盘中 10:21–11:28 约 1 小时 `data/*.js` 全部无法上线 ⇒ 前端卡片 `update_time` 冻结（且不报错）。
      · 连带 `pages-build-deployment` 10:55–11:12 **六档 `Deploy to GitHub Pages` failure**。
      · 判 P1（非 P0）的理由：**已自愈且非数据错误**（旧版本保留、无半截数据），
        但**复发面是结构性的**（配额消耗速率由实现方式决定，不会自行下降）。
    fix: >-
      治本方向 = 把「逐文件 Contents/blobs 上传」改为 **Git Data API 单树单提交**
      （N 个文件 ≈ 4 次请求：blobs→tree→commit→ref），使单轮配额消耗从 O(N) 降到 O(1)。
      次要：派发侧节流（同 category 在跑则不派），减少空转 run 对配额的叠加消耗。
      ⚠️ **禁止**用「再多派发」对冲 —— 派发本身也在消耗同一配额（09-24 上午已实测加剧）。
    verify_how: >-
      ① 单轮 run 的 `POST /git/blobs` 调用数应 ≈1（而非 N）；
      ② 连续 ≥3 个交易日无 `HTTP 403 / rate limit exceeded` 命中；
      ③ 对照口径：`GET /rate_limit` 的 `core.remaining` 在盘中不出现断崖式归零。
    evidence: >-
      阿狸咪 2026-09-24 12:5x CST 独立取证（与小九 11:09 档逐字同源）：
      · run 日志命中逐字 `⚠️ API POST /repos/.../git/blobs -> HTTP 403` +
        `message: API rate limit exceeded for installation`，并有
        `⚠️ 跳过（8 次均失败，HTTP 403）: data/SECTOR_CYCLE_ARCHIVE.js` 等成片跳过行；
      · **恢复判据（三档）**：① 11:28 档（#2111）日志 **0 条** rate-limit；
        ② 产物按批恢复 11:29–11:45 → 12:09 → 12:18–12:22（STOCK_QUOTE/LIMIT_UP_HEATMAP/
        MARKET_FUND_FLOW_DATA/MARKET_ALERTS）；③ `pages-build-deployment` **12:25 起连续 success**
        （末档 #18025 @12:44:10），`build_deploy` 11:46 起 12 档全 success；
      · 本机同刻 `GET /rate_limit`（阿狸咪 PAT 口径，非安装级）`remaining=5000` ⇒ **不能**用本机 PAT 配额反证安装级配额。
      ⚠️ 归属澄清：本条与 14:10 小九档的**下午**断档（并发组/队列）**不是同一根因**
        —— 小九 14:10 档 §四.1 已明确排除「上传 403」（13:00 后 25 文件提交成功）。
