# 九宝量化 v8.0 — 构建 + 部署（GitHub 云端 ubuntu-latest）
#
# 2026-08-01 周末改造：
#   1) push 事件（cn runner 推 raw_data 或 v6 算法端推 post_close raw_data）
#      改用 --detect-changes：只构建发生变化的那几个 data/*.js，不全站重部署。
#   2) 保留 17:00 CST 盘后算法换算调度：对 post_close 类别做一次 selective build，
#      确保 v6 算法端在非 push 场景下也能被构建到。
#   3) concurrency 保持 serial，防止并发 push 冲突。
#
# 触发策略（2026-08-01 审计修正，2026-08-03 修正 auto-deploy，2026-08-03 扩展风险温度计）：
#   - push raw_data/**  → 检测变化 → 只构建受影响类别（v6 算法端推 raw_data 由此触发）
#   - workflow_run: 🇨🇳 v8 中国数据抓取(cn) / 🌍 v8 实时风险温度计 成功完成后 → 自动构建部署
#     原因：cn runner / 云端 workflow 用 GITHUB_TOKEN push raw_data 不会触发 push 类 workflow，
#     用 workflow_run 原生机制绕过该限制，实现"抓取完成即自动部署"，无需小九手动 dispatch。
#   - workflow_dispatch → 全量构建（人工兜底）
#
# ⚠️ 已移除原 17:00 schedule：它会与 18:30 前尚未完成的算法链竞态，用旧 raw_data
#   先构建部署一版陈旧数据；而算法链 18:30 推送 raw_data 时会经 push 触发本工作流
#   自动重新构建，schedule 纯属冗余且有害，故删除。

name: "☁️ v8 构建部署(云端ubuntu)"

on:
  push:
    branches: [main]
    paths:
      - 'raw_data/**'
      - 'index.html'
      - 'update_v8.py'
      - 'v8_health_check.py'
      - 'v8_cloud_watchdog.py'
      - 'guard_index_sections.py'
      - 'guard_v8_freshness.py'
      - 'algorithms/**'
      - 'v8_postclose_guard.py'
      - 'data/.workbuddy/**'   # 自愈调度锁文件改动也会触发重新构建 HEALTH_CHECK.js
  workflow_run:
    workflows:
      - "🇨🇳 v8 中国数据抓取(cn·应急)"
      - "🇨🇳 v8 中国数据抓取(云端)"
      - "☁️ v8 盘后算法链(云端)"
      - "🌍 v8 实时风险温度计"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # v8_health_check.py 查 /actions/runners 需要此权限；不加则 401

concurrency:
  group: v8-build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run 触发时，仅在上游 cn_fetch 成功后才构建；push / workflow_dispatch 始终构建
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 需要 HEAD~1 做 detect_changes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🛡️ 确保 .nojekyll 存在（防 Jekyll 因 _ 前缀目录报错致整站构建失败）"
        run: |
          if [ ! -f .nojekyll ]; then printf '
' > .nojekyll; echo "rebuild missing .nojekyll"; else echo ".nojekyll ok"; fi
          git add -f .nojekyll

      - name: "🛡️ 护栏：校验关键板块未被误删/清空"
        run: python guard_index_sections.py

      - name: "🏗️ 构建 data/*.js（selective）"
        env:
          # V8_GH_TOKEN 是含 actions:read+list runners 权限的 PAT（已存为 repo secret）。
          # GHA 默认 GITHUB_TOKEN 即便声明 actions:read 也无权列 self-hosted runners。
          # v8_health_check.py 通过 _load_token() 优先选 V8_GITHUB_TOKEN > GITHUB_TOKEN > 本地文件。
          V8_GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "调度触发：构建 post_close 类别"
            python update_v8.py --category post_close
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发：全量构建"
            python update_v8.py
          else
            echo "raw_data push 触发：检测变化并 selective build"
            python update_v8.py --detect-changes
          fi

      - name: "🛡️ 部署前校验：关键 data/*.js 非空（防空 raw_data 覆盖成 shell 致整站空）"
        run: python v8_deploy_guard.py

      - name: "📤 部署到 main（GitHub Pages 源）"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "v8-cloud-bot"
          git config user.email "v8-bot@users.noreply.github.com"
          REPO="https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git"
          # ⚠️ 不要改回 git rebase：data/*.js 是构建产物，两趟构建并发时 rebase 必然
          #   在生成文件上产生 content conflict -> rebase --abort -> 整个部署失败
          #   （2026-08-04 23:50 实例：data/HEALTH_CHECK.js CONFLICT，部署挂掉）。
          #   正确做法：push 被拒 = 远端已前进，同步远端后用最新 raw_data 重新全量构建，
          #   产物由构建决定而非由合并决定，天然无冲突且不会用旧产物覆盖新数据。
          for i in 1 2 3; do
            git add -f data/ index.html .nojekyll
            if git diff --cached --quiet; then
              echo "ℹ️ 无数据变化，跳过部署（远端已是最新构建）"
              exit 0
            fi
            git commit -m "v8 build: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            if git push "$REPO" HEAD:main; then
              echo "✅ 已部署 main（第 $i 次尝试，GitHub Pages 自动重建）"; exit 0
            fi
            echo "⚠️ push 被拒（远端已前进），同步远端并按最新 raw_data 全量重建后重试 ($i/3)"
            git fetch "$REPO" main
            git reset --hard FETCH_HEAD
            python update_v8.py --detect-changes
          done
          echo "❌ 3 次重试后仍失败"; exit 1
