# 九宝量化 v8.0 — 云端自愈器（GitHub 云端 ubuntu-latest）
#
# P1 自愈机制：周六 14:00 检测本周（尤其是周五盘后）是否有模块因 cn runner
# 断线/超时/失败而停更，自动 dispatch 触发补跑。
#
# 设计原则：
#   - 纯云端执行（ubuntu），不依赖 cn runner 在线
#   - 跑 guard_v8_freshness.py 识别陈旧模块
#   - 对停更模块分类：premarket → dispatch premarket / post_close → dispatch post_close
#   - 不自己抓数据（数据必须 CN IP），只做"诊断 + 开药方"
#
# ⚠️ 正常情况下周五 18:30 算法链 + 15:30 盘后已产出全部数据，
#    本工作流是「周末兜底」，防止周五晚上的偶发故障拖到周一才发现。

name: "💊 v8 云端自愈器(云端ubuntu)"

on:
  schedule:
    - cron: '6 6 * * 6'   # 周六 14:06 CST（避开 14:00 整点高峰）
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🩺 运行新鲜度体检"
        id: guard
        run: |
          echo "=== Self Heal 检查 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') ==="
          python guard_v8_freshness.py 2>&1 | tee heal_output.txt || true

          # 提取 FROZEN/WARN 模块数
          FROZEN=$(grep -c "FROZEN\|❄️" heal_output.txt 2>/dev/null || echo "0")
          WARN=$(grep -c "WARN\|⚠️" heal_output.txt 2>/dev/null || echo "0")
          OK=$(grep -c "✅" heal_output.txt 2>/dev/null || echo "0")

          echo "frozen=$FROZEN" >> "$GITHUB_OUTPUT"
          echo "warn=$WARN" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"

          if [ "$FROZEN" -gt 0 ]; then
            echo "need_heal=true" >> "$GITHUB_OUTPUT"
            echo "🔴 发现 $FROZEN 个冻结模块，需要补跑"
          else
            echo "need_heal=false" >> "$GITHUB_OUTPUT"
            echo "✅ 无冻结模块（$WARN 个 WARN 可接受）"
          fi

      - name: "📊 诊断摘要"
        if: always()
        run: |
          echo "## v8 云端自愈器 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat heal_output.txt 2>/dev/null || echo "无输出" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "💊 dispatch 补跑（冻结模块）"
        if: steps.guard.outputs.need_heal == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FROZEN="${{ steps.guard.outputs.frozen }}"
          echo "💊 发现 $FROZEN 个冻结模块，触发全量补跑"

          # 全量补跑最简单可靠——避免逐个分析类别
          # 2026-08-06 修正：dispatch 云端主链（ubuntu，不依赖 cn runner 在线），
          # 原指向「v8 中国数据抓取(cn)」需 cn runner（小九/家里机器）在线，关机即失效
          gh workflow run "🇨🇳 v8 中国数据抓取(云端)" \
            -R ah-quant999/quant-scanner-v8 \
            -f category=all \
            -f label="Self Healer 自动补跑（${FROZEN} frozen modules）"

          echo "✅ 已 dispatch v8_cn_fetch（全量模式）"
          echo "::warning::Self Healer 检测到 ${FROZEN} 个冻结模块，已 dispatch 补跑"

      - name: "✅ 无需补跑"
        if: steps.guard.outputs.need_heal != 'true'
        run: |
          echo "✅ 所有模块正常，无需补跑。WARN 模块数: ${{ steps.guard.outputs.warn }}"
