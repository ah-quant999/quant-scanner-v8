      `/usr/bin/bash --noprofile --norc -e -o pipefail`（逐字取自 run #2321 日志 12:26:40.1539337Z）
      ⇒ `-e` 使被捕获命令一旦非零就**立即终止整段脚本**，`$?` 捕获 / annotation / `exit 1` 全部不可达。
      · 分布（远端真身行号，共 **29 处**）：`v8_cn_fetch_cloud.yml` 14 处
        （482/499/517/536/554/583/649/721/740/758/781/813/908/952）；
        `v8_cn_fetch_cloud_hosted.yml` 6 处（180/257/275/300/361/419）；
