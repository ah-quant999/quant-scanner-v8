      obj_had_ts = bool(isinstance(obj, dict) and (obj.get("update_time") or obj.get("calc_time")))。
      优先级链 existing > _meta.last_update > 文件历史 update_time > mtime > now 完全不变；
      到达 L776 时 existing 恒为假，且两个调用点的 existing 均由 obj 的 update_time/calc_time 推导
      ⇒ 本补法与原作者语义等价、不改任何既有分支。
      推送走 Git Data API 六步（远端 contents API 取基底 10fdc3d1cba7 → 新建 blob → base_tree
