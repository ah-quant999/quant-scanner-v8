# 九宝量化 v8.0 — ETF clist 探针（第9版·一次性诊断，验完即删）
#
# v8 实测（19:24~19:29，同窗口 6 个独立 runner）：
#   A 全新IP 顺序爬 17 页（页间 2s）: 仅第 1 页 200，第 2~17 页全败（187s）
#   B 全新IP 分片域名 1..17.push2  : 前 3 页 200，第 4~17 页全败（37s）
#   C 先烧 30 个请求再爬          : 0/17（271s）——「IP 被打死」可复现
#   D 同域名隔 60s 打 4 次         : 0/4（204s）——**慢速节流也救不回来**
#   E 同域名无间隔连打 6 次        : 4/6 成功（7s）= 200,200,200,502,502,200
#   F 1..10.push2 各 1 次          : 0/10
# ⇒ v7「首请求必成」在 v8 窗口不成立 ⇒ **不是干净的 per-IP 速率限制**，
#   更像「随请求抽签 + 好/坏时段交替」。D 说明「放慢」无效，E 说明**快打有时能连成串**。
#
# 本版要选出**唯一可行修法**（4 条路各占一个独立 runner）：
#   G_concurrent_17  : 17 页**并发**发，失败页并发重试，最多 6 轮（好窗口只需几秒）
#   H_rapid_restart  : 顺序爬（无间隔），一失败立即重开整爬，8 分钟内尽可能多次
#   I_np2_pz2000     : 参数探路——np=2 / invt=1 等能否突破「rows=100」硬截（若能 ⇒ 1 请求拿全）
#   J_shard_concur   : 17 页并发 + 每页打到不同分片域名 {i}.push2
# 判据：leg 结束时**拿到多少页 / 多少只**（满 17 页 1700 只 = 可行修法）。

name: "🔬 v8 ETF clist 探针v9(并发vs快速重开·分片并发·参数破100截)"

on:
  workflow_dispatch: {}

concurrency:
  group: v8_etf_probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "G_concurrent_17"
            mode: "concurrent"
            hostmode: "delay"
            budget: "360"
          - name: "H_rapid_restart"
            mode: "rapid"
            hostmode: "delay"
            budget: "480"
          - name: "I_param_probe"
            mode: "params"
            hostmode: "delay"
            budget: "120"
          - name: "J_shard_concur"
            mode: "concurrent"
            hostmode: "subdom"
            budget: "360"
    steps:
      - name: "🐍 装依赖"
        run: python3 -m pip install --quiet --disable-pip-version-check requests

      - name: "🔬 实测"
        shell: bash
        env:
          CFG_NAME: ${{ matrix.name }}
          CFG_MODE: ${{ matrix.mode }}
          CFG_HOSTMODE: ${{ matrix.hostmode }}
          CFG_BUDGET: ${{ matrix.budget }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time, random, socket
          from concurrent.futures import ThreadPoolExecutor

          UT = "b2884a393a59ad64002292a3e90d46a5"
          FS = "b:MK0021,b:MK0022,b:MK0023,b:MK0024"
          FLDS = "f12,f14,f3,f6,f10,f62"
          DELAY = "https://push2delay.eastmoney.com"
          HDR = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                 "Referer": "https://quote.eastmoney.com/"}
          import requests
          try:
              requests.packages.urllib3.disable_warnings()
          except Exception:
              pass

          def host_for(i, mode):
              return ("https://%d.push2.eastmoney.com" % (i,)) if mode == "subdom" else DELAY

          def fetch(host, pn, extra=None):
              p = {"pn": str(pn), "pz": "100", "po": "1", "np": "1", "fltt": "2", "invt": "2",
                   "ut": UT, "fid": "f62", "fs": FS, "stat": "1", "fields": FLDS,
                   "_": int(time.time() * 1000)}
              if extra:
                  p.update(extra)
              try:
                  r = requests.get(host.rstrip("/") + "/api/qt/clist/get", params=p,
                                   timeout=15, verify=False, headers=HDR)
                  if r.status_code != 200:
                      return None
                  d = r.json()
                  data = d.get("data") or {}
                  diff = data.get("diff")
                  if isinstance(diff, dict):
                      diff = list(diff.values())
                  return diff if isinstance(diff, list) else []
              except Exception:
                  return None

          name = os.environ["CFG_NAME"]; mode = os.environ["CFG_MODE"]
          hm = os.environ["CFG_HOSTMODE"]; budget = float(os.environ["CFG_BUDGET"])
          t0 = time.time()
          print("══════════════ %s ══════════════" % name, flush=True)

          if mode == "params":
              probes = [
                  ("np2_pz2000", {"np": "2", "pz": "2000"}),
                  ("np2_pz6000", {"np": "2", "pz": "6000"}),
                  ("invt1_pz5000", {"invt": "1", "pz": "5000"}),
                  ("fltt1_pz5000", {"fltt": "1", "pz": "5000"}),
                  ("pz1000", {"pz": "1000"}),
                  ("pz500_po1", {"pz": "500"}),
              ]
              for tag, extra in probes:
                  rows = fetch(DELAY, 1, extra)
                  print("PARAM %s %s -> %s" % (name, tag, "ERR/502" if rows is None else len(rows)),
                        flush=True)
                  time.sleep(2)
              print("RESULT " + json.dumps({"cfg": name, "secs": round(time.time() - t0, 1)},
                                           ensure_ascii=False), flush=True)

          elif mode == "concurrent":
              pages = {}; rounds = 0
              while time.time() - t0 < budget and len(pages) < 17:
                  rounds += 1
                  todo = [pn for pn in range(1, 18) if pn not in pages]
                  with ThreadPoolExecutor(max_workers=17) as ex:
                      futs = {ex.submit(fetch, host_for(pn, hm), pn): pn for pn in todo}
                      for f in futs:
                          pn = futs[f]
                          try:
                              rows = f.result()
                          except Exception:
                              rows = None
                          if rows is not None and len(rows) > 0:
                              pages[pn] = rows
                  print("ROUND %s #%d ok=%d/%d pages=%d rows=%d (%.0fs)" % (
                      name, rounds, len(todo) - (len(todo) - (17 - len(pages))), 17,
                      len(pages), sum(len(v) for v in pages.values()), time.time() - t0), flush=True)
                  if len(pages) < 17:
                      time.sleep(1.5)
              print("RESULT " + json.dumps({"cfg": name, "rounds": rounds,
                                            "pages_ok": sorted(pages.keys()),
                                            "rows": sum(len(v) for v in pages.values()),
                                            "secs": round(time.time() - t0, 1)}, ensure_ascii=False),
                    flush=True)

          else:  # rapid
              best = 0; attempts = 0
              while time.time() - t0 < budget:
                  attempts += 1
                  got = {}
                  for pn in range(1, 18):
                      rows = fetch(host_for(1, hm), pn)
                      if rows is None or not rows:
                          break
                      got[pn] = rows
                      if len(rows) < 100:
                          break
                  n = sum(len(v) for v in got.values())
                  best = max(best, n)
                  if n >= 1200:
                      print("HIT %s attempt#%d rows=%d (%.0fs)" % (name, attempts, n, time.time() - t0),
                            flush=True)
                      break
                  if attempts % 10 == 0:
                      print("PROG %s attempt#%d best=%d (%.0fs)" % (name, attempts, best, time.time() - t0),
                            flush=True)
                  time.sleep(random.uniform(2.0, 5.0))
              print("RESULT " + json.dumps({"cfg": name, "attempts": attempts, "best_rows": best,
                                            "secs": round(time.time() - t0, 1)}, ensure_ascii=False),
                    flush=True)
          print("══════════════ END %s ══════════════" % name, flush=True)
          PYEOF
