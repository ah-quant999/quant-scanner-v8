# 九宝量化 v8.0 — 孤儿模块同步（🔴 已退役 / RETIRED）
#
# 退役时间：2026-08-02
# 退役原因：NT_DATA / SUSPENSION_ALERT / MARKET_ALERTS / SECTOR_FUND_FLOW_TREND
#   这 4 个孤儿模块已补齐 v8 原生 akshare/东财 抓取器（fetch_orphan_*.py），
#   由 v8_algo_run.yml（18:30 盘后算法链）直接产出 raw_data/，不再依赖 v6 源。
#   本工作流已无同步对象（V6_TO_V8 中这 4 项已移除），保留仅为历史参考与应急回退。
#
# ⚠️ 如需临时恢复 v6 源应急：把对应项加回 sync_v6_to_v8.py 的 V6_TO_V8，
#   并将下方 step 改回 `python sync_v6_to_v8.py --only <VAR,...> --push` 即可。
#
# 原时序约束（已失效，存档）：本 workflow 原定 19:30，必须晚于 v8_algo_run(18:30)，
# 仅同步 4 孤儿、绝不覆盖 v8 原生模块。现全部由 algo_run 原生覆盖，约束不再适用。

name: "🔄 v8 孤儿模块同步(cn)【已退役·no-op】"

# 调度已停用（注释），仅保留 workflow_dispatch 手动触发用于应急回退
# on:
#   schedule:
#     - cron: '30 11 * * 1-5'   # 原 19:30 CST（已退役）
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-sync-legacy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, cn]
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "📥 检出 v8 仓库"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🚫 已退役：4 孤儿已原生化，无需 v6 同步"
        shell: powershell
        run: |
          Write-Host "=================================================="
          Write-Host " v8_sync_legacy 已退役（2026-08-02）"
          Write-Host " NT_DATA / SUSPENSION_ALERT / MARKET_ALERTS /"
          Write-Host " SECTOR_FUND_FLOW_TREND 已由 v8_algo_run 原生产出"
          Write-Host " 无需再经 v6 同步桥。"
          Write-Host "=================================================="
          exit 0
