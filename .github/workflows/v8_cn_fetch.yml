# 九宝量化 v8.0 — 中国数据抓取（自托管 cn runner · 应急回退版）
#
# 2026-08-05 17:34：主人要求"中国数据不再依赖小九"→ 已新建 v8_cn_fetch_cloud.yml
# （ubuntu-latest 云端版，探针实测 OK 10/11 可达，跑通验证成功）。
# 本文件 cron 全部移除，仅保留 workflow_dispatch 作为【应急回退】：
# 当云端版故障时，可手动 dispatch 本文件到 lemoncat-cn 补跑。
# 云端版已接管全部 schedule（盘前/盘中/盘后/周末）。
#
# 历史时段映射（已被云端版承接）：
#   08:25  盘前：V8_CAL / IPO_DATA / MARGIN_DATA / CFFEX_HOLDINGS / MACRO_DATA /
#                 CRISIS_DATA / NORTH_FUND / ANALYST_RATINGS / W52_HIGH /
#                 VOLATILITY / HERDING_DATA
#   盘中每30分钟刷新：INDEX_QUOTES / ETF_PULSE / ETF_INTRADAY_HEAT /
#                     ETF_DAILY_MONITOR / SECTOR_FUND_FLOW / CAPITAL_FLOW_DATA /
#                     CONCEPT_RANKING / LIMIT_UP_HEATMAP / AI_MARKET_BRIEF
#   15:30  盘后：EXPERIMENT + MARKET_FUND_FLOW_DATA
#   周六/周日 09:00：T+1 周度/月度统一刷新

name: "🇨🇳 v8 中国数据抓取(cn·应急)"

on:
  workflow_dispatch:
    inputs:
      category:
        description: '抓取类别：premarket / intraday / post_close / all（应急回退用）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: v8-cn-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, cn]
    # 🔴 2026-08-30 22:3x 抬高 job 墙钟（实测本 workflow run 33309687912 跑满
    #   20 分钟被硬杀，杀点是推送步 13.8 分钟未完成 → 数据抓到却推不上 main）。
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ⛔️ 2026-08-14 主人令永久修复：WorkBuddy safe-delete 批量删除守卫默认阈值 50
      #   （alimi-cn 实测 966 文件，100% 被拦、所有 [self-hosted, cn] workflow 必须显式抬到 1000。
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 1000
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "🕐 确定本次抓取类别（优先用 workflow_dispatch 传入的 category）"
        id: cat
        shell: bash
        run: |
          # 手动派发时优先用 inputs.category，绕过 GitHub schedule 下午失效率
          DISPATCH_CAT="${{ github.event.inputs.category }}"
          if [ -n "$DISPATCH_CAT" ]; then
            echo "category=$DISPATCH_CAT" >> "$GITHUB_OUTPUT"
            echo "label=手动派发($DISPATCH_CAT)"
            exit 0
          fi
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "25 0 * * 1-5"|"0 1 * * 6"|"0 1 * * 0")
              echo "category=premarket" >> "$GITHUB_OUTPUT"
              echo "label=盘前" ;;
            "40 1 * * 1-5"|"0 2 * * 1-5"|"30 2 * * 1-5"|\
            "0 3 * * 1-5"|"30 3 * * 1-5"|\
            "0 5 * * 1-5"|"30 5 * * 1-5"|\
            "0 6 * * 1-5"|"30 6 * * 1-5"|"10 7 * * 1-5")
              echo "category=intraday" >> "$GITHUB_OUTPUT"
              echo "label=盘中" ;;
            "30 7 * * 1-5")
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=盘后" ;;
            *)
              echo "category=all" >> "$GITHUB_OUTPUT"
              echo "label=全量兜底" ;;
          esac

      - name: "经 API 拉取脚本（绕过 git）"
        shell: powershell
        run: |
          python -c @'
          import os, base64, json, urllib.request
          token = os.environ['GITHUB_TOKEN']
          files = [
              'cloud_fetch_v8.py', 'api_push_raw.py',
              'fetch_ipo_data_v8.py', 'fetch_limit_up_heatmap_v8.py',
              'backfill_lhb_history.py', 'algorithms/gen_market_brief.py',
              'algorithms/strategy_four_volume.py', 'algorithms/scanner.py',
              'algorithms/data_source_gtimg.py',
              'out/lhb_seats.json'
          ]
          for fn in files:
              url = f'https://api.github.com/repos/ah-quant999/quant-scanner-v8/contents/{fn}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              d = json.load(urllib.request.urlopen(req, timeout=60))
              os.makedirs(os.path.dirname(fn) or '.', exist_ok=True)
              with open(fn, 'wb') as f: f.write(base64.b64decode(d['content']))
              print('downloaded', fn, len(d['content']), 'b64 chars')
          '@

      - name: "校验 Python / akshare（缺失则走清华镜像安装）"
        shell: powershell
        run: |
          python --version
          python -c "import akshare, pandas" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "akshare/pandas 缺失，安装中（清华镜像）..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas
          } else {
            Write-Host "akshare/pandas 已就绪，跳过安装"
          }
          python -c "import akshare; print('akshare', akshare.__version__)"

      - name: "📡 抓中国数据 → raw_data/（ selective ）"
        # 🛡️ 2026-08-12 移除 continue-on-error：与云端版一致，抓取失败必须阻止空壳推送。
        shell: powershell
        run: |
          $cat = "${{ steps.cat.outputs.category }}"
          Write-Host "本次类别: $cat"
          python cloud_fetch_v8.py --category $cat

      - name: "🐉 刷新当日 LHB 数据（仅 post_close）"
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: powershell
        run: |
          # fetch_lhb.py 产出 out/lhb_result.json；stage_to_raw 将其提升为 raw_data/lhb_data.json
          python algorithms/fetch_lhb.py
          python -c "import sys; sys.path.insert(0,'algorithms'); import stage_to_raw; stage_to_raw.main()"

      - name: "🐉 回填 LHB 历史（仅 post_close）"
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: powershell
        run: |
          python backfill_lhb_history.py

      # 2026-08-17 主人令：calc_commodity_elasticity.py 加入云端自动跑（之前从未自动跑过，导致国内期货 LC/SA 永远不显示）
      # 无第三方风险：写 data/COMMODITY_ELASTICITY.js + raw_data/commodity_elasticity.json，推送走现有 api_push_raw 步骤
      - name: "💹 商品涨价弹性榜重算（仅 post_close）"
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: powershell
        run: |
          python algorithms/calc_commodity_elasticity.py

      # 2026-08-17 主人令：板块周期 fetch_sector_rs 之前从未自动跑过，导致 3 天前数据陈旧
      - name: "🔄 板块相对强度重算（仅 post_close）"
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: powershell
        run: |
          python algorithms/fetch_sector_rs.py
          python -c "import sys; sys.path.insert(0,'algorithms'); import stage_to_raw; stage_to_raw.main()"

      # 2026-08-17 主人令：ETF 三件套（POTENTIAL_PICKS / ETF_PULSE / ETF_INTRADAY_HEAT / ETF_DAILY_MONITOR）之前无任何 workflow 触发，3 天没更新
      # calc_potential_picks.py 已由 update_v8.py 实验链路自动跑；这里新增 ETF 三件套（intraday 与 post_close 都跑，post_close 跑一次兜底）
      - name: "💹 ETF 三件套数据生成（post_close 兜底）"
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: powershell
        run: |
          python algorithms/calc_etf_intraday.py

      - name: "📤 经 API 推送 raw_data/ 到 main"
        # 🔴 2026-08-30 22:3x 同类 bug 一次清干净（实测 run 33312102792 / 33309687912
        #   均因推送步跑 13-22 分钟被 job 级 timeout 硬杀，连带后续消费步全 skipped）。
        #   推送慢的根因是 api_push_raw.py 防倒退守卫要逐个下载远端 blob 比时间戳
        #   （raw_data 117 个 json / 26 MB，cn 出海串行传输），守卫不能删只能限时。
        #   步级 timeout + continue-on-error 组合：推送超时只判该步失败，job 存活，
        #   后续 bridge/update_v8/health_check 照常跑完，raw_data 交下一轮补推。
        continue-on-error: true
        timeout-minutes: 35
        shell: powershell
        run: |
          python api_push_raw.py

      # 🛡 2026-08-18 主人紧急令根治：抓完 raw_data 立即跑 4 步闭环
      #   bridge_raw_data → update_v8 → health_check。bridge_raw_data 是关键，
      #   防止 raw_data 内部改名断点（如 triple_resonance_history → triple_history）让
      #   update_v8 永远读到 4 天前的旧 raw_data/triple_history.json。
      - name: "🔗 桥接 raw_data 内部改名（bridge_raw_data.py）"
        shell: powershell
        continue-on-error: true
        run: |
          python algorithms/bridge_raw_data.py

      - name: "🔄 重生成 data/*.js (update_v8)"
        shell: powershell
        run: |
          python update_v8.py

      - name: "🩺 刷新 HEALTH_CHECK.js (v8_health_check)"
        shell: powershell
        run: |
          python v8_health_check.py
