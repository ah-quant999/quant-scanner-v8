    what: >-
      🔴 双机心跳的**唯一载体** `raw_data/hb_alimi.json` / `raw_data/hb_xiaojiu.json` 会被 cn 侧 raw 回推
      用**陈旧副本**顶掉 ⇒ 其 `last_time` **非单调回退** ⇒ 云端 build 据它重生成的 `data/HB_ALIMI.js` /
      `data/HB_XIAOJIU.js` 同步回退 ⇒ `v8_peer_monitor` 的 `check_alimi_alive()` / `check_xiaoju_alive()`
      读到超阈 ⇒ **误判「机器掉线」**（阈值 `PEER_FAILOVER_THRESHOLD_MIN=180`，日历分钟，**无节假日/回退豁免**）。
      现象是「心跳倒退」，不是「心跳停跳」——发送侧一切正常，是**发布层被顶掉**。
    impact: >-
      · **信任通道被污染**：心跳是双机「对方是否活着」的唯一判据；回退即把「活着」显示成「死了」
        ⇒ down 判定 / 派发 / 交接决策失真，并可能外发「机器掉线」告警邮件（纯噪音）。
      · **不是理论风险（已实测发生）**：`v8_peer_monitor` 2026-09-25 15:07:13 档判 `al=down`
        （`alimi.silent_min=200.2 / last_time=2026-09-25 11:47:03`），而阿狸咪发送侧**实际正常** ——
        `~/.workbuddy/v8_alimi_heartbeat.state.json` = `last_time 2026-09-25 13:53:20 / status ok`，
        且远端存在对应提交 `2e4dc62488`「data: 阿狸咪心跳上报 20260925-1353」。
      · **同族悬案的最优解释**：2026-09-24 观测到的「`HB_XIAOJIU.last_time` 非单调倒退 ~10.5h」
        与本项同一机制（见 evidence 小九侧逐笔），可直接并入本项结案。
    fix: >-
      待 owner 拍板（本轮**未改任何代码**：15:4x 处小九白天独家时段，且推送器属 cn runner 车道）：
      ① **最小**：把 `last_time` 纳入 `api_push_raw.py` 的防倒退时间戳白名单 ——
         `_TS_KEYS`（L568）与抽取正则（L584）**两处必须同改**；
         并核 `_NO_REGRESSION_GUARD`（累积继承型豁免表）**不得**豁免这两份心跳文件。
      ② 或按 `api-push-stale-base-index-clobber` 的 `_SKIP_LOCAL_PUSH` 范式：心跳文件**本地副本永不入队**，
         改由发送侧「取远端正文 + 只改 `last_time`」后随本提交原子落地。
      ③ **结构性（与①②正交）**：cn 侧推送前对 `raw_data/hb_*.json` 做**单调性硬前置** ——
         新值 < 远端旧值即**拒推 + 显式告警**（宁可不推，绝不倒退）。
      ⚠️ 治本还须定位「陈旧副本从哪来」，候选：① `walk_raw()` 回退路径 os.walk 本地 `raw_data/` 全量入队；
        ② cn runner 工作区对 `raw_data/hb_*.json` 无 fetch/reset ⇒ 停留在上一次同步值。
    verify_how: >-
      ① 静态：`grep -n "last_time" api_push_raw.py` 在 `_TS_KEYS` 与抽取正则**两处**均有命中（给出逐字）；
