# 九宝量化 v8.0 — 中国数据抓取（自托管 cn runner，仅此一步在中国机器跑）
#
# ⚠️ 为什么只在 cn runner 跑：cloud_fetch_v8.py 调 akshare 抓 A 股数据源（东方财富/新浪/
# 中国接口），GitHub 官方 runner 在美国会被 60s 超时。所以「抓取」必须在本机(cn)执行。
#
# 其余全部上云：update_v8 转换 + deploy 部署 + 算法 + 清理 都交给 ubuntu-latest（见
# v8_build_deploy.yml / v8_algo.yml / v8_cleanup.yml），不占用本机资源，省 token。
#
# 数据交接链路：本任务抓完 push raw_data/ → v8_build_deploy 拉取 → update_v8.py 生成
# data/*.js → push main（GitHub Pages 源即部署）。两任务定时错开 10 分钟保证 raw_data 已落地。
#
# 运行环境说明（本机 cn runner 已配好）：
#   - runner 以 NT AUTHORITY\NETWORK SERVICE 运行，无法访问 E:（坚果云 junction）。
#   - 故 git/Python 工具链全部放在 D: 真实本地盘：
#       Python: D:\actions-runner-v8\_work\_tool\Python\3.13.14\x64（预装 akshare 1.18.64 + pandas）
#       Git:    D:\PortableGit\mingw64\bin（由 E: 复制而来，并给 NETWORK SERVICE 授权）
#   - 上述路径已写入 D:\actions-runner-v8\.env 的 PATH，runner 服务已重启生效。
#   - shell 统一用 powershell（本机 git-bash 在 service 账户下异常，powershell 稳定）。

name: "🇨🇳 v8 中国数据抓取(cn)"

on:
  schedule:
    - cron: '25 0 * * *'    # 08:25 CST 盘前
    - cron: '30 2 * * *'    # 10:30 CST
    - cron: '30 3 * * *'    # 11:30 CST
    - cron: '0 6 * * *'     # 14:00 CST
    - cron: '5 7 * * *'     # 15:05 CST
    - cron: '30 8 * * *'    # 16:30 CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: [self-hosted, cn]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "校验 Python / akshare（缺失则走清华镜像安装）"
        shell: powershell
        run: |
          python --version
          python -c "import akshare, pandas" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "akshare/pandas 缺失，安装中（清华镜像）..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas
          } else {
            Write-Host "akshare/pandas 已就绪，跳过安装"
          }
          python -c "import akshare; print('akshare', akshare.__version__)"

      - name: "📡 抓中国数据 → raw_data/（逐模块容错）"
        continue-on-error: true
        shell: powershell
        run: |
          python cloud_fetch_v8.py

      - name: "📤 push raw_data/ 到 main"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          if (-not (Test-Path raw_data)) { Write-Host "raw_data 未生成，跳过"; exit 0 }
          git config user.name "v8-cn-bot"
          git config user.email "v8-bot@users.noreply.github.com"
          git add -f raw_data/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "ℹ️ 无数据变化，跳过提交"; exit 0 }
          $msg = "v8 cn fetch: " + (Get-Date -Format 'yyyy-MM-dd HH:mm')
          git commit -m $msg
          $repo = "https://x-access-token:$env:GITHUB_TOKEN@github.com/ah-quant999/quant-scanner-v8.git"
          # 与 build_deploy 并发 push 时可能非快进被拒，rebase 重试 3 次
          for ($i=1; $i -le 3; $i++) {
            if (git push $repo HEAD:main) { Write-Host "✅ raw_data 已推送（第 $i 次尝试）"; exit 0 }
            Write-Host "⚠️ push 被拒，rebase 后重试 ($i/3)"
            git fetch $repo main
            git rebase FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { git rebase --abort; exit 1 }
          }
          Write-Host "❌ 3 次重试后仍失败"; exit 1
