# 九宝量化 v8.0 — 中国数据抓取（GitHub 云端，优先走 [self-hosted, cn] 中国 IP）
#
# 🔴 2026-08-13 根因修复（小九令）：2026-08-05 的探针结论「ubuntu-latest 能抓」不可靠——
#   盘中模块（INDEX_QUOTES / SECTOR_FUND_FLOW / CONCEPT_RANKING / AI_MARKET_BRIEF 等）
#   经美国 IP 抓取频繁超时/残缺，导致 2026-08-13 09:40 盘中数据缺口。
#   cloud_fetch_v8.py 头部亦明示「美国 runner 抓 A 股中国源会 60s 超时」。
#   故本 workflow 改为优先 runs-on: [self-hosted, cn]（小九/备用机中国 IP，全量可抓）。
#   ⚠️ 2026-08-13 11:47 提交 1fe4f8c7 把 runs-on 写成映射形态
#      runs-on: { group: self-hosted, labels: [cn], fallback-to-github-hosted-runner: true }
#   有两处致命错：① fallback-to-github-hosted-runner 仅对 larger/auto-scaling runner 有效，
#      标准 self-hosted 触发 GitHub 工作流解析 422（两云 workflow 自 11:47 起完全无法触发）；
#   ② group: self-hosted 无效——本仓库 self-hosted runner（lemoncat-cn）属于 Default 组、
#      标签为 [self-hosted, cn]，并无名为 self-hosted 的组，故映射形态匹配不到 runner，
#      任务 1 秒 completed failure（无 step）。已改为正确数组形态 runs-on: [self-hosted, cn]。
#   cn 离线兜底走看门狗 CN_WORKFLOW_ID_FALLBACK（v8_cn_fetch.yml 应急）+ 防倒退守卫。
#   分时段 selective fetch，逻辑与 v8_cn_fetch.yml 一致。
#
# 时段映射（北京时间）：
#   08:25  盘前：V8_CAL / IPO_DATA / MARGIN_DATA / CFFEX_HOLDINGS / MACRO_DATA /
#                 CRISIS_DATA / NORTH_FUND / ANALYST_RATINGS / W52_HIGH /
#                 VOLATILITY / HERDING_DATA
#   盘中每30分钟刷新（09:00-15:30）：INDEX_QUOTES / ETF_PULSE / ETF_INTRADAY_HEAT / ETF_SUBSCRIPTION /
#                     ETF_DAILY_MONITOR / SECTOR_FUND_FLOW / CAPITAL_FLOW_DATA /
#                     CONCEPT_RANKING / LIMIT_UP_HEATMAP / AI_MARKET_BRIEF
#   17:20  盘后：EXPERIMENT + MARKET_FUND_FLOW_DATA + 龙虎榜当日数据刷新
#          （交易所 17:00 后才发布龙虎榜，故 post_close 从 15:45 推迟到 17:20）
#   17:00/21:30 全量兜底（防 GitHub schedule 高负载丢触发；21:30 刚好美股开盘后捕获隔夜宏观变动）
#   周六 09:00 / 周日 09:00  T+1 周度/月度统一刷新
#
# 🔴 2026-08-06 根因修复：GitHub Actions 单个 workflow 的 schedule 条目过多会静默失效。
#    本文件原先 17 条 cron，导致 v8_cn_fetch_cloud 自创建以来从未被 schedule 触发。
#    现收敛为 5 条 cron，符合平台隐性约束；同时保留本机 WorkBuddy 每 30 分钟 workflow_dispatch 兜底。

name: "🇨🇳 v8 中国数据抓取(云端)"

on:
  schedule:
    # 以下 5 条 cron 为 GitHub schedule 上限约束内的最大集合。
    # 盘中时间从原来的 09:40/10:00/.../15:10 提前/合并为 09:00-16:30 每 30 分钟（含 16:30 港股收盘补抓，2026-08-06 用户令加回）
    - cron: '25 0 * * 1-5'     # 08:25 CST 盘前
    - cron: '*/30 1-8 * * 1-5' # 09:00-16:30 CST 盘中每30分钟（含 16:30 港股收盘补抓）
    - cron: '20 9 * * 1-5'     # 17:20 CST 盘后（龙虎榜 17:00 后发布）
    - cron: '0 9,14 * * 1-5'   # 17:00/21:30 CST 全量兜底
    - cron: '0 1 * * 0,6'      # 周六/周日 09:00 CST 周度刷新
  workflow_dispatch:
    inputs:
      category:
        description: '抓取类别：premarket / intraday / post_close / all'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: v8-cn-fetch-cloud
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, cn]
    timeout-minutes: 20
    env:
      # 🔴 2026-08-06 00:10 必须保留：云端 runner 默认 UTC，朴素 datetime.now() 写出的
      #   update_time 会比北京时间慢 8 小时，前端「更新于」与新鲜度判定全线错位。
      #   显式声明时区后与中国节点产出一致；显式带 tzinfo 的写法不受影响，不会双重偏移。
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "🕐 确定抓取类别"
        id: cat
        shell: bash
        run: |
          DISPATCH_CAT="${{ github.event.inputs.category }}"
          if [ -n "$DISPATCH_CAT" ]; then
            echo "category=$DISPATCH_CAT" >> "$GITHUB_OUTPUT"
            echo "label=手动派发($DISPATCH_CAT)"
            exit 0
          fi
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "25 0 * * 1-5")
              echo "category=premarket" >> "$GITHUB_OUTPUT"
              echo "label=盘前" ;;
            "*/30 1-8 * * 1-5")
              echo "category=intraday" >> "$GITHUB_OUTPUT"
              echo "label=盘中" ;;
            "20 9 * * 1-5")
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=盘后" ;;
            # 🛡️ 2026-08-13 23:1x 根因修复（小九令）：原 case 写 "0 9,13" 但 yml cron 是 '0 9,14'
            #   （注释里写"17:00/21:30" 实际 cron 是 22:00），case 不匹配导致 step 2 失败
            #   → 整个 fetch job 失败、main 上 raw_data 缺口无人补（从 14:44 起 4 次连续失败）。
            #   兜底：任何未匹配 cron 统一走 "all" 全量，避免因注释/cron 不同步而漏跑。
            "0 9,14 * * 1-5"|"0 9,13 * * 1-5"|"0 1 * * 0,6")
              echo "category=all" >> "$GITHUB_OUTPUT"
              echo "label=全量兜底" ;;
            *)
              echo "category=all" >> "$GITHUB_OUTPUT"
              echo "label=兜底(未匹配cron $CRON, 走all)" ;;
          esac
          # 兜底：无论 case 命中与否，确保 category 输出有值（防 step 后续 ${{ steps.cat.outputs.category }} 为空）
          if [ -z "${{ steps.cat.outputs.category }}" ]; then
            echo "⚠️ category 输出为空，强制设为 all"
            echo "category=all" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        # 🛡️ 2026-08-13 14:54 根因修复（小九令）：原 checkout 默认 1 分钟超时，
        #   self-hosted cn runner 在中国 IP 拉 GitHub 偶发 60s 超时（#194 step 3 failure
        #   根因），导致整个 fetch job 失败、main 上 raw_data 缺口无人补。
        #   改 timeout=5min（容忍网络抖动）+ fetch-depth=1（默认，已省带宽）。
        #   失败时不 retry——直接 fail，让 v8_health_patrol 自愈派发；
        #   但配合 v8_health_patrol 的「无数据即派发」护栏（见 step 4 末尾），
        #   5 分钟内会被新派发接手，不会卡死。
        with:
          fetch-depth: 1
          timeout-minutes: 5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "📦 安装依赖"
        run: |
          pip install akshare pandas requests --quiet
          python -c "import akshare, pandas; print('akshare', akshare.__version__, '/ pandas', pandas.__version__)"

      - name: "📡 抓中国数据 → raw_data/（selective）"
        # 🛡️ 2026-08-12 移除 continue-on-error：抓取失败必须让 job 失败，
        #    阻止 api_push_raw 把只刷了 update_time 的空壳数据推送到 main。
        shell: bash
        run: |
          cat="${{ steps.cat.outputs.category }}"
          echo "本次类别: $cat"
          python cloud_fetch_v8.py --category "$cat"

      - name: "🐉 刷新当日 LHB 数据（仅 post_close）"
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: bash
        run: |
          # fetch_lhb.py 产出 out/lhb_result.json；stage_to_raw 将其提升为 raw_data/lhb_data.json
          python algorithms/fetch_lhb.py
          python -c "import sys; sys.path.insert(0,'algorithms'); import stage_to_raw; stage_to_raw.main()"

      - name: "🐉 回填 LHB 历史（仅 post_close）"
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: bash
        run: |
          python backfill_lhb_history.py

      - name: "📤 推送 raw_data/ 到 main（Contents API）"
        shell: bash
        run: |
          python api_push_raw.py

      - name: "🛰️ 云端兜底调度（算法链/温度计，幂等）"
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/cloud_dispatcher.py
