# 九宝量化 v8.0 — 数据抓取云端看门狗（自愈·兜底）
#
# 🔴 2026-09-01 根因修复（一劳永逸）：
#   主 workflow v8_cn_fetch_cloud.yml 的 5 条 cron 长期被 GitHub schedule 高负载整段漏触发
#   （实测 2026-09-01 全天 0 次 schedule 触发，而 08-31 正常）。单靠 workflow 内置 cron 不可靠。
#   本看门狗不依赖"准点"，而是**基于状态（线上数据是否陈旧）**自愈：
#     - 每 30 分（交易日 08:00-17:30 CST）跑一次轻量检查；
#     - 拉取线上 data/HEALTH_CHECK.js，取最新 last_update 与当前 CST 比较；
#     - 若处于交易时段且对应类别数据陈旧（盘中>35min / 盘前盘后>60min），
#       直接在云端用 gh workflow run 派发 v8_cn_fetch_cloud.yml（category 自适应）。
#   全云端（ubuntu-latest），小九机仅在云端连续失败时才作人工后备，不依赖其定时。
#   与主 workflow 的 cron 互为冗余：只要任意一条触发，数据就不会长时间空窗。

name: "🐕 v8 数据抓取看门狗(云端自愈)"

on:
  # 🔴 2026-09-10 一劳永逸修复（主人令·午休窗口）：09-09 误删 schedule，导致看门狗整日哑火——
  #    上午 5 次云端 run 被 cancelled 且零兜底 → 数据空窗近 30 分钟（09-10 上午事故）。
  #    现恢复 GitHub cron 自唤起（每 15 分，与 WorkBuddy 唤起器 2d9121c8 互为冗余，任一方掉线都自恢复），
  #    数据陈旧（盘中>35min）即自动补派云端/小九 cn 兜底。时段：交易日 08:07-15:52 CST（UTC 00:07-07:52），
  #    与 20 分主派发错峰（:07/:22/:37/:52），避免并发互相踩踏。
  schedule:
    # 🔴 2026-09-21（本批）小九 · 结构性变更：本链被 GitHub schedule 静默注销，
    #   按 v8_stock_quote_refresh.yml 09-07 已验证做法把单条多点 cron 拆为两条显式行，
    #   语义等价（{7,22} ∪ {37,52} = {7,22,37,52}），条目数 1→2 强制重新注册。
    #   见 HANDOFF.yaml::intraday-chain-cron-deregistered。
    # 🔴 2026-11-09 一劳永逸（主人令·终选/最终推荐全被算法链卡死堵到深夜）：
    #   旧时段 0-7（UTC）= CST 08:07-15:52 —— 而盘后算法链全在 16:30-23:00 跑，
    #   11-09 实证 16:50 起卡死 3.5h 整段无人值守（第二个结构性盲区）。现扩为
    #   UTC 全 24h × 周日~周四（覆盖 CST 周一 00:07 ~ 周六 07:52 全程每 15 分）。
    #   安全性：非交易日/周末由探针内部 CST dow>=5 自行空转退出（纯读探针+破锁，
    #   不写任何数据），对双机分时零影响。
    # 🔴🔴 2026-11-28 主人令「盘前盘后不需要这么高频；盘中 15 分钟别造成风暴」——实测驱动整改：
    #   ① 名义 vs 实际：原 96 档/天，GitHub API 实测 11-24~11-28 schedule 事件只有 17 次
    #      （11-27 单日 22 个 run 里仅 1 个是 schedule），其余是外部每小时 dispatch。
    #      即：名义上 15 分、实际放行约 1 次/天 —— 不存在「15 分钟风暴」，问题只在别处。
    #   ② 真正的成本在 checkout：每次 run 全量拉工作区 879MB × 名义 96 档 = 约 84GB/天。
    #      已在下面对 checkout 收窄为 sparse（只取 .github/scripts，约 0.2MB）。
    #   ③ 纯空转档：探针时段门只认 07:05-09:55 / 09:00-15:30 / 17:00-21:30，
    #      CST 22:00-07:00 共 36 档（4/小时 × 9 小时）必然一进来就 exit(0) —— 全删。
    #   现名义 96 → 41 档/天（−57%），盘前/盘后降到 30 分，**盘中 09:07-15:52 每 15 分不动**。
    - cron: '7,22,37,52 1-7 * * 1-5'  # 盘中 09:07-15:52 CST · 每 15 分（28 档·主人令不动）
    - cron: '7,37 23 * * 0-4'         # 盘前 07:07/07:37 CST（2 档·30 分）
    - cron: '7,37 0 * * 1-5'          # 盘前 08:07/08:37 CST（2 档·30 分）
    - cron: '7,37 8-11 * * 1-5'       # 盘后 16:07-19:37 CST · 每 30 分（8 档）
    - cron: '37 12 * * 1-5'           # 晚间 20:37 CST（1 档·覆盖 17:41-21:30 窗尾）
  # 🔴 保留手动入口：WorkBuddy 唤起器 2d9121c8 每 15 分也可主动触发（双保险）。
  workflow_dispatch:
    inputs:
      force_category:
        description: '强制派发类别（留空=按陈旧度自适应）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write   # 用于 gh workflow run 派发主抓取

concurrency:
  group: v8-cn-fetch-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 🔴 2026-11-10 阿狸咪修复：11-09 6a065f8fac 探针抽出仓内脚本后漏加 checkout，runner 空工作区⇒ python3 找不到 .github/scripts/v8_watchdog_probe.py，自愈兜底层 7 连败。
      # 🔴 2026-11-28 主人令（成本根治）：原 checkout 全量工作区 879MB/次。
      #   本 workflow 五步全部只跑 .github/scripts/*.py，且脚本自述「纯标准库 + 读线上
      #   Pages/API」，不读任何仓内数据文件 ⇒ sparse 收窄到该目录即可（实测效果：
      #   下载量 879MB → 约 0.2MB，降 99.98%）。cone-mode 关掉是为了不把根目录
      #   index.html / logic.html 一起拖下来（cone 模式会带上根目录全部文件）。
      - name: 检出仓库（sparse·只取 .github/scripts）
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/scripts/
          sparse-checkout-cone-mode: false
      - name: 自检数据新鲜度并兜底派发
        env:
          GH_TOKEN: ${{ github.token }}
          # dispatch 入参经 env 传入探针脚本（run 块内零表达式字面量，体积恒小）
          V8_FORCE_CATEGORY: ${{ github.event.inputs.force_category }}
        run: |
          # 🔴 2026-11-09 一劳永逸：探针逻辑抽到 .github/scripts/v8_watchdog_probe.py（369 行），
          #   本 run 块只剩一行调用。根治 GitHub「Exceeded max expression length 21000」——
          #   原 27.8KB run 块内嵌表达式定界符+320行脚本，被 GitHub 表达式扫描器整块误吞 ⇒ 每次推送
          #   全仓连坐 Invalid workflow file（11-09 实证 5 连坐，含双机纯数据推送）。
          python3 .github/scripts/v8_watchdog_probe.py
      # 🔴 2026-11-19 主人令「一劳永逸」：morning_plan cron（北京07:50）漏触发根治——
      #   交易日 07:45-09:35 CST 每 15 分随看门狗顺带检查，MORNING_PLAN data_date≠今日
      #   即补发 v8_morning_plan（幂等：已生成则退出；探针只读+派发，不写数据）。
      - name: 盘前计划兜底派发（MORNING_PLAN 陈旧即补发）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/v8_morning_plan_fallback.py

      # 🔴🔴 2026-11-19 最高优先级主人令「实时数据怎么还没更新！」根治：盘中调度器
      #   lemoncat schedule 再次被 GitHub 整段漏触发（实测 11-19 开盘 09:30/09:40 档
      #   0 run，实时卡全停盘前/昨收）。交易日盘中窗 09:25-11:35/12:55-15:05 CST
      #   随看门狗每 15 分检查：lemoncat 最近班 >25min（链最大档间隔 20min+余量）且
      #   无在跑班 ⇒ 判漏触发，补派 lemoncat（幂等只读+派发，正常班次零写操作）。
      - name: 盘中调度器漏触发兜底（lemoncat 停摆即补派）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/v8_intraday_sched_fallback.py
      # 🔴 2026-11-23 主人令「这卡也断更了」一劳永逸根治：v8_sector_tech.yml 的 cron
      #   自 11-20 起连续 3 天被 GitHub schedule 整段漏触发（workflow active 但 0 run），
      #   板块技术研判卡停在 11-20。盘后 15:05 起随看门狗检查：SECTOR_TECH_JUDG 的
      #   data_date≠今日即补派 v8_sector_tech（幂等生成+每小时整点档节流，只读探针不写数据）。
      - name: 板块技术研判断更自愈（SECTOR_TECH_JUDG 陈旧即补派）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/v8_sector_tech_fallback.py
      # 🔴 2026-11-28 主人令「一劳永逸」：v8_ima_strong_stock.yml 的 cron
      #   (UTC 07:45/13:00 = 北京 15:45/21:00) 在 11-27 全天两条全 0 run，
      #   数据停在 11-27 06:16 → 前端红卡「超过阈值 694 分钟」。与 sector_tech 同一类
      #   「GitHub schedule 整段漏触发」，故用同一范式兜底：判据取 **update_time 日期**
      #   （≠data_date：update_time 能区分「workflow 没跑」与「源方没发新稿」两层，
      #    用 data_date 会把后者当成漏跑反复空派）。
      - name: 强势跟踪断更自愈（IMA_STRONG_STOCK 今日未产出即补派）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/v8_ima_fallback.py
