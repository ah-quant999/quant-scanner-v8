      ⇒ 按本条**自己定的两级阈值**：「**单次静默覆盖 ⇒ 立即转 B**」**已满足** ⇒ 建议**立即转 B**，
        不必再等「累计 ≥3」（那条只覆盖「漂移但重放成功」）。
      · 🔴 **小九自认违约（这解释了 [13/13] 为何没抓住）**：协议 **E 条**要求「推本文件时**同一提交**刷新
