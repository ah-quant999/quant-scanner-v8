# 九宝量化 v8.0 — 中国数据抓取（自托管 cn runner，仅此一步在中国机器跑）
#
# ⚠️ 为什么只在 cn runner 跑：cloud_fetch_v8.py 调 akshare 抓 A 股数据源（东方财富/新浪/
# 中国接口），GitHub 官方 runner 在美国会被 60s 超时。所以「抓取」必须在本机(cn)执行。
#
# 其余全部上云：update_v8 转换 + deploy 部署 + 算法 + 清理 都交给 ubuntu-latest（见
# v8_build_deploy.yml / v8_algo.yml / v8_cleanup.yml），不占用本机资源，省 token。
#
# 数据交接链路：本任务抓完 push raw_data/ → v8_build_deploy 拉取 → update_v8.py 生成
# data/*.js → push main（GitHub Pages 源即部署）。两任务定时错开 10 分钟保证 raw_data 已落地。
#
# ⚠️ 中国网络特殊说明（本机 cn runner 已配好）：
#   - runner 以 NT AUTHORITY\NETWORK SERVICE 运行，无法访问 E:（坚果云 junction）。
#     工具链全在 D: 真实本地盘：Python(D:\actions-runner-v8\_work\_tool) / Git(D:\PortableGit)。
#   - 关键坑：该账户下 github.com 的 git/HTTPS 协议被重置（Connection reset / timeout），
#     但 api.github.com 可达。因此本工作流【完全不用 git】：脚本经 REST API 拉取、
#     raw_data 也经 Git Database API 推送（单次 commit，并发安全）。
#   - shell 统一 powershell（git-bash 在 service 账户下异常）。

name: "🇨🇳 v8 中国数据抓取(cn)"

on:
  schedule:
    - cron: '25 0 * * *'    # 08:25 CST 盘前
    - cron: '30 2 * * *'    # 10:30 CST
    - cron: '30 3 * * *'    # 11:30 CST
    - cron: '0 6 * * *'     # 14:00 CST
    - cron: '5 7 * * *'     # 15:05 CST
    - cron: '30 8 * * *'    # 16:30 CST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: [self-hosted, cn]
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "经 API 拉取脚本（绕过 git）"
        shell: powershell
        run: |
          python -c @'
          import os, base64, json, urllib.request
          token = os.environ['GITHUB_TOKEN']
          files = ['cloud_fetch_v8.py', 'api_push_raw.py', 'fetch_ipo_data_v8.py', 'fetch_limit_up_ladder.py']
          for fn in files:
              url = f'https://api.github.com/repos/ah-quant999/quant-scanner-v8/contents/{fn}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              d = json.load(urllib.request.urlopen(req, timeout=60))
              with open(fn, 'wb') as f: f.write(base64.b64decode(d['content']))
              print('downloaded', fn, len(d['content']), 'b64 chars')
          '@

      - name: "校验 Python / akshare（缺失则走清华镜像安装）"
        shell: powershell
        run: |
          python --version
          python -c "import akshare, pandas" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "akshare/pandas 缺失，安装中（清华镜像）..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas
          } else {
            Write-Host "akshare/pandas 已就绪，跳过安装"
          }
          python -c "import akshare; print('akshare', akshare.__version__)"

      - name: "📡 抓中国数据 → raw_data/（逐模块容错）"
        continue-on-error: true
        shell: powershell
        run: |
          python cloud_fetch_v8.py

      - name: "🔥 涨停连板梯队 → raw_data/（逐模块容错）"
        continue-on-error: true
        shell: powershell
        run: |
          python fetch_limit_up_ladder.py

      - name: "📤 经 API 推送 raw_data/ 到 main"
        shell: powershell
        run: |
          python api_push_raw.py
