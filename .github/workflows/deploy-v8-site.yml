name: Deploy v8 Site (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

# 经自托管 Windows 运行器构建静态站点并发币到 GitHub Pages。
# 目的：绕开 GitHub 原生 "branch: main" 构建服务器（其持久化工作克隆含已删除的
# docs/ops 超长名文件，git checkout 永远失败 -> Pages 长期 build errored）。
# 本工作流用干净的运行器 checkout 当前 main，仅打包站点所需文件为制品，
# 由 actions/deploy-pages 经 API 发布（不依赖中毒的构建服务器克隆）。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout (clean, fetch-depth 1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build site artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp *.css _site/ 2>/dev/null || true
          cp *.js _site/ 2>/dev/null || true
          cp *.html _site/ 2>/dev/null || true
          mkdir -p _site/assets
          cp -r assets/* _site/assets/ 2>/dev/null || true
          mkdir -p _site/data
          cp -r data/* _site/data/ 2>/dev/null || true
          echo "artifact files: $(find _site -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
