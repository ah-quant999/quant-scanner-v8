      `docs/ops/*.txt` 同族同法（该段注释明写「逐族列窄规则，把影响面精确锁定在已知的几个文件」），
      影响面仅 **2 个文件**；且 `eol=lf` 同时约束工作树 ⇒ 无论翻转来自 checkout 还是
      API 上传工作树字节，均被消除。补规则后由既有 `scripts/normalize_eol.py → git check-attr`
      机制自动收口，无需手改工作树。
      ⚠️ 备选（仅治标，且会掩盖同类回归，不推荐单独用）：`push_snapshot.py` 侧比较前统一归一化行尾。
      ⚠️ 也**禁**只做一次 `fix(eol)` 手工归一化就收工 —— 源侧会再翻。
    verify_how: >-
      ① `raw_data/ima_strong_stock_full.md` 的 CRLF 计数恒 **0**、字节数恒 **5504**、
