# 🏔 v8 板块年度主力净流入 refresh (cn) — 单变量专链
#
# 2026-11-20 小九（白班审计阿狸咪夜班产物后根治）：
#   根因链（11-12 / 11-14 / 11-19 三次 27.9h+ 停更同款复发）：
#     · 生产者 f_sector_year_flow 用东财 clist + push2his fflow（cn-IP 硬约束源，云端境外轮软失败）；
#     · 原 national_team 20:50 本地生成步骤 2026-11-09 拆除（72e56edd）后，现役唯一登记档位 =
#       v8_cn_fetch_cloud.yml post_close —— 该 workflow 固定 runs-on: ubuntu-latest（境外 IP）；
#     · ⇒ **全链再无一个 cn 执行位会在盘后产出它** ⇒ 结构性断链，云端每轮软失败无人察觉。
#   一劳永逸修法 = 按 v8_us_hk_map / v8_sector_tech 先例建 cn runner 专链：
#     15:45 CST（收盘定稿 45 分钟后，东财 fflow daykline 当日已出全）单变量拉取。
#     幂等闸门（f_sector_year_flow 当日已产出→跳过）保证 17:20 云端 post_close 再轮到它时零重复。
#
# 链路：交易日闸 → 同步源码（Contents API）→ `python cloud_fetch_v8.py --only SECTOR_YEAR_FLOW`
#      → `python update_v8.py --category post_close`（缺失 raw 走 carry-forward，只重建本卡）
#      → 内容 sha 比对，变化才推 raw + data + index.html ?v 同步。
#
# 安全铁律（与 v8_us_hk_map.yml 同源）：
#   1. 严禁 actions/checkout / rm -rf / git clean -fdx（cn runner 系统级拦截）；
#   2. 严禁 git clone/fetch（cn runner 到 github.com:443 被连接重置），源码同步走 Contents API；
#   3. 单一职责：只产出并推送 raw_data/sector_year_flow.json + data/SECTOR_YEAR_FLOW.js，不动其他文件。
#   4. 🔴 中国 IP 硬依赖（非可选）：东财 clist m:90 + push2his fflow 境外 IP 不可达。
#      本链永不可迁云端，违者复发 11-12/11-14/11-19 三次停更（2026-11-20 审计实证）。
name: "🏔 v8 板块年度主力净流入 refresh (cn)"

on:
  schedule:
    # 工作日 15:45 CST（UTC 07:45）= 收盘定稿后；幂等闸门防同日多轮重复 90+ 请求。
    - cron: '45 7 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_trading_day_gate:
        description: "应急手动调用时绕过交易日闸（true 仅供非交易日补算）"
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: write

concurrency:
  group: v8-sector-year-flow
  cancel-in-progress: false

jobs:
  sector-year-flow-only:
    runs-on: [self-hosted, cn]   # 🔴 中国 IP 硬依赖，见头部注释，永不可迁云。
    env:
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 2000   # cn runner 为 Windows，不设吃默认 50
      PYTHONIOENCODING: utf-8                      # cn runner(Windows) 默认 GBK，中文打印必崩
      PYTHONUTF8: "1"
    timeout-minutes: 20
    steps:
      - name: "🚦 交易日闸（非交易日跳过，防假日拉旧数据假产出）"
        id: gate
        shell: bash
        env:
          SKIP_GATE: ${{ github.event.inputs.skip_trading_day_gate || 'false' }}
        run: |
          if [ "$SKIP_GATE" = "true" ]; then echo "[skip-gate] 应急补算模式"; exit 0; fi
          python -c "import v8_date,sys; sys.exit(0 if v8_date.is_trading_day() else 1)" \
            && echo "[ok] 交易日" || { echo "[pause] 非A股交易日，跳过本轮"; exit 1; }

      - name: "📥 同步源码（Contents API · 同域）"
        if: steps.gate.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, base64, json, urllib.request, time
          TOK=os.environ["GITHUB_TOKEN"]
          REPO="ah-quant999/quant-scanner-v8"
          H={ "Authorization":"Bearer "+TOK, "Accept":"application/vnd.github+json" }
          for path in ("cloud_fetch_v8.py","update_v8.py","v8_date.py"):
              ok=False
              for i in range(6):
                  try:
                      req=urllib.request.Request(f"https://api.github.com/repos/{REPO}/contents/{path}",headers=H)
                      obj=json.load(urllib.request.urlopen(req,timeout=90))
                      data=base64.b64decode(obj["content"])
                      d=os.path.dirname(path)
                      if d: os.makedirs(d,exist_ok=True)
                      open(path,"wb").write(data)
                      print("synced",path,len(data)); ok=True; break
                  except Exception as e:
                      print("retry",i,path,e); time.sleep(min(2**i,15))
              if not ok: raise SystemExit("sync failed: "+path)
          PY

      - name: "🧮 跑 cloud_fetch_v8.py --only SECTOR_YEAR_FLOW"
        if: steps.gate.outcome == 'success'
        shell: bash
        run: |
          python cloud_fetch_v8.py --only SECTOR_YEAR_FLOW
          if [ ! -s raw_data/sector_year_flow.json ]; then
            echo "::error::raw_data/sector_year_flow.json 空/缺失（生成器放弃本轮，宁缺勿错）"; exit 1
          fi
          echo "✅ raw: $(wc -c < raw_data/sector_year_flow.json) bytes"

      - name: "🧱 update_v8.py --category post_close（重建 data/SECTOR_YEAR_FLOW.js）"
        if: steps.gate.outcome == 'success'
        shell: bash
        env:
          # 🛡 逃生舱语义论证（2026-11-20 小九）：ws-guard 防的是「工作区落后于远端仍出产物」。
          #   本链工作区源码由上一步刚从 origin/main 逐文件同步（cloud_fetch_v8/update_v8/v8_date
          #   均为 main 最新 blob），守卫意图已由同步步骤结构性满足；
          #   而 self-hosted runner 工作区常残留其他链的历史 .git（HEAD 停在旧 commit）⇒
          #   守卫按旧 HEAD 比对恒 fail-closed（08:36 首跑实测 exit 1，本地最小复现无 git 时全绿）。
          V8_SKIP_WS_GUARD: "1"
        run: |
          python update_v8.py --category post_close
          if [ ! -s data/SECTOR_YEAR_FLOW.js ]; then
            echo "::error::data/SECTOR_YEAR_FLOW.js 空/缺失"; exit 1
          fi
          echo "✅ data: $(wc -c < data/SECTOR_YEAR_FLOW.js) bytes"

      - name: "📤 内容比对后推送 raw + data + index.html ?v（无变化零提交）"
        if: steps.gate.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, re, json, base64, urllib.request, urllib.error, hashlib, time
          TOK=os.environ["GITHUB_TOKEN"]
          REPO="ah-quant999/quant-scanner-v8"
          H={ "Authorization":"Bearer "+TOK, "Content-Type":"application/json",
              "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" }
          def api(method,url,data=None):
              body=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request(url,data=body,headers=H,method=method)
              with urllib.request.urlopen(req,timeout=90) as r: return json.load(r)
          import json as _j
          def push(remote, local_path, msg):
              raw=open(local_path,"rb").read()
              if not raw: print("empty refuse",remote); return False
              sha1=hashlib.sha1(b"blob %d\0"%len(raw)+raw).hexdigest()
              try: cur=api("GET","https://api.github.com/repos/{REPO}/contents/{remote}".format(REPO=REPO,remote=remote)).get("sha")
              except urllib.error.HTTPError as e: cur=None if e.code==404 else (_ for _ in ()).throw(e)
              if cur and cur==sha1:
                  print("[skip] content identical:",remote); return False
              payload={"message":msg.format(sha10=sha1[:10]),
                       "content":base64.b64encode(raw).decode(),"branch":"main"}
              if cur: payload["sha"]=cur
              for i in range(4):
                  try: api("PUT","https://api.github.com/repos/{REPO}/contents/{remote}".format(REPO=REPO,remote=remote),payload)
                  except urllib.error.HTTPError as e:
                      if e.code in (409,422) and i<3:
                          cur=api("GET","https://api.github.com/repos/{REPO}/contents/{remote}".format(REPO=REPO,remote=remote)).get("sha")
                          payload["sha"]=cur; time.sleep(2); continue
                      raise
                  print("pushed",remote,len(raw)); return True
              return False

          pushed=push("raw_data/sector_year_flow.json","raw_data/sector_year_flow.json",
                      "data: sector_year_flow raw refresh ({sha10} CST)")
          pushed_d=push("data/SECTOR_YEAR_FLOW.js","data/SECTOR_YEAR_FLOW.js",
                        "data: SECTOR_YEAR_FLOW refresh ({sha10} CST)")

          if pushed_d:
              # 3) 同步 index.html 的 ?v 缓存戳（data 有变才做）
              idx="https://api.github.com/repos/{REPO}/contents/index.html".format(REPO=REPO)
              for i in range(5):
                  try:
                      ex=api("GET",idx); idx_sha=ex.get("sha")
                      html=base64.b64decode(ex["content"]).decode("utf-8"); break
                  except Exception as e:
                      print("idx get retry",i,e); time.sleep(3)
              else:
                  print("index.html 获取失败，跳过 ?v（cache-bot 下轮自愈）"); raise SystemExit(0)
              raw=open("data/SECTOR_YEAR_FLOW.js","rb").read()
              content_sha=hashlib.sha1(raw).hexdigest()[:10]
              pat=r'(data/SECTOR_YEAR_FLOW\.js\?v=)([a-f0-9]+)'
              new_html,n=re.subn(pat,lambda m:m.group(1)+content_sha,html)
              if n==0: print("⚠️ index.html 未找到 SECTOR_YEAR_FLOW.js?v= 引用")
              elif new_html==html: print("?v 已是",content_sha)
              else:
                  pl={"message":"chore(cache): SECTOR_YEAR_FLOW.js?v="+content_sha,
                      "content":base64.b64encode(new_html.encode("utf-8")).decode(),"branch":"main"}
                  for i in range(4):
                      if idx_sha: pl["sha"]=idx_sha
                      try: api("PUT",idx,pl); print("index.html ?v →",content_sha); break
                      except urllib.error.HTTPError as e:
                          if e.code in (409,422) and i<3:
                              idx_sha=api("GET",idx).get("sha"); time.sleep(2); continue
                          raise
          print("✅ 🏔 板块年度主力净流入 refresh 完成")
          PY
