# 九宝量化 v8.0 — 中国数据抓取（GitHub 云端，ubuntu-latest 主力）
#
# 🔴 2026-08-18 主人令：小九机器跑太费 TOKEN 且网络不稳定，必须让云端 ubuntu-latest 成为主力。
#   本 workflow 固定 runs-on: ubuntu-latest，由 GitHub schedule / workflow_dispatch 触发。
#   self-hosted cn runner（小九单位机 LEMONCAT）降级为应急兜底，仅在看门狗检测到
#   云端连续失败时才 dispatch v8_cn_fetch_cloud_selfhosted.yml。
#   云端对部分 akshare/纯内网源可能超时，但东方财富 push2 系列（INDEX_QUOTES / SECTOR_FUND_FLOW /
#   CONCEPT_RANKING / LIMIT_UP_HEATMAP / ETF_PULSE / CAPITAL_FLOW_DATA / AI_MARKET_BRIEF 等）
#   在境外 runner 仍可工作，优先保证实时数据区不空窗。
#
# 时段映射（北京时间）：
#   08:25  盘前：V8_CAL / IPO_DATA / MARGIN_DATA / MACRO_DATA / CRISIS_DATA /
#                 NORTH_FUND / ANALYST_RATINGS / W52_HIGH / VOLATILITY /
#                 RESTRICTED_RELEASE / PERFORMANCE_FORECAST
  #   注意：PERFORMANCE_FORECAST 数据格式 = {summary: {increase, decrease, loss, uncertain, total}, items: [...]}
  #   summary.total 由云端 f_perf_forecast 算出 = 4 类型合计（schema 已稳定，不要写 sum(increase+...)现算避免与 stats 双源漂移）。
  #   前端 2026-08-31 起展示为 6 列汇总：预增/预减/预亏/不确定 + 总数 + 净增(=预增−预减)，其中「净增」前端现算不写盘。
  #   INDEX 同步：logic.html 「今日业绩预告·说明」段已同步改为"6 列"口径。
#   盘中每30分钟刷新（09:00-15:30）：INDEX_QUOTES / ETF_PULSE / ETF_INTRADAY_HEAT /
#                     ETF_DAILY_MONITOR / SECTOR_FUND_FLOW / CAPITAL_FLOW_DATA /
#                     CONCEPT_RANKING / LIMIT_UP_HEATMAP / AI_MARKET_BRIEF
#   17:20  盘后：CFFEX_HOLDINGS + EXPERIMENT + MARKET_FUND_FLOW_DATA + ETF_DAILY_MONITOR +
#          龙虎榜当日数据刷新
#          （交易所 17:00 后才发布龙虎榜，故 post_close 从 15:45 推迟到 17:20）
#          🛡 2026-09-11 主人令（轻量化·卡迁移）：「日监控·主力净流入」卡迁至「盘后数据」页后，
#             ETF_DAILY_MONITOR 由单纯 intraday 升为 "intraday,post_close" 双档（见 cloud_fetch_v8.py
#             CATEGORY_MAP）——盘中继续每 30 分抓，盘后三档(17:20/18:20/19:20)必重抓一次 T+1 定稿。
#             （原「ETF 三连板」措辞已随该次轻量化拆为「ETF 二合一」，勿按旧名检索。）
#   17:00/21:30 全量兜底（防 GitHub schedule 高负载丢触发；21:30 刚好美股开盘后捕获隔夜宏观变动）
#   周六 09:00 / 周日 09:00  T+1 周度/月度统一刷新
#
# 🔴 2026-08-06 根因修复：GitHub Actions 单个 workflow 的 schedule 条目过多会静默失效。
#    本文件原先 17 条 cron，导致 v8_cn_fetch_cloud 自创建以来从未被 schedule 触发。
#    后收敛为 5 条 cron，符合平台隐性约束。
# 🛡 2026-09-09 主人令「盘中 20 分钟 + 单一调度器」：盘中 schedule cron 只有 30 分钟粒度，
#    且 GHA cron 静默丢触发问题无法根治；盘中时段改由本机 WorkBuddy 单一调度器
#    每 20 分钟 workflow_dispatch 派发（category=intraday）。本文件只保留盘前/盘后/周末 cron。

name: "🇨🇳 v8 中国数据抓取(云端)"
# 🔴 2026-09-24 一劳永逸·第三重（根治「拆组后幂等闸门把抓取全量跳过」· 小九的工程师）
#   【病灶】幂等闸门只按「同 workflow」判重、**不含并发组维度**。并发组按 category 拆分后
#     intraday 与 post_close 可同时在跑 ⇒ 后到的 run 一律判「已有新鲜同 workflow run 在执行」
#     ⇒ **「抓中国数据」step 直接 completed/skipped（0s）**。净效果：多轮 run 空转、
#     raw_data 永不更新、线上数据停在 15:05（主人感知为「越修越差」）。
#   【修法】把 category 写进 run 名，闸门据此**按并发组判重**，跨组一律放行。
run-name: "🇨🇳 v8 中国数据抓取(云端) [${{ github.event.inputs.category || 'scheduled' }}]"

on:
  schedule:
    # 🔧 2026-09-09 主人令「盘中 20 分钟 + 单一调度器」：盘中 schedule cron 已删除，
    #   改由本机 WorkBuddy 单一调度器每 20 分钟 workflow_dispatch 派发 category=intraday。
    #   本处保留 3 条 cron：盘前 + 盘后 + 周末。
    - cron: '25 0 * * 1-5'     # 08:25 CST 盘前（不变）
    # 🛡 2026-09-11 小九的工程师（盘中错题 E1/E6 一劳永逸修复 · 云端原生种子）：
    #   实证：盘中 14 档权威定义在本机调度器 v8_cn_fetch_intraday_lemoncat.yml，
    #   但该 workflow **历史仅 14 次运行且全部严重迟到**（09-10 全部落在 15:29-20:04，
    #   最大延迟 5 小时），09-11 全天 **0 次**；同日本 workflow 的 8,38 cron 也只跑了
    #   4/22 次 —— 本仓 GitHub schedule 已普遍不可靠，盘中档位**没有可靠种子**，
    #   导致 10:40/11:00/11:20/11:30 四档全部零派发、数据两度靠人工兜底。
    #   本 workflow 的 08:25 盘前档每日准时 → 在此追加云端原生盘中种子（每 20 分），
    #   与 lemoncat（如恢复）同 concurrency group 排队不互杀、幂等闸门自动去重。
    #   注：本 job 的 schedule 触发为**每次新派发**（非高频轮询），不构成风暴。
    # 🔴 2026-09-22 一劳永逸修复（主人令「隔夜美股卡没更新」· 小九）：
    #   【病灶】盘前档 `25 0 * * 1-5`（08:25）被 GitHub **静默丢弃且从不触发**——
    #     实测该 workflow 近 100 轮 run：schedule 仅 5 次，且全部落在盘中/盘后，
    #     `25 0` 一次都没中过。⇒ 依赖 premarket 单档的 US_HK_MAP（隔夜美股映射）
    #     整链漏跑，卡面冻结（09-21 08:20），HEALTH_CHECK 判 fail。
    #   【修法】把每条种子的 UTC 起点由 `1` 提前到 `0`（CST 08:00 起）——
    #     **不新增 cron 条目**（守住「≤5 条」的平台隐性约束，见文件顶部 08-06 记录），
    #     却给盘前档 08:00/08:20/08:40 三个原生种子；配合下方类别判定的
    #     「08:00–09:00 判 premarket」窗，盘前档从「单点 cron」变为「三种子冗余」。
    #     幂等闸门会自动去重，不构成额外抓取负担。
    - cron: '*/20 0-3,5-6 * * 1-5'  # 08:00-09:00 盘前种子 + 09:00-11:40/13:00-14:40 盘中种子
    - cron: '20 9-11 * * 1-5'  # 17:20/18:20/19:20 CST 盘后三档（不变）
    - cron: '0 1 * * 0,6'      # 周六/周日 09:00 CST 周度刷新（不变）
  workflow_dispatch:
    inputs:
      category:
        description: '抓取类别：premarket / intraday / post_close / all'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  # 🔴 2026-09-24 一劳永逸（主人令「主站还是13点多的数据」根因修复之一 · 小九的工程师）
  #   【病灶】并发组是**单一静态名** `v8-cn-fetch-cloud`：所有 category（intraday /
  #     post_close / premarket / 周末全量）**抢同一个槽位**。而 post_close 是合法长跑
  #     （job timeout 60 min），实测 09-24 #35956823600 从 12:43 占槽到 13:45
  #     **共 62 分钟**；同期到达的 6 个 intraday run 全部被取消
  #     （13:25:24 一次 canc 5 个、14:06:09 一次 canc 7 个）⇒ 盘中数据空窗 2.8 小时
  #     （CAPITAL_FLOW 卡 11:35 / ETF 卡 11:30 / INDEX_QUOTES 卡 12:09）。
  #   【修法】并发组**按 category 动态命名** ⇒ intraday 与 post_close 各占一组、
  #     互不阻塞：盘后长跑再久也顶不掉盘中档，盘中档再密也拖不慢盘后。
  #   【为何不用 `docs/ops/**` 那种前缀匹配】并发组名必须**精确**，
  #     表达式在 workflow 解析期求值，`inputs.category` 为空（schedule/cron 触发）时
  #     回落到 `scheduled` —— 三条 cron（盘前/盘后/周末）时间窗本就错开，共享一组无碍。
  group: v8-cn-fetch-cloud-${{ github.event.inputs.category || 'scheduled' }}
  # 2026-08-24 修复(#1 取消风暴根治)：改为 false，新派发不再杀掉正在写
  # 共振/快照文件的 run，从根上杜绝「自伤顶掉」——此前 cancel-in-progress:true
  # 频繁把正在写 triple_consensus.json / lhb_history.json / sector_fund_flow 的 run 杀掉，
  # 留下半截 JSON → 数据清空（共振日历反复「数据又没了」、主力净额曲线断档均源于此）。
  # 配合 token 修复 + 僵尸看门狗形成双保险。
  cancel-in-progress: false
  # 🛡 2026-09-18 一劳永逸·第二重（主人令「今日事件页今天怎么没更新」根因修复之二 · 小九的工程师）：
  #   【问题】今日事件页 V8_CAL/IPO_DATA 当日未更新，除「分红步拖死 job」外还有**第二条腿**：
  #     本仓盘中 20 分钟粒度派发 + 盘中自接力叠加 ⇒ 每有新 run 到达，**旧 pending run 被无条件顶掉**。
  #   【机制·官方文档背书】`cancel-in-progress: false` **只保护「正在运行」的 run**；
  #     concurrency 组默认「最多 1 running + 1 pending」，新 run 到达时
  #     **旧 pending 一律被取消**，新 run 占住 pending 位。
  #     实测代价：09-18 全天 39 轮 run 中 **11 轮 cancelled（28%）**；09-17 为 6/42（14%）。
  #     其中 #35315423241(06:33:51) 与 #35315463560(06:34:25) 仅隔 34 秒即互顶。
  #   【修法】GitHub 2026-05-07 changelog「Concurrency groups now allow larger queues」新增
  #     `queue: max`：并发组可排队至 100 个 run，逐个依次执行、不再互顶。
  #     保持 `cancel-in-progress: false` 不变（不破坏 2026-08-24 已定的「不杀正在写文件的 run」）。
  #   【安全性】`queue` 仅在 `cancel-in-progress: false`（或未设）时生效 —— 本文件已满足；
  #     job 的 `timeout-minutes` 只计 job 自身执行时长、**不含排队时间** ⇒ 排队变多不会触发超时。
  queue: max

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 2026-08-31 16:25 一劳永逸修复（小九令：收盘数据上线）：25 -> 60
    #   根因：post_close 要跑 LHB 刷新 + LHB 历史回填 + 研报抓取重建候选池 +
    #   涨价弹性榜重算 + 板块RS重算 + update_v8 全量重生成 + HEALTH_CHECK 108 项比对，
    #   实测 15:42 那轮 step18(update_v8) 就已跑到 16:00（17min），16:07:56 被
    #   25min 硬超时杀死 -> data/*.js 已重生成却来不及 step21 推送 -> 线上数据停滞
    #   （13:46/15:42 两轮同因 cancelled，数据卡在 14:2x 唯一跑完的一轮）。
    #   60min 覆盖完整 post_close 链路，intraday 实际仍只需 ~20min，无副作用。
    timeout-minutes: 60
    env:
      # 🔴 2026-08-06 00:10 必须保留：云端 runner 默认 UTC，朴素 datetime.now() 写出的
      #   update_time 会比北京时间慢 8 小时，前端「更新于」与新鲜度判定全线错位。
      #   显式声明时区后与中国节点产出一致；显式带 tzinfo 的写法不受影响，不会双重偏移。
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "🕐 确定抓取类别"
        id: cat
        shell: bash
        run: |
          CRON="${{ github.event.schedule }}"
          IN="${{ github.event.inputs.category }}"
          # 🛡 2026-08-31 一劳永逸修复（小九令：收盘数据上线）：
          #   原逻辑只看 github.event.schedule，而 workflow_dispatch 触发时该值为空
          #   → case 落 *) 分支 → category=all（全量抓取，最重）。
          #   实测 15:42 派 intraday、16:05 派 post_close，两轮都实际跑成 all，
          #   叠加 step18 update_v8 全量重生成，25min 硬超时被杀 →
          #   data/*.js 已重生成却来不及 step21 推送 → 线上数据停滞在 14:2x。
          #   修复：workflow_dispatch 入参优先；入参为空才按 cron 判定。
          if [ -n "$IN" ]; then
            case "$IN" in
              premarket)  echo "category=premarket" >> "$GITHUB_OUTPUT"; echo "label=手动派发(盘前)" ;;
              intraday)   echo "category=intraday" >> "$GITHUB_OUTPUT"; echo "label=手动派发(盘中)" ;;
              post_close) echo "category=post_close" >> "$GITHUB_OUTPUT"; echo "label=手动派发(盘后)" ;;
              all)        echo "category=all" >> "$GITHUB_OUTPUT"; echo "label=手动派发(全量)" ;;
              *)          echo "category=all" >> "$GITHUB_OUTPUT"; echo "label=手动派发(未知入参→all)" ;;
            esac
          elif [ -n "$CRON" ]; then
            # 🛡 2026-09-11 小九的工程师（三档口径对齐·清理幽灵分支）：
            #   case 表此前同时接受 4 组 cron，其中 3 组**已不在本文件**——盘中
            #   `*/30 1-3` / `*/30 5-7`（09-10 起盘中抓取改由本机调度器
            #   v8_cn_fetch_intraday_lemoncat 以 workflow_dispatch 派发，见文件顶部说明）、
            #   旧的 `0 9,14` / `0 9,13` 全量档。留着不会误触发（永不匹配），但会让人误判
            #   「本文件还有盘中 cron」，与「盘前/盘中/盘后 权威划分表」口径冲突，故删除。
            #   判定仍是 github.event.schedule 原串精确匹配，未匹配即走 all 兜底（保底不变）。
            case "$CRON" in
              "25 0 * * 1-5")           # 08:25 CST 盘前（保留；历史实测被 GitHub 静默丢弃）
                CAT="premarket"; LB="盘前" ;;
              "*/20 0-3,5-6 * * 1-5")   # 08:00-09:00 盘前种子 + 09:00-11:40/13:00-14:40 盘中种子
                CAT="intraday";  LB="盘中(云端原生种子)" ;;
              "*/20 1-3,5-6 * * 1-5")   # 旧串（兼容：历史 run 的 github.event.schedule 可能仍为此值）
                CAT="intraday";  LB="盘中(云端原生种子·旧串兼容)" ;;
              "20 9-11 * * 1-5")        # 17:20 / 18:20 / 19:20 CST 盘后三档
                CAT="post_close"; LB="盘后" ;;
              "0 1 * * 0,6")            # 周六 / 周日 09:00 CST 周度全量
                CAT="all";       LB="全量兜底(周末周度)" ;;
              *)
                CAT="all";       LB="兜底(未匹配cron $CRON, 走all)" ;;
            esac

            # 🛡 2026-09-14 一劳永逸修复（小九令「下午盘中数据链断更」）：
            #   🔴 根因：GitHub schedule 高延迟时，`github.event.schedule` 仍是
            #   「应触发时刻的 cron」，与实际执行时刻严重脱节 ⇒ 僵尸 run 判成错类别。
            #   实证（run #1630，09-14）：08:25 盘前档 `25 0 * * 1-5` 被 GitHub 延迟
            #   4小时46分，13:11 才真正执行；日志铁证 `CRON="25 0 * * 1-5"` → `label=盘前`。
            #   后果：category=premarket ≠ intraday ⇒ 末端「🔁 盘中自接力」被 skip
            #   ⇒ 盘中链断档 37 分钟（13:11→13:48），主站实时页卡片集体停更，
            #     而 run 结论仍是 success（假绿）⇒ 一切看 run 结论的看门狗全瞎。
            #   🛠 修法：cron 判出 premarket 而实际 CST 已过 09:35 ⇒ 必为僵尸 run，
            #   改以「实际执行时刻」重判类别，保证抓到当下该抓的档位。
            #   （盘前档正常 08:25 执行时 _HM≈505 < 575，不受影响。）
            #   🛡 健壮性：python3 取时失败时 _HM 兜底为 0（<575）⇒ 不校正、保持原判定，
            #   安全降级，绝不因取时异常而阻断整个抓取步骤。
            _HM=$(python3 -c "from datetime import datetime,timezone,timedelta;n=datetime.now(timezone.utc)+timedelta(hours=8);print(n.hour*60+n.minute)" 2>/dev/null || echo 0)
            if [ "$CAT" = "premarket" ] && [ "$_HM" -ge 575 ]; then
              if [ "$_HM" -le 905 ]; then
                CAT="intraday";   LB="僵尸盘前档·按实际时刻重判(盘中 ${_HM}分)"
              elif [ "$_HM" -le 1290 ]; then
                CAT="post_close"; LB="僵尸盘前档·按实际时刻重判(盘后 ${_HM}分)"
              else
                CAT="all";        LB="僵尸盘前档·按实际时刻重判(深夜 ${_HM}分→all)"
              fi
            fi
            # 🔴 2026-09-22 一劳永逸修复（主人令「隔夜美股卡没更新」· 小九）：
            #   【病灶】盘前种子 `*/20 0-3,5-6`（含 08:00/08:20/08:40 三档）在 UTC 00
            #     时段执行时，上面 case 表判为 intraday。但 08:00–09:00（CST）**是盘前时段**：
            #     此时段不能跑 intraday —— 盘前 A 股未开盘，intraday 类变量（INDEX_QUOTES/
            #     ETF_PULSE/SECTOR_FUND_FLOW/…）取到的是上一交易日的收盘残值，
            #     会把「盘前」的时间戳写进盘中卡 ⇒ 与 2026-09-13 那次「周日 all 洗出
            #     15:3x 空窗时间戳」同族事故。
            #   🛠 修法：把实际时刻 ∈ [480, 540)（08:00–09:00）的 intraday 判定**上修为
            #     premarket**，使盘前种子真正落到盘前档；09:00 起仍按原样判 intraday。
            #     安全性：premarket 档只含盘前类变量，不含任何 intraday 变量 ⇒ 不会污染盘中卡。
            if [ "$CAT" = "intraday" ] && [ "$_HM" -ge 480 ] && [ "$_HM" -lt 540 ]; then
              CAT="premarket"; LB="盘中种子·按实际时刻上修为盘前(${_HM}分)"
            fi
            echo "category=$CAT" >> "$GITHUB_OUTPUT"
            echo "label=$LB"
          else
            # 🛡 2026-09-11 小九的工程师·一劳永逸（治「裸 dispatch 落 all」）：
            #   实证 09-11：09:39–10:21 有 6 次 `workflow_dispatch` 但**未带 category 入参**
            #   （actor=github-actions[bot]）→ 既无 IN 也无 CRON → 原先一路落到 `*)` = **all（最重档）**
            #   → 盘中跑了盘后策略（四量等）→ 命中 0 只 → 洗空 data/FOUR_VOLUME.js →
            #     前端卡空 + CI pre_deploy_audit 硬阻断整站部署。
            #   修复：无 IN 且无 CRON 时，按 **CST 当前时刻自适应** 归类，绝不再落 all。
            #   （all 仅保留给周末周度与显式请求；盘中派发无入参也只会跑 intraday，危害面归零。）
            # 用 python 显式 +8h 计算 CST，不依赖 TZ 环境变量是否生效（跨 runner 更稳）
            HM=$(python3 -c "from datetime import datetime,timezone,timedelta;n=datetime.now(timezone.utc)+timedelta(hours=8);print(n.hour*60+n.minute)")
            HSTR=$(python3 -c "from datetime import datetime,timezone,timedelta;n=datetime.now(timezone.utc)+timedelta(hours=8);print('%d:%02d'%(n.hour,n.minute))")
            # 🔴 2026-09-22 一劳永逸修复（主人令「隔夜美股卡没更新」· 小九）：
            #   【病灶】原窗口为 `HM>=505`（08:25）。而盘前档的**唯一**种子 cron
            #     `25 0 * * 1-5` 被 GitHub 静默丢弃（实测该 workflow 近 100 轮 run 中
            #     schedule 仅 5 次、且**全部落在盘中/盘后**，`25 0` 一次都没触发过）⇒
            #     盘前档长期只能靠第三方「推送顺带触发」的裸 dispatch 兜底。
            #   【实测事故·09-22】08:14:42 有一次裸 dispatch（HM=494）——
            #     494 < 505 ⇒ 落到最末 else ⇒ **judged as `all`（最重档）**，两个恶果：
            #       ① 全量档占满并发组（同组仅 1 running + 排队位），后续 run 被顶/积压
            #          （实测 11:52/11:57/12:03 连续 3 轮 cancelled、12:04/12:06 卡 pending）；
            #       ② 盘前语义丢失 ⇒ RUNNER_STATUS 记不上盘前档 ⇒ 依赖 premarket 单档的
            #          US_HK_MAP（隔夜美股映射）整链漏跑，卡面冻结在 09-21 08:20，
            #          HEALTH_CHECK 判 fail（age 1656min > 通用红线 1620min）。
            #   🛠 修法：盘前窗**向前扩展到 08:00**（480）。08:00–09:00 之间的任何裸派发
            #     一律判 premarket（轻档、语义正确、不堵塞并发组）—— 这正是「盘前兜底」
            #     该有的行为：盘前时段本就该跑盘前档，而不是最重的 all。
            #     安全性：premarket 档只抓盘前类变量（V8_CAL/IPO/MARGIN/MACRO/CRISIS/
            #     NORTH_FUND/ANALYST_RATINGS/W52_HIGH/VOLATILITY/RESTRICTED_RELEASE/
            #     PERFORMANCE_FORECAST/US_HK_MAP + MARKET_FUND_FLOW_DATA），
            #     不含任何 intraday 变量 ⇒ 不会把盘中卡时间戳落进设计空窗。
            # 🔴 2026-09-22 追加：盘前窗**下沿再前移到 06:00**（360）。
            #   理由：06:00–08:00 之间若有裸派发（本机守护/看门狗补位，实测存在），
            #   原逻辑落 `else` → all（最重档）⇒ 占满并发组、且「盘前语义」丢失。
            #   该时段本就无盘中数据可抓（A 股未开盘），跑 premarket 是最轻且语义正确的选择。
            if [ "$HM" -ge 360 ] && [ "$HM" -lt 540 ]; then
              echo "category=premarket" >> "$GITHUB_OUTPUT"
              echo "label=裸派发·按时刻自适应(盘前 $HSTR)"
            elif [ "$HM" -ge 540 ] && [ "$HM" -le 905 ]; then
              echo "category=intraday" >> "$GITHUB_OUTPUT"
              echo "label=裸派发·按时刻自适应(盘中 $HSTR)"
            elif [ "$HM" -gt 905 ] && [ "$HM" -le 1290 ]; then
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=裸派发·按时刻自适应(盘后 $HSTR)"
            else
              echo "category=all" >> "$GITHUB_OUTPUT"
              echo "label=裸派发·按时刻自适应(深夜 $HSTR → all)"
            fi
          fi
          # 注：原 if 兜底已删（重复 echo 同一 output 键会导致 GitHub Action 报 Multiple outputs）

      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1

      # 🔴 2026-09-25 阿狸咪·P0 一劳永逸：本块（setup-python + 安装依赖）由原「交易日历闸门之后」上移至此。
      #    根因：解析数据日期/交易日历闸门先于依赖安装运行 ⇒ fetch_lhb 顶层 import akshare 失败 ⇒
      #    v8_date 静默兜底 weekday()<5 ⇒ 休市日（如 2026-09-25 中秋）误判为交易日：V8_DATA_DATE 被标成
      #    休市日当天（61 个 data/*.js 假今日）、闸门 proceed=true 致全量空转（单日 ≥95 档）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "📦 安装依赖"
        # 🔴 2026-08-14 主人令永久修复：裸 `pip` 在 Windows runner 默认 PowerShell 下找不到
        #   （pip: ObjectNotFound，导致今天下午 13:40-14:04 云端链路 5 连败）。
        #   改用 `python -m pip`（不依赖 PATH），并显式 shell: bash 与其余 step 一致。
        shell: bash
        run: |
          python -m pip install akshare pandas requests --quiet
          python -c "import akshare, pandas; print('akshare', akshare.__version__, '/ pandas', pandas.__version__)"

      # 🛡 2026-08-29 统一交易日历中枢：所有下游脚本通过 V8_DATA_DATE 取「数据应属日期」，
      #   根治非交易日跑批把日期错标成「今天」的冒充今日问题。
      - name: "🗓 解析数据日期"
        id: data_date
        shell: bash
        run: |
          DATA_DATE=$(python -c "import v8_date; print(v8_date.today_data_date())")
          echo "data_date=$DATA_DATE" >> "$GITHUB_OUTPUT"
          echo "V8_DATA_DATE=$DATA_DATE" >> "$GITHUB_ENV"
          echo "📅 数据日期=$DATA_DATE"

      # 🛡 2026-08-22 一劳永逸（主人令根治）：幂等闸门升级
      #   旧版 exit 0 在 run: 块里只是退出当前 shell、后续步骤仍照跑 → 实际从未拦住抓取，
      #   且「只要有并发就跳过」过激：一个僵尸/过期 run 会永久冻住本卡刷新。
      # 🔴 2026-09-24 一劳永逸·第三重（根治「拆组后抓取被全量跳过」· 小九的工程师）：
      #   【病灶】判据是「同 workflow 是否存在 in_progress run」，**不含并发组维度**。
      #     并发组按 category 拆分后，intraday 与 post_close 可同时在跑 ⇒ 后到的 run
      #     一律判「已有新鲜同 workflow run」⇒ **「抓中国数据」step 直接 completed/skipped（0s）**。
      #     实测 09-24 15:41 run 的抓取 step = skipped 0s，连续多轮 run 空转、
      #     raw_data/capital_flow_data.json 停在 15:09、线上数据停在 15:05 —— 主人感知为「越修越差」。
      #   【修法】
      #     1) **按并发组（category）判重**：run 名已带 `[category]`；跨组一律放行。
      #        拿不到组标的（过渡期旧 run）同样放行 —— 宁多抓一轮，绝不停更；
      #     2) 新增**数据陈旧硬闸**：线上 data/INDEX_QUOTES.js 超过 25 分钟未更新 ⇒
      #        无视并发强制抓取（防「闸门误判 + 并发卡死」叠加造成长时间空窗）；
      #     3) 仅「正在执行且未超时(<35min)」视为有效并发；排队中/过期(>35min)视为僵尸不阻断。
      - name: "🔒 幂等闸门（按并发组判重；数据陈旧强制放行；僵尸不阻断）"
        id: gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          MY_CAT: ${{ github.event.inputs.category || 'scheduled' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, datetime
          token = os.environ.get('GITHUB_TOKEN', '')
          run_id = os.environ.get('RUN_ID', '')
          repo = os.environ.get('REPO', '')
          my_cat = (os.environ.get('MY_CAT') or 'scheduled').strip()
          out = os.environ.get('GITHUB_OUTPUT', '/dev/null')
          hdr = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          def emit(skip, msg):
              print(msg)
              print(f"skip={'true' if skip else 'false'}", file=open(out, 'a'))

          now = datetime.datetime.now(datetime.timezone.utc)

          # ① 数据陈旧硬闸：线上 data/*.js 太久没动 ⇒ 无视并发强制抓取
          try:
              cu = f"https://api.github.com/repos/{repo}/contents/data/INDEX_QUOTES.js?ref=main"
              body = urllib.request.urlopen(
                  urllib.request.Request(cu, headers=dict(hdr, Accept="application/vnd.github.raw")),
                  timeout=20).read().decode('utf-8', 'ignore')
              m = re.search(r'"update_time"\s*:\s*"([^"]+)"', body)
              if m:
                  t = datetime.datetime.strptime(m.group(1)[:19], '%Y-%m-%d %H:%M:%S').replace(
                      tzinfo=datetime.timezone(datetime.timedelta(hours=8)))
                  stale_min = (now - t).total_seconds() / 60
                  if stale_min > 25:
                      emit(False, f"⚠️ 线上数据已 {stale_min:.0f} 分钟未更新（>25） ⇒ 无视并发强制抓取")
                      sys.exit(0)
                  print(f"数据新鲜度 {stale_min:.0f} 分钟（≤25），进入并发组判重")
              else:
                  print("数据新鲜度：未取到 update_time ⇒ 保守按可抓处理")
          except Exception as e:
              print(f"数据新鲜度探测失败（忽略，不阻断）: {e}")

          # ② 按并发组（category）判重
          url = f"https://api.github.com/repos/{repo}/actions/workflows/v8_cn_fetch_cloud.yml/runs?per_page=100"
          try:
              d = json.load(urllib.request.urlopen(
                  urllib.request.Request(url, headers=hdr), timeout=20))
          except Exception as e:
              emit(False, f"幂等检查 API 失败，保守放行: {e}")
              sys.exit(0)

          reason = None
          for r in d.get('workflow_runs', []):
              if str(r.get('id', '')) == run_id:
                  continue
              if r.get('status') != 'in_progress':
                  continue
              started = r.get('run_started_at') or r.get('created_at')
              age = 999.0
              if started:
                  try:
                      ts = datetime.datetime.fromisoformat(started.replace('Z', '+00:00'))
                      age = (now - ts).total_seconds() / 60
                  except Exception:
                      age = 999.0
              if age >= 35:
                  continue
              nm = f"{r.get('name') or ''} {r.get('display_title') or ''}"
              m2 = re.search(r'\[([^\]]+)\]', nm)
              cand = m2.group(1).strip() if m2 else ''
              if cand != my_cat:
                  print(f"  并发 run#{r.get('id')} 属组[{cand or '未知'}] != 本组[{my_cat}] ⇒ 不判重")
                  continue
              reason = f"同组[{my_cat}] run#{r.get('id')} 在执行（{age:.0f} 分）"
              break

          if reason:
              emit(True, f"✅ 已有新鲜{reason}，本 run 幂等跳过抓取")
          else:
              emit(False, f"无有效并发 run（本组 {my_cat}） ⇒ 继续抓取")
          PY

      - name: "🛡 交易日历闸门（连续休市段跳过冗余抓取）"
        id: td
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CAT="${{ steps.cat.outputs.category }}"
          # check_trading_day.py：A 股交易日判断；失败时保守视为交易日（不跳过），避免调休漏跑
          TD=$(python algorithms/check_trading_day.py 2>/dev/null | grep -o 'is_trading_day=.*' | tail -1 | cut -d= -f2)
          if [ -z "$TD" ]; then TD="true"; fi   # 解析失败→保守视为交易日，不跳过
          if [ "$TD" != "true" ]; then TD="false"; fi
          echo "is_trading_day=$TD"
          echo "is_trading_day=$TD" >> "$GITHUB_OUTPUT"   # 🛡 2026-09-23 供「一进二观察」等日频卡步做周末闸门
          # 交易日 / 周末周度刷新(category=all) / 手动全量 → 继续抓取；
          # 仅「工作日 + 非交易日(节假日)」→ 跳过冗余抓取（V8_DATA_DATE 已保证不串日，无数据风险）
          if [ "$TD" = "true" ] || [ "$CAT" = "all" ]; then
            echo "proceed=true  (交易日 或 周末周度/手动全量)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false (工作日遇节假日，跳过冗余抓取)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "📡 抓中国数据 → raw_data/（selective）"
        # 🛡 2026-08-22 幂等闸门：skip=true 时本 run 不重复抓取（另一新鲜 run 已在做）
        if: steps.gate.outputs.skip != 'true' && steps.td.outputs.proceed != 'false'
        # 🛡️ 2026-09-24 主人令「按推荐方案全落地」：恢复 continue-on-error（选择性推送）。
        #   根因：cloud_fetch_v8 仅对「成功模块」save()（失败模块不写 → 远端旧值天然保留），
        #    但旧逻辑（2026-08-12 移除 continue-on-error）让抓取步 return 1 时整 job 失败 →
        #    后续 api_push_raw 全 skipped → 整批不推（连已成功模块的新数据也卡住）。
        #   恢复后：单/多源失败仅留痕，已成功模块照常推送，失败模块远端旧值保留；
        #    HEALTH_CHECK 显式标注未刷新源。空壳防护改由 freshness 看门狗事后核对。
        # 🔴 2026-09-22 小九·一劳永逸：步级时间锁（血证 cn_fetch #1990）保留——
        #   现象：本步曾静默卡死 50 分钟占满唯一并发槽位；卡点 ak.stock_xgsr_ths() 内 requests 不传 timeout
        #    （治本修复在 fetch_ipo_data_v8.py 注入 30s 超时；本锁为第二道防线）。
        #   取值依据：本步历史耗时 n=29 / p50=8.2min / max=20.2min ⇒ 30min=1.5×峰值封顶「无限挂死」。
        #   语义（2026-09-24 修正）：超时 → 本步 failure → continue-on-error 兜住不 kill job →
        #    已成功源照常由后续 api_push_raw 推送，槽位 30 分钟即释放。
        timeout-minutes: 30
        continue-on-error: true
        shell: bash
        run: |
          cat="${{ steps.cat.outputs.category }}"
          echo "本次类别: $cat"
          python cloud_fetch_v8.py --category "$cat"

      # 2026-09-01 主人令：#7 分红刷新上云（小九机降级为监督/应急兜底）。
      # 直接跑 refresh_dividend_cninfo（cninfo 源），写回 raw_data/stock_quote.json 并重建
      # data/STOCK_QUOTE.js；随后本 workflow 的「📤 推送 raw_data/」与「📤 推送重建 data/*.js」
      # 两步经 api_push_raw(Contents API) 自动上线——不再走 run_dividend_refresh.py 的本地 SSH 自推
      # （云端 runner 无 SSH 凭据，自推会失败）。cninfo 为境内源，云端偶发超时则 continue-on-error 跳过，
      # 由小九机「分红刷新」监督 automation 检测后作为应急兜底本地补跑。
      # 🗑 2026-09-11 主人 P3（清理孤儿链）：原 soft_2「ETF 申购赎回（东财口径）」整步删除。
      #   原因：该链 fetcher 一直在跑、raw_data/etf_subscription_em.json 一直产出，
      #   但 update_v8.py 侧的注入映射早已被注释掉 → data/ETF_SUBSCRIPTION_EM.js 从不生成、
      #   前端 0 引用 = 「半截接线」死链；且其「净申赎(亿)」实取「主力净流入-净额」，
      #   属 A 类估算值贴 B 类标签。真实 ETF 份额申赎已由 ETF_NET_SUBSCRIPTION
      #   （上交所基金份额日环比）取代，本链整体下线（脚本 + raw 已同步删除）。
      #   注：soft_2 删除后，后续 soft_* 保持原 id **不重编号**（与历史日志/告警一一对应，
      #   避免旧 issue 里的 soft_N 指向新步造成误读）；其 env 与汇总 for 列表已同步清理。

      - name: "🐉 刷新当日 LHB 数据（post_close + 周末全量）"
        id: soft_3
        if: steps.cat.outputs.category == 'post_close' || steps.cat.outputs.category == 'all'
        continue-on-error: true
        shell: bash
        run: |
          # fetch_lhb.py 产出 out/lhb_result.json；stage_to_raw 将其提升为 raw_data/lhb_data.json
          python algorithms/fetch_lhb.py
          python -c "import sys; sys.path.insert(0,'algorithms'); import stage_to_raw; stage_to_raw.main()"

          # 🔴 2026-09-08 主人令「软失败但强制告警」：本步 continue-on-error 保留（不阻断 job），
          #   但失败必须显式打 ::error:: annotation —— 否则与 H_AUTO_BUY 断更 3 天
          #   同款静默失败（脚本崩了、job 全绿、无人知晓）。
          _v8_rc=$?
          if [ "$_v8_rc" != "0" ]; then
            echo "::error title=v8-softfail:soft_3(exit=$_v8_rc)::🐉 刷新当日 LHB 数据（post_close + 周末全量） 软失败，退出码 $_v8_rc。本步不阻断 job，但对应数据可能未刷新，请核对健康面板该卡新鲜度。"
            exit 1
          fi

      - name: "🐉 回填 LHB 历史（post_close + 周末全量）"
        id: soft_4
        if: steps.cat.outputs.category == 'post_close' || steps.cat.outputs.category == 'all'
        continue-on-error: true
        shell: bash
        run: |
          python backfill_lhb_history.py

          # 🔴 2026-09-08 主人令「软失败但强制告警」：本步 continue-on-error 保留（不阻断 job），
          #   但失败必须显式打 ::error:: annotation —— 否则与 H_AUTO_BUY 断更 3 天
          #   同款静默失败（脚本崩了、job 全绿、无人知晓）。
          _v8_rc=$?
          if [ "$_v8_rc" != "0" ]; then
            echo "::error title=v8-softfail:soft_4(exit=$_v8_rc)::🐉 回填 LHB 历史（post_close + 周末全量） 软失败，退出码 $_v8_rc。本步不阻断 job，但对应数据可能未刷新，请核对健康面板该卡新鲜度。"
            exit 1
          fi

      # 2026-08-17 主人令：calc_commodity_elasticity.py 加入云端自动跑（之前从未自动跑过，导致国内期货 LC/SA 永远不显示）
      - name: "💹 商品涨价弹性榜重算（仅 post_close）"
        id: soft_5
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: bash
        run: |
          python algorithms/calc_commodity_elasticity.py

          # 🔴 2026-09-08 主人令「软失败但强制告警」：本步 continue-on-error 保留（不阻断 job），
          #   但失败必须显式打 ::error:: annotation —— 否则与 H_AUTO_BUY 断更 3 天
          #   同款静默失败（脚本崩了、job 全绿、无人知晓）。
          _v8_rc=$?
          if [ "$_v8_rc" != "0" ]; then
            echo "::error title=v8-softfail:soft_5(exit=$_v8_rc)::💹 商品涨价弹性榜重算（仅 post_close） 软失败，退出码 $_v8_rc。本步不阻断 job，但对应数据可能未刷新，请核对健康面板该卡新鲜度。"
            exit 1
          fi

      # 2026-08-17 主人令：板块周期 fetch_sector_rs 之前从未自动跑过，导致 3 天前数据陈旧
      - name: "🔄 板块相对强度重算（仅 post_close）"
        id: soft_6
