name: Deploy v8 Site (self-hosted)

# 🔴 2026-11-04 递归防护根治：数据管线 v8_build_deploy.yml 在把数据 commit 回 main 后，
#   会显式 `gh workflow run deploy-v8-site.yml` 唤起本工作流。原因：GitHub 规定
#   GITHUB_TOKEN(Actions 令牌) 的 push 不触发下游 push 类 workflow，导致数据更新后
#   Pages 停在旧部署（如 WAVE_ELLIOTT.js 缺 update_time → 前端徽章显示"已加载"）。
#   用 workflow_dispatch 绕过该限制，确保数据一落地即上线。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 经 GitHub 托管 ubuntu-latest 运行器构建静态站点并发币到 GitHub Pages。
# 目的：
#   ① 绕开 GitHub 原生 "branch: main" 构建服务器（其持久化工作克隆含已删除的
#      docs/ops 超长名文件，git checkout 永远失败 -> Pages 长期 build errored）；
#   ② 2026-11-02 事故根治：原 runs-on:[self-hosted,Windows] 依赖一台常驻自托管机，
#      该机离线即导致 Pages 卡在旧版本、所有 main 推送只排队不部署
#      （实测线上 19:13 CST 后冻结逾 1 小时，龙虎榜真实数据无法上线）。
#      ubuntu-latest 为临时干净运行器，既避开中毒克隆、又始终可用，
#      部署不再有单点故障（自托管机离线也不影响上线）。
# 本工作流 checkout 当前 main，仅打包站点所需文件为制品，由 actions/deploy-pages 经 API 发布。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout (clean, fetch-depth 1)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build site artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp *.css _site/ 2>/dev/null || true
          cp *.js _site/ 2>/dev/null || true
          cp *.html _site/ 2>/dev/null || true
          mkdir -p _site/assets
          cp -r assets/* _site/assets/ 2>/dev/null || true
          mkdir -p _site/data
          cp -r data/* _site/data/ 2>/dev/null || true
          echo "artifact files: $(find _site -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
