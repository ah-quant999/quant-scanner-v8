  - id: cn-runner-ps1-utf8-noBOM-gbk-parse-fail
    priority: P1
    owner: shared
    status: pending-verify
    what: >-
      **cn runner 上的 Windows PowerShell `run:` 块严禁出现非 ASCII 字符。** 机制（已到字节级）：
      cn runner 是 Windows 且系统码页为 **GBK(936)**，而 GitHub Actions 把 `run:` 写成的临时 `.ps1`
      是 **UTF-8 无 BOM**；Windows PowerShell 5.1 对无 BOM 脚本**按 ANSI(GBK) 解码** ⇒
      多字节字符的**尾字节会「吃掉」紧随的那个字节**（引号 0x22 或换行 0x0A 都在 GBK 尾字节合法区间
      0x40–0xFE 之外 ⇒ 解码器把该 2 字节对整体替换掉）⇒ 后果分两级：
      · **解析期硬失败**：被吃掉的是 `"` ⇒ `ParserError: 字符串缺少终止符`；
      · **静默吞行（更危险）**：被吃掉的是换行 ⇒ 下一行代码并入上一行的注释
        ⇒ **整条语句凭空消失、零报错、零红灯**。
    impact: >-
      · **已致真事故**：`v8_dajijin_fetch.yml` 4 个 run 块中 3 个解析失败 ——
        step0 `Write-Host "[fatal] 抓取器未就位，本链无法继续"` 的收尾引号被吞 ⇒ 该链
        **2/2 run 全部死在第 2 步「同步源码」**（run #1/#2）。
      · **静默丢码实证**：step2 原文 8 行，cp936 解码后**只剩 7 行** ——
        `$out = python scripts/dajijin_need_push.py 2>&1 | Out-String`
        **整行并入上一行注释** ⇒ `$out` 恒 `$null` ⇒ `need=0` ⇒ **即使解析通过也永远不推送**。
      · **同族潜伏面（本项主体风险）**：全仓扫描（`shell` 为 powershell/pwsh/cmd 且 `run` 含非 ASCII）
        另有 **4 个块 / 3 个 workflow**：`v8_algo_run.yml` ×2（step0 20 行中文注释、step4 2 行）、
        `v8_cn_fetch_cloud_selfhosted.yml` ×1（7 行）、`v8_lhb_fetch.yml` ×1（1 行）。
        **实测这 4 个块今日解析 0 错**（被吞的都是同行注释、未命中引号/换行），
        但**同一条字节规则随时会命中** ⇒ 属**结构性隐患**，任何一次改字都可能引爆。
    fix: >-
      **已修**：`v8_dajijin_fetch.yml` 三个 run 块内 10 行中文（注释 / `Write-Host` 日志 /
      提交信息文案）**ASCII 化**，**代码逻辑零改动**（AST 命令序列比对为证）；中文原文无损保留为
      文件尾部 YAML 注释块（YAML 由 GitHub 按 UTF-8 读、**不经 PowerShell**，故无风险）。
      提交 `86a7f056a1e9`（parent `51ad156adb13`），blob `02299413152a`。
      ⏳ **未做（留 owner 裁决）**：另 3 个 workflow 的 4 个同族块是否同批 ASCII 化。
      **阿狸咪判断**：`v8_algo_run.yml` 是主算法链，为「潜伏项」动它有回归风险，
      建议**等一次专门窗口**同批处理，而不是在巡检轮里顺手改。
    verify_how: >-
      **可复现命令（本机即 alimi-cn runner，故结论可复现）**：
      ① 取远端 `run:` 块 → 替换 `${{ … }}` 表达式 → 以 **UTF-8 无 BOM** 写 `.ps1`
         （`run.encode('utf-8')`，**勿加 BOM**）→ 用 PowerShell 5.1 解析：
         `[System.Management.Automation.Language.Parser]::ParseFile($f,[ref]$null,[ref]$errs)`
         ⇒ 修复前 `errs = 2/3/0/2`，修复后 `0/0/0/0`。
      ② **静默吞行判据**：`[System.Text.Encoding]::GetEncoding(936).GetString(bytes)`
         的**行数** < UTF-8 解码的行数（实测 step0 29→27、step2 8→7）即已吞行。
      ③ **等价性判据**：对修复前后块提取 `CommandAst.GetCommandName()` 有序序列
         ⇒ 现存语句必须一一对应；修复前 step2 缺 `python`/`Out-String` 即被吞证据。
      ④ 反向判据（防回归）：仓库内任何 `.ps1`（含 `run:` 块落盘体）**非 ASCII 字符数应为 0**。
    evidence: >-
      · 本机实测（PowerShell 5.1.19041.2364，即 runner 同机同版本）：
        修复前 step0 `2 err @L24 字符串缺少终止符: "`、step1 `3 err`、step2 `0 err 但丢语句`、step3 `2 err`。
      · cp936 逐字节还原（`GetEncoding(936)`）：step0 行 24 变为
        `Write-Host "[fatal] 鎶撳彇鍣ㄦ湭灏变綅锛屾湰閾炬棤娉曠户缁? -ForegroundColor Red`
        —— 收尾 `"` 消失 ⇒ 字符串吞到行尾。
      · CI 侧原始证据：run #1（`36006148888`）/ #2（`36034611514`）均
        `FAILED STEP #2 📝 同步源码`，报 `ParserError … TerminatorExpectedAtEndOfString`。
      · 修复后：run #3（`86a7f056a1e9`）/ #4（`87fe569b43d7`）6 步全 success，
        且日志出现 ASCII 化后的 `[fatal] fetcher scripts not present…`（证明新码在执行）。
    updated: 2026-09-25 17:05
    updated_by: 阿狸咪的工程师(alimi-cn)

