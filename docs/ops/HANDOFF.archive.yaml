         五态映射、summary 行含 `(s.limited||0)` 与 `(s.info||0)`、诊断区为白名单式；
      ④ 以 status=info 的项喂两页诊断区函数，断言不进诊断区；以未知 status 喂网格/setRow，
         断言不显红（中性灰）。
      ⚠️ ② ③ 与 ① 分别验证「两页不显」与「后端不发」，**缺一即回归风险**（两条路径独立）。
