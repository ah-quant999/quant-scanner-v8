      success ⇒ 非 [13/13] 阻断。分界提交 = 69166eab4d（卡面假刷新根治），其引入
      `if not existing and not obj_had_ts and _existing_file_ts:`（update_v8.py L776）却未定义
      obj_had_ts ⇒ `NameError: name 'obj_had_ts' is not defined`，update_v8.py 以 exit 1 终止。
      该提交当时的推送自证只跑了 py_compile —— 它不解析名字，故对运行期 NameError 静默漏检。
