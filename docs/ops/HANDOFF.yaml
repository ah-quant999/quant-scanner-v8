# ============================================================================
# 双机交接唯一状态源 · quant-scanner-v8
# ============================================================================
#
# 🔴🔴 本文件是「什么还没做 / 谁在做 / 做到哪」的唯一权威来源。
#
# 规则（2026-09-21 主人批准，双机共同遵守）：
#   1. 任何挂账、待办、待验证、待拍板项 —— **只登记在本文件**，不散落在交接档里。
#   2. 查「还有什么没做完」= 读本文件，**不要翻 docs/ops/handover/ 的 518 个档**。
#   3. 交接档只在**需要人拍板**或**跨机需知的结构性变更**时才写；
#      技术细节写进**代码注释**，改动记录写进 **git commit message**。
#   4. 严禁「回执档」「催办档」—— 收到 = 改本文件的状态字段。
#   5. 本文件每项必须有 `updated`（时刻）；改状态时**就地更新**，不追加新条目。
#
# status 取值：
#   todo            未开始
#   doing           进行中（有 active owner）
#   pending-verify  改动已上线，但**尚未被运行验证生效** ← 最易被误报为「已完成」
#   blocked         等外部条件（如等 run、等对方）
#   done            已验证生效（含验证证据）
#
# ⚠️ 判据纪律：`代码改了` ≠ `产物重跑了` ≠ `被 run 验证生效`。
#    `pending-verify` 状态**不得**对外宣称「已修复」。必须填 `verified_at` 才算 done。
#
# 数据采集时刻：2026-09-21 08:40 CST（小九机实测）
# ============================================================================

