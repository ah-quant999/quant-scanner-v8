      - name: "🛡️ 原子提交 index.html ?v（与本次 data 同轮上线，根治 ?v 失配）"
        id: soft_15
        # 2026-09-02 一劳永逸根治「?v 缓存戳失配」：生成器跑完 update_v8.py 已本地重写
        # index.html ?v，但此前从不推送 index.html → ?v 改动随 runner 销毁丢失；且 build_deploy
        # 的 push 组高频互相 cancel 时 ?v 永不提交。现本步用 git 把 ?v 与本次 data 同轮推上线。
        # 先 sync 远端再重写 ?v，确保 ?v 基于「当前线上最新 data」而非构建机滞后副本；
        # 与 v8_cache_buster_reconcile / v8_build_deploy 三处共用 update_v8.py --only-cache-busters，
        # 形成「生成器原子提交 + build 提交前守卫 + reconcile 15分钟兜底」三保险。
        continue-on-error: true
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "v8-cloud-bot"
          git config user.email "v8-bot@users.noreply.github.com"
          REPO="https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git"
          _v8_ok=0
          for i in 1 2 3; do
            git fetch "$REPO" main
            git reset --hard FETCH_HEAD
            python update_v8.py --only-cache-busters

            # 🔴 2026-09-23 小九补 · 缺口② cn-fetch-writer-version-drift
            #   背景：2026-09-22 22:20:41 index.html 被 commit 7c78439fe8 删掉尾部 183 行
            #   （A2 懒加载块 STOCK_LIST/STOCK_QUOTE/LHB_HISTORY 全没），而 update_v8.py 的
            #   _atomic_write_index_html 是软守卫（只匹配文本末 200 字含 </html>），
            #   对「截断点在中间 / 守卫被跳过 / 守卫后的二次损坏」无感。
            #   ⇒ 本步在 git add 之前做四项硬断言，任一不过即 exit 1（不 add / 不 commit / 不 push）。
            #   ⚠️ 保持 continue-on-error: true（不阻断 job），但会打 ::error:: 显式告警。
            python - <<'PYEOF_IDXGUARD'
            import io, sys, os
            p = "index.html"
            if not os.path.isfile(p):
                print("::error title=v8-index-guard::index.html 不存在，已阻止推送"); sys.exit(1)
            raw = io.open(p, "rb").read()
            txt = raw.decode("utf-8", "replace")
            nlines = txt.count(chr(10)) + 1
            errs = []
            MIN_LINES = 18800
            if nlines < MIN_LINES:
                errs.append("行数 %d < %d（疑尾部截断）" % (nlines, MIN_LINES))
            if "</html>" not in txt[-200:]:
                errs.append("末 200 字内无 </html>（HTML 未闭合）")
            for k in ["{name:'STOCK_LIST'", "{name:'STOCK_QUOTE'", "{name:'LHB_HISTORY'"]:
                if k not in txt:
                    errs.append("缺 A2 锚点 %s（尾部块被删）" % k)
            MIN_BYTES = 1250000
            if len(raw) < MIN_BYTES:
                errs.append("字节数 %d < %d" % (len(raw), MIN_BYTES))
            if errs:
                print("::error title=v8-index-guard::index.html 完整性断言失败，已阻止推送")
                for e in errs:
                    print("  - " + e)
                sys.exit(1)
            print("\u2705 index.html 完整性断言通过：行数=%d 字节=%d 尾部闭合=OK A2三锚=OK" % (nlines, len(raw)))
            PYEOF_IDXGUARD

            git add -f index.html
            if git diff --cached --quiet; then
              echo "ℹ️ ?v 已最新，无需推送"; _v8_ok=1; break
            fi
            git commit -m "chore: 生成器原子提交 ?v → 防覆盖 ($(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))"
            if git push "$REPO" HEAD:main; then
              echo "✅ 已原子提交 ?v (第 $i 次)"; _v8_ok=1; break
            fi
            echo "⚠️ push 被拒，同步远端后重试 ($i/3)"
          done

          # 🔴 2026-09-08 主人令「软失败但强制告警」：本步 continue-on-error 保留（不阻断 job），
          #   但失败必须显式打 ::error:: annotation —— 否则与 H_AUTO_BUY 断更 3 天
          #   同款静默失败（脚本崩了、job 全绿、无人知晓）。
          _v8_rc=0; [ "${_v8_ok:-1}" = "1" ] || _v8_rc=1
          if [ "$_v8_rc" != "0" ]; then
            echo "::error title=v8-softfail:soft_15(exit=$_v8_rc)::🛡️ 原子提交 index.html ?v（与本次 data 同轮上线，根治 ?v 失配） 软失败，退出码 $_v8_rc。本步不阻断 job，但对应数据可能未刷新，请核对健康面板该卡新鲜度。"
            exit 1
          fi

      - name: "🛰️ 云端兜底调度（算法链/温度计，幂等）"
