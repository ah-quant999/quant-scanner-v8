# 九宝量化 v8.0 — 运维看板常态自愈巡检（云端 ubuntu，每小时）
#
# 2026-08-10 用户痛点：运维看板（任务运行/盘后数据/实时数据/选股策略/今日事件）
# 出现 stale / fail 时，全靠人工看图才发现，没有「自动巡检 + 自动派发治愈」的常驻机制。
# 原 v8_self_heal.yml 仅周六 14:00 跑一次（周末兜底），runner_health_alert.yml 只查 runner 离线，
# 本机看门狗（WorkBuddy 自动化）若那阵子没跑则整体停摆（表现为「任务运行看板 更新于 4天前」）。
#
# 本工作流：纯云端 ubuntu-latest，每小时跑 `v8_health_check.py --heal`，
#   1) 检测全部前端数据卡片新鲜度 + 空值 + 管线同步；
#   2) 发现 fail 卡片即按 page→category 逐源自动派发对应 cn_fetch / algo_run 刷新；
#   3) 本地/部署不同步自动对齐 + 派发 build_deploy；
#   4) 自愈成功发『已自愈』确认邮件，失败/不可自愈项升级邮件。
# 不依赖本机小九在线，GHA cron 永不漏跑，从根上实现「小九自己发现、自己自愈」。
#
# 自愈动作在夜间静音时段照常执行（仅不发邮件，写 URGENT 留痕）。

name: "🩺 v8 运维看板常态自愈巡检(云端ubuntu)"

on:
  schedule:
    - cron: '23,53 * * * *'      # 每 30 分钟第 23/53 分 UTC（北京每半小时整点后 8 分，避开高峰）
  workflow_dispatch:
    inputs:
      force:
        description: "强制运行（忽略去抖锁）"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write            # 必须：dispatch 其他 workflow 做派发治愈

jobs:
  ops-self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ah-quant999/quant-scanner-v8
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🩺 巡检 + 自动治愈"
        id: heal
        continue-on-error: true
        run: |
          echo "=== 运维自愈巡检 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') ==="
          echo "=== DEBUG: python version ===" && python --version
          echo "=== DEBUG: git log ===" && git log --oneline -3
          echo "=== DEBUG: data/STOCK_RPS time ===" && grep -o '"update_time": *"[0-9-]*"' data/STOCK_RPS.js 2>/dev/null | head -1 || echo "NO STOCK_RPS"
          python v8_health_check.py --heal 2>&1 | tee heal_output.txt; echo "PYTHON_EXIT=$?"

          # 提取自愈结果用于摘要
          HEALED=$(grep -c "\[HEAL✓\]" heal_output.txt 2>/dev/null || echo "0")
          FAILED=$(grep -c "\[HEAL✗\]" heal_output.txt 2>/dev/null || echo "0")
          FAIL=$(grep -c "\[FAIL\]" heal_output.txt 2>/dev/null || echo "0")
          echo "healed=$HEALED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "💊 自动治愈 $HEALED 项 / 失败 $FAILED 项 / 仍 fail $FAIL 项"

      - name: "📊 巡检摘要"
        if: always()
        run: |
          echo "## v8 运维自愈巡检 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo "- 自动治愈: ${{ steps.heal.outputs.healed }} 项" >> $GITHUB_STEP_SUMMARY
          echo "- 自愈失败: ${{ steps.heal.outputs.failed }} 项" >> $GITHUB_STEP_SUMMARY
          echo "- 仍 fail: ${{ steps.heal.outputs.fail }} 项" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 40 heal_output.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "无输出" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "🚨 自愈失败升级"
        if: steps.heal.outputs.failed != '0' && steps.heal.outputs.failed != ''
        run: |
          echo "::warning::运维自愈有 ${{ steps.heal.outputs.failed }} 项失败，需人工介入（见邮件/URGENT 文件）"
