      # 🔴 2026-09-08 主人令「软失败但强制 ::error:: 告警」：
      #   上面各消费步保留 continue-on-error（不阻断 job，尊重 2026-08-18 软失败策略），
      #   但每步失败已单独打 ::error:: annotation；这里再做一次集中汇总，
      #   让巡检一眼看到本轮有哪些软失败——而不是翻遍日志才发现问题。
      # 🛡 2026-09-18 一劳永逸（主人令「今日事件页没更新」根因修复 · 小九的工程师）：
      #   【事故】09-18 08:16 盘前轮 35290486459：step9 抓取 success（耗 23min）→
      #     step10「💰 分红方案刷新」卡死 36min → job 级 timeout-minutes:60 撞死 →
      #     step18/19/20/23/24（推送 raw_data / 桥接 / 重建 data/*.js / 推送 data /
      #     原子提交 ?v）**全部 skipped** ⇒ 本批盘前数据整批报废。
      #     后果具体化为：V8_CAL 与 IPO_DATA 只挂 category=premarket（无 intraday/post_close
      #     兜底），当日再无人重跑 ⇒ 「今日事件详情」「打新速览」两张卡全日陈旧
      #     （主人截图所报「今日事件页今天没更新」）。
      #   【历史证据】该步单步耗时 17~39min（35200819678=2340s / 35232628293=1860s /
      #     35197088557=1010s），而抓取步稳定耗 23min ⇒ **必然反复撞 60min 天花板**，
      #     不是偶发，是结构性缺陷。
      #   【修法】本步原位于「📤 推送 raw_data/」之前 —— 今整体**后移**到**整条推送/重建/上线链的最末尾**
      #     （「📤 推送 raw_data」→「🔗 桥接」→「🔄 重生成 data/*.js」→「📤 推送 data」→「🛡️ 原子提交 ?v」之后），
      #     并加步级 timeout-minutes:20 硬超时（脚本内另有 900s 预算闸门，双保险）。
      #     ⇒ 即便本步再次超时，也只影响分红数据本身，推送链/重建链/上线链一律不受牵连。
      #     ⇒ 「fail-soft 步骤绝不允许排在关键推送之前」这条铁律在此落地。
      #   【为何必须放到"最末"而非"仅推送 raw_data 之后"】核验实测：推送类步骤共 3 个 ——
      #     「📤 推送 raw_data」(pos13) /「📤 推送重建的 data/*.js」(pos20) /
      #     「🛡️ 原子提交 index.html ?v」(pos21)。若只后移到 pos14，仍挡在 pos20/21 之前，
      #     一旦 hang 则 data/*.js 与 ?v 依旧上不了线 —— 主人的卡照样陈旧（因为
      #     data/V8_CAL.js 重建完却推不出去）。⇒ 正确位置 = 全部推送动作之后。
      - name: "💰 分红方案刷新（cninfo·云端主跑）"
        id: soft_1
        if: (steps.cat.outputs.category == 'premarket' || steps.cat.outputs.category == 'post_close' || steps.cat.outputs.category == 'all') && steps.td.outputs.proceed != 'false'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          # 🛡 2026-09-18：脚本内置 900s 总时长预算闸门（到点优雅落盘已刷部分，
          #   保证早于步级 20min 超时退出）；此处再传 --budget 显式覆盖，双保险。
          python algorithms/refresh_dividend_cninfo.py --budget=900

          # 🔴 2026-09-08 主人令「软失败但强制告警」：本步 continue-on-error 保留（不阻断 job），
          #   但失败必须显式打 ::error:: annotation —— 否则与 H_AUTO_BUY 断更 3 天
          #   同款静默失败（脚本崩了、job 全绿、无人知晓）。
          _v8_rc=$?
          if [ "$_v8_rc" != "0" ]; then
            echo "::error title=v8-softfail:soft_1(exit=$_v8_rc)::💰 分红方案刷新（cninfo·云端主跑） 软失败，退出码 $_v8_rc。本步不阻断 job，但对应数据可能未刷新，请核对健康面板该卡新鲜度。"
            exit 1
          fi

      - name: "📢 软失败汇总告警（不阻断 job，但强制 annotation）"
        if: always()
        shell: bash
        env:
          V8_SF_soft_1: ${{ steps.soft_1.outcome }}
          V8_SF_soft_3: ${{ steps.soft_3.outcome }}
          V8_SF_soft_4: ${{ steps.soft_4.outcome }}
          V8_SF_soft_5: ${{ steps.soft_5.outcome }}
          V8_SF_soft_6: ${{ steps.soft_6.outcome }}
          V8_SF_soft_7: ${{ steps.soft_7.outcome }}
          V8_SF_soft_8: ${{ steps.soft_8.outcome }}
          V8_SF_soft_9: ${{ steps.soft_9.outcome }}
          V8_SF_soft_10: ${{ steps.soft_10.outcome }}
          V8_SF_soft_11: ${{ steps.soft_11.outcome }}
          V8_SF_soft_12: ${{ steps.soft_12.outcome }}
          V8_SF_soft_13: ${{ steps.soft_13.outcome }}
          V8_SF_soft_14: ${{ steps.soft_14.outcome }}
          V8_SF_soft_15: ${{ steps.soft_15.outcome }}
          V8_SF_soft_16: ${{ steps.soft_16.outcome }}
        run: |
          FAILED=""
          # 显式列出本 job 全部软失败步 id（生成期确定，不依赖 env 扫描，永不漏）
          for sid in soft_1 soft_3 soft_4 soft_5 soft_6 soft_7 soft_8 soft_9 soft_10 soft_11 soft_12 soft_13 soft_14 soft_15 soft_16; do
            eval "v=\"\${V8_SF_$sid:-}\""
            if [ "$v" = "failure" ] || [ "$v" = "cancelled" ]; then
              FAILED="$FAILED $sid"
            fi
          done
          if [ -n "$FAILED" ]; then
            N=$(echo $FAILED | wc -w)
            echo "::error title=v8-softfail-summary::软失败步（不阻断 job，但对应数据可能未刷新）：$FAILED"
            {
              echo "## ⚠️ 本轮软失败 ${N} 项（job 未阻断）"
              echo ""
              echo "以下消费步失败但按软失败策略未阻断 job，对应数据**可能未刷新**，请核对健康面板："
              echo ""
              for s in $FAILED; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 本轮无软失败（所有消费步 outcome 非 failure）"
          fi

      # 🔴 2026-09-10 一劳永逸根治「假成功」（主人令）：
      #   病灶：本 job 有 16 个消费步 `continue-on-error: true`（2026-08-18 软失败策略），
      #     失败只打 ::error:: annotation，**job 结论仍为 success** → run 全绿。
      #     于是任何监控（看门狗/巡检/人眼）看到 success 就认定"数据已刷新"，不再兜底
      #     → 数据持续陈旧而无人补（09-10 盘中 26~102 分钟空窗的成因之一）。
      #   本步不看"步骤有没有报错"，只看「结果事实」：远端 main 上本轮该刷新的代表文件，
      #     其 update_time 是否真的推进到了本轮开始之后。
      #   分级（与看门狗分工，不重复）：
      #     - 本轮【0 个代表文件推进】= 整轮空转的假成功 → ::error + exit 1，让 run 如实变红；
      #     - 部分推进 = 局部软失败 → 已由上方 softfail-summary 覆盖，本步不重复报红。
      #   读远端走 Contents API（Accept: raw 直取 git blob），**不走 Pages CDN** —— CDN 有缓存会误判。
      - name: "🔍 数据落地实证终检（杜绝『run 全绿但数据没动』的假成功）"
        id: landcheck
        if: always() && steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V8_CAT: ${{ steps.cat.outputs.category }}
          V8_RUN_START: ${{ github.run_started_at }}
        run: |
          python3 - <<'PY'
          import os, re, sys, datetime, urllib.request

          tok = os.environ.get("GITHUB_TOKEN", "")
          cat = (os.environ.get("V8_CAT", "") or "").strip()
          started = (os.environ.get("V8_RUN_START", "") or "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "ah-quant999/quant-scanner-v8")

          # 与 v8_cn_fetch_watchdog.yml 的 PROBE 同源同口径（单一事实来源，不另立一套）
          PROBE = {
              "intraday":   ["LIMIT_UP_HEATMAP.js", "CONCEPT_RANKING.js", "CAPITAL_FLOW_DATA.js",
                             "SECTOR_FUND_FLOW.js", "INDEX_QUOTES.js", "CANDIDATE_QUOTES.js",
                             "MARKET_ALERTS.js"],
              "premarket":  ["JUDGMENT_DATA.js", "CRISIS_DATA.js", "LIMIT_UP_HEATMAP.js",
                             "US_HK_MAP.js", "V8_CALENDAR.js", "MARGIN_DATA.js"],
              "post_close": ["LHB_DATA.js", "CANDIDATE_QUOTES.js", "CAPITAL_FLOW_DATA.js",
                         "MARKET_ALERTS.js"],
          }
          files = PROBE.get(cat)
          if not files:
              print(f"[landcheck] category={cat or '(空)'} 不在校验清单（如 all / 周度），本步跳过")
              sys.exit(0)

          try:
              base = datetime.datetime.strptime(started[:19], "%Y-%m-%dT%H:%M:%S")
          except Exception:
              print(f"[landcheck] 无法解析 run_started_at={started!r}，保守跳过（宁可不报，不误报）")
              sys.exit(0)
          # 容差 3 分钟：run_started_at 与脚本内取「当前时间」存在排队/启动差
          base = base - datetime.timedelta(minutes=3)
          print(f"[landcheck] 本轮基准时间 {base}（run_started_at {started} - 3min 容差）")

          PAT = re.compile(r'"?update_time"?\s*[:=]\s*"([^"]+)"')
          advanced, stale, unknown = [], [], []

          for fn in files:
              url = f"https://api.github.com/repos/{repo}/contents/data/{fn}?ref=main"
              try:
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {tok}",
                      "Accept": "application/vnd.github.raw",
                      "User-Agent": "v8-landcheck",
                      "X-GitHub-Api-Version": "2022-11-28"})
                  txt = urllib.request.urlopen(req, timeout=25).read().decode("utf-8", "replace")
              except Exception as e:
                  print(f"[landcheck]   ! {fn}: 远端读取失败 {e}")
                  unknown.append(fn)
                  continue
              m = PAT.search(txt)
              if not m:
                  print(f"[landcheck]   ? {fn}: 无 update_time 字段")
                  unknown.append(fn)
                  continue
              raw = m.group(1).strip().replace("T", " ")
              dt = None
              for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M:%S"):
                  try:
                      dt = datetime.datetime.strptime(raw[:19] if len(raw) >= 19 else raw, fmt)
                      break
                  except Exception:
                      continue
              if dt is None:
                  print(f"[landcheck]   ? {fn}: update_time 无法解析 ({raw!r})")
                  unknown.append(fn)
                  continue
              if dt >= base:
                  print(f"[landcheck]   OK  {fn}: {dt} 已推进")
                  advanced.append(fn)
              else:
                  print(f"[landcheck]   XX  {fn}: {dt} 未推进")
                  stale.append(fn)

          verdict = "skip"
          if advanced:
              verdict = "ok"
              if stale:
                  print(f"[landcheck] 部分未推进 {stale}（已由软失败汇总覆盖，本步不重复报红）")
          elif stale:
              verdict = "empty_round"
          else:
              print("[landcheck] 全部文件无法读取/解析，证据不足 → 不误报红")

          # 🆕 2026-09-24 东财源组判红（治「东财系盘中停摆但 run 全绿」）：
          #   病灶：盘中主力跑 GitHub hosted（海外 IP），东财 push2delay 拒答 ⇒ 东财系任务
          #   每轮 empty（不覆盖旧产物）；而 landcheck 只要非东财源（INDEX_QUOTES 等）推进
          #   1 个就判 ok ⇒ 调度器「小九 cn 兜底」几乎永不触发 ⇒ 东财卡整日停摆。
          #   修法：intraday 档东财源组**全部**未推进（哪怕其余源全绿）→ run 判红 exit 1
          #   ⇒ 调度器 check_cloud 探到 failure 触发小九 selfhosted 兜底轮（中国 IP 可抓东财）。
          #   红 run 在此语义下 = 自愈链路信号，非事故。
          EAST_FILES = ["CONCEPT_RANKING.js", "CAPITAL_FLOW_DATA.js", "SECTOR_FUND_FLOW.js",
                        "LIMIT_UP_HEATMAP.js", "CANDIDATE_QUOTES.js"]
          east_stale = [f for f in stale if f in EAST_FILES]
          east_adv = [f for f in advanced if f in EAST_FILES]
          east_all_stale = (cat == "intraday" and bool(east_stale) and not east_adv)
          if east_all_stale:
              verdict = "east_group_stale"
              print(f"[landcheck] 东财源组 {len(east_stale)} 个全部未推进"
                    f"（其余源推进 {len(advanced)} 个）→ 判红触发小九 cn 兜底")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"verdict={verdict}\n")
                  f.write(f"advanced={len(advanced)}\n")
                  f.write(f"stale={len(stale)}\n")

          if verdict in ("empty_round", "east_group_stale"):
              if verdict == "empty_round":
                  msg = (f"本轮 category={cat} 应刷新 {len(files)} 个代表文件，"
                         f"实际【0 个】推进 → 整轮空转（假成功）")
                  detail = ", ".join(f"`{x}`" for x in stale)
              else:
                  msg = (f"本轮 category={cat} 东财源组 {len(east_stale)} 个代表文件全部未推进"
                         f"（其余源推进 {len(advanced)} 个）→ 东财数据假成功")
                  detail = ", ".join(f"`{x}`" for x in east_stale)
              print("::error title=v8-fake-success::" + msg +
                    "。远端 main 数据未更新，本轮此前的 success 不可信，请查本轮软失败 annotation。")
              gh_sum = os.environ.get("GITHUB_STEP_SUMMARY")
              if gh_sum:
                  with open(gh_sum, "a") as f:
                      f.write(f"## ❌ 假成功：{msg}\n\n未推进文件：" + detail + "\n")
              sys.exit(1)
          PY

      # 🔁 2026-09-11 小九的工程师·一劳永逸（治「盘中 14 档双源皆哑」）：
      #   病灶：盘中 20 分钟档此前**只有定时器**——`v8_cn_fetch_intraday_lemoncat.yml` 的
      #     14 档 GitHub schedule。实证 2026-09-11：该 workflow **全天 0 次运行**
      #     （GitHub schedule 静默失约，平台级问题、无法在本仓根治），WorkBuddy 侧对应
      #     调度器同时处于 PAUSED → 10:40 / 11:00 / 11:20 / 11:30 **四个档位全部零派发**，
      #     数据两次靠人工兜底（10:48、11:36）才没断档。
      #   修法：**不再依赖任何定时器**——本轮 intraday 成功落地后，由本步自行派发下一轮。
      #     间隔 = 本轮耗时（实测 9~18 分钟），天然落在「20 分钟档」区间；
      #     只要链上有一环活着，链条就自己维持到收盘；窗口外自动停止。
      #   闸门：① 仅盘中窗口（09:38-11:32 / 12:58-15:05 CST）；② 距本轮开跑 <15 分钟则等待，
      #         保持 20 分钟档节奏、不与外部派发叠加成风暴；③ 幂等闸门已生效时不接力。
      #   兜底：链条若被异常掐断（run 被 timeout 杀死致本步未执行），由 v8_cn_fetch_watchdog
      #         的「数据极陈旧(>45min)」分支恢复，形成「链式维持 + 状态兜底」双保险。
      - name: "🔁 盘中自接力（不依赖定时器·链式维持到收盘）"
        id: relay
        # 🛡 2026-09-14 一劳永逸修复（同上事故）：原条件 `category == 'intraday'` 太脆 ——
        #   一旦类别因僵尸 cron 判错（如 premarket），接力被整段 skip，链条当场断裂，
        #   且 run 仍判 success（无任何告警）。
        #   改为「非盘后档即执行」，窗口判断交给本步骤脚本自身的 in_win()
        #   （09:38-11:32 / 12:58-15:05），非盘中窗口脚本会自行静默退出 ⇒ 语义等价且不再断链。
        #   盘后档(post_close)不接力：它有自己的盘后链，避免重复派发。
        if: always() && steps.gate.outputs.skip != 'true' && steps.cat.outputs.category != 'post_close' && steps.td.outputs.proceed != 'false'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V8_RUN_START: ${{ github.run_started_at }}
          V8_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, sys, time, datetime, urllib.request

          tok  = os.environ.get("GITHUB_TOKEN", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "ah-quant999/quant-scanner-v8")
          me   = str(os.environ.get("V8_RUN_ID", ""))
          rstart = (os.environ.get("V8_RUN_START", "") or "").strip()

          CST = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(CST)
          hm  = now.hour * 60 + now.minute

          # 盘中窗口：上午 09:38-11:32 / 下午 12:58-15:10
          #   2026-09-22 主人令「覆盖 13-15点10分」：下午上界 15:05 → 15:10。
          #   原 15:05 截止会让 15:05-15:10 出现空档，而「v8发布闸门·盘后flush」正是
          #   15:05 触发 ⇒ 恰在最需要一份新鲜数据兜底的时刻链已停。
          in_win = (9 * 60 + 38 <= hm <= 11 * 60 + 32) or (12 * 60 + 58 <= hm <= 15 * 60 + 10)
          print(f"[relay] CST={now:%H:%M:%S} hm={hm} in_window={in_win}")
          if not in_win:
              print("[relay] 非盘中窗口（午休 / 已收盘）→ 链条在此自然终止，交由盘前/盘后档与看门狗")
              sys.exit(0)

          H = {"Authorization": "Bearer " + tok,
               "Accept": "application/vnd.github+json",
               "User-Agent": "v8-relay",
               "X-GitHub-Api-Version": "2022-11-28"}

          def api(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=H, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          # 节奏闸门：距本轮开跑不足 10 分钟则等到 10 分钟，避免与外部派发叠加
          #   2026-09-22 主人令「覆盖 13-15点10分」：档位 15 → 10 分钟。
          #   实测依据（09-22 线上「v8 cn fetch」提交时间戳 13:00-15:11）：
          #     13:10 / 13:25 / 13:34 / 13:58 / 14:08 / 14:19 / 14:43 / 14:54 / 15:09
          #     ⇒ 多数 10~11 分钟，但出现 **两处 24 分钟空洞**
          #       (13:36→13:58、14:21→14:43)。成因：run 被 cancelled 时
          #       always() 的接力步来不及执行 ⇒ 链断，只能等外部 20/30 分钟兜底。
          #   ⇒ 本档位下调 + 下方「在途查询」双管：既贴近 10 分钟，又不再叠队。
          #   ⚠️ 下限纪律：**不得低于 10 分钟**。09-21 实测派发密到 7~8 分钟时
          #     撞新浪/东财反爬 ⇒ 单轮 exit 1（详见本文件下方 STOCK_QUOTE 段记录）。
          gap = 999.0
          if rstart:
              try:
                  t0 = datetime.datetime.fromisoformat(rstart.replace("Z", "+00:00")).astimezone(CST)
                  gap = (now - t0).total_seconds() / 60
              except Exception as e:
                  print(f"[relay] 解析 run_started_at 失败: {e}")
          print(f"[relay] 本轮已跑 {gap:.1f} 分钟（口径：距本轮开跑）")
          if gap < 10:
              wait = 10 - gap
              print(f"[relay] 间隔不足 10 分钟 → 等待 {wait:.0f} 分钟后派发")
              time.sleep(min(wait * 60, 600))

          # 🔴 在途查询（2026-09-22 追加）：已有后继在排队/在跑 ⇒ 本轮不再派发。
          #   理由：本仓并发组为 `queue: max`（可排队 100），派发源有三处
          #     （原生 cron 每 20 分 / 外部兜底每 30 分 / 本接力）。
          #     三处叠加时 run 会一路排队，把「排队时长」伪装成「run 很慢」，
          #     并放大反爬命中。查询失败一律**保守照常派发**（宁可多派，不可断链）。
          successor = False
          try:
              q = json.loads(api("GET",
                  f"https://api.github.com/repos/{repo}/actions/workflows/v8_cn_fetch_cloud.yml/runs?per_page=20"))
              for r in q.get("workflow_runs", []):
                  if str(r.get("id")) == me:
                      continue
                  if r.get("status") in ("queued", "in_progress", "pending", "waiting", "requested"):
                      successor = True
                      print(f"[relay] 已有在途 run #{r.get('run_number')} "
                            f"(status={r.get('status')}) ⇒ 本轮不派发（链未断）")
                      break
          except Exception as e:
              print(f"[relay] 在途查询失败({e}) ⇒ 保守照常派发")

          # ① 派发下一轮 intraday（自接力主环）
          try:
              if successor:
                  print("[relay] ⏭ 跳过本轮 intraday 派发")
              else:
                  api("POST",
                      f"https://api.github.com/repos/{repo}/actions/workflows/v8_cn_fetch_cloud.yml/dispatches",
                      {"ref": "main", "inputs": {"category": "intraday"}})
                  print("[relay] ✅ 已派发下一轮 intraday（自接力）")
          except Exception as e:
              print(f"[relay] ❌ 派发失败: {e} —— 链条断于此，由 v8_cn_fetch_watchdog(>45min) 恢复")
              sys.exit(0)

          # ② STOCK_QUOTE 刷新派发 —— 🛠 2026-09-21 阿狸咪的工程师·修法甲落地（结构层治本）
          #    【同一 bug 二次出现】09-08 断档 8h → 09-17 双源全灭 27min → 09-21 11:21 再次全灭。
          #    根因（09-17 URGENT 交接件已诊断，当时只留痕未改行为）：本 relay **无条件**派发
          #    _cloud 兜底链（ubuntu-latest·**海外 IP**）⇒ 盘中执行主力从「中国 IP 主链」漂移到
          #    「美国 IP 兜底链」⇒ 撞新浪/东财反爬 ⇒ 单轮 exit 1。09-21 实测派发已密到 **7-8 分钟**
          #    （叠加多源派发），进一步加剧反爬命中；而 _cloud 头注契约本写明「仅主链接单超时才跑」。
          #    【治本】改「主链优先 + 主链离线才兜底」门控，判据取主链最近一次 run（API 零成本、不 sleep）：
          #      ① 主链 queued/in_progress 且未超时 → 在跑/刚派 → 不派（防叠加、防刷无用 run）
          #      ② 主链 queued ≥ QUEUE_MAX 分仍未起 job → 判 cn runner 离线 → 派 _cloud 兜底
          #      ③ 主链 completed：age < FRESH_MIN 且 success → 新鲜 → 不派
          #                        age ≥ FRESH_MIN → 派**主链**（中国 IP·双源畅通）
          #    【保底联动】不 sleep：主链若离线，下一轮 relay 自会看到 queued 时长增长而改派兜底。
          #    ↳ 乙（抓取脚本源级重试）已于同日落地；丙（勿把盘中主力挂 cron）见 09-17 交接件。
          MAIN_SQ  = "v8_stock_quote_refresh.yml"        # 主链·[self-hosted, cn]·中国 IP
          CLOUD_SQ = "v8_stock_quote_refresh_cloud.yml"  # 兜底·ubuntu-latest·海外 IP
          FRESH_MIN, QUEUE_MAX = 12, 10

          def _sq_age(ts):
              if not ts:
                  return 1e9
              try:
                  return (now - datetime.datetime.fromisoformat(ts.replace("Z", "+00:00")).astimezone(CST)).total_seconds() / 60
              except Exception:
                  return 1e9

          def _sq_dispatch(name, label):
              try:
                  api("POST",
                      f"https://api.github.com/repos/{repo}/actions/workflows/{name}/dispatches",
                      {"ref": "main"})
                  print(f"[relay] ✅ 已派发 STOCK_QUOTE {label}（{name}）")
              except Exception as e:
                  print(f"[relay] ⚠️ STOCK_QUOTE {label} 派发失败: {e}（不阻断接力主环）")

          try:
              d = json.loads(api("GET",
                  f"https://api.github.com/repos/{repo}/actions/workflows/{MAIN_SQ}/runs?per_page=5").decode())
              r0 = (d.get("workflow_runs") or [None])[0]
              if r0 is None:
                  print("[relay] 主链无历史 run → 派主链")
                  _sq_dispatch(MAIN_SQ, "主链")
              else:
                  st  = r0.get("status")
                  age = _sq_age(r0.get("updated_at") or r0.get("created_at"))
                  if st in ("queued", "in_progress"):
                      q = _sq_age(r0.get("created_at"))
                      print(f"[relay] 主链在途 status={st} 已 {q:.1f} 分（updated {age:.1f} 分前）")
                      if st == "queued" and q >= QUEUE_MAX:
                          print(f"[relay] 主链排队 {q:.1f} 分 ≥ {QUEUE_MAX} 分未起 job ⇒ 判 cn runner 离线 → 派兜底")
                          _sq_dispatch(CLOUD_SQ, "兜底")
                      else:
                          print("[relay] 主链在跑/刚派 → 本轮不派（防叠加）")
                  else:
                      concl = r0.get("conclusion")
                      print(f"[relay] 主链最近档 conclusion={concl} updated {age:.1f} 分前")
                      if concl == "success" and age < FRESH_MIN:
                          print(f"[relay] 主链新鲜（{age:.1f} < {FRESH_MIN} 分）→ 本轮不派")
                      else:
                          _sq_dispatch(MAIN_SQ, "主链")
          except Exception as e:
              print(f"[relay] ⚠️ STOCK_QUOTE 门控异常: {e} → 保守派主链")
              _sq_dispatch(MAIN_SQ, "主链")
          PY
