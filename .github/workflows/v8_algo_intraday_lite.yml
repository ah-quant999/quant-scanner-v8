# 九宝量化 v8.0 — 动量共识筛选重算（云端 ubuntu-latest，新 OCR 触发）
#
# 2026-08-19 一劳永逸修复：主人对「动量共识筛选」卡（前端读 window.MOMENTUM_FILTER.generated）
#   投诉「好几天没动静」——根因不是盘中刷新问题，而是：
#   ① MOMENTUM_FILTER 的候选清单完全由 OCR 标签(超跌反弹/consec_before/stage)驱动，属【日频信号】，
#      intraday 重算内容不变(--emit-js 幂等跳过)，盘中刷新本就是无意义空跑；
#   ② 此前 momentum_common_filter.py 压根不在任何自动链里（仅有人手动跑），OCR 输入更新后卡永不重算。
#
# 本工作流只做一件轻量事：运行 scripts/momentum_common_filter.py --emit-js。
#   · 纯标准库（只读 data/STOCK_MOMENTUM_STATE_V2.js + data/STOCK_QUOTE.js，无 akshare/网络），几秒完成。
#   · 仅在「主人喂入新盘后选股 PDF → OCR 更新 STOCK_MOMENTUM_STATE_V2.js」或「filter 缺失」时才产生新内容
#     （--emit-js 幂等：OCR 未变则跳过重写，不制造空提交/死循环）。
#
# 触发方式（不依赖不可靠的 schedule）：由 cloud_dispatcher.py 在检测到「STOCK_MOMENTUM_STATE_V2 的
#   OCR 日期 > MOMENTUM_FILTER.generated 日期（即有新 OCR 输入尚未重算）或 filter 缺失」时幂等派发——
#   该 dispatcher 挂在 v8_cn_fetch_cloud*（每 30 分可靠触发）尾部，与风险温度计 v8_risk_gauge 同机制。
#   另：盘后算法链(run_algorithms.py 经 algorithms/emit_momentum_filter.py 包装)每晚 18:30 也跑一次兜底。
#
# 推送：仅 workflow_dispatch 可用。重算后若 MOMENTUM_FILTER 内容未变(即 ?v 已是最新)则跳过推送。

name: "☁️ v8 动量共识重算(新OCR触发)"

on:
  workflow_dispatch:
    inputs:
      note:
        description: '备注（可选）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  momentum_lite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 朴素 now() 即北京时间（与云端中国节点产出一致，新鲜度守卫时间对齐）
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V8_PUSH: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 checkout（云端 git 可靠）"
        uses: actions/checkout@v4

      - name: "🐍 配置 Python (setup-python 3.13)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "🧮 生成动量共识筛选（纯标准库，读仓库内 STOCK_QUOTE + OCR 标签）"
        run: |
          set +e
          python scripts/momentum_common_filter.py --emit-js
          echo "momentum_common_filter exit: $?"
          # 即便脚本因非致命原因非零退出，也不应 fail 整 job（推送兜底在下步判断是否真有变更）
          exit 0

      - name: "🔄 同步 MOMENTUM_FILTER 缓存戳 ?v 并推送 index.html + data"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, re, hashlib, base64, json, urllib.request, sys
          TOK = os.environ["GITHUB_TOKEN"]
          REPO = "ah-quant999/quant-scanner-v8"
          API = "https://api.github.com/repos/" + REPO
          H = {"Authorization": "Bearer " + TOK, "Content-Type": "application/json",
               "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          ROOT = "."

          p = os.path.join(ROOT, "data", "MOMENTUM_FILTER.js")
          if not os.path.exists(p):
              print("⚠️ MOMENTUM_FILTER.js 缺失，跳过推送"); raise SystemExit(0)

          # ★ 与 update_v8.py _sha10 逐字符一致：中性化 republish_time 后 sha1 前 10 位
          _b = open(p, "rb").read()
          _neutral = re.sub(rb'"republish_time"\s*:\s*"[^"]*"', b'"republish_time":""', _b)
          t = hashlib.sha1(_neutral).hexdigest()[:10]

          idx = os.path.join(ROOT, "index.html")
          html = open(idx, encoding="utf-8").read()
          new = re.sub(r'(MOMENTUM_FILTER\.js)\?v=\w+', r'\1?v=' + t, html)
          if new == html:
              print("⏭️ MOMENTUM_FILTER 内容未变(?v 已是最新 %s)，跳过推送" % t)
              raise SystemExit(0)

          # 内容有变：一并推送 data/MOMENTUM_FILTER.js 与 index.html（缓存戳必随数据变）
          files = [("data/MOMENTUM_FILTER.js", _b.decode("utf-8")), ("index.html", new)]
          for rel, content in files:
              meta = json.loads(urllib.request.urlopen(
                  urllib.request.Request(API + "/contents/" + rel + "?ref=main", headers=H)).read())
              body = json.dumps({
                  "message": "chore: 盘中动量共识轻量刷新(MOMENTUM_FILTER ?v=%s)" % t,
                  "content": base64.b64encode(content.encode("utf-8")).decode(),
                  "sha": meta["sha"],
              }).encode()
              req = urllib.request.Request(API + "/contents/" + rel, data=body, headers=H, method="PUT")
              code = urllib.request.urlopen(req).getcode()
              print("✅ push %s -> HTTP %s (v=%s)" % (rel, code, t))
          PY
