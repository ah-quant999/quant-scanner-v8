# 九宝量化 v8.0 — 🔮「未来预测」子TAB数据 fetcher 调度（cn runner）
#
# 2026-10-05 阿狸咪的工程师 建（主人令：未来预测子TAB · 牛转熊指标观测台 · 每日更新）。
# 单一职责：跑 v8/gen_market_thermo.py → data/MARKET_THERMO.js → api_push_raw 入仓。
# 数据链路：sw_index_daily_cache(等权/PE分位) + gtimg(上证月K/成交量/实时点位)
#           + akshare(社融脉冲/PMI) + raw_data 缓存(融资/国债/沪深300PE)。
# 健壮性：单源失败自动回退上一版同字段；D 骨架重建失败则不写盘退出（宁旧勿错）。
#
# 安全铁律（与 v8_lhb_fetch.yml 同步）：
#   1. 严禁 actions/checkout / rm -rf / git clean -fdx / Remove-Item -Recurse。
#   2. 严禁 git clone/fetch，仅走 GitHub Contents API 同步源码。
#   3. index.html 绝不经本链推送（_SKIP_LOCAL_PUSH 护栏）。
name: "🔮 v8 未来预测数据 fetcher (cn runner)"

on:
  schedule:
    # 交易日 16:10 CST 盘后（收盘数据落定后；社融/PMI 月频公布，当日未发布沿用最近值）
    - cron: '10 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-market-thermo
  cancel-in-progress: false

jobs:
  market-thermo:
    runs-on: [self-hosted, cn]
    env:
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 2000
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    timeout-minutes: 30
    steps:
      - name: "📝 同步源码（安全）"
        shell: powershell
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $TARGET = 'v8/gen_market_thermo.py'
          $URL = "https://api.github.com/repos/ah-quant999/quant-scanner-v8/contents/$($TARGET -replace '/','%2F')?ref=main"
          $headers = @{
            'User-Agent' = 'v8-market-thermo'
            'Accept'     = 'application/vnd.github.raw'
            'Authorization' = "Bearer $env:GH_PAT"
          }
          New-Item -ItemType Directory -Force -Path v8 | Out-Null
          try {
            $r = Invoke-RestMethod -Uri $URL -Headers $headers -TimeoutSec 60 -Method Get
            [System.IO.File]::WriteAllText("v8/_gen_thermo.py.tmp", $r, [System.Text.Encoding]::UTF8)
            Move-Item -Force "v8/_gen_thermo.py.tmp" "v8/gen_market_thermo.py"
            Write-Host "fetched $TARGET from origin/main"
          } catch {
            Write-Host "[warn] API fetch failed: $_ ; using local copy" -ForegroundColor Yellow
          }

      - name: "🐍 Python / akshare 环境检查"
        shell: powershell
        run: |
          python --version
          python -c "import akshare, pandas, requests" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "deps missing, installing from tsinghua mirror..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas requests
          } else { Write-Host "deps ready" }

      - name: "📊 跑 gen_market_thermo.py（交易日闸）"
        id: gen
        shell: powershell
        continue-on-error: true
        run: |
          $dow = (Get-Date).DayOfWeek.value__
          if ($dow -eq 0 -or $dow -ge 6) { Write-Host "[skip] weekend"; exit 0 }
          cd $env:GITHUB_WORKSPACE
          python v8/gen_market_thermo.py
          if (Test-Path 'data/MARKET_THERMO.js') {
            Write-Host "[ok] data/MARKET_THERMO.js refreshed"
          } else {
            Write-Host "[warn] MARKET_THERMO.js missing（D 重建失败，宁旧勿错）"
          }

      - name: "📤 推送到仓库（api_push_raw · PUSH_FILES）"
        if: steps.gen.outcome == 'success'
        shell: powershell
        env:
          PUSH_FILES: "data/MARKET_THERMO.js"
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
        run: |
          cd $env:GITHUB_WORKSPACE
          if ((Test-Path 'data/MARKET_THERMO.js') -and ((Get-Item 'data/MARKET_THERMO.js').Length -gt 3000)) {
            python api_push_raw.py
          } else {
            Write-Host "[skip] 产物缺失或过小，不推送（防线：防空白覆盖）"
          }
