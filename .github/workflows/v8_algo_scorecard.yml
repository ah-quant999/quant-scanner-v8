# 九宝量化 v8.0 — 「算法记分卡」卡数据生成器调度（云端 ubuntu）
#
# 2026-10-21 主人令：新卡放「暂未上架」（国家队活跃度之后）。
# 2026-10-22 主人令「确认两新卡都是日更且有定时任务跟踪」：本链即算法记分卡的
#   **真实定时任务**（此前数据由另一条开发链 10-22 06:41 带入，非定时任务；
#   登记表里的 06:10 是空头声明，且那个时点隔夜回测链常还没收尾——已校准）。
#
# 时点：工作日 08:25 CST（UTC 00:25）。选此点三条理由：
#   ① 数据就绪：隔夜算法链 E 批（21:00 唤醒，实测常至次日 06:4x 才收尾，
#      见 raw_data/backtest_all_algos.json update_time=2026-10-22 06:40:54）此时
#      必已推上 main；06:10 跑会读到前一日甚至更旧的回测；
#   ② 语义正确：08:25 仍是盘前（09:30 开盘），与「盘前派发」定位一致，且与
#      抓取链盘前档同刻（互不依赖——本链只读 raw_data/backtest_all_algos.json）；
#   ③ 无 runner 竞争：纯本地计算，放 ubuntu-latest 不占 [self-hosted, cn]。
#
# 防假新鲜闸门（生成器内，2026-10-22 配套）：backtest update_time 未变 ⇒ 回测链
#   无新产物 ⇒ 不写盘。回测链失败日若照刷 update_time，卡片会「看起来日更」实则
#   数据冻结（09-23 防假新鲜口径）；去重后失败日自然停写，看板 ✓/✗ 显形，
#   链恢复后 source_time 前进即自动续写。
#
# 空提交保护：v8_build_deploy 的 push.paths 含 data/** ⇒ 每推一次触发全量重建（~8min）。
#   推送前先比对线上 blob（scripts/card_need_push.py），逐字节相同即 SKIP。
name: "🧮 v8 算法记分卡生成器 (云端)"

on:
  schedule:
    - cron: '25 0 * * 1-5'   # 北京 08:25 工作日（UTC 00:25，同日不错位）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-algo-scorecard
  cancel-in-progress: false

jobs:
  algo-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "📥 Checkout（默认深度即取 main 最新 tip；只读 raw_data/ + Contents API 推送，无需 git 操作）"
        uses: actions/checkout@v4

      - name: "🧮 跑 gen_algo_scorecard.py（产出 data/ALGO_SCORECARD.js）"
        id: gen
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          # weekend gate only — the E batch itself does not run on weekends
          # (no new signals), so a weekend trigger would be a pure no-op.
          dow=$(date +%u)
          if [ "$dow" -ge 6 ]; then echo "[skip] weekend, exit ok"; exit 0; fi
          python v8/gen_algo_scorecard.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=v8-algo-scorecard(exit=$rc)::🧮 算法记分卡生成失败（退出码 $rc）。线上卡将沿用上一版；若连续多日失败请检查隔夜算法链 E 批（raw_data/backtest_all_algos.json）是否就绪。"
            exit 1
          fi
          if [ ! -f data/ALGO_SCORECARD.js ]; then
            echo "::error title=v8-algo-scorecard(no-output)::🧮 未产出 data/ALGO_SCORECARD.js"
            exit 1
          fi
          echo "[ok] data/ALGO_SCORECARD.js ready"

      - name: "🔍 内容比对（相同则 SKIP，防空提交触发全量重建）"
        id: diff
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          out=$(python scripts/card_need_push.py data/ALGO_SCORECARD.js 2>&1)
          echo "$out"
          if echo "$out" | grep -q 'NEED_PUSH=1'; then echo "need=1" >> "$GITHUB_OUTPUT"; else echo "need=0" >> "$GITHUB_OUTPUT"; fi

      - name: "📤 推送 data/ALGO_SCORECARD.js（api_put_file.py）"
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          if [ "${{ steps.diff.outputs.need }}" != "1" ]; then
            echo "[skip] content identical to remote (or dedup kept the old card); no push"
            exit 0
          fi
          python scripts/api_put_file.py data/ALGO_SCORECARD.js "data: algo scorecard refresh ($(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') CST)"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=v8-algo-scorecard(push-failed)::📤 data/ALGO_SCORECARD.js 推送失败（非阻塞，下一轮补推）。"
            exit 1
          fi

# ─────────────────────────────────────────────────────────────────────────────
# 链路备忘（2026-10-22 阿狸咪的工程师）：
#   推送后 index.html 的 ?v 由 v8_cache_buster_reconcile（监听 data/** push）自动对齐。
#   数据源 raw_data/backtest_all_algos.json 由盘后算法链 E 批产出并受
#   v8_stage_gate READY_SPEC["E"] 的 must=[BACKTEST_ALL_ALGOS] 闸门监视——
#   回测链停更会触发 E 批重跑，不会静默（09-12 主人令闭环）。
# ─────────────────────────────────────────────────────────────────────────────
