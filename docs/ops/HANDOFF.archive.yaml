      · `sync_westock_portfolio.py` —— `git fetch origin main` + `read-tree origin/main` 派生树。
      · `v8/fetch_wave_elliott.py` —— 临时隔离索引（`GIT_INDEX_FILE`）+ `read-tree <tree_sha>`。
      · 本机 4 个净室推送脚本 —— 本轮全部核过并**已挂护栏**（`v8_push_files.py` 内建 /
        `v8_prepush_guard.py` / `v8_push_multifile_base.py` / `v8_push_multifile_fast.py` /
        `v8_fix_stockquery.py`，逃生门统一 `--skip-guard`）。
      ⇒ **印证 what 段的纠偏**：「先拉最新」是这一族的**既有属性**、不是缺口；
      真缺口在**内容级** —— 旧树内容挂在新父提交上，故本次落地的是**版本比对护栏**。
      据此**未改动 `api_push_raw.py` 等仓内推送器**：其风险已由既有「防倒退闸（时间戳单调）」
