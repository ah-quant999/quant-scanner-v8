# 九宝量化 v8.0 — 🔮「未来预测」子TAB数据 fetcher 调度（cn runner）
#
# 2026-10-05 阿狸咪的工程师 建（主人令：未来预测子TAB · 牛转熊指标观测台 · 每日更新）。
# 2026-10-05 补（主人令："每日自动审计不能只是说说，要落实到位"）：
#   推送前强制跑 v8/audit_market_thermo.py 审计门禁（结构层+akshare真值交叉核验），
#   审计 exit!=0 → 推送步骤不执行 → Actions 红灯可见。硬闸，非日志说说。
# 单一职责：跑 v8/gen_market_thermo.py → data/MARKET_THERMO.js → 审计门禁 → api_push_raw 入仓。
# 数据链路：sw_index_daily_cache(等权/PE分位) + gtimg(上证月K/成交量/实时点位)
#           + akshare(社融脉冲/PMI) + raw_data 缓存(融资/国债/沪深300PE)。
# 健壮性：单源失败自动回退上一版同字段；D 骨架重建失败则不写盘退出（宁旧勿错）。
#
# 安全铁律（与 v8_lhb_fetch.yml 同步）：
#   1. 严禁 actions/checkout / rm -rf / git clean -fdx / Remove-Item -Recurse。
#   2. 严禁 git clone/fetch，仅走 GitHub Contents API 同步源码。
#   3. index.html 绝不经本链推送（_SKIP_LOCAL_PUSH 护栏）。
name: "🔮 v8 未来预测数据 fetcher (cn runner)"

on:
  schedule:
    # 交易日 16:10 CST 盘后（收盘数据落定后；社融/PMI 月频公布，当日未发布沿用最近值）
    - cron: '10 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-market-thermo
  cancel-in-progress: false

jobs:
  market-thermo:
    runs-on: [self-hosted, cn]
    env:
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 2000
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    timeout-minutes: 30
    steps:
      - name: "📝 同步源码（安全）"
        shell: powershell
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $TARGETS = @('v8/gen_market_thermo.py', 'v8/audit_market_thermo.py')
          $headers = @{
            'User-Agent' = 'v8-market-thermo'
            'Accept'     = 'application/vnd.github.raw'
            'Authorization' = "Bearer $env:GH_PAT"
          }
          New-Item -ItemType Directory -Force -Path v8 | Out-Null
          foreach ($TARGET in $TARGETS) {
            $URL = "https://api.github.com/repos/ah-quant999/quant-scanner-v8/contents/$($TARGET -replace '/','%2F')?ref=main"
            $local = $TARGET -replace '^v8/', 'v8/_'
            $local = $local -replace '\.py$', '.py.tmp'
            try {
              $r = Invoke-RestMethod -Uri $URL -Headers $headers -TimeoutSec 60 -Method Get
              [System.IO.File]::WriteAllText($local, $r, [System.Text.Encoding]::UTF8)
              $dest = if ($TARGET -eq 'v8/gen_market_thermo.py') { 'v8/gen_market_thermo.py' } else { 'v8/audit_market_thermo.py' }
              Move-Item -Force $local $dest
              Write-Host "fetched $TARGET from origin/main"
            } catch {
              Write-Host "[warn] API fetch failed for ${TARGET}: $_ ; using local copy" -ForegroundColor Yellow
            }
          }

      - name: "🐍 Python / akshare 环境检查"
        shell: powershell
        run: |
          python --version
          python -c "import akshare, pandas, requests" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "deps missing, installing from tsinghua mirror..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas requests
          } else { Write-Host "deps ready" }

      - name: "📦 同步 raw_data 缓存依赖（gen 输入·仅5文件·Git Data API·sha校验·tries=6）"
        shell: powershell
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
        run: |
          $code = @'
          import os, base64, json, hashlib, urllib.request, time
          token = os.environ["GH_PAT"]
          REPO = "ah-quant999/quant-scanner-v8"
          H = {"Authorization": "Bearer " + token,
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28"}

          def sha_of(data):
              h = hashlib.sha1()
              h.update(("blob %d\0" % len(data)).encode())
              h.update(data)
              return h.hexdigest()

          def get_json(url, tries=6):
              last = None
              for i in range(tries):
                  try:
                      return json.load(urllib.request.urlopen(
                          urllib.request.Request(url, headers=H), timeout=120))
                  except Exception as e:
                      last = e
                      print("  retry %d: %s" % (i + 1, e), flush=True)
                      time.sleep(min(2 ** i, 20))
              raise SystemExit("API fetch failed: %s (%s)" % (url, last))

          def fetch_blob(sha, tries=6):
              # 抄 v8_cn_fetch_cloud_selfhosted.yml 的 proven 模式：
              # Git Data API /git/blobs/{sha} + raw media（载荷小防截断）
              # + 每次 sha 校验（静默截断永不被写入）+ tries=6 指数退避 + raw/b64 交替
              url = "https://api.github.com/repos/%s/git/blobs/%s" % (REPO, sha)
              raw_h = dict(H); raw_h["Accept"] = "application/vnd.github.raw"
              last = None
              for i in range(tries):
                  mode = "raw" if i % 2 == 0 else "b64"
                  try:
                      hdr = raw_h if mode == "raw" else H
                      resp = urllib.request.urlopen(
                          urllib.request.Request(url, headers=hdr), timeout=180)
                      body = resp.read()
                      data = body if mode == "raw" else base64.b64decode(
                          json.loads(body.decode())["content"])
                      if sha_of(data) != sha:
                          raise ValueError("sha mismatch (truncated?) got %d bytes" % len(data))
                      return data
                  except Exception as e:
                      last = e
                      print("  blob retry %d [%s]: %s" % (i + 1, mode, e), flush=True)
                      time.sleep(min(2 ** i, 20))
              raise SystemExit("blob fetch failed: %s (%s)" % (sha, last))

          tip = get_json("https://api.github.com/repos/%s/git/ref/heads/main" % REPO)["object"]["sha"]
          top = get_json("https://api.github.com/repos/%s/git/trees/%s" % (REPO, tip))
          raw_sha = None
          for e in top["tree"]:
              if e["path"] == "raw_data":
                  raw_sha = e["sha"]; break
          if not raw_sha:
              raise SystemExit("远端无 raw_data")
          raw_tree = get_json("https://api.github.com/repos/%s/git/trees/%s" % (REPO, raw_sha))
          sw_entry = None
          for e in raw_tree["tree"]:
              if e["path"] == "sw_index_daily_cache":
                  sw_entry = e; break
          if not sw_entry:
              raise SystemExit("远端无 sw_index_daily_cache")
          sw_tree = get_json("https://api.github.com/repos/%s/git/trees/%s" % (REPO, sw_entry["sha"]))
          # path -> sha 查表（raw_data 顶层 + sw 子树）
          sha_of_path = {}
          for e in raw_tree["tree"]:
              sha_of_path["raw_data/" + e["path"]] = e["sha"]
          for e in sw_tree["tree"]:
              sha_of_path["raw_data/sw_index_daily_cache/" + e["path"]] = e["sha"]
          # gen 实际依赖的 5 个文件（实测 grep gen_market_thermo.py 得出）
          NEED = [
              "raw_data/sw_index_daily_cache/market_valuation_cache.csv",
              "raw_data/sw_index_daily_cache/macro_margin.csv",
              "raw_data/margin_data.json",
              "raw_data/macro_data.json",
              "raw_data/valuation_percentile.json",
          ]
          for rel in NEED:
              if rel not in sha_of_path:
                  raise SystemExit("远端缺依赖文件: %s" % rel)
              os.makedirs(os.path.dirname(rel), exist_ok=True)
              data = fetch_blob(sha_of_path[rel])
              with open(rel, "wb") as f:
                  f.write(data)
              print("synced %s (%d bytes, sha ok)" % (rel, len(data)))
          print("raw_data 同步完成（5 文件，全部 sha 校验通过）")
          '@
          python -c $code

      - name: "📊 跑 gen_market_thermo.py（交易日闸）"
        id: gen
        shell: powershell
        run: |
          $dow = (Get-Date).DayOfWeek.value__
          if ($dow -eq 0 -or $dow -ge 6) { Write-Host "[skip] weekend"; exit 0 }
          cd $env:GITHUB_WORKSPACE
          python v8/gen_market_thermo.py
          if (Test-Path 'data/MARKET_THERMO.js') {
            Write-Host "[ok] data/MARKET_THERMO.js refreshed"
          } else {
            Write-Host "[warn] MARKET_THERMO.js missing（D 重建失败，宁旧勿错）"
          }

      - name: "🔍 审计门禁（结构层+akshare真值交叉核验 · 硬闸）"
        id: audit
        if: steps.gen.outcome == 'success'
        shell: powershell
        run: |
          cd $env:GITHUB_WORKSPACE
          if (-not (Test-Path 'data/MARKET_THERMO.js')) {
            Write-Host "[GATE-FAIL] gen 成功但产物缺失 → 异常，红灯阻断" -ForegroundColor Red
            exit 2
          }
          python v8/audit_market_thermo.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[GATE-FAIL] 审计门禁未通过(exit=$LASTEXITCODE) → 阻断推送" -ForegroundColor Red
            exit $LASTEXITCODE
          }
          Write-Host "[GATE-PASS] 审计全绿 → 放行推送"

      - name: "📤 推送到仓库（api_push_raw · PUSH_FILES）"
        id: push
        if: steps.gen.outcome == 'success' && steps.audit.outcome == 'success'
        shell: powershell
        env:
          PUSH_FILES: "data/MARKET_THERMO.js"
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
        run: |
          cd $env:GITHUB_WORKSPACE
          if ((Test-Path 'data/MARKET_THERMO.js') -and ((Get-Item 'data/MARKET_THERMO.js').Length -gt 3000)) {
            python api_push_raw.py
          } else {
            Write-Host "[skip] 产物缺失或过小，不推送（防线：防空白覆盖）"
          }

      - name: "🚨 结果闸门（gen失败/审计skip/推送skip → 红灯，禁绿灯假象）"
        if: always()
        shell: powershell
        run: |
          $gen = '${{ steps.gen.outcome }}'
          $aud = '${{ steps.audit.outcome }}'
          $push = '${{ steps.push.outcome }}'
          Write-Host "gen=$gen audit=$aud push=$push"
          if ($gen -ne 'success') {
            Write-Host "[GATE] gen 未成功($gen) → 红灯（宁可报警可见，不可静默旧数据）" -ForegroundColor Red
            exit 1
          }
          if ($aud -ne 'success') {
            Write-Host "[GATE] 审计未通过或未执行($aud) → 红灯" -ForegroundColor Red
            exit 1
          }
          if ($push -ne 'success') {
            Write-Host "[GATE] 推送未执行($push) → 红灯" -ForegroundColor Red
            exit 1
          }
          Write-Host "[GATE] gen+审计+推送 全链正常 ✓" -ForegroundColor Green
