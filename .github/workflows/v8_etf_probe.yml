# 九宝量化 v8.0 — ETF clist 探针（第11版·一次性诊断，验完即删）
#
# ── 已排除项（v6~v10 累计）────────────────────────────────────────────
#   · pz 硬截 100：pz=5000 亦只回 100 行 ⇒ 「一次请求拿全」不存在
#   · 板块级单请求汇总：ulist(90.MK0021..24) rc=102；fflow ConnectionError；
#     单板块 clist 全 502 ⇒ **汇总路径全部不通**，必须分页
#   · 分片域名并发（v9 J：93 轮）最好只到 13/17 页；单域并发（v9 G：19 轮）9/17 页
#   · 快速重开（v9 H：70 次）最差，只拿 1 页
#
# ── 本版要回答的唯一问题 ────────────────────────────────────────────
#   🔴 历版探针都有「自污染」缺陷：把重活放前面，后面所有对照都在**已被自己
#      打限流**的状态下跑，结论不可用（v4 就是这么废掉的）。
#      干净数据只剩两条，且互相矛盾：
#        (a) v10 的 D_cold（**新鲜 IP 上第一位**、串行同请求连打 3 次）→ **3/3 全成**
#        (b) 生产 20:00 那笔（**新鲜 IP**、17 页**并发**扇出）→ 首轮仅 6/17，
#            其后 9 轮 **0 页**（该 IP 已被打死）
#     ⇒ 假设：「**串行** 比 **并发** 在同一新鲜 IP 上取到的页数显著更多」
#        若是，则把生产首轮改为串行即可**一轮拼齐**，无需跨轮累积。
#
# ── 本版设计（严格消除自污染）────────────────────────────────────────
#   矩阵两条腿 **各占独立 runner（= 独立出口 IP）**，被测对象都放在该 runner
#   的**第一步**：
#     S_serial17   : 串行 pn=1..17（无间隔，同域 push2delay）→ 报告逐页成败
#     C_concur17   : 并发 pn=1..17（workers=17，同域）    → 报告逐页成败
#   两条腿跑完各自的第一趟后，再对**缺失页**做第二轮（串行补 / 并发补），
#   用于回答「补页该用串行还是并发」。
#   判据：以**第一趟**的 pages_ok / secs 为准（那才是干净数据）。

name: "🔬 v8 ETF clist 探针v11(串行vs并发·独立runner新鲜IP对决)"

on:
  workflow_dispatch: {}

concurrency:
  group: v8_etf_probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "S_serial17"
            mode: "serial17"
          - name: "C_concur17"
            mode: "concur17"
    steps:
      - name: "🐍 装依赖"
        run: python3 -m pip install --quiet --disable-pip-version-check requests

      - name: "🔬 实测"
        shell: bash
        env:
          CFG_NAME: ${{ matrix.name }}
          CFG_MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time
          from concurrent.futures import ThreadPoolExecutor
          import requests
          try:
              requests.packages.urllib3.disable_warnings()
          except Exception:
              pass

          UT = "b2884a393a59ad64002292a3e90d46a5"
          FS = "b:MK0021,b:MK0022,b:MK0023,b:MK0024"
          FLDS = "f12,f14,f2,f3,f6,f10,f62,f184"
          DELAY = "https://push2delay.eastmoney.com"
          HDR = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                               "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
                 "Referer": "https://data.eastmoney.com/zjlx/detail.html",
                 "Accept": "*/*"}
          PAGES = 17

          name = os.environ["CFG_NAME"]
          mode = os.environ["CFG_MODE"]
          t0 = time.time()
          print("══════════════ %s ══════════════" % name, flush=True)

          def tag(t, **kw):
              print("TAG %s %s" % (t, json.dumps(kw, ensure_ascii=False)), flush=True)

          def params(pn):
              return {"pn": str(pn), "pz": "100", "po": "1", "np": "1", "fltt": "2",
                      "invt": "2", "ut": UT, "fid": "f62", "fs": FS, "stat": "1",
                      "fields": FLDS, "_": int(time.time() * 1000)}

          def get_page(pn):
              """→ (ok, rows, total, status)"""
              try:
                  r = requests.get(DELAY + "/api/qt/clist/get", params=params(pn),
                                   timeout=15, verify=False, headers=HDR)
                  if r.status_code != 200:
                      return False, 0, None, "http%d" % r.status_code
                  d = r.json()
                  if d.get("rc") != 0:
                      return False, 0, None, "rc%s" % d.get("rc")
                  dd = d.get("data") or {}
                  diff = dd.get("diff") or []
                  if isinstance(diff, dict):
                      diff = list(diff.values())
                  return (len(diff) > 0), len(diff), dd.get("total"), "ok"
              except Exception as e:
                  return False, 0, None, type(e).__name__

          def serial_pass(ids, gap, tag_name):
              ok, bad = [], []
              rows_total, total = 0, None
              for pn in ids:
                  o, n, tot, st = get_page(pn)
                  if tot:
                      total = tot
                  if o:
                      ok.append(pn); rows_total += n
                  else:
                      bad.append("%d:%s" % (pn, st))
                  if gap:
                      time.sleep(gap)
              tag(tag_name, pages_ok=ok, rows=rows_total, total=total,
                  fail=bad, secs=round(time.time() - t0, 1))
              return ok, rows_total, total

          def concur_pass(ids, workers, tag_name):
              ok, bad = [], []
              rows_total, total = 0, None
              with ThreadPoolExecutor(max_workers=workers) as ex:
                  futs = {ex.submit(get_page, pn): pn for pn in ids}
                  for f, pn in futs.items():
                      try:
                          o, n, tot, st = f.result()
                      except Exception as e:
                          o, n, tot, st = False, 0, None, type(e).__name__
                      if tot:
                          total = tot
                      if o:
                          ok.append(pn); rows_total += n
                      else:
                          bad.append("%d:%s" % (pn, st))
              tag(tag_name, pages_ok=sorted(ok), rows=rows_total, total=total,
                  fail=bad, secs=round(time.time() - t0, 1))
              return sorted(ok), rows_total, total

          allp = list(range(1, PAGES + 1))

          if mode == "serial17":
              print(">>> 第 1 趟：串行 17 页（无间隔，新鲜 IP 第一位）", flush=True)
              ok1, r1, tot = serial_pass(allp, 0.0, "S1_serial17")
              miss = [p for p in allp if p not in ok1]
              print(">>> 第 2 趟：串行补缺页（仍串行，间隔 0.4s）", flush=True)
              ok2, r2, _ = serial_pass(miss, 0.4, "S2_serial_gap") if miss else ([], 0, None)
              print(">>> 第 3 趟：并发补缺页（workers=6）", flush=True)
              miss2 = [p for p in allp if p not in ok1 + ok2]
              ok3, r3, _ = concur_pass(miss2, 6, "S3_concur_mopup") if miss2 else ([], 0, None)
              got = sorted(set(ok1 + ok2 + ok3))
              print("RESULT " + json.dumps({"cfg": name, "pages_ok": got, "n_pages": len(got),
                                            "rows": r1 + r2 + r3,
                                            "secs": round(time.time() - t0, 1)},
                                           ensure_ascii=False), flush=True)

          elif mode == "concur17":
              print(">>> 第 1 趟：并发 17 页（workers=17，新鲜 IP 第一位）", flush=True)
              ok1, r1, tot = concur_pass(allp, 17, "C1_concur17")
              miss = [p for p in allp if p not in ok1]
              print(">>> 第 2 趟：并发补缺页（workers=17）", flush=True)
              ok2, r2, _ = concur_pass(miss, 17, "C2_concur_mopup") if miss else ([], 0, None)
              print(">>> 第 3 趟：串行补缺页（间隔 0.4s）", flush=True)
              miss2 = [p for p in allp if p not in ok1 + ok2]
              ok3, r3, _ = serial_pass(miss2, 0.4, "C3_serial_mopup") if miss2 else ([], 0, None)
              got = sorted(set(ok1 + ok2 + ok3))
              print("RESULT " + json.dumps({"cfg": name, "pages_ok": got, "n_pages": len(got),
                                            "rows": r1 + r2 + r3,
                                            "secs": round(time.time() - t0, 1)},
                                           ensure_ascii=False), flush=True)

          print("══════════════ END %s ══════════════" % name, flush=True)
          PYEOF
