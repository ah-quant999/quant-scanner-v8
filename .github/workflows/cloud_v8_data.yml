# 九宝量化 v8.0 — 云端数据抓取 + 轻量构建（自托管 cn runner）
#
# ⚠️ 关键架构说明（务必先读）：
# GitHub 官方 runner 在美国，抓 A 股数据源（东方财富/新浪/akshare 中国接口）会 60s 超时，
# 因此本工作流必须运行在「标记为 cn 的自托管 runner」上——即小九或阿狸咪的中国 IP 机器。
# 云端只负责「定时编排 + 派发」，真正抓数在中国机器本地执行。这正是「云端跑数据、数据主机是小九」。
#
# 首次使用需在小九/阿狸咪机器上注册一个 label=cn 的自托管 runner（见仓库 HANDOVER 文档）。
# 未注册 cn runner 时，本工作流会因无可用 runner 而排队/跳过，不会报错污染数据。

name: "☁️ v8 数据抓取(自托管cn)"

on:
  # 盘后主刷新：16:35 CST（收盘后）
  schedule:
    - cron: '35 8 * * *'
  # 盘中补充：10:35 / 11:50 / 14:35 CST
    - cron: '35 2 * * *'
    - cron: '50 3 * * *'
    - cron: '35 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 必须在 cn 标签的自托管 runner 上跑（中国网络可达 A 股数据源）
jobs:
  v8-data:
    # 若没有 cn runner，workflow 会等待；用 runs-on 数组指定 label
    runs-on: [self-hosted, cn]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install akshare --quiet 2>/dev/null || pip install akshare

      - name: "📡 抓取 v8 数据（中国源，逐模块容错）"
        continue-on-error: true
        run: python cloud_fetch_v8.py

      - name: "🏗️ 轻量构建 data/*.js（仅重写 raw_data 中存在的模块）"
        run: python update_v8.py

      - name: "📤 提交 data/ + raw_data/ 回 main"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "v8-cloud-bot"
          git config user.email "v8-cloud-bot@users.noreply.github.com"
          git add -f data/ raw_data/
          if git diff --cached --quiet; then
            echo "ℹ️ 无数据变化，跳过提交"
          else
            git commit -m "v8 data: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
            git push "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git" HEAD:main
            echo "✅ v8 数据已推送 main"
          fi

      - name: "💓 写云端心跳"
        continue-on-error: true
        run: |
          echo "$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') | cloud | v8_data_fetch | DONE" >> data/_heartbeat.log
          git config user.name "v8-cloud-bot"
          git config user.email "v8-cloud-bot@users.noreply.github.com"
          git add -f data/_heartbeat.log
          git diff --cached --quiet || (git commit -m "heartbeat: v8_data_fetch done" && git push "https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git" HEAD:main)
