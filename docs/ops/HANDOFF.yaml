  - id: build-deploy-blocked-by-crosslayer-stale-guard-0929
    title: "build_deploy 部署链被自家跨层闸门恒阻断（4/12 档同因失败）：HB_ALIMI / HB_XIAOJIU 内层 update_time 被钉旧 + IMA_STRONG_BACKTEST 停更 ⇒ v8_verify_layer_parity STALE_DAYS=3 恒判失败"
    priority: P0
    owner: shared
    status: todo
