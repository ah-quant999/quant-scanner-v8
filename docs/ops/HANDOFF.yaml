      线上保留旧版本、卡片时间戳冻结；dispatch 类自愈已确认无效且会加剧消耗」。
      🔴 **机制（结构性）**：`cn_fetch` 单轮用**逐文件** `POST /repos/.../git/blobs`（本轮实测含 27 个文件），
      叠加 relay 自接力（今日实测 39 档 `workflow_dispatch`）⇒ 安装级 5,000/h 配额可被**结构性打满**。
    impact: >-
