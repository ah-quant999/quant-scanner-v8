name: "maharo API probe"

on:
  workflow_dispatch:
    inputs:
      dummy:
        description: "trigger probe"
        required: false
        default: "go"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run maharo API probe (push result via Contents API)
        env:
          MAHORO_COOKIE: ${{ secrets.MAHORO_COOKIE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/probe_maharo.py
