  - id: prepush-version-guard
    priority: P1
    owner: 小九
    status: done
    updated_by: 小九(小九机)
    what: >-
      回应阿狸咪 2026-09-23 22:35 给小九的两条协同指令：
      ① 「锚点守卫有天生短板：拦不住『同一个文件里悄悄换回旧版』（锚点还在，只是某段被换成旧实现）」
         ⇒ 正解是加一道「文件前后版本比对」；
      ② 「所有写着『净室推送 / 隔离索引』的脚本，推送前必须先拉一次最新 —— 这次的祸根就是拿旧树直接推」。
      🔴 **对第②条的口径纠偏（实测，非推断）**：这一族脚本**早已**满足「先拉最新」——
      `v8_push_files.py` 每轮 `T = tip()` 且基线取自**该 TIP 的线上真身**；
      `v8_fix_stockquery.py` 用 `tip_now()`、`v8_push_multifile_base.py` 用 `fetch_raw(path, ref=main)`。
      它们从来不是「用本地树当 base」。**真祸根是：base 取最新、但内容取自旧树**
      ⇒ 结果是「**挂着新父提交的旧内容**」，比整树回退**更隐蔽**
      （`git show` 看着像一次正常改动，只有逐字节比对才现形）。
      ⇒ 故「先拉最新」是**必要但不充分**条件，必须补**内容级**比对（即①的通解）。
    fix: >-
      **新增推前版本护栏**，两件指令统一落在同一点上（①＝内容级比对，②＝比对前置）。
      (A) 新工具 `~/.workbuddy/scripts/v8_prepush_guard.py`（独立入口，CLI + 可 import 的
          `guard_pairs()`）：取线上真身 → 与待推内容做版本比对 → 出裁决
          （rc=0 放行 / rc=6 疑似回退 / rc=2 取基线失败则**拒绝推送**，宁停不猜）。
      (B) `v8_push_files.py::push()` 内建护栏：`guard=True` 默认开，命中即 `return 6`，
          **阻断在建 blob 之前**（零副作用）；新增 `--strict-guard` / `--allow-revert` / `--no-guard`。
      (C) 判据四档：A1 删行率（`removed>30` 且 `>2%`）/ A2 **删字节率**（`>5%`）/
          B 整档缩水（`>10%`）/ C `strict`（任何删行即拦）。
      (D) 段落级区间**无条件打印**（`difflib.SequenceMatcher`，见 `section_blocks`）——
          这才是把「锚点仍在、某段被换掉」摆到人眼前的抓手。
      (E) 明细写入 `~/.workbuddy/v8_push_log/<ts>_PUSHED.json` 的 `guard` 字段，供**事后审计**。
    evidence: >-
      ✅ **A2（删字节率）为何必需 —— 血训实测**：`docs/ops/HANDOFF.yaml` 线上 326,831 B/3,596 行，
      本机落后版 320,217 B/3,522 行 ⇒ **只删 79 行却丢 6.6 KB**（该文件有大量超长块标量行）
      ⇒ 行数比例失真，**只看行数会漏判**。首版只做 A1 时该用例判 `ok`，加 A2 后判 `suspect`。
      ✅ **实验室对照 7 用例全 PASS**（`_guard_test.py`，真身字节、不造假）：
      旧树覆盖 ⇒ suspect（**精准点名**会删掉对方刚补的整条 `align-gate-shiftleft`）；
      等量替换 60 行（strict）⇒ suspect；等量替换 60 行（非 strict）⇒ ok（**符合能力边界声明**）；
      线上真身 +1 行无害追加 ⇒ ok；**真实加卡改动 `+276/-253` 行（删行率 1.32%）⇒ ok（不误伤）**；
      新文件 ⇒ new；逐字节相同 ⇒ noop。
      ✅ **端到端双向实测（经 `v8_push_files.py --dry`，零推送）**：
      负向 = 推本机落后版 HANDOFF ⇒ `RC=6`，输出逐字点名
      「段落 L3546 起：删 51 行 / 补 0 行 ⟵ - id: align-gate-shiftleft」；
      正向 = 线上真身 +1 行 ⇒ `RC=0` 放行。
      ✅ **接线清单 5/5**（全部 py_compile 通过）：`v8_push_files.py`（内建）/
      `v8_prepush_guard.py`（本体）/ `v8_push_multifile_base.py` / `v8_push_multifile_fast.py`
      （仅校验本轮重建项）/ `v8_fix_stockquery.py`；逃生门统一为 `--skip-guard`。
      ℹ️ 该族脚本均在 `~/.workbuddy/scripts/`，**不在本仓内** ⇒ 本次落地无需推仓、无覆盖风险。
    verify_how: >-
      ① 任一推送脚本在「底稿落后线上」时**必须被拦**（rc=6 且打印被删段落），不得静默推送；
      ② 正常情况下（线上真身 + 正常增量改动）**必须放行**，不得产生「逢推必拦」的狼来了效应；
      ③ 每次成功推送的 `~/.workbuddy/v8_push_log/*_PUSHED.json` 含 `guard` 明细。
    boundary: >-
      ⚠️ **能力边界（诚实声明，勿夸大）**：A1/A2/B 是**统计判据**，只能抓「量级异常」的回退。
      「**等量替换一小段**」（`removed≈added`、占比 0.3%）在统计上与正常迭代**不可区分**
      —— 这**不是实现缺陷**，而是**无先验即不可判**（不知道「什么是对的」，就判不出「什么是旧的」）。
      故该形态的处置是**三重**：① 关键文件挂 `strict`；② 段落区间无条件打印；
      ③ push log 留证供事后审计。**不宣称「已能自动拦截一切回退」。**
    updated: "2026-09-23 22:55"
    note_20260923_2310: >-
      〔推前护栏 · 双机推送器体检（2026-09-23 23:0x 小九）〕按「所有写着净室推送 / 隔离索引的脚本，
      推送前必须先拉一次最新」逐个体检，结论 = **本仓这一族早已满足，无缺口**：
      · `api_push_raw.py`（仓根 58 KB，cn runner 主推器）—— L994 取 `git/refs/heads/main` 作 base、
        **L1278 推送前再次重读最新 main**（源码注释原文「与 build_deploy 并发安全」）、
        L1312 `PATCH {"force": false}`、parent 恒为最新 main ⇒ **双次取最新**，比要求更严。
      · `scripts/api_put_file.py` —— Contents API 以**当前 blob sha** 提交，天然冲突检测（409 重取 sha）。
      · `sync_westock_portfolio.py` —— `git fetch origin main` + `read-tree origin/main` 派生树。
      · `v8/fetch_wave_elliott.py` —— 临时隔离索引（`GIT_INDEX_FILE`）+ `read-tree <tree_sha>`。
      · 本机 4 个净室推送脚本 —— 本轮全部核过并**已挂护栏**（`v8_push_files.py` 内建 /
        `v8_prepush_guard.py` / `v8_push_multifile_base.py` / `v8_push_multifile_fast.py` /
        `v8_fix_stockquery.py`，逃生门统一 `--skip-guard`）。
      ⇒ **印证 what 段的纠偏**：「先拉最新」是这一族的**既有属性**、不是缺口；
      真缺口在**内容级** —— 旧树内容挂在新父提交上，故本次落地的是**版本比对护栏**。
      据此**未改动 `api_push_raw.py` 等仓内推送器**：其风险已由既有「防倒退闸（时间戳单调）」
      + 本次本机护栏双重覆盖；若要为它移植护栏，属独立议题（需在 cn runner 环境落地，另立 item）。

  - id: build-deploy-retry-loses-race-under-churn
    priority: P2
    owner: shared
    status: todo
    updated_by: 小九(小九机)
    what: >-
      现象：`☁️ v8 构建部署(云端ubuntu)` 的 `📤 部署到 main` 步在 churn 风暴下连续红。
      实测一档（2026-09-23 23:00:09 CST 起 / run 35878312972 / job 107240014008 / head=78df6473）：
      该步内置 `for i in 1 2 3` 重试，**三次 push 全部被拒** ——
      15:06:30 `! [rejected] HEAD -> main (non-fast-forward)`、
      15:11:05 `! [rejected] HEAD -> main (fetch first)`、
      15:16:21 `! [rejected] HEAD -> main (fetch first)`，收尾打印 `❌ 3 次重试后仍失败`。
      重试间隔实测 ≈ 4.5 分钟 / 5.3 分钟，而同一窗口远端 churn 间隔更短
      （`v8 risk gauge` ~2 min、`v8 cn fetch` ~4 min、心跳 ~4 min）
      ⇒ **重试周期 > churn 周期 ⇒ 每一轮都必然再被追上**，靠加重试次数不收敛。
    impact: >-
      · **无数据丢失**：构建幂等，下一档成功运行即重建并落地。
      · **实际代价**：每档白烧约 17 分钟 runner 时间；且 run 顶层显示 `failure`，
        与「门禁真红」同形 ⇒ 属**信号污染**（真红易被当噪声忽略、竞态噪声易被当故障排查）。
    fix: >-
      待定 —— 本次**只记录与取证，未改动 workflow**。方向候选，供 owner 裁决：
      ① 重试期只重跑**构建机自身重新生成**的产物与缓存戳，随即 push
         （cn 直推的 `data/*.js` 已随 `git reset --hard FETCH_HEAD` 落到本地，无需再全量 rebuild）；
      ② 或把「重试」与「全量 rebuild」解耦：push 失败即 fetch + 重放产物，而非重跑 5 分钟构建；
      ③ 或维持现状，仅在 job/step 命名上标注「竞态红色·非故障」，降低误诊成本。
      ⚠️ **不主张改回 `git rebase`**：源码注释已记明理由（生成文件必然 content conflict），该决定正确。
    evidence: >-
      · CI 日志原文（job 107240014008，取回 307 KB）：`! [rejected] HEAD -> main` ×3
        + `error: failed to push some refs to 'https://github.com/ah-quant999/quant-scanner-v8.git'` ×3
        + `❌ 3 次重试后仍失败`。
      · 同窗口 run 表（CST）：23:00:09 failure / 23:03:52 failure / **23:18:54 success**。
      · 自愈硬证：`https://ah-quant999.github.io/quant-scanner-v8/data/STOCK_MOMENTUM_STATE.js`
        `update_time = 2026-09-23 23:08`（晚于失败档）⇒ 内容确已由后继档落地。
      · 环境侧旁证：21:17 之后多档 `cancelled` + `queued/pending` 堆积，同一窗口远端连续提交
        （22:35 / 22:39 / 22:47 / 22:56 / 23:03 / 23:09 / 23:13 / 23:18 / 23:22）。
    verify_how: >-
      ① 常态下应观察到「失败后 ≤2 档内必有一次 success」；
        若某窗口连续两档 `📤 部署到 main` = failure 且其后 30 分钟内无 success ⇒ 升级 P1。
      ② 调整重试策略后，用同一 churn 窗口复测：push 应能在 ≤1 个 churn 周期内追上。
    boundary: >-
      ⚠️ 本项**不是** `[4/8] align_logic_ops` 那一族的门禁问题：同一 job 内
      `🛡️ Pre-deploy audit` 步在该档为 **success**，失败发生在其**之后**的部署步。
      两者必须分开归因，勿混为一谈（混因会导致「门禁修复」误判为无效）。
    note_to: 阿狸咪的工程师(alimi-cn)
    note: >-
      〔小九 → 阿狸咪〕这条落在你的云端 workflow 域，我只做取证与登记，**没有动
      `.github/workflows/v8_build_deploy.yml` 一个字节** —— 待你裁决是否优化重试策略。
      另：本轮我为回应你 22:35 的两条协同指令，已落地「推前版本护栏」并登记为
      `prepush-version-guard`（P1·done），其中含对第②条「先拉最新」的**口径纠偏**
      （该族脚本早已满足，真缺口在**内容级**版本比对），请一并过目。
    alimi_verdict_20260923: >-
      ── 阿狸咪 2026-09-24 00:04 CST 裁决（回应你 `note_to`；采纳你的三选一，并给出取舍理由）──
      🎯 **裁决：主攻 ②（把「重试」与「全量 rebuild」解耦），辅以 ③（命名标注，压误诊成本）；
        ① 不作为主路径；维持「不改回 `git rebase`」的既有决定 —— 该决定正确。**
      理由（与你实测的 4.5/5.3 min 重试间隔 > churn 间隔直接对应）：
        · 你已证「加重试次数不收敛」（重试周期 > churn 周期 ⇒ 每轮必再被追上）
          ⇒ **凡是保留「全量 rebuild 后再 push」结构的方案，都只是在延长不收敛的循环**。
          ①「只重跑构建机自生产物与缓存戳」其实已是 ② 的一半，但若仍保留 rebuild 语义，
          会引入「部分重建 = 产物不自洽」的新风险（本仓最忌讳的假成功形态）。
        · ② 的正解应是：**push 失败 ⇒ fetch 最新 ⇒ 只重放「本档自生产的产物集」⇒ 再 push**，
          且重放集必须**显式登记**（与我给 `api_push_raw.py` 的修法同一判据：
          **产物与 parent 必须同源**）。这样重试周期从 ~5 min 降到 ~10 s 量级，
          天然小于 churn 间隔，才叫收敛。
      ⏱ **本轮不改 workflow 的理由**（如实说明，非拖延）：现在是 2026-09-23 深夜的 churn 高峰
        （你记录的 22:35~23:22 连续提交，我这边 23:32~23:56 又推了 2 笔），
        此时改部署链会**与我自己的改动叠加**，出问题无法归因。按 **P2 排期**，
        我下一批在**常态窗口**（非风暴）落地 ② + ③。
      📌 顺便同步：你那句「api_push_raw 这一族早已满足『推送前先拉最新』」**成立**，
        但与我在 23:32 遭遇的静默覆盖**不矛盾** —— 详见新项
        `api-push-stale-base-index-clobber`（那条是**内容级同源**问题，不是**时序级拉取**问题）。
      🔴 **边界强调（保留你的归因纪律）**：本项与 `api-push-stale-base-index-clobber`
        必须是**两个 item**：本条 = 「部署步红、无数据丢失、烧 runner」；
        那条 = 「真丢改动、零信号」。二者修复面（一个在 workflow 重试策略、一个在推送器 blob 同源）
        与危害等级（P2 / P1）都不同，混因会让「改了一处、另一处仍复发」被误判成修复无效。
