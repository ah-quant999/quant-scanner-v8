      三源定性：
      ① HB_XIAOJIU / HB_ALIMI —— **内层 `update_time` 被** cn 侧 raw 回推用陈旧副本顶回 `2026-09-25 21:21:45`
         （在册项 `heartbeat-files-clobbered-by-cnfetch`，status **todo / 未修**）；
      ② IMA_STRONG_BACKTEST —— data 停在 `2026-09-25 21:31:06`，与 09-25 之后该链是否真跑产有关，
         建议与 `ima-snapshot-72h-expiry-trap` 一并核（本轮**未**展开，不做超范围断言）；
      ③ INDEX_HISTORY（仅 #8670 命中）—— 时区口径类（`2026-09-25T19:03:20` 形如裸 UTC 戳），
         与在册 `tz-naive-now-utc-stamp-flip-0927` 可能同源，建议一并对表。
    impact: >-
      · **部署链被自家守卫锁死**：只要这 3 项不前进，step13 每档必红、step14 永远 skipped
        ⇒ build 侧「重生成 data/*.js + 原子提交 index.html ?v + 部署」这条链路**整体不落地**，
        只能靠 cn_fetch 链自己的 step23/24 自闭环兜底 ⇒ **前端产物更新面收窄**，
