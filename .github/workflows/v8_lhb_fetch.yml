# 九宝量化 v8.0 — 龙虎榜单飞 fetcher 调度（cn runner）
#
# 2026-08-30 F7-挂账：本 workflow 独立调度 fetch_lhb.py + api_push_raw.py，
#   不依赖 v8_algo_run.yml（其 cron 已禁用，cn runner 仅 workflow_dispatch 应急），
#   也不依赖 v8_algo_cloud.yml（云端跑，但 fetch_lhb 在 cn 才稳定）。
# 每周一至周五 17:30（盘后+龙虎榜当日发布+留 30 分钟缓冲）单飞补算 LHB 数据。
#
# 🛡 2026-08-30 19:2x 一劳永逸修复（首次 dispatch 报 422 才暴露）：
#   ① 原文件 name / description 用了「反斜杠 + u + d83c 型」UTF-16 surrogate pair 转义，
#      go-yaml（GitHub Actions 解析器）不接受 → 整份 workflow 解析失败，
#      GitHub 把 name 显示成文件路径，并判定「没有 workflow_dispatch trigger」→ dispatch 422。
#      本次全部改为真实 UTF-8 字符，不再使用任何 \uXXXX 转义。
#   ② 原推送步骤条件 `steps.fetch_lhb.outcome == 'success'` 引用了一个没有 id 的 step
#      → 条件恒为 false，即使抓到数据也永不入仓。本次给抓取步骤补 `id: fetch_lhb`。
#
# 安全铁律（与 v8_algo_run.yml 同步）：
#   1. 严禁 actions/checkout / rm -rf / git clean -fdx / Remove-Item -Recurse
#      （cn runner 系统级 BULK_CONFIRM 拦截，会挂 job）。
#   2. 严禁 git clone/fetch（cn runner 到 github.com:443 被连接重置），
#      仅走 GitHub Contents API 同步源码。
#   3. 单一职责：只调 fetch_lhb.py → out/lhb_result.json + api_push → 入仓；
#      不动其他 raw_data 文件。
name: "🐉 v8 龙虎榜单飞 fetcher (cn runner)"

on:
  schedule:
    # 每周一至五 17:30 CST（交易日 17:00 后发布龙虎榜，17:30 起跑「当日龙虎榜」，
    # 周末不触发）。以 UTC cron 表达：CST 17:30 = UTC 09:30。
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_trading_day_gate:
        description: "应急手动调用时绕过交易日闸（默认 false，true 仅供非交易日补算）"
        required: false
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: write

jobs:
  lhb-only:
    runs-on: [self-hosted, cn]
    timeout-minutes: 25
    steps:
      # 仅调 GitHub Contents API 拉取 algorithms/fetch_lhb.py（本 workflow 唯一需要的脚本），
      # 避开 git clone（cn runner 上 github.com 被 connection reset）也避开 checkout action。
      # 需要的环境变量：GH_PAT
      - name: "📝 同步源码（安全）"
        shell: powershell
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $TARGET = 'algorithms/fetch_lhb.py'
          $URL = "https://api.github.com/repos/ah-quant999/quant-scanner-v8/contents/$($TARGET -replace '/','%2F')?ref=main"
          $headers = @{
            'User-Agent' = 'v8-lhb-fetcher'
            'Accept'     = 'application/vnd.github.raw'
            'Authorization' = "Bearer $env:GH_PAT"
          }
          $tmpPath = "algorithms/_lhb_fetch.py.tmp"
          New-Item -ItemType Directory -Force -Path algorithms | Out-Null
          try {
            $r = Invoke-RestMethod -Uri $URL -Headers $headers -TimeoutSec 60 -Method Get
            [System.IO.File]::WriteAllText($tmpPath, $r, [System.Text.Encoding]::UTF8)
            Move-Item -Force $tmpPath "algorithms/fetch_lhb.py"
            Write-Host "fetched $TARGET from origin/main"
          } catch {
            Write-Host "[warn] API fetch failed: $_ ; using local copy (LHB may be stale)" -ForegroundColor Yellow
          }

      - name: "🐍 Python / akshare 环境检查"
        shell: powershell
        run: |
          python --version
          python -c "import akshare, pandas, requests" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "deps missing, installing from tsinghua mirror..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas requests
          } else { Write-Host "deps ready" }

      - name: "📊 跑 fetch_lhb.py（产出 out/lhb_result.json）"
        id: fetch_lhb
        shell: powershell
        continue-on-error: true
        run: |
          # 交易日闸（默认）：周末静默跳过（fetch_lhb 内部已有交易日判断，调度端双保险再判一次）
          $skip = "${{ github.event.inputs.skip_trading_day_gate || 'false' }}"
          if ($skip -eq 'true') {
            Write-Host "skip_trading_day_gate=true: force run"
          } else {
            $dow = (Get-Date).DayOfWeek.value__
            if ($dow -eq 0 -or $dow -ge 6) {
              Write-Host "[skip] weekend, exit ok"
              exit 0
            }
          }
          cd $env:GITHUB_WORKSPACE
          python algorithms/fetch_lhb.py
          if (Test-Path 'out/lhb_result.json') {
            Write-Host "[ok] out/lhb_result.json generated"
          } else {
            Write-Host "[warn] out/lhb_result.json missing"
          }

      # api_push_raw.py 推送仓内 OUT_DIR 中产出的龙虎榜明细，
      # 以 api_push_raw.py --only lhb 限定只推送 lhb_result.json + lhb_seats.json。
      - name: "📤 推送到仓库（api_push_raw.py 中 LHB 分支）"
        if: always() && steps.fetch_lhb.outcome == 'success'
        shell: powershell
        continue-on-error: true
        run: |
          cd $env:GITHUB_WORKSPACE
          python api_push_raw.py --only lhb || python api_push_raw.py || Write-Host "api_push_raw failed, non-blocking"
