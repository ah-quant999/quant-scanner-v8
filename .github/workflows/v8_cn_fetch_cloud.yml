# 九宝量化 v8.0 — 中国数据抓取（GitHub 云端，ubuntu-latest 主力）
#
# 🔴 2026-08-18 主人令：小九机器跑太费 TOKEN 且网络不稳定，必须让云端 ubuntu-latest 成为主力。
#   本 workflow 固定 runs-on: ubuntu-latest，由 GitHub schedule / workflow_dispatch 触发。
#   self-hosted cn runner（小九单位机 LEMONCAT）降级为应急兜底，仅在看门狗检测到
#   云端连续失败时才 dispatch v8_cn_fetch_cloud_selfhosted.yml。
#   云端对部分 akshare/纯内网源可能超时，但东方财富 push2 系列（INDEX_QUOTES / SECTOR_FUND_FLOW /
#   CONCEPT_RANKING / LIMIT_UP_HEATMAP / ETF_PULSE / CAPITAL_FLOW_DATA / AI_MARKET_BRIEF 等）
#   在境外 runner 仍可工作，优先保证实时数据区不空窗。
#
# 时段映射（北京时间）：
#   08:25  盘前：V8_CAL / IPO_DATA / MARGIN_DATA / MACRO_DATA / CRISIS_DATA /
#                 NORTH_FUND / ANALYST_RATINGS / W52_HIGH / VOLATILITY /
#                 RESTRICTED_RELEASE / PERFORMANCE_FORECAST
  #   注意：PERFORMANCE_FORECAST 数据格式 = {summary: {increase, decrease, loss, uncertain, total}, items: [...]}
  #   summary.total 由云端 f_perf_forecast 算出 = 4 类型合计（schema 已稳定，不要写 sum(increase+...)现算避免与 stats 双源漂移）。
  #   前端 2026-08-31 起展示为 6 列汇总：预增/预减/预亏/不确定 + 总数 + 净增(=预增−预减)，其中「净增」前端现算不写盘。
  #   INDEX 同步：logic.html 「今日业绩预告·说明」段已同步改为"6 列"口径。
#   盘中每30分钟刷新（09:00-15:30）：INDEX_QUOTES / ETF_PULSE / ETF_INTRADAY_HEAT /
#                     ETF_DAILY_MONITOR / SECTOR_FUND_FLOW / CAPITAL_FLOW_DATA /
#                     CONCEPT_RANKING / LIMIT_UP_HEATMAP / AI_MARKET_BRIEF
#   17:20  盘后：CFFEX_HOLDINGS + EXPERIMENT + MARKET_FUND_FLOW_DATA + ETF_DAILY_MONITOR +
#          龙虎榜当日数据刷新
#          （交易所 17:00 后才发布龙虎榜，故 post_close 从 15:45 推迟到 17:20）
#          🛡 2026-09-11 主人令（轻量化·卡迁移）：「日监控·主力净流入」卡迁至「盘后数据」页后，
#             ETF_DAILY_MONITOR 由单纯 intraday 升为 "intraday,post_close" 双档（见 cloud_fetch_v8.py
#             CATEGORY_MAP）——盘中继续每 30 分抓，盘后三档(17:20/18:20/19:20)必重抓一次 T+1 定稿。
#             （原「ETF 三连板」措辞已随该次轻量化拆为「ETF 二合一」，勿按旧名检索。）
#   17:00/21:30 全量兜底（防 GitHub schedule 高负载丢触发；21:30 刚好美股开盘后捕获隔夜宏观变动）
#   周六 09:00 / 周日 09:00  T+1 周度/月度统一刷新
#
# 🔴 2026-08-06 根因修复：GitHub Actions 单个 workflow 的 schedule 条目过多会静默失效。
#    本文件原先 17 条 cron，导致 v8_cn_fetch_cloud 自创建以来从未被 schedule 触发。
#    后收敛为 5 条 cron，符合平台隐性约束。
# 🛡 2026-09-09 主人令「盘中 20 分钟 + 单一调度器」：盘中 schedule cron 只有 30 分钟粒度，
#    且 GHA cron 静默丢触发问题无法根治；盘中时段改由本机 WorkBuddy 单一调度器
#    每 20 分钟 workflow_dispatch 派发（category=intraday）。本文件只保留盘前/盘后/周末 cron。

name: "🇨🇳 v8 中国数据抓取(云端)"

on:
  schedule:
    # 🔧 2026-09-09 主人令「盘中 20 分钟 + 单一调度器」：盘中 schedule cron 已删除，
    #   改由本机 WorkBuddy 单一调度器每 20 分钟 workflow_dispatch 派发 category=intraday。
    #   本处保留 3 条 cron：盘前 + 盘后 + 周末。
    - cron: '25 0 * * 1-5'     # 08:25 CST 盘前（不变）
    # 🛡 2026-09-11 小九的工程师（盘中错题 E1/E6 一劳永逸修复 · 云端原生种子）：
    #   实证：盘中 14 档权威定义在本机调度器 v8_cn_fetch_intraday_lemoncat.yml，
    #   但该 workflow **历史仅 14 次运行且全部严重迟到**（09-10 全部落在 15:29-20:04，
    #   最大延迟 5 小时），09-11 全天 **0 次**；同日本 workflow 的 8,38 cron 也只跑了
    #   4/22 次 —— 本仓 GitHub schedule 已普遍不可靠，盘中档位**没有可靠种子**，
    #   导致 10:40/11:00/11:20/11:30 四档全部零派发、数据两度靠人工兜底。
    #   本 workflow 的 08:25 盘前档每日准时 → 在此追加云端原生盘中种子（每 20 分），
    #   与 lemoncat（如恢复）同 concurrency group 排队不互杀、幂等闸门自动去重。
    #   注：本 job 的 schedule 触发为**每次新派发**（非高频轮询），不构成风暴。
    - cron: '*/20 1-3,5-6 * * 1-5'  # 09:00-11:40 / 13:00-14:40 CST 盘中种子
    - cron: '20 9-11 * * 1-5'  # 17:20/18:20/19:20 CST 盘后三档（不变）
    - cron: '0 1 * * 0,6'      # 周六/周日 09:00 CST 周度刷新（不变）
  workflow_dispatch:
    inputs:
      category:
        description: '抓取类别：premarket / intraday / post_close / all'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: v8-cn-fetch-cloud
  # 2026-08-24 修复(#1 取消风暴根治)：改为 false，新派发不再杀掉正在写
  # 共振/快照文件的 run，从根上杜绝「自伤顶掉」——此前 cancel-in-progress:true
  # 频繁把正在写 triple_consensus.json / lhb_history.json / sector_fund_flow 的 run 杀掉，
  # 留下半截 JSON → 数据清空（共振日历反复「数据又没了」、主力净额曲线断档均源于此）。
  # 配合 token 修复 + 僵尸看门狗形成双保险。
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 2026-08-31 16:25 一劳永逸修复（小九令：收盘数据上线）：25 -> 60
    #   根因：post_close 要跑 LHB 刷新 + LHB 历史回填 + 研报抓取重建候选池 +
    #   涨价弹性榜重算 + 板块RS重算 + update_v8 全量重生成 + HEALTH_CHECK 108 项比对，
    #   实测 15:42 那轮 step18(update_v8) 就已跑到 16:00（17min），16:07:56 被
    #   25min 硬超时杀死 -> data/*.js 已重生成却来不及 step21 推送 -> 线上数据停滞
    #   （13:46/15:42 两轮同因 cancelled，数据卡在 14:2x 唯一跑完的一轮）。
    #   60min 覆盖完整 post_close 链路，intraday 实际仍只需 ~20min，无副作用。
    timeout-minutes: 60
    env:
      # 🔴 2026-08-06 00:10 必须保留：云端 runner 默认 UTC，朴素 datetime.now() 写出的
      #   update_time 会比北京时间慢 8 小时，前端「更新于」与新鲜度判定全线错位。
      #   显式声明时区后与中国节点产出一致；显式带 tzinfo 的写法不受影响，不会双重偏移。
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "🕐 确定抓取类别"
        id: cat
        shell: bash
        run: |
          CRON="${{ github.event.schedule }}"
          IN="${{ github.event.inputs.category }}"
          # 🛡 2026-08-31 一劳永逸修复（小九令：收盘数据上线）：
          #   原逻辑只看 github.event.schedule，而 workflow_dispatch 触发时该值为空
          #   → case 落 *) 分支 → category=all（全量抓取，最重）。
          #   实测 15:42 派 intraday、16:05 派 post_close，两轮都实际跑成 all，
          #   叠加 step18 update_v8 全量重生成，25min 硬超时被杀 →
          #   data/*.js 已重生成却来不及 step21 推送 → 线上数据停滞在 14:2x。
          #   修复：workflow_dispatch 入参优先；入参为空才按 cron 判定。
          if [ -n "$IN" ]; then
            case "$IN" in
              premarket)  echo "category=premarket" >> "$GITHUB_OUTPUT"; echo "label=手动派发(盘前)" ;;
              intraday)   echo "category=intraday" >> "$GITHUB_OUTPUT"; echo "label=手动派发(盘中)" ;;
              post_close) echo "category=post_close" >> "$GITHUB_OUTPUT"; echo "label=手动派发(盘后)" ;;
              all)        echo "category=all" >> "$GITHUB_OUTPUT"; echo "label=手动派发(全量)" ;;
              *)          echo "category=all" >> "$GITHUB_OUTPUT"; echo "label=手动派发(未知入参→all)" ;;
            esac
          elif [ -n "$CRON" ]; then
            # 🛡 2026-09-11 小九的工程师（三档口径对齐·清理幽灵分支）：
            #   case 表此前同时接受 4 组 cron，其中 3 组**已不在本文件**——盘中
            #   `*/30 1-3` / `*/30 5-7`（09-10 起盘中抓取改由本机调度器
            #   v8_cn_fetch_intraday_lemoncat 以 workflow_dispatch 派发，见文件顶部说明）、
            #   旧的 `0 9,14` / `0 9,13` 全量档。留着不会误触发（永不匹配），但会让人误判
            #   「本文件还有盘中 cron」，与「盘前/盘中/盘后 权威划分表」口径冲突，故删除。
            #   判定仍是 github.event.schedule 原串精确匹配，未匹配即走 all 兜底（保底不变）。
            case "$CRON" in
              "25 0 * * 1-5")           # 08:25 CST 盘前
                echo "category=premarket" >> "$GITHUB_OUTPUT"
                echo "label=盘前" ;;
              "*/20 1-3,5-6 * * 1-5")   # 09:00-11:40 / 13:00-14:40 CST 盘中种子（云端原生）
                echo "category=intraday" >> "$GITHUB_OUTPUT"
                echo "label=盘中(云端原生种子)" ;;
              "20 9-11 * * 1-5")        # 17:20 / 18:20 / 19:20 CST 盘后三档
                echo "category=post_close" >> "$GITHUB_OUTPUT"
                echo "label=盘后" ;;
              "0 1 * * 0,6")            # 周六 / 周日 09:00 CST 周度全量
                echo "category=all" >> "$GITHUB_OUTPUT"
                echo "label=全量兜底(周末周度)" ;;
              *)
                echo "category=all" >> "$GITHUB_OUTPUT"
                echo "label=兜底(未匹配cron $CRON, 走all)" ;;
            esac
          else
            # 🛡 2026-09-11 小九的工程师·一劳永逸（治「裸 dispatch 落 all」）：
            #   实证 09-11：09:39–10:21 有 6 次 `workflow_dispatch` 但**未带 category 入参**
            #   （actor=github-actions[bot]）→ 既无 IN 也无 CRON → 原先一路落到 `*)` = **all（最重档）**
            #   → 盘中跑了盘后策略（四量等）→ 命中 0 只 → 洗空 data/FOUR_VOLUME.js →
            #     前端卡空 + CI pre_deploy_audit 硬阻断整站部署。
            #   修复：无 IN 且无 CRON 时，按 **CST 当前时刻自适应** 归类，绝不再落 all。
            #   （all 仅保留给周末周度与显式请求；盘中派发无入参也只会跑 intraday，危害面归零。）
            # 用 python 显式 +8h 计算 CST，不依赖 TZ 环境变量是否生效（跨 runner 更稳）
            HM=$(python3 -c "from datetime import datetime,timezone,timedelta;n=datetime.now(timezone.utc)+timedelta(hours=8);print(n.hour*60+n.minute)")
            HSTR=$(python3 -c "from datetime import datetime,timezone,timedelta;n=datetime.now(timezone.utc)+timedelta(hours=8);print('%d:%02d'%(n.hour,n.minute))")
            if [ "$HM" -ge 505 ] && [ "$HM" -lt 540 ]; then
              echo "category=premarket" >> "$GITHUB_OUTPUT"
              echo "label=裸派发·按时刻自适应(盘前 $HSTR)"
            elif [ "$HM" -ge 540 ] && [ "$HM" -le 905 ]; then
              echo "category=intraday" >> "$GITHUB_OUTPUT"
              echo "label=裸派发·按时刻自适应(盘中 $HSTR)"
            elif [ "$HM" -gt 905 ] && [ "$HM" -le 1290 ]; then
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=裸派发·按时刻自适应(盘后 $HSTR)"
            else
              echo "category=all" >> "$GITHUB_OUTPUT"
              echo "label=裸派发·按时刻自适应(深夜 $HSTR → all)"
            fi
          fi
          # 注：原 if 兜底已删（重复 echo 同一 output 键会导致 GitHub Action 报 Multiple outputs）

      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 1

      # 🛡 2026-08-29 统一交易日历中枢：所有下游脚本通过 V8_DATA_DATE 取「数据应属日期」，
      #   根治非交易日跑批把日期错标成「今天」的冒充今日问题。
      - name: "🗓 解析数据日期"
        id: data_date
        shell: bash
        run: |
          DATA_DATE=$(python -c "import v8_date; print(v8_date.today_data_date())")
          echo "data_date=$DATA_DATE" >> "$GITHUB_OUTPUT"
          echo "V8_DATA_DATE=$DATA_DATE" >> "$GITHUB_ENV"
          echo "📅 数据日期=$DATA_DATE"

      # 🛡 2026-08-22 一劳永逸（主人令根治）：幂等闸门升级
      #   旧版 exit 0 在 run: 块里只是退出当前 shell、后续步骤仍照跑 → 实际从未拦住抓取，
      #   且「只要有并发就跳过」过激：一个僵尸/过期 run 会永久冻住本卡刷新。
      #   新版：
      #     1) 仅当存在「正在执行且未超时(<35min)」的同 workflow run 才真正跳过（写 skip 输出，
      #        由下方 fetch 步骤 if 拦截），避免重复抓取/推送冲突；
      #     2) 排队中/已过期(>35min)的 run 视为僵尸，不阻断本 run → 根治「冻在 13:45」；
      #     3) concurrency 现改为 cancel-in-progress: false（2026-08-24 #1 根治），
      #        风暴来时新 dispatch 排队而非杀掉在跑的 run → 不再有「半截写入→数据清空」；
      #        盘前僵尸由 cloud_dispatcher 看门狗清理（见 v8_cn_fetch_cloud_selfhosted 同款逻辑）。
      - name: "🔒 幂等闸门（仅新鲜 run 执行时跳过；僵尸/过期 run 不阻断）"
        id: gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, datetime
          token = os.environ.get('GITHUB_TOKEN', '')
          run_id = os.environ.get('RUN_ID', '')
          repo = os.environ.get('REPO', '')
          out = os.environ.get('GITHUB_OUTPUT', '/dev/null')
          url = f"https://api.github.com/repos/{repo}/actions/workflows/v8_cn_fetch_cloud.yml/runs?per_page=100"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
          try:
              d = json.load(urllib.request.urlopen(req, timeout=20))
          except Exception as e:
              print("幂等检查 API 失败，保守放行:", e)
              print("skip=false", file=open(out, 'a'))
              sys.exit(0)
          now = datetime.datetime.now(datetime.timezone.utc)
          fresh = False
          for r in d.get('workflow_runs', []):
              if str(r.get('id', '')) == run_id:
                  continue
              st = r.get('status')
              if st not in ('in_progress', 'queued', 'pending', 'waiting', 'requested'):
                  continue
              started = r.get('run_started_at') or r.get('created_at')
              age = 999.0
              if started:
                  try:
                      ts = datetime.datetime.fromisoformat(started.replace('Z', '+00:00'))
                      age = (now - ts).total_seconds() / 60
                  except Exception:
                      age = 999.0
              # 仅『正在执行且未超时(>35min)』视为有效并发；过期僵尸不阻断
              if st == 'in_progress' and age < 35:
                  fresh = True
                  break
          if fresh:
              print("✅ 已有新鲜同 workflow run 在执行，本 run 幂等跳过抓取")
              print("skip=true", file=open(out, 'a'))
          else:
              print("无有效并发 run（或仅有僵尸/过期 run），继续抓取")
              print("skip=false", file=open(out, 'a'))
          PY

      - name: "🛡 交易日历闸门（连续休市段跳过冗余抓取）"
        id: td
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CAT="${{ steps.cat.outputs.category }}"
          # check_trading_day.py：A 股交易日判断；失败时保守视为交易日（不跳过），避免调休漏跑
          TD=$(python algorithms/check_trading_day.py 2>/dev/null | grep -o 'is_trading_day=.*' | tail -1 | cut -d= -f2)
          if [ -z "$TD" ]; then TD="true"; fi   # 解析失败→保守视为交易日，不跳过
          if [ "$TD" != "true" ]; then TD="false"; fi
          echo "is_trading_day=$TD"
          # 交易日 / 周末周度刷新(category=all) / 手动全量 → 继续抓取；
          # 仅「工作日 + 非交易日(节假日)」→ 跳过冗余抓取（V8_DATA_DATE 已保证不串日，无数据风险）
          if [ "$TD" = "true" ] || [ "$CAT" = "all" ]; then
            echo "proceed=true  (交易日 或 周末周度/手动全量)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false (工作日遇节假日，跳过冗余抓取)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "📦 安装依赖"
        # 🔴 2026-08-14 主人令永久修复：裸 `pip` 在 Windows runner 默认 PowerShell 下找不到
        #   （pip: ObjectNotFound，导致今天下午 13:40-14:04 云端链路 5 连败）。
        #   改用 `python -m pip`（不依赖 PATH），并显式 shell: bash 与其余 step 一致。
        shell: bash
        run: |
          python -m pip install akshare pandas requests --quiet
          python -c "import akshare, pandas; print('akshare', akshare.__version__, '/ pandas', pandas.__version__)"

      - name: "📡 抓中国数据 → raw_data/（selective）"
        # 🛡 2026-08-22 幂等闸门：skip=true 时本 run 不重复抓取（另一新鲜 run 已在做）
        if: steps.gate.outputs.skip != 'true' && steps.td.outputs.proceed != 'false'
        # 🛡️ 2026-08-12 移除 continue-on-error：抓取失败必须让 job 失败，
        #    阻止 api_push_raw 把只刷了 update_time 的空壳数据推送到 main。
        shell: bash
        run: |
          cat="${{ steps.cat.outputs.category }}"
          echo "本次类别: $cat"
          python cloud_fetch_v8.py --category "$cat"

      # 2026-09-01 主人令：#7 分红刷新上云（小九机降级为监督/应急兜底）。
      # 直接跑 refresh_dividend_cninfo（cninfo 源），写回 raw_data/stock_quote.json 并重建
      # data/STOCK_QUOTE.js；随后本 workflow 的「📤 推送 raw_data/」与「📤 推送重建 data/*.js」
      # 两步经 api_push_raw(Contents API) 自动上线——不再走 run_dividend_refresh.py 的本地 SSH 自推
      # （云端 runner 无 SSH 凭据，自推会失败）。cninfo 为境内源，云端偶发超时则 continue-on-error 跳过，
      # 由小九机「分红刷新」监督 automation 检测后作为应急兜底本地补跑。
      - name: "💰 分红方案刷新（cninfo·云端主跑）"
        id: soft_1
        if: (steps.cat.outputs.category == 'premarket' || steps.cat.outputs.category == 'post_close' || steps.cat.outputs.category == 'all') && steps.td.outputs.proceed != 'false'
        continue-on-error: true
