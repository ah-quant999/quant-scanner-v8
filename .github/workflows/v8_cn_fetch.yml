# 九宝量化 v8.0 — 中国数据抓取（自托管 cn runner）
#
# 2026-08-01 周末改造：改为分时段 selective fetch，不再每次全删 raw_data。
# 每个 cron 对应一个 category：premarket / intraday / post_close。
# post_close 中的算法类数据由 v6 算法端推送 raw_data；本工作流只抓 akshare 能提供的
# ETF_DAILY_MONITOR / EXPERIMENT。
#
# 时段映射（北京时间，按主人要求）：
#   08:25  盘前：V8_CAL / IPO_DATA / MARGIN_DATA / CFFEX_HOLDINGS / MACRO_DATA /
#                 CRISIS_DATA / NORTH_FUND / ANALYST_RATINGS / W52_HIGH /
#                 VOLATILITY / HERDING_DATA
#   盘中每30分钟刷新（09:40 首刷 / 15:10 末档）：INDEX_QUOTES / ETF_PULSE / ETF_INTRADAY_HEAT / ETF_SUBSCRIPTION /
#                     ETF_DAILY_MONITOR / SECTOR_FUND_FLOW / CAPITAL_FLOW_DATA /
#                     CONCEPT_RANKING / LIMIT_UP_HEATMAP / MARKET_FUND_FLOW_DATA / AI_MARKET_BRIEF
#   15:30  盘后：EXPERIMENT + MARKET_FUND_FLOW_DATA（收盘后累积历史序列）
#          ETF_DAILY_MONITOR 因配合 ETF 三连板实时卡，已归 intraday 盘中更新
#   周六 09:00 T+1 周度/月度统一刷新：日历/IPO/两融/中金所/宏观/危机/北向/分析师/52周高/羊群效应
#                 周六强制重建日历（月度事件），避免非月初只读缓存导致停滞

name: "🇨🇳 v8 中国数据抓取(cn)"

on:
  schedule:
    - cron: '25 0 * * 1-5'   # 08:25 CST 盘前
    - cron: '40 1 * * 1-5'    # 09:40 CST 盘中（开盘前首刷）
    - cron: '0 2 * * 1-5'    # 10:00 CST 盘中（开盘后首次刷新）
    - cron: '30 2 * * 1-5'   # 10:30 CST 盘中
    - cron: '0 3 * * 1-5'    # 11:00 CST 盘中
    - cron: '30 3 * * 1-5'   # 11:30 CST 盘中
    - cron: '0 5 * * 1-5'    # 13:00 CST 盘中（午后开盘）
    - cron: '30 5 * * 1-5'   # 13:30 CST 盘中
    - cron: '0 6 * * 1-5'    # 14:00 CST 盘中
    - cron: '30 6 * * 1-5'   # 14:30 CST 盘中
    - cron: '10 7 * * 1-5'    # 15:10 CST 盘中（收盘前最后一次快照）
    - cron: '30 7 * * 1-5'   # 15:30 CST 盘后（收盘数据：ETF_DAILY_MONITOR / EXPERIMENT）
    - cron: '0 1 * * 6'      # 周六 09:00 CST 盘前
    - cron: '0 1 * * 0'      # 周日 09:00 CST 盘前（2026-08-02 补：周日-周六隔一天不刷新导致 today 标错）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-cn-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, cn]
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "🕐 根据 cron 确定本次抓取类别"
        id: cat
        shell: bash
        run: |
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "25 0 * * 1-5"|"0 1 * * 6"|"0 1 * * 0")
              echo "category=premarket" >> "$GITHUB_OUTPUT"
              echo "label=盘前" ;;
            "40 1 * * 1-5"|"0 2 * * 1-5"|"30 2 * * 1-5"|\
            "0 3 * * 1-5"|"30 3 * * 1-5"|\
            "0 5 * * 1-5"|"30 5 * * 1-5"|\
            "0 6 * * 1-5"|"30 6 * * 1-5"|"10 7 * * 1-5")
              echo "category=intraday" >> "$GITHUB_OUTPUT"
              echo "label=盘中" ;;
            "30 7 * * 1-5")
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=盘后" ;;
            *)
              echo "category=all" >> "$GITHUB_OUTPUT"
              echo "label=全量兜底" ;;
          esac

      - name: "经 API 拉取脚本（绕过 git）"
        shell: powershell
        run: |
          python -c @'
          import os, base64, json, urllib.request
          token = os.environ['GITHUB_TOKEN']
          files = [
              'cloud_fetch_v8.py', 'api_push_raw.py',
              'fetch_ipo_data_v8.py', 'fetch_limit_up_heatmap_v8.py',
              'backfill_lhb_history.py', 'algorithms/gen_market_brief.py'
          ]
          for fn in files:
              url = f'https://api.github.com/repos/ah-quant999/quant-scanner-v8/contents/{fn}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              d = json.load(urllib.request.urlopen(req, timeout=60))
              os.makedirs(os.path.dirname(fn) or '.', exist_ok=True)
              with open(fn, 'wb') as f: f.write(base64.b64decode(d['content']))
              print('downloaded', fn, len(d['content']), 'b64 chars')
          '@

      - name: "校验 Python / akshare（缺失则走清华镜像安装）"
        shell: powershell
        run: |
          python --version
          python -c "import akshare, pandas" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "akshare/pandas 缺失，安装中（清华镜像）..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas
          } else {
            Write-Host "akshare/pandas 已就绪，跳过安装"
          }
          python -c "import akshare; print('akshare', akshare.__version__)"

      - name: "📡 抓中国数据 → raw_data/（ selective ）"
        continue-on-error: true
        shell: powershell
        run: |
          $cat = "${{ steps.cat.outputs.category }}"
          Write-Host "本次类别: $cat"
          python cloud_fetch_v8.py --category $cat

      - name: "🐉 回填 LHB 历史（仅 post_close）"
        if: steps.cat.outputs.category == 'post_close'
        continue-on-error: true
        shell: powershell
        run: |
          python backfill_lhb_history.py

      - name: "📤 经 API 推送 raw_data/ 到 main"
        shell: powershell
        run: |
          python api_push_raw.py
