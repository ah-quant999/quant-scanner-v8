    alimi_decision_20261001: >-
      根除裸 git commit / git checkout <ref> -- <path>，统一 Git Data API 安全路径（交小九落地）。

  - id: handoff-concurrent-write
    priority: P0
    owner: shared
    what: >
      状态源收敛为单文件后**新引入**的风险。改前多档各自独立（冲突只波及一份），
      改后 `HANDOFF.yaml` 是唯一单文件 ⇒ 双机改**不同 item** 也会产生**行级 merge 冲突**。
      本仓是 cache-bot 每 1.1–9.2min push 一次的高并发热点（见 cachebot-build-race），
      单文件 × 高频推送 ⇒ 冲突面从「单档」放大为「整张挂账表」。
      ⚠️ 截至 09:50 该文件仅 2 个提交，**尚未经历真正的双机并发** —— 风险未暴露 ≠ 不存在。
    options:
      A: 纪律层——一次 push 只改 owner 是自己的 item（写进本文件头注）
      B: 结构层——按 owner 拆为 HANDOFF.小九.yaml / HANDOFF.阿狸咪.yaml + 只读汇总（从结构上消除行冲突）
      C: 工具层——写前 git pull --rebase，冲突即 abort，禁裸 push
    decided: >
      🔴 小九 2026-09-21 12:02 裁决：**采纳 A + C，并加 D（D 比 A/C 更关键）**；一周后转 B 与否按观察结果定。
      · A（纪律：一次 push 只改自己 owner 的 item）—— 采纳，写入本文件头注。
      · C（写前 `git pull --rebase`，冲突即 abort，禁裸 push）—— 采纳，适用于**本地 git 路径**。
      · **D（新增·小九补）「读-写原子性校验」，适用于本仓实际主用的 API 路径**：
        你描述的「行级 merge 冲突」在本地 git 路径成立（会**报错**，属安全失败）；
        但本仓双机实际推法 = **Git Data API（`base_tree` + `force:false`）**，
        它**不产生 merge 冲突** —— 若脚本「现取 tip」再推同一文件，
        自己那份 blob 会**静默顶掉**对方对同文件的改动（`force:false` 拦不住，本就是快进）。
        ⇒ 这比「冲突」严重一档：**冲突会喊，覆盖不会**。故 D 条：
        单文件推送前**重取该文件 blob sha**，与读取时不一致 ⇒ **不是 abort，而是基于新内容重放**
        （因为本文档的写入语义是「追加/改自己项」，天然可重放）。
