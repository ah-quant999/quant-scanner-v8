# 九宝量化 v8.0 — 盘中准点档调度器（小九 self-hosted cn 主力）
#
# 🔴 2026-09-09 主人令「盘中 20 分钟单源闭环（升级版·接力赛模型）」：
#   根因：原盘中由 WorkBuddy 自动化「云端按铃」(1787141452867) 每 20 分 dispatch 易导致
#   多源齐发 + api_push_raw 防倒退守卫互踢、半截 JSON；尤其小九偶尔下线时阿狸咪兜底
#   仍要抢按铃节奏 → 真正的"风暴根因"。
#   新模型：
#     - 盘中 14 档（9:40/10:00/.../15:00 CST，跳午休 11:30-13:00）由本 workflow 统一调度。
#     - 每档先 dispatch 云端 v8_cn_fetch_cloud（category=intraday，云端抓中国源主力）。
#     - 实时轮询云端 run 状态（最多 12 分钟，每 30s 探测），成功即结束；超时/失败转兜底。
#     - gh api 查 run 状态：成功 → 本档结束；失败/超时/无 run → dispatch
#       v8_cn_fetch_cloud_selfhosted（小九 cn IP 兜底，同 runner 不出海）。
#     - 接力赛：云端抓 8-10min + 小九 10min 后检查 + 失败小九兜底（cn IP 直连）→ 一档 20-25min。
#   优点：
#     ① 单源（小九 GHA cron 14 档）+ 接力赛（云端失败小九兜底）→ 不再双源互踢。
#     ② 同 concurrency group v8-cn-fetch-cloud（含云端主力+小九应急+hosted 兜底+阿狸咪按铃）
#        互斥排队不互杀，api_push_raw 防倒退守卫稳定。
#     ③ 阿狸咪盘中按铃阈值放宽到 60 分钟（小九正常时永不触发，整台机掉才兜底）。
#     ④ 与现状 cron 完全解耦：本 yml 是新加，v8_cn_fetch_cloud.yml 盘中 cron 已删，
#        纯依赖本 yml 与阿狸咪按铃（兜底）。
#
# 工作日窗口（小九 cn runner 在线时段 7:45-17:45）：
#   CST  9:40  10:00  10:20  10:40  11:00  11:20  11:40  13:00  13:20  13:40  14:00  14:20  14:40  15:00
#   UTC  1:40  2:00   2:20   2:40   3:00   3:20   3:40   5:00   5:20   5:40   6:00   6:20   6:40   7:00
#   注：UTC 4:00-4:59 是午休（11:30-12:30 CST 跳过，A股午休无数据；13:00 CST = UTC 5:00）
#
# 🔴 反踩踏铁律：
#   - 本 workflow **不直接跑抓取**，只 dispatch + 检查 + 兜底 dispatch，零产物输出。
#   - 不写 raw_data/、不写 data/、不 git push → 不会有 api_push_raw 互踢。
#   - 三层 dispatch 全走同 group v8-cn-fetch-cloud 互斥排队。

name: "🇨🇳 v8 盘中准点档调度器(小九 self-hosted cn 主力)"

on:
  schedule:
    # 🔧 2026-09-09 主人令「盘中 14 档准点档」：
    #   每档 UTC 触发后 → dispatch 云端 → sleep 10min → 查状态 → 失败时 dispatch 小九 cn 兜底
    #   共 14 档，跳午休（UTC 4:00-4:59）
    - cron: '40 1 * * 1-5'    # 09:40 CST
    - cron: '0 2 * * 1-5'     # 10:00 CST
    - cron: '20 2 * * 1-5'    # 10:20 CST
    - cron: '40 2 * * 1-5'    # 10:40 CST
    - cron: '0 3 * * 1-5'     # 11:00 CST
    - cron: '20 3 * * 1-5'    # 11:20 CST
    - cron: '40 3 * * 1-5'    # 11:40 CST
    # 🛡 午休 11:30-13:00 CST（UTC 3:30-4:59）跳过，A股午休无新数据
    - cron: '0 5 * * 1-5'     # 13:00 CST
    - cron: '20 5 * * 1-5'    # 13:20 CST
    - cron: '40 5 * * 1-5'    # 13:40 CST
    - cron: '0 6 * * 1-5'     # 14:00 CST
    - cron: '20 6 * * 1-5'    # 14:20 CST
    - cron: '40 6 * * 1-5'    # 14:40 CST
    - cron: '0 7 * * 1-5'     # 15:00 CST
  workflow_dispatch:

permissions:
  # 🔴 2026-09-10 修正：原写 `actions: read` → 用 GITHUB_TOKEN dispatch 其他 workflow 会 403
  #    （对照 v8_cn_fetch_watchdog.yml / v8_slot_scheduler.yml / v8_freshness_watch.yml
  #      / v8_algo_cloud.yml 全为 actions: write，本 yml 原是唯一异类）
  #    dispatch 需要 actions: write；本 yml 不写盘、不 push，故 contents 保持 read。
  contents: read
  actions: write

# 🔴 2026-09-10 实测修正（Bug ④ 架构死锁）：本 yml **移出** v8-cn-fetch-cloud 组。
#   原因：本 job 占组长达 20 分钟（dispatch + sleep 10min + 检查 + 兜底），
#   而它 dispatch 出去的 v8_cn_fetch_cloud / _selfhosted 又同属该组 → 被调度者
#   必须排队等本 job 让出组 → 本 job 10 分钟后检查时对方还在 queued → 误判失败
#   → 触发兜底 → 兜底同样排队 → 死锁。
#   实测证据：run 34430728891 跑到 sleep 结束时被外力 cancelled（02:46→02:56），
#   check/兜底两步全部 skipped，一档 20 分钟白跑。
#
#   本 yml 零产物（不写 raw_data/、不写 data/、不 git push），与被调度者没有资源竞争，
#   互斥毫无必要。改独立组 v8-cn-fetch-slot：
#     - cancel-in-progress: true → 上一档若卡住，新档接管，避免 14 档逐档堆积。
concurrency:
  group: v8-cn-fetch-slot
  cancel-in-progress: true

jobs:
  intraday_slot:
    runs-on: [self-hosted, cn]
    # 🛡 2026-09-09 一档最多 20 分钟：dispatch + sleep 10min + 查状态 + 兜底 dispatch
    #   （兜底 job 自己 75min timeout），本 yml 只跑前 20 分钟的"调度+检查"段
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "🚀 dispatch 云端主力 v8_cn_fetch_cloud（category=intraday）"
        id: dispatch_cloud
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO="https://api.github.com/repos/ah-quant999/quant-scanner-v8"
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_cloud.json -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$REPO/actions/workflows/v8_cn_fetch_cloud.yml/dispatches" \
            -d '{"ref":"main","inputs":{"category":"intraday"}}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ 云端 dispatch OK (204)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 云端 dispatch 失败 HTTP=$HTTP_CODE body=$(cat /tmp/dispatch_cloud.json)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "⏳ 实时轮询云端 run 状态（最多 12 分钟，每 30s 探测）"
        if: steps.dispatch_cloud.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          echo "档期起点: $(TZ=Asia/Shanghai date '+%F %T') CST, 开始实时轮询云端 run..."
          REPO="ah-quant999/quant-scanner-v8"
          DONE=0
          for i in $(seq 1 24); do
            sleep 30
            STATUS=$(curl -sS -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/v8_cn_fetch_cloud.yml/runs?per_page=3" \
              | python -c "
            import sys, json, datetime
            try:
                d = json.load(sys.stdin)
            except Exception:
                print('PARSE_FAIL')
                sys.exit(0)
            now = datetime.datetime.now(datetime.timezone.utc)
            for r in d.get('workflow_runs', []):
                c = r.get('created_at', '')
                if not c:
                    continue
                try:
                    ts = datetime.datetime.fromisoformat(c.replace('Z', '+00:00'))
                except Exception:
                    continue
                if (now - ts).total_seconds() / 60 < 30:
                    print(r.get('status'), r.get('conclusion'))
                    break
            else:
                print('NONE')
            " 2>/dev/null)
            echo "  轮询#$i: [$STATUS] @ $(TZ=Asia/Shanghai date '+%H:%M:%S')"
            if [ "$STATUS" = "completed success" ]; then
              echo "✅ 云端本档已完成 @ $(TZ=Asia/Shanghai date '+%F %T') CST"; DONE=1; break
            fi
          done
          if [ "$DONE" = "0" ]; then
            echo "⚠️ 轮询 12 分钟云端仍未成功 → 交由后续兜底步处理"
          fi
          echo "档期检查点: $(TZ=Asia/Shanghai date '+%F %T') CST"

      - name: "🔍 gh api 查云端 run 状态"
        id: check_cloud
        if: steps.dispatch_cloud.outputs.ok == 'true'
        # 🔴 2026-09-10 修正（Bug ⑤）：探测脚本自身报错时原会 step failure，
        #    而 need_fallback 从未赋值 → 兜底落空（实测 run 34433613329：
        #    check failure → 兜底 skipped，整档白跑）。
        #    探测只是"看看云端跑完没"，失败绝不该阻断；兜底条件已覆盖 outcome != success。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 🔴 2026-09-10：GitHub Actions 的 bash 默认带 -e，探测链任意一环非零即中断整步
          #    → need_fallback 永远写不进 OUTPUT → 兜底落空。探测全程关 errexit，
          #    任何异常都转为"判定为需要兜底"，由兜底条件统一接住。
          set +e
          REPO="ah-quant999/quant-scanner-v8"
          RESP=$(curl -sS -o /tmp/check.json -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/v8_cn_fetch_cloud.yml/runs?per_page=5")
          if [ "$RESP" != "200" ]; then
            echo "⚠️ API 查询失败 HTTP=$RESP, 默认按云端失败处理（兜底）"
            echo "status=unknown" >> "$GITHUB_OUTPUT"
            echo "conclusion=unknown" >> "$GITHUB_OUTPUT"
            echo "need_fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 解析最近 30 分钟内 v8_cn_fetch_cloud 的 run
          # 🔴 2026-09-10 修正：原硬编码 python3。小九 cn runner 是 Windows + Git Bash，
          #    实测同机其他 yml（v8_cn_fetch_cloud_selfhosted.yml / v8_lhb_fetch.yml
          #    / v8_stock_quote_refresh.yml）一律用 `python`。统一用自动探测。
          PY_CMD=$(command -v python3 2>/dev/null || command -v python 2>/dev/null || echo python)
          echo "使用解释器: $PY_CMD"
          $PY_CMD --version 2>&1 | head -1
          STATUS=$($PY_CMD -c "
          import json, datetime
          try:
              with open('/tmp/check.json') as f: data = json.load(f)
          except Exception as e:
              print(f'PARSE_FAIL|{e}')
              raise SystemExit(0)
          now = datetime.datetime.now(datetime.timezone.utc)
          for r in data.get('workflow_runs', []):
              created = r.get('created_at', '')
              if not created: continue
              try:
                  ts = datetime.datetime.fromisoformat(created.replace('Z','+00:00'))
              except Exception: continue
              age_min = (now - ts).total_seconds() / 60
              if age_min < 30:
                  print(f\"{r.get('status')}|{r.get('conclusion')}\")
                  break
          else:
              print('NONE_FOUND|')
          " 2>/tmp/py_err.txt || echo "PY_FAIL|$(head -c 80 /tmp/py_err.txt 2>/dev/null)")
          IFS='|' read -r s c <<<"$STATUS"
          echo "云端最近 run: status=[$s] conclusion=[$c]"
          echo "status=$s" >> "$GITHUB_OUTPUT"
          echo "conclusion=$c" >> "$GITHUB_OUTPUT"
          if [ "$s" = "completed" ] && [ "$c" = "success" ]; then
            echo "✅ 云端本档成功"
            echo "need_fallback=false" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 云端本档失败/超时/无 run → 触发小九 cn IP 兜底"
            echo "need_fallback=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "🛡️ 小九 cn IP 兜底（云端 dispatch 失败 或 云端跑失败 时均触发）"
        id: fallback_cn
        # 🔴 2026-09-10 二修（Bug ② + ⑤ 完备条件）：
        #    ② 原只写 need_fallback == 'true' → 云端 dispatch 失败时该变量从未赋值 → 兜底永不触发。
        #    ⑤ check 探测自身 failure 时同样从未赋值 → 兜底再次落空。
        #    现以 outcome 为准做完备覆盖：只要「dispatch 没成功」或「没探测成功」或「探测说要兜底」，
        #    一律兜底。宁可多跑一次 cn 兜底，也不能因为探测链路问题丢掉整档数据。
        if: steps.dispatch_cloud.outputs.ok != 'true' || steps.check_cloud.outcome != 'success' || steps.check_cloud.outputs.need_fallback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO="https://api.github.com/repos/ah-quant999/quant-scanner-v8"
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_cn.json -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$REPO/actions/workflows/v8_cn_fetch_cloud_selfhosted.yml/dispatches" \
            -d '{"ref":"main","inputs":{"category":"intraday"}}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ cn 兜底 dispatch OK (204) → 小九本机 cn IP 直连中国源"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ cn 兜底 dispatch 失败 HTTP=$HTTP_CODE body=$(cat /tmp/dispatch_cn.json)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "📝 档期状态汇总"
        if: always()
        shell: bash
        run: |
          {
            echo "## 盘中准点档·本档总结"
            echo "- 档期: \`$(TZ=Asia/Shanghai date '+%F %T')\` CST"
            echo "- 云端 dispatch: \`${{ steps.dispatch_cloud.outcome }}\`"
            echo "- 云端 run 状态: \`${{ steps.check_cloud.outputs.status }}/${{ steps.check_cloud.outputs.conclusion }}\`"
            echo "- 兜底触发: \`${{ steps.check_cloud.outputs.need_fallback }}\`"
            echo "- cn 兜底 dispatch: \`${{ steps.fallback_cn.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔴 2026-09-09 主人令「软失败但强制 ::error:: 告警」（对齐 09-08 消费层软失败策略）：
      #   本 yml 不写盘、只 dispatch，失败也不阻断——但必须显式 annotation 让主人一眼可见
      - name: "📢 软失败汇总告警（不阻断 job，但强制 annotation）"
        if: always()
        shell: bash
        env:
          V8_CLOUD_DISPATCH: ${{ steps.dispatch_cloud.outcome }}
          V8_CLOUD_CHECK: ${{ steps.check_cloud.outcome }}
          V8_CN_FALLBACK: ${{ steps.fallback_cn.outcome }}
        run: |
          FAILED=""
          for sid in dispatch_cloud check_cloud fallback_cn; do
            eval "v=\"\${V8_${sid^^}:-}\""
            if [ "$v" = "failure" ] || [ "$v" = "cancelled" ]; then
              FAILED="$FAILED $sid"
            fi
          done
          if [ -n "$FAILED" ]; then
            N=$(echo $FAILED | wc -w)
            echo "::error title=v8-intraday-slot-softfail::盘中准点档调度器软失败步（不阻断 job，但本档数据可能未刷新，请检查）：$FAILED"
            {
              echo "## ⚠️ 本档软失败 ${N} 项"
              echo ""
              echo "盘中准点档调度器失败步："
              echo ""
              for s in $FAILED; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 本档无软失败"
          fi
