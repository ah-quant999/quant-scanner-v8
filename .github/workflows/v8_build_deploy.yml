# 九宝量化 v8.0 — 构建 + 部署（GitHub 云端 ubuntu-latest）
#
# 2026-08-01 周末改造：
#   1) push 事件（cn runner 推 raw_data 或 v6 算法端推 post_close raw_data）
#      改用 --detect-changes：只构建发生变化的那几个 data/*.js，不全站重部署。
#   2) 保留 17:00 CST 盘后算法换算调度：对 post_close 类别做一次 selective build，
#      确保 v6 算法端在非 push 场景下也能被构建到。
#   3) concurrency 保持 serial，防止并发 push 冲突。
#
# 触发策略（按主人要求）：
#   - push raw_data/**  → 检测变化 → 只构建受影响类别
#   - schedule 17:00    → 构建 post_close 类别（算法换算后部署）
#   - workflow_dispatch → 全量构建

name: "☁️ v8 构建部署(云端ubuntu)"

on:
  push:
    branches: [main]
    paths: ['raw_data/**']
  schedule:
    - cron: '0 9 * * 1-5'    # 17:00 CST 盘后算法换算部署
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 需要 HEAD~1 做 detect_changes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🏗️ 构建 data/*.js（selective）"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "调度触发：构建 post_close 类别"
            python update_v8.py --category post_close
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发：全量构建"
            python update_v8.py
          else
            echo "raw_data push 触发：检测变化并 selective build"
            python update_v8.py --detect-changes
          fi

      - name: "📤 部署到 main（GitHub Pages 源）"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "v8-cloud-bot"
          git config user.email "v8-bot@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "ℹ️ 无数据变化，跳过部署"
            exit 0
          fi
          git commit -m "v8 build: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          REPO="https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git"
          for i in 1 2 3; do
            if git push "$REPO" HEAD:main; then
              echo "✅ 已部署 main（第 $i 次尝试，GitHub Pages 自动重建）"; exit 0
            fi
            echo "⚠️ push 被拒，rebase 后重试 ($i/3)"
            git fetch "$REPO" main && git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "❌ 3 次重试后仍失败"; exit 1
