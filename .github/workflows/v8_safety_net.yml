# 九宝量化 v8.0 — Safety Net 兜底监控（GitHub 云端 ubuntu-latest）
#
# P0 保险机制：cn runner（小九单位机）工作日全天在线概率极高，
# 但万一断线/卡死/网络抖动导致 raw_data 超过 2 小时未更新，
# 本工作流自动 dispatch 触发 v8_cn_fetch 补跑，无需人工介入。
#
# 设计原则：
#   - 纯云端执行（ubuntu），不依赖 cn runner 在线
#   - 只检查 + dispatch，不自己抓数据（数据必须 CN IP）
#   - 每 30 分钟检查一次，超 2h 未更新才触发（避免误触发）
#   - 工作日 09:00~19:00 活跃（覆盖盘前到收盘后算法链完成）
#
# ⚠️ 这是"保险"不是"刚需"——正常情况下永远不会触发。

name: "🛡️ v8 Safety Net 兜底监控(云端ubuntu)"

on:
  schedule:
    # 工作日北京时间 09:00~19:00，每30分钟一次（UTC = CST-8）
    - cron: '1 1 * * 1-5'    # 09:01 CST
    - cron: '31 1 * * 1-5'   # 09:31 CST
    - cron: '1 2 * * 1-5'    # 10:01 CST
    - cron: '31 2 * * 1-5'   # 10:31 CST
    - cron: '1 3 * * 1-5'    # 11:01 CST
    - cron: '31 3 * * 1-5'   # 11:31 CST
    - cron: '1 4 * * 1-5'    # 12:01 CST
    - cron: '31 4 * * 1-5'   # 12:31 CST
    - cron: '1 5 * * 1-5'    # 13:01 CST
    - cron: '31 5 * * 1-5'   # 13:31 CST
    - cron: '1 6 * * 1-5'    # 14:01 CST
    - cron: '31 6 * * 1-5'   # 14:31 CST
    - cron: '1 7 * * 1-5'    # 15:01 CST
    - cron: '31 7 * * 1-5'   # 15:31 CST
    - cron: '1 8 * * 1-5'    # 16:01 CST
    - cron: '31 8 * * 1-5'   # 16:31 CST
    - cron: '1 9 * * 1-5'    # 17:01 CST
    - cron: '31 9 * * 1-5'   # 17:31 CST
    - cron: '1 10 * * 1-5'   # 18:01 CST
    - cron: '31 10 * * 1-5'  # 18:31 CST
    - cron: '1 11 * * 1-5'   # 19:01 CST（最后一检，19:00后不再查）
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  safety-net:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🕐 检查 raw_data/ 最后更新时间"
        id: check
        run: |
          echo "=== Safety Net 检查 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') ==="

          # 找 raw_data/ 下最新文件的最后修改时间（git log）
          LATEST=$(git log -1 --format="%ai" -- raw_data/ 2>/dev/null || echo "never")
          echo "raw_data 最后 commit: $LATEST"

          if [ "$LATEST" = "never" ]; then
            echo "⚠️ raw_data/ 无任何 commit 历史"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "last_update=never" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 计算距今秒数
          NOW=$(date +%s)
          LAST=$(date -d "$LATEST" +%s 2>/dev/null || echo "$NOW")
          AGE=$(( NOW - LAST ))
          echo "距今 ${AGE} 秒（约 $(( AGE / 60 )) 分钟）"

          THRESHOLD=$(( 2 * 60 * 60 ))  # 2 小时 = 7200 秒
          if [ "$AGE" -gt "$THRESHOLD" ]; then
            echo "🔴 超过 2 小时未更新！触发补跑"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "age_minutes=$(( AGE / 60 ))" >> "$GITHUB_OUTPUT"
          else
            echo "✅ 数据新鲜（< 2h）"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "🚨 dispatch v8_cn_fetch 补跑"
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AGE="${{ steps.check.outputs.age_minutes }}"
          echo "🔴 Safety Net 触发：raw_data 已 ${AGE} 分钟未更新，dispatch v8_cn_fetch"

          gh workflow run "🇨🇳 v8 中国数据抓取(cn)" \
            -R ah-quant999/quant-scanner-v8 \
            -f category=all \
            -f label="Safety Net 自动补跑（${AGE}min stale）"

          echo "✅ 已 dispatch v8_cn_fetch（全量兜底模式）"
