            exit 1
          fi
      # 🔴 2026-09-08 主人令「软失败但强制 ::error:: 告警」：
      #   上面各消费步保留 continue-on-error（不阻断 job，尊重 2026-08-18 软失败策略），
      #   但每步失败已单独打 ::error:: annotation；这里再做一次集中汇总，
      #   让巡检一眼看到本轮有哪些软失败——而不是翻遍日志才发现问题。
      - name: "📢 软失败汇总告警（不阻断 job，但强制 annotation）"
        if: always()
        shell: bash
        env:
          V8_SF_soft_1: ${{ steps.soft_1.outcome }}
          V8_SF_soft_3: ${{ steps.soft_3.outcome }}
          V8_SF_soft_4: ${{ steps.soft_4.outcome }}
          V8_SF_soft_5: ${{ steps.soft_5.outcome }}
          V8_SF_soft_6: ${{ steps.soft_6.outcome }}
          V8_SF_soft_7: ${{ steps.soft_7.outcome }}
          V8_SF_soft_8: ${{ steps.soft_8.outcome }}
          V8_SF_soft_9: ${{ steps.soft_9.outcome }}
          V8_SF_soft_10: ${{ steps.soft_10.outcome }}
          V8_SF_soft_11: ${{ steps.soft_11.outcome }}
          V8_SF_soft_12: ${{ steps.soft_12.outcome }}
          V8_SF_soft_13: ${{ steps.soft_13.outcome }}
          V8_SF_soft_14: ${{ steps.soft_14.outcome }}
          V8_SF_soft_15: ${{ steps.soft_15.outcome }}
          V8_SF_soft_16: ${{ steps.soft_16.outcome }}
        run: |
          FAILED=""
          # 显式列出本 job 全部软失败步 id（生成期确定，不依赖 env 扫描，永不漏）
          for sid in soft_1 soft_3 soft_4 soft_5 soft_6 soft_7 soft_8 soft_9 soft_10 soft_11 soft_12 soft_13 soft_14 soft_15 soft_16; do
            eval "v=\"\${V8_SF_$sid:-}\""
            if [ "$v" = "failure" ] || [ "$v" = "cancelled" ]; then
              FAILED="$FAILED $sid"
            fi
          done
          if [ -n "$FAILED" ]; then
            N=$(echo $FAILED | wc -w)
            echo "::error title=v8-softfail-summary::软失败步（不阻断 job，但对应数据可能未刷新）：$FAILED"
            {
              echo "## ⚠️ 本轮软失败 ${N} 项（job 未阻断）"
              echo ""
              echo "以下消费步失败但按软失败策略未阻断 job，对应数据**可能未刷新**，请核对健康面板："
              echo ""
              for s in $FAILED; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 本轮无软失败（所有消费步 outcome 非 failure）"
          fi

      # 🔴 2026-09-10 一劳永逸根治「假成功」（主人令）：
      #   病灶：本 job 有 16 个消费步 `continue-on-error: true`（2026-08-18 软失败策略），
      #     失败只打 ::error:: annotation，**job 结论仍为 success** → run 全绿。
      #     于是任何监控（看门狗/巡检/人眼）看到 success 就认定"数据已刷新"，不再兜底
      #     → 数据持续陈旧而无人补（09-10 盘中 26~102 分钟空窗的成因之一）。
      #   本步不看"步骤有没有报错"，只看「结果事实」：远端 main 上本轮该刷新的代表文件，
      #     其 update_time 是否真的推进到了本轮开始之后。
      #   分级（与看门狗分工，不重复）：
      #     - 本轮【0 个代表文件推进】= 整轮空转的假成功 → ::error + exit 1，让 run 如实变红；
      #     - 部分推进 = 局部软失败 → 已由上方 softfail-summary 覆盖，本步不重复报红。
      #   读远端走 Contents API（Accept: raw 直取 git blob），**不走 Pages CDN** —— CDN 有缓存会误判。
      - name: "🔍 数据落地实证终检（杜绝『run 全绿但数据没动』的假成功）"
        id: landcheck
        if: always() && steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V8_CAT: ${{ steps.cat.outputs.category }}
          V8_RUN_START: ${{ github.run_started_at }}
        run: |
          python3 - <<'PY'
          import os, re, sys, datetime, urllib.request

          tok = os.environ.get("GITHUB_TOKEN", "")
          cat = (os.environ.get("V8_CAT", "") or "").strip()
          started = (os.environ.get("V8_RUN_START", "") or "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "ah-quant999/quant-scanner-v8")

          # 与 v8_cn_fetch_watchdog.yml 的 PROBE 同源同口径（单一事实来源，不另立一套）
          PROBE = {
              "intraday":   ["LIMIT_UP_HEATMAP.js", "CONCEPT_RANKING.js", "CAPITAL_FLOW_DATA.js",
                             "SECTOR_FUND_FLOW.js", "INDEX_QUOTES.js", "CANDIDATE_QUOTES.js"],
              "premarket":  ["JUDGMENT_DATA.js", "CRISIS_DATA.js", "LIMIT_UP_HEATMAP.js"],
              "post_close": ["LHB_DATA.js", "CANDIDATE_QUOTES.js", "CAPITAL_FLOW_DATA.js"],
          }
          files = PROBE.get(cat)
          if not files:
              print(f"[landcheck] category={cat or '(空)'} 不在校验清单（如 all / 周度），本步跳过")
              sys.exit(0)

          try:
              base = datetime.datetime.strptime(started[:19], "%Y-%m-%dT%H:%M:%S")
          except Exception:
              print(f"[landcheck] 无法解析 run_started_at={started!r}，保守跳过（宁可不报，不误报）")
              sys.exit(0)
          # 容差 3 分钟：run_started_at 与脚本内取「当前时间」存在排队/启动差
          base = base - datetime.timedelta(minutes=3)
          print(f"[landcheck] 本轮基准时间 {base}（run_started_at {started} - 3min 容差）")

          PAT = re.compile(r'"?update_time"?\s*[:=]\s*"([^"]+)"')
          advanced, stale, unknown = [], [], []

          for fn in files:
              url = f"https://api.github.com/repos/{repo}/contents/data/{fn}?ref=main"
              try:
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {tok}",
                      "Accept": "application/vnd.github.raw",
                      "User-Agent": "v8-landcheck",
                      "X-GitHub-Api-Version": "2022-11-28"})
                  txt = urllib.request.urlopen(req, timeout=25).read().decode("utf-8", "replace")
              except Exception as e:
                  print(f"[landcheck]   ! {fn}: 远端读取失败 {e}")
                  unknown.append(fn)
                  continue
              m = PAT.search(txt)
              if not m:
                  print(f"[landcheck]   ? {fn}: 无 update_time 字段")
                  unknown.append(fn)
                  continue
              raw = m.group(1).strip().replace("T", " ")
              dt = None
              for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M:%S"):
                  try:
                      dt = datetime.datetime.strptime(raw[:19] if len(raw) >= 19 else raw, fmt)
                      break
                  except Exception:
                      continue
              if dt is None:
                  print(f"[landcheck]   ? {fn}: update_time 无法解析 ({raw!r})")
                  unknown.append(fn)
                  continue
              if dt >= base:
                  print(f"[landcheck]   OK  {fn}: {dt} 已推进")
                  advanced.append(fn)
              else:
                  print(f"[landcheck]   XX  {fn}: {dt} 未推进")
                  stale.append(fn)

          verdict = "skip"
          if advanced:
              verdict = "ok"
              if stale:
                  print(f"[landcheck] 部分未推进 {stale}（已由软失败汇总覆盖，本步不重复报红）")
          elif stale:
              verdict = "empty_round"
          else:
              print("[landcheck] 全部文件无法读取/解析，证据不足 → 不误报红")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a") as f:
                  f.write(f"verdict={verdict}\n")
                  f.write(f"advanced={len(advanced)}\n")
                  f.write(f"stale={len(stale)}\n")

          if verdict == "empty_round":
              msg = (f"本轮 category={cat} 应刷新 {len(files)} 个代表文件，"
                     f"实际【0 个】推进 → 整轮空转（假成功）")
              print("::error title=v8-fake-success::" + msg +
                    "。远端 main 数据未更新，本轮此前的 success 不可信，请查本轮软失败 annotation。")
              gh_sum = os.environ.get("GITHUB_STEP_SUMMARY")
              if gh_sum:
                  with open(gh_sum, "a") as f:
                      f.write(f"## ❌ 假成功：{msg}\n\n未推进文件："
                              + ", ".join(f"`{x}`" for x in stale) + "\n")
              sys.exit(1)
          PY

      # 🔁 2026-09-11 小九的工程师·一劳永逸（治「盘中 14 档双源皆哑」）：
      #   病灶：盘中 20 分钟档此前**只有定时器**——`v8_cn_fetch_intraday_lemoncat.yml` 的
      #     14 档 GitHub schedule。实证 2026-09-11：该 workflow **全天 0 次运行**
      #     （GitHub schedule 静默失约，平台级问题、无法在本仓根治），WorkBuddy 侧对应
      #     调度器同时处于 PAUSED → 10:40 / 11:00 / 11:20 / 11:30 **四个档位全部零派发**，
      #     数据两次靠人工兜底（10:48、11:36）才没断档。
      #   修法：**不再依赖任何定时器**——本轮 intraday 成功落地后，由本步自行派发下一轮。
      #     间隔 = 本轮耗时（实测 9~18 分钟），天然落在「20 分钟档」区间；
      #     只要链上有一环活着，链条就自己维持到收盘；窗口外自动停止。
      #   闸门：① 仅盘中窗口（09:38-11:32 / 12:58-15:05 CST）；② 距本轮开跑 <15 分钟则等待，
      #         保持 20 分钟档节奏、不与外部派发叠加成风暴；③ 幂等闸门已生效时不接力。
      #   兜底：链条若被异常掐断（run 被 timeout 杀死致本步未执行），由 v8_cn_fetch_watchdog
      #         的「数据极陈旧(>45min)」分支恢复，形成「链式维持 + 状态兜底」双保险。
      - name: "🔁 盘中自接力（不依赖定时器·链式维持到收盘）"
        id: relay
        if: always() && steps.gate.outputs.skip != 'true' && steps.cat.outputs.category == 'intraday'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V8_RUN_START: ${{ github.run_started_at }}
          V8_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, sys, time, datetime, urllib.request

          tok  = os.environ.get("GITHUB_TOKEN", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "ah-quant999/quant-scanner-v8")
          me   = str(os.environ.get("V8_RUN_ID", ""))
          rstart = (os.environ.get("V8_RUN_START", "") or "").strip()

          CST = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(CST)
          hm  = now.hour * 60 + now.minute

          # 盘中窗口：上午 09:38-11:32 / 下午 12:58-15:05（收盘跑完最后一档即自然终止）
          in_win = (9 * 60 + 38 <= hm <= 11 * 60 + 32) or (12 * 60 + 58 <= hm <= 15 * 60 + 5)
          print(f"[relay] CST={now:%H:%M:%S} hm={hm} in_window={in_win}")
          if not in_win:
              print("[relay] 非盘中窗口（午休 / 已收盘）→ 链条在此自然终止，交由盘前/盘后档与看门狗")
              sys.exit(0)

          H = {"Authorization": "Bearer " + tok,
               "Accept": "application/vnd.github+json",
               "User-Agent": "v8-relay",
               "X-GitHub-Api-Version": "2022-11-28"}

          def api(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=H, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          # 节奏闸门：距本轮开跑不足 15 分钟则等到 15 分钟，避免与外部派发叠加
          gap = 999.0
          if rstart:
              try:
                  t0 = datetime.datetime.fromisoformat(rstart.replace("Z", "+00:00")).astimezone(CST)
                  gap = (now - t0).total_seconds() / 60
              except Exception as e:
                  print(f"[relay] 解析 run_started_at 失败: {e}")
          print(f"[relay] 本轮已跑 {gap:.1f} 分钟（口径：距本轮开跑）")
          if gap < 15:
              wait = 15 - gap
              print(f"[relay] 间隔不足 15 分钟 → 等待 {wait:.0f} 分钟后派发（保持 20 分钟档节奏，上限 8 分钟）")
              time.sleep(min(wait * 60, 480))

          # ① 派发下一轮 intraday（自接力主环）
          try:
              api("POST",
                  f"https://api.github.com/repos/{repo}/actions/workflows/v8_cn_fetch_cloud.yml/dispatches",
                  {"ref": "main", "inputs": {"category": "intraday"}})
              print("[relay] ✅ 已派发下一轮 intraday（自接力）")
          except Exception as e:
              print(f"[relay] ❌ 派发失败: {e} —— 链条断于此，由 v8_cn_fetch_watchdog(>45min) 恢复")
              sys.exit(0)

          # ② 同频派发 STOCK_QUOTE 刷新
          #    原设计依赖「哨兵 e7b2e732 + 4 个时间点兜底」，五个 automation 全 PAUSED
          #    → 实证 09-11 全天 STOCK_QUOTE 停在昨日 15:03，靠人工兜底才刷新一次。
          #    现挂到本链上，与抓取同频（约 15-18 分钟一次），不再依赖任何本机定时器。
          try:
              api("POST",
                  f"https://api.github.com/repos/{repo}/actions/workflows/v8_stock_quote_refresh_cloud.yml/dispatches",
                  {"ref": "main"})
              print("[relay] ✅ 已派发 STOCK_QUOTE refresh（与抓取同频）")
          except Exception as e:
              print(f"[relay] ⚠️ STOCK_QUOTE 派发失败: {e}（不阻断接力主环）")
          PY
