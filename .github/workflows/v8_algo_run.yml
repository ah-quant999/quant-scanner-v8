# 九宝量化 v8.0 — 盘后算法链（自托管 cn runner）
#
# 2026-08-01 周末改造：把 v6 的算法产出脚本选择性复制到 v8/algorithms/，
# 由本工作流在本地 cn 自托管 runner 上按依赖顺序运行，直接产出 v8 raw_data/，
# 不再依赖 v6 每日批处理。GitHub 美区云端 runner 无法访问 EastMoney/akshare/
# Tongdaxin，故算法必须在 cn runner（本地机器）执行。
#
# 2026-08-03 修复：该 workflow 自 07-31 创建、08-01/08-02 多次提交后，GitHub 调度器从未派发其
#   schedule（API 实测 total runs = 0，而同仓库同 cn runner 的 v8_cn_fetch 正常 30 次）。
#   根因 = schedule 未被调度器注册/触发（非 runner 问题）。修复 = re-touch 文件 + 加 20:00 冗余 cron。
#   若日后再次发现盘后页陈旧，先查本 workflow 的 schedule 是否又失效，手动 workflow_dispatch 即可补算。
#
# 2026-08-03 21:23 实测：schedule 修复后本 workflow 终于被调度触发，但首步 actions/checkout 在
#   自托管 cn runner（Windows 持久化工作目录）上因脏树/dubious ownership 直接失败（0 算法执行）。
#   加固：checkout 前加「git reset --hard + git clean -fdx（保留 out 产物）+ safe.directory '*」清理步，
#   checkout 本身加 clean:true。若仍失败，查 Actions 日志确认具体 checkout 报错。
#
# 2026-08-03 22:50 再修复：actions/checkout@v4 在 Windows 自托管 runner 上使用 Node24 的 safe-delete 库，
#   当 .git 目录文件数超过 50 阈值时要求 BULK_CONFIRM，但 Action 无法交互确认，直接抛错：
#   [safe-delete][SAFE_DELETE_BULK_CONFIRM_REQUIRED] {"count":217,"threshold":50,...}
#   根因不是 git 命令，而是 checkout action 自己删不掉旧 .git。修复 = 前置清理步直接删除整个 workspace，
#   让 checkout 重新 clone 到空目录。经实测 run#30820713215 因此失败。
#

# 2026-08-02 原生化：4 类上游输入（gold_pool / scan_result / guanlan_* / mahoro_signals）
# 也已由 v8 自产（scanner.py / guanlan_extractor.py / fetch_maharo_signals.py + V8_OUT_DIR 钩子
# → 写 v8 仓根 out/）。run_algorithms.py 的 step_v8_self_sufficiency() 负责调度这 3 脚本；
# 原 step_seed_inputs() 默认 no-op（V6_SEED=1 可强制回退 v6 重灌）。彻底脱离 v6。
#
# 4 类原 v6 → v8 映射:
#   v6 data/scan_result.json          → v8 out/scan_result.json          (scanner.py)
#   v6 data/guanlan_watchlist.json     → v8 out/guanlan_watchlist.json     (guanlan_extractor.py)
#   v6 data/guanlan_reports.json       → v8 out/guanlan_reports.json       (guanlan_extractor.py)
#   v6 data/mahoro_signals.json (拼写 mahoro) ← fetch_maharo_signals.py 写 (拼写 maharo, v8 钩子自动改写)
#
# 注意: v6 build_candidate_pool.py 读「mahoro_signals.json」, v6 fetch_maharo_signals.py 写「maharo_signals.json」,
# 两个文件在 v6 data/ 一直并存. v8 fetch_maharo_signals.py 在 v8 环境下 OUTPUT_JSON 改写为 mahoro_signals.json, 兼容下游.

name: "🇨🇳 v8 盘后算法链(cn)"

# ⏰ 时点铁律（2026-08-01 审计修正 + 2026-08-02 锁定）：
#   龙虎榜由交易所「17点后」才发布（fetch_lhb 在 17:00 整点跑会查到空、静默保留昨日数据），
#   v6 成熟系统据此把 close_p2（龙虎榜+scanner全量+各类生成）固定在 18:30。
#   原 v8 定在 17:00 是时序倒退 → 三重共识/机构游资共振/top10 龙虎榜维度全用隔夜数据。
#   现对齐 v6，改为 18:30（LHB 已出 + 留缓冲），单次跑全链即数据齐全。
#
# ⏰ 时序依赖（2026-08-02 固化，2026-08-02 升级）：
#   本 workflow (18:30) 是 v8 盘后数据的唯一权威生产者。自 2026-08-02 起，
#   NT_DATA / SUSPENSION_ALERT / MARKET_ALERTS / SECTOR_FUND_FLOW_TREND 这 4 个孤儿模块
#   也已由本链原生产出（fetch_orphan_*.py → raw_data/ → api_push），彻底脱离 v6。
#   原 v8_sync_legacy.yml（19:30 从 v6 补 4 孤儿）已退役为 no-op，不再参与时序。
#   详见 TIME_ORDER.md。
on:
  schedule:
    - cron: '30 10 * * 1-5'  # 18:30 CST 盘后（龙虎榜18点后已发布 + 收盘数据 + 算法部署）主
    - cron: '0 12 * * 1-5'   # 20:00 CST 盘后冗余备份（2026-08-03 阿狸咪修复：原单一 cron 自 07-31 创建以来 0 次被调度，加冗余防再失效；与 18:30 主跑错峰不并发）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  algo:
    runs-on: [self-hosted, cn]
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V8_PUSH: "1"
      V6_DATA_DIR: "E:\\workspace\\stock-scanner\\data"
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "🧹 自托管 runner 工作区清理（删除 workspace 绕过 checkout safe-delete 阈值）"
        shell: powershell
        continue-on-error: true
        run: |
          $ws = "${{ github.workspace }}"
          Write-Host "正在删除 workspace: $ws"
          Remove-Item -Path $ws -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $ws -Force | Out-Null
          Write-Host "workspace 已清空，等待 checkout 重新 clone"

      - name: "📥 Checkout v8"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: "🐍 校验 Python / 安装 A股依赖"
        shell: powershell
        run: |
          python --version
          python -c "import akshare, pandas, numpy, requests" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "基础依赖缺失，安装中（清华镜像）..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas numpy requests
          } else { Write-Host "基础依赖已就绪" }
          # 回测/候选池依赖（mootdx / baostock），缺失则尽力安装
          python -c "import mootdx" 2>$null; if ($LASTEXITCODE -ne 0) {
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple mootdx 2>$null; Write-Host "mootdx 安装结果: $LASTEXITCODE"
          }
          python -c "import baostock" 2>$null; if ($LASTEXITCODE -ne 0) {
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple baostock 2>$null; Write-Host "baostock 安装结果: $LASTEXITCODE"
          }

      - name: "🧮 运行盘后算法链 → raw_data/ → 推送"
        shell: powershell
        continue-on-error: true
        run: |
          python algorithms/run_algorithms.py

      - name: "📤 兜底推送（若上一步未推）"
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          python api_push_raw.py
