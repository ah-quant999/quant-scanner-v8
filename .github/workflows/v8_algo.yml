# 九宝量化 v8.0 — 每日数据体检（GitHub 云端 ubuntu-latest）
#
# ⚠️ 2026-07-31 审计改造：
#   本工作流原名「算法上云」，但实际只跑 `python update_v8.py`，
#   与 v8_build_deploy.yml 的构建步骤 100% 重复 —— 既没有跑任何算法，
#   也白白消耗 Actions 分钟数，且两者并发 push main 会互相 rebase 冲突。
#   （v8 仓内根本没有算法脚本：9 个 .py 全是抓取/构建/部署/工具。
#     三重共识、驾驶舱分级、回测等算法产出目前是 07-30 的冻结快照。）
#
#   现改造为「每日数据体检」：跑全量新鲜度守卫，把停更模块暴露出来，
#   结果写入 data/freshness_status.json 供运维面板读取。
#   构建部署仍由 v8_build_deploy.yml 单独负责，职责不再重叠。

name: "🩺 v8 每日数据体检(云端ubuntu)"

on:
  schedule:
    - cron: '0 9 * * *'    # 17:00 CST 每日（收盘后总检）
    - cron: '0 1 * * *'    # 09:00 CST 每日（盘前预检）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-health-check
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🩺 全量新鲜度体检（46 个模块）"
        id: guard
        continue-on-error: true
        run: |
          python guard_v8_freshness.py | tee guard_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: "📊 体检摘要写入 Job Summary"
        if: always()
        run: |
          echo "## v8 数据体检 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat guard_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "无输出" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "📤 提交体检报告"
        if: always()
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "v8-cloud-bot"
          git config user.email "v8-bot@users.noreply.github.com"
          git add -f data/freshness_status.json
          if git diff --cached --quiet; then
            echo "ℹ️ 体检结果无变化"
            exit 0
          fi
          git commit -m "v8 healthcheck: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          REPO="https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git"
          for i in 1 2 3; do
            if git push "$REPO" HEAD:main; then
              echo "✅ 体检报告已提交（第 $i 次）"; exit 0
            fi
            git fetch "$REPO" main && git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "❌ 3 次重试后仍失败"; exit 1

      - name: "🔴 核心数据过期则标红"
        if: steps.guard.outcome == 'failure'
        run: |
          echo "::error::核心数据过期，请检查 v8_cn_fetch 是否正常运行"
          exit 1
