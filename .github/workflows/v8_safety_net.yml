# 九宝量化 v8.0 — v8_cn_fetch 兜底调度（safety_net）
#
# 目标：当 GitHub schedule 偶发跳过、或 v8_cn_fetch 抓取失败导致数据中断时，
#       自动触发一次 workflow_dispatch 重试，无需人工干预。
#
# 防崩溃设计（回答“加来加去会不会崩”）：
#   1. 只查不抓：本工作流只做状态检查 + dispatch，不跑任何数据脚本。
#   2. 盘中限时：仅工作日 09:00–17:30 CST 运行，夜间/周末静默。
#   3. 成功即退：最近 1 小时已有 v8_cn_fetch 成功 run，直接跳过。
#   4. 防并发：当前已有 v8_cn_fetch 在运行（queued/in_progress/waiting），不重复触发。
#   5. 去重窗口：最近 20 分钟内已经启动过 v8_cn_fetch，不再 dispatch，避免连环重试雪崩。
#   6. 单并发：safety_net 自身 concurrency.group 串行，防止重叠检查导致重复 dispatch。
#
# 🔴 2026-08-06 04:50 修正（小九看门狗第三十五轮）——兜底目标切到云端主力：
#   背景：08-05 23:45 阿狸咪把中国数据抓取迁到 v8_cn_fetch_cloud.yml（ubuntu 云端），
#         并移除旧自建版 v8_cn_fetch.yml 的全部 cron（其注释明写「防止双跑：两路都会往
#         main 推 raw_data，同一产物并发会互相覆盖」），旧版降级为 dispatch 应急回退。
#   缺陷：本 safety_net 仍只检查/派发【旧版 v8_cn_fetch.yml】。旧版 cron 已删 ⇒ 永远不会
#         自动产生成功 run ⇒ 条件2「最近1小时有 success」恒为假 ⇒ 每轮都会 dispatch，
#         把已退役的自建 runner 每小时拉起来推 raw_data，与云端主力对撞（实测坐实：
#         08-05 19:03 safety_net run 与 v8_cn_fetch workflow_dispatch run 同分钟出现）。
#   修法：检查与派发目标统一改为 v8_cn_fetch_cloud.yml（用 TARGET_WF 单点常量，防再漂移）。
#         旧自建版保持 0 cron + 纯手动 dispatch 应急，不再被自动唤醒。

name: "🛡️ v8 cn_fetch safety_net"

on:
  schedule:
    # 北京时间工作日 09:00–17:30，每 30 分钟检查一次（UTC 01:00–09:30）。
    # 2026-08-06 收敛：原 22 条 cron 远超 GitHub Actions 单 workflow schedule 隐性上限，
    # 导致 schedule 触发异常；改为 1 条 */30 后稳定可预期。
    - cron: '*/30 1-9 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: v8-safety-net
  cancel-in-progress: false

jobs:
  check_and_dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 兜底目标：云端主力（2026-08-06 起）。旧自建版 v8_cn_fetch.yml 仅手动应急，勿在此引用。
      TARGET_WF: v8_cn_fetch_cloud.yml
    steps:
      - name: "🛡️ 检查是否需要兜底"
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          NOW=$(date -u +%s)
          ONE_HOUR_AGO=$((NOW - 3600))
          TWENTY_MIN_AGO=$((NOW - 1200))

          echo "当前 UTC 时间: $(date -u '+%Y-%m-%d %H:%M:%S')"

          # 1) 获取最近 20 条抓取运行记录（目标 = ${TARGET_WF}，云端主力）
          echo "兜底监控目标: ${TARGET_WF}"
          RUNS_JSON=$(curl -sL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${TARGET_WF}/runs?per_page=20")

          # 2) 最近 1 小时有 success？
          HAS_SUCCESS=$(echo "$RUNS_JSON" | jq -r --arg t "$ONE_HOUR_AGO" '
            [.workflow_runs[] | select(.conclusion == "success") |
              (.updated_at | fromdateiso8601 // 0)] | map(select(. > ($t | tonumber))) | length
          ')
          if [ "$HAS_SUCCESS" -gt 0 ]; then
            echo "result=skip" >> "$GITHUB_OUTPUT"
            echo "reason=最近1小时已有 v8_cn_fetch 成功运行" >> "$GITHUB_OUTPUT"
            echo "✅ 最近1小时已有 v8_cn_fetch 成功运行，无需兜底"
            exit 0
          fi

          # 3) 当前是否有运行中/排队中/等待中？
          HAS_ACTIVE=$(echo "$RUNS_JSON" | jq -r '
            [.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length
          ')
          if [ "$HAS_ACTIVE" -gt 0 ]; then
            echo "result=skip" >> "$GITHUB_OUTPUT"
            echo "reason=当前已有 v8_cn_fetch 运行中" >> "$GITHUB_OUTPUT"
            echo "⏳ 当前已有 v8_cn_fetch 运行中，不重复触发"
            exit 0
          fi

          # 4) 最近 20 分钟内已经启动过 v8_cn_fetch？（避免连环 dispatch 雪崩）
          HAS_RECENT=$(echo "$RUNS_JSON" | jq -r --arg t "$TWENTY_MIN_AGO" '
            [.workflow_runs[] |
              (.run_started_at | fromdateiso8601 // 0)] | map(select(. > ($t | tonumber))) | length
          ')
          if [ "$HAS_RECENT" -gt 0 ]; then
            echo "result=skip" >> "$GITHUB_OUTPUT"
            echo "reason=最近20分钟已有 v8_cn_fetch 启动过" >> "$GITHUB_OUTPUT"
            echo "🚦 最近20分钟已有 v8_cn_fetch 启动过，避免雪崩式重试"
            exit 0
          fi

          echo "result=dispatch" >> "$GITHUB_OUTPUT"
          echo "⚠️ 最近1小时无成功运行、无运行中、且20分钟内未启动过，准备兜底 dispatch"

      - name: "🚀 dispatch v8_cn_fetch_cloud"
        if: steps.decide.outputs.result == 'dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          RESP=$(curl -sL -w "\nHTTP_CODE:%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/${TARGET_WF}/dispatches" \
            -d '{"ref":"main"}')
          CODE=$(echo "$RESP" | grep -oP 'HTTP_CODE:\K\d+')
          BODY=$(echo "$RESP" | sed '/HTTP_CODE:/d')
          if [ "$CODE" = "204" ]; then
            echo "✅ 已成功 dispatch ${TARGET_WF}"
          else
            echo "❌ dispatch 失败，HTTP $CODE"
            echo "$BODY"
            exit 1
          fi
