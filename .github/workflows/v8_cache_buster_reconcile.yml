# 九宝量化 v8.0 — 缓存戳实时对齐（防覆盖铁律·根本修复）
#
# 2026-08-15 审计根因：多个独立 workflow（cn_fetch / 盘后算法链 / 风险温度计）会
# 在不同时刻重写 data/*.js，但只有 v8_build_deploy 在构建时才重算 index.html 的 ?v。
# 任意一者在 build_deploy 提交之后再次推送 data → index.html 的 ?v 立即失配 →
# CDN 持续吐旧副本（防覆盖铁律最忌）。单次 build_deploy 永远无法永久消除此漂移窗口。
#
# 本 workflow 是「缓存戳自愈器」：
#   1) 监听 data/** / raw_data/** 的每一次 push（即任何 data 变更的瞬间）→ 立即重算 ?v；
#   2) 每 15 分钟兜底巡检一次（防 schedule 偶发静默失效 + 兜底短时漂移）；
#   3) 重算时**优先用 GitHub Contents API 拉取线上真实服务版本**（raw.githubusercontent 实际
#      吐给浏览器/CDN 的内容）来算 ?v，而非依赖 actions/checkout 检出的文件——实测 checkout
#      对部分 data/*.js 会检出「旧 blob」，导致按磁盘算 ?v 误判「已一致」、缓存戳长期失配。
#      API 取到的内容即用户真实拿到的内容，?v 与之严格一致，CDN 不再吐旧副本。
#   4) 仅在 ?v 真变化时才 commit+push。
#
# 与 build_deploy 的关系：
#   - 本 workflow 推送 index.html 会触发 build_deploy（其 paths 含 index.html），
#     但 build_deploy 在「无数据变化」时 git diff --cached --quiet 直接跳过，不会形成死循环；
#   - 本 workflow 自身的 paths 不含 index.html，故它推送 index.html 不会再次触发自己。
#   - 两道机制互为冗余：即便 schedule 偶发失效，data push 也会立刻对齐；即便某次
#     build_deploy 因竞态漏算，本巡检 15 分钟内必纠。

name: "🛡️ v8 缓存戳实时对齐(防覆盖)"

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '!data/freshness_status.json'   # 🔴 2026-08-18 幽灵提交源排除：health_patrol 每分钟写它，
                                        #   每次触发本 workflow → 与 build 死循环（今日 42 次 cache-bot 提交实证）
      - 'raw_data/**'
  schedule:
    - cron: '*/15 * * * *'   # 每 15 分钟兜底巡检
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-cache-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🔄 重算 index.html 全部 ?v 对齐 CDN 真实内容（中性化 republish_time）"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 🔴 2026-08-18 根因修复：弃用 reconcile_cache_busters.py（git blobs API 取 origin/main
        #   快照算 ?v，cn 墙/竞态下拿旧 blob → 算旧 ?v → 与 build 互踩 → 死循环，今日 42+77 提交实证）。
        #   改 fix_cachebusters_cdn.py：直接下载 github.io 实际服务内容算 sha，
        #   ?v 严格等于 CDN 真实文件 sha（memory 铁律：CDN 权威）。
        run: python scripts/fix_cachebusters_cdn.py

      - name: "📤 推送（仅当 ?v 真变化）"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "v8-cache-bot"
          git config user.email "v8-bot@users.noreply.github.com"
          REPO="https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git"
          git add -f index.html
          if git diff --cached --quiet; then
            echo "ℹ️ ?v 已一致，无需推送"; exit 0
          fi
          git commit -m "chore: 缓存戳实时对齐 ?v → 防覆盖 ($(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))"
          for i in 1 2 3; do
            if git push "$REPO" HEAD:main; then
              echo "✅ 已对齐并推送 (第 $i 次)"; exit 0
            fi
            echo "⚠️ push 被拒，同步远端后重试 ($i/3)"
            git fetch "$REPO" main
            git reset --hard FETCH_HEAD
            python scripts/fix_cachebusters_cdn.py
            git add -f index.html
            if git diff --cached --quiet; then echo "ℹ️ 重试时已一致"; exit 0; fi
            git commit -m "chore: 缓存戳实时对齐 ?v → 防覆盖 (retry $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M'))"
          done
          echo "❌ 3 次重试仍失败"; exit 1
