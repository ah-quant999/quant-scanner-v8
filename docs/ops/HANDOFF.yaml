      另：`index.html` 改前/改后均 34/34 保护锚点齐备（不阻断 Pre-deploy audit）；
      `logic.html` 不在该锚点门禁范围内（pre_deploy_audit 仅扫 index.html），
      但其 4 页 `<script src>` 断链检查仍覆盖 logic.html，本批未增删任何 script 标签。
    verify_how: >
