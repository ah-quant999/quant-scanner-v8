name: "🛡️ 投资避雷针 consolidate (cloud)"
# 🔴 2026-11-04 一劳永逸根治：原 INVEST_AVOID 由 v8_morning_plan.yml 在 [self-hosted, cn] 跑，
#   该 cn 自托管机自 2026-11-02 起宕机 ⇒ 投资避雷针卡冻在 11-02 15:16。
#   gen_invest_avoid.py 纯读本地 data/*.js、不抓网、仅 stdlib，完全可在 GitHub 托管 ubuntu-latest 跑
#   （与 v8_algo_cloud 同款根治：把 cn 单点故障移出关键数据链）。
#   拆出独立云端工作流 ⇒ 与 cn 解耦，卡体每日可靠刷新。
#   上游 6 源（DAJIJIN/SUSPENSION/MARKET_REGIME/RISK_GAUGE/MACRO_BRIEF/MARKET_ALERTS）
#   仍由 cn_fetch 产出；若 cn 宕机导致某源滞后，本卡会如实标注各源 update_time（绝不伪造）。
on:
  schedule:
    # 🔴 2026-11-26 主人令「盘前/盘中不许跑·只留盘后」—— **07:55 盘前微调档已删除**。
    #   理由：① 本链是「6 源 consolidate」，六个源里收盘价/公告/停牌都是**盘后**才定型的，
    #          盘前跑只能拿到前一交易日的旧值，重算没有任何新信息；
    #        ② 该档实测常被 GitHub 调度漂移到盘中（曾漂到 13:41）；
    #        ③ 删掉后早上看到的就是前一晚 **15:35 盘后定稿**那一版 —— 这正是主人要的
    #          「盘前看昨晚的定稿」口径，而不是「盘前再算一遍同样的东西」。
    #   保留的触发：15:35 盘后定稿 + workflow_run 盘后窗 + 手动 dispatch。
    #   若将来确需盘前补跑 ⇒ 用 workflow_dispatch 手动，不要再挂 cron。
    #   历史留痕：原 07:55 档 cron 为 '55 23 * * *'（UTC），2026-11-26 删除。
    - cron: '35 7 * * 1-5'  # 北京时间 15:35 交易日盘后定稿
  # 🔴 2026-11-19 一劳永造根治（主人令「盘后没和其他今日事件一起更新」）：
  #   GitHub schedule 本仓实证大面积漂移/哒火（07:55 档漂到 12:59、15:35 盘后档当日未触发）： cron 不能作盘后必跑唯一保证。
  #   改用 workflow_run：上游 cn 数据抓取任一链 completed 即触发 consolidate（六源刷新完紧跟重算），盘后 cn_fetch 完成→本卡盘后自动定稿。
  #   原 schedule 保留作冗余兜底；workflow_dispatch 保留供人工补跑。
  workflow_run:
    workflows:
      - "🇨🇳 v8 中国数据抓取(云端)"
      - "🇨🇳 v8 中国数据抓取(云端·CN runner1号机应急)"
      - "🇨🇳 v8 中国数据抓取(云端·hosted兜底)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-invest-avoid
  cancel-in-progress: false

jobs:
  invest-avoid:
    # ⏰ 2026-11-26 主人令「盘后链不许在盘前/盘中浪费资源」：避雷针读 6 源 consolidate，
    #   其中收盘价/公告/停牌口径只在盘后定型 ⇒ 盘中重算没有意义。
    #   原实现：workflow_run 无任何时间闸门 ⇒ 今日实测 09:05/09:14/09:24/09:39/09:46/10:13 连跑 6 次纯浪费。
    #   修法：workflow_run 只在 **北京时间 15:00–23:59（盘后窗）** 放行。
    #     注意（铁律⑤ · 凡事一律用北京时间表述）：GitHub 的 created_at 字段本身是 UTC，
    #     所以下面的字面量是 'T07:'' 到 'T15:'（= 北京时间 15:00–23:59）；
    #     但**注释与对外报时一律换算成北京时间**，不要写成「UTC 07:00-15:59」——
    #     那样读的人还得自己 +8，历史上已因此误判过一次盘前批为凌晨批。
    #   自有 cron（15:35 盘后定稿）与手动 dispatch 不受本闸门影响。
    if: |
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' && (
          contains(github.event.workflow_run.created_at, 'T07:') ||
          contains(github.event.workflow_run.created_at, 'T08:') ||
          contains(github.event.workflow_run.created_at, 'T09:') ||
          contains(github.event.workflow_run.created_at, 'T10:') ||
          contains(github.event.workflow_run.created_at, 'T11:') ||
          contains(github.event.workflow_run.created_at, 'T12:') ||
          contains(github.event.workflow_run.created_at, 'T13:') ||
          contains(github.event.workflow_run.created_at, 'T14:') ||
          contains(github.event.workflow_run.created_at, 'T15:')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: "🧭 跑 gen_invest_avoid.py（产出 data/INVEST_AVOID.js）"
        run: python v8/gen_invest_avoid.py
      - name: "📤 推送 data/INVEST_AVOID.js（变化才推）"
        run: |
          git config user.name "v8-bot"
          git config user.email "bot@quant-scanner-v8.local"
          if git diff --quiet data/INVEST_AVOID.js; then
            echo "INVEST_AVOID 内容无变化，跳过推送"
          else
            git add data/INVEST_AVOID.js
            git commit -m "v8 invest_avoid: cloud consolidate $(date +'%Y-%m-%d %H:%M')"
            git fetch origin main
            git rebase origin/main || true
            git push || echo "push 被其他链抢先（数据已更新），跳过"
          fi
