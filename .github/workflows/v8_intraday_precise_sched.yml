name: "v8 盘中精准调度器 (intraday precise scheduler)"

on:
  schedule:
    # 🔁 2026-11-24 08:57 CST 触改重注册（schedule 第5次复发：晨档 08:20/08:35/08:50 三档 schedule run 全零，nolost_guard 代跑续命）
    # 🔁 2026-11-23 13:25 触改重注册 + 补真空档：11-23 上午实例 10:31 relay 断链后
    #   10:48-14:45 整段真空（13:02 午后开盘档全缺，主人实测 4 卡停 10:43-10:50）——
    #   架构单点：relay 只在实例退出前 dispatch 一次，失败即无人接管到 14:45 午后档。
    #   治本：加午间兜底两条，relay 断链后最大真空窗从 4h 压到 <1h；
    #   12:55 实例还能补派 13:02 档（late=7min 内不弃档）。
    - cron: '20 0 * * 1-5'   # 08:20 CST 晨档1
    - cron: '35 0 * * 1-5'   # 08:35 CST 晨档2
    - cron: '50 0 * * 1-5'   # 08:50 CST 晨档3
    - cron: '55 4 * * 1-5'   # 12:55 CST 午间兜底1（relay断链自愈，13:02档可补派）
    - cron: '10 5 * * 1-5'   # 13:10 CST 午间兜底2（冗余，兜住13:22起全部午后档）
    - cron: '45 6 * * 1-5'   # 14:45 CST 午后档1（接棒上午实例，覆盖 15:02-16:32 档）
    - cron: '55 6 * * 1-5'   # 14:55 CST 午后档2（冗余）
  workflow_dispatch:
    inputs:
      phase:
        description: 'morning / afternoon / relay / auto'
        default: 'auto'
        type: string
      end_bj:
        description: 'relay 班次的当日结束时刻(HH:MM, CST)'
        default: ''
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: v8-intraday-precise-sched
  cancel-in-progress: false   # 🔴 绝不允许取消在跑实例（上午实例被取消=全天失守）

jobs:
  precise_sched:
    # 纯调度器：零数据、零写盘、零 push，只需 dispatch 权限 → GitHub 托管 ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PHASE: ${{ github.event.inputs.phase || 'auto' }}
      END_BJ: ${{ github.event.inputs.end_bj || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: "⏱ 精准逐档 dispatch（内部时钟对时，替代失灵的 GitHub schedule）"
        run: |
          python3 .github/scripts/v8_intraday_precise_sched.py
