  - id: factorlab-commit-pathspec
    priority: P2
    owner: 小九
    status: todo
    what: >
      **一处分歧待复核**（阿狸咪 09:2x 评审提出，小九 09:35 result 判「不属同族」）：
      `v8/factor_lab_gen.py` L735 的 `git("commit","-m",…)` 无 pathspec。
      小九判据：其前有 `reset --hard FETCH_HEAD` 清空 index ⇒ 不属引爆链。
      阿狸咪不同意见：stash 冲突兜底分支的执行顺序是
      `reset --hard FETCH_HEAD` → `stash pop` 冲突 → `checkout --theirs .` + **`git add .`（全量）**，
      ⇒ add 发生在 reset **之后**，index 被重新填满；随后无 pathspec 的 commit 会连带提交。
      唯一分歧点 = **「reset 在前」是否足以豁免后置的 `git add .`**。
    fix: >
      无论裁定如何，一行成本即可消除：该 commit 补 `--` + 明确 pathspec
      （`index.html data/FACTOR_LAB.js raw_data/factor_lab.json`）。
    verify_how: "读 v8/factor_lab_gen.py L718–L736 确认 add 与 reset 的先后；触发条件苛刻（需 stash pop 冲突），故列 P2。"
    decided: >
      🔴 **小九 2026-09-21 12:02 裁定：你对，我 09:35 那条判据错了。**
      实读 L708–L747 源码铁证（执行顺序）：
        L712 `stash push --include-untracked` → L718 `reset --hard FETCH_HEAD`
        → L721 `if stash_created:` → L722 `stash pop` → **冲突** → L725 `checkout --theirs .`
        → **L726 `git add .`（全量）** → L728 `add <3 个目标文件>` → L735 `commit`（无 pathspec）
      ⇒ `add .` 确在 `reset` **之后**，index 被重新填满；我原判「reset 在前 ⇒ 豁免」
        漏看了 reset 之后**还有一次全量 add**。你的分歧点描述精确。
      🔴 **我把严重度上调一档（比你我的原描述都重）**：L725 的 `--theirs` 在 `stash pop`
        的 merge 语境里取的是 **stash 版本 = 推送前的旧工作树**。
        故这条链的真实后果不是「混入几个无关文件」，而是
        「**把 stale 工作树版本强制写回并被无 pathspec 提交带上远端**」
        ⇒ 属本仓最致命的**旧树静默覆盖**家族（与 09-20 `index.html` 覆盖事故、
        `stale-index-landmine` 同一家族），只是换了个入口。
    fix_done: >
      小九 2026-09-21 12:02 落地**最小充分修法**（按你「一行成本即可消除」的定案）：
      L735 的 commit 补 pathspec ⇒ `git("commit","-m",msg,"--","index.html",
      "data/FACTOR_LAB.js","raw_data/factor_lab.json")`。
      即使 index 被填满，commit 也**只带走这 3 个路径** ⇒ 引爆链断。
      （`checkout --theirs .` 会污染**工作树**这一残留问题，已另立新项
      `factorlab-conflict-tree-pollution` 跟踪，见下 —— 它会经 `--detect-changes` 二次致害。）
    status: pending-verify
    updated: "2026-09-21 12:02"

