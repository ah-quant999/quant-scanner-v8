# v8 中国数据源 GHA 可达性实测（ubuntu-latest）
# 2026-08-05：验证能否把 v8_cn_fetch 从自托管 lemoncat-cn 迁到 GitHub 云端
# 关键：cloud_fetch_v8.py 已改走 push2delay 镜像（requests 直连，不走 akshare 东财）

name: "🔍 v8 中国源 GHA 可达性探针"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: "📦 安装依赖"
        run: |
          pip install requests pandas akshare --quiet
          python -c "import requests, pandas; print('deps ok')"
      - name: "🧪 实测 push2delay + akshare 关键接口"
        run: |
          python - <<'PY'
          import time, json, traceback

          EM_DELAY = "https://push2delay.eastmoney.com"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              "Referer": "https://data.eastmoney.com/zjlx/detail.html",
              "Accept": "*/*",
          }
          import requests as req

          def em_clist(fs, fields, fid="f62", stat="1", pz=50, po="1"):
              params = {"pn": "1", "pz": str(pz), "po": po, "np": "1", "fltt": "2", "invt": "2",
                        "ut": "b2884a393a59ad64002292a3e90d46a5",
                        "fid": fid, "fs": fs, "stat": stat, "fields": fields,
                        "_": int(time.time() * 1000)}
              r = req.get(f"{EM_DELAY}/api/qt/clist/get", params=params, headers=HEADERS, timeout=15)
              d = r.json()
              return d.get("data", {}).get("diff", []) or []

          def probe(name, fn):
              t = time.time()
              try:
                  r = fn()
                  dt = time.time() - t
                  if isinstance(r, (list, tuple)):
                      print(f"[OK]   {name}  {len(r)} 条  {dt:.1f}s  sample={str(r[0])[:100] if r else 'EMPTY'}")
                  else:
                      print(f"[OK]   {name}  {dt:.1f}s  {str(r)[:100]}")
                  return True
              except Exception as e:
                  dt = time.time() - t
                  print(f"[FAIL] {name}  {dt:.1f}s  {type(e).__name__}: {str(e)[:160]}")
                  return False

          results = {}
          # ── 1. push2delay 行业资金流（SECTOR_FUND_FLOW 核心，今天刚修复的）──
          results["sector_industry"] = probe("push2delay 行业clist po=1", lambda: em_clist("m:90 t:2", "f12,f14,f3,f62,f184", pz=10))
          results["sector_industry_asc"] = probe("push2delay 行业clist po=0(流出)", lambda: em_clist("m:90 t:2", "f12,f14,f3,f62,f184", pz=10, po="0"))
          # ── 2. push2delay 概念资金流 ──
          results["sector_concept"] = probe("push2delay 概念clist po=1", lambda: em_clist("m:90 t:3", "f12,f14,f3,f62,f184", pz=10))
          # ── 3. push2delay 指数行情（INDEX_QUOTES 核心）──
          results["index_quotes"] = probe("push2delay 指数ulist", lambda: em_clist("m:90 t:3", "f12,f14,f3,f62,f184", pz=3) and [x for x in []]) if False else probe("push2delay 指数ulist.np", lambda: (
              req.get(f"{EM_DELAY}/api/qt/ulist.np/get",
                      params={"fltt": "2", "invt": "2", "ut": "b2884a393a59ad64002292a3e90d46a5",
                              "fields": "f2,f3,f4,f12,f13,f14,f104,f105,f106",
                              "secids": "1.000001,0.399001,0.399006,1.000688"},
                      headers=HEADERS, timeout=15).json().get("data", {}).get("diff", []) or []))
          # ── 4. push2delay 概念排名（CONCEPT_RANKING 核心）──
          results["concept_ranking"] = probe("push2delay 概念排名clist", lambda: em_clist("m:90 t:3 f:!50", "f12,f14,f3,f62,f184,f20", pz=10))

          # ── 5. akshare 关键接口（GHA 可达性）──
          import akshare as ak
          results["ak_margin"] = probe("akshare 两融stock_margin_sse", lambda: ak.stock_margin_sse(start_date="20260801", end_date="20260805"))
          results["ak_fund_flow_industry"] = probe("akshare 行业资金流stock_fund_flow_industry", lambda: ak.stock_fund_flow_industry())
          results["ak_concept_flow"] = probe("akshare 概念资金流stock_fund_flow_concept", lambda: ak.stock_fund_flow_concept())
          results["ak_cffex"] = probe("akshare 中金所stock_cffex_hold", lambda: ak.stock_cffex_hold())
          results["ak_ths_industry"] = probe("akshare 同花顺行业名stock_board_industry_name_ths", lambda: ak.stock_board_industry_name_ths())
          results["ak_news"] = probe("akshare 东财新闻stock_news_em", lambda: ak.stock_news_em(symbol="000001"))

          ok = sum(1 for v in results.values() if v)
          fail = sum(1 for v in results.values() if not v)
          print(f"\n════════ 探针结果: OK {ok} / FAIL {fail} ════════")
          print("GHA 判定:", "可迁移" if ok >= 4 else "需双轨/谨慎")
          PY
