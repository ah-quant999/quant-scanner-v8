# 九宝量化 v8.0 — v6 算法数据 → v8 raw_data 同步
#
# 作用：在自托管 cn runner（与 v6 同机）上读取 stock-scanner/data/ 的盘后/算法类 JSON，
# 推送到 quant-scanner-v8 raw_data/，触发 v8_build_deploy.yml 自动构建 data/*.js。
#
# 时段（北京时间）：
#   08:40  盘前：同步 NT_DATA / SUSPENSION_ALERT / MARKET_ALERTS 等盘前预警
#   19:00  盘后：同步 GOLD_POOL / CANDIDATE / TRIPLE_* / COCKPIT_* / BACKTEST_* /
#                LHB / SECTOR_RS / FIB / MAHORO / CRDS / INST_TRADE / STOCK_LIST 等
#                （v6 close_p2 18:30 才生成算法产出，故同步时间从原 16:45 推迟到 19:00）
#
# 注意：
# - 本工作流依赖 v6 仓库位于 runner 的 E:\workspace\stock-scanner\data。
# - 若路径不同，请在 sync_v6_to_v8.py 中修改 V6_ROOT。
# - 只读 v6，不写 v6；推送使用 git（非 api_push_raw.py）。

name: "🔄 v8 v6数据同步(cn)"

on:
  schedule:
    - cron: '40 0 * * 1-5'   # 08:40 CST 盘前
    - cron: '0 11 * * 1-5'   # 19:00 CST 盘后（v6 close_p2 18:30 算法产出已就绪）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-sync-v6-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, cn]
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "📥 检出 v8 仓库"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🕐 根据 cron 确定同步类别"
        id: cat
        shell: bash
        run: |
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "40 0 * * 1-5")
              echo "category=premarket" >> "$GITHUB_OUTPUT"
              echo "label=盘前" ;;
            "45 8 * * 1-5")
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=盘后" ;;
            *)
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=盘后-手动" ;;
          esac

      - name: "🔄 同步 v6 数据 → raw_data/"
        shell: powershell
        run: |
          $cat = "${{ steps.cat.outputs.category }}"
          Write-Host "本次同步类别: $cat"
          python sync_v6_to_v8.py --category $cat --push

      - name: "📝 Job Summary"
        if: always()
        shell: powershell
        run: |
          $cat = "${{ steps.cat.outputs.category }}"
          Write-Host "v6→v8 $cat 同步完成"
