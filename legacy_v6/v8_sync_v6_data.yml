# 九宝量化 v8.0 — v6 算法数据 → v8 raw_data 同步【应急工具 / 已停用定时】
#
# ⚠️ 2026-08-01 起：v8 算法链（v8_algo_run.yml）已在 cn runner 上原生运行，
# 直接产出 raw_data/，不再依赖 v6。本同步桥的定时任务已停用，仅保留
# workflow_dispatch 作为「万一 v8 原生链故障、需临时从 v6 灌数据」的应急手动触发。
#
# ❗ 切勿重新启用 on.schedule：v6 已停止运营，定时同步会把陈旧 v6 数据覆盖掉
#    新鲜的 v8 原生数据。
#
# 作用（手动）：在自托管 cn runner（与 v6 同机）上读取 stock-scanner/data/ 的
# 盘后/算法类 JSON，推送到 quant-scanner-v8 raw_data/。
# 注意：只读 v6，不写 v6；推送使用 git（非 api_push_raw.py）。

name: "🔄 v8 v6数据同步(cn)【应急·已停用定时】"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-sync-v6-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, cn]
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "📥 检出 v8 仓库"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🕐 根据 cron 确定同步类别"
        id: cat
        shell: bash
        run: |
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "40 0 * * 1-5")
              echo "category=premarket" >> "$GITHUB_OUTPUT"
              echo "label=盘前" ;;
            "45 8 * * 1-5")
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=盘后" ;;
            *)
              echo "category=post_close" >> "$GITHUB_OUTPUT"
              echo "label=盘后-手动" ;;
          esac

      - name: "🔄 同步 v6 数据 → raw_data/"
        shell: powershell
        run: |
          $cat = "${{ steps.cat.outputs.category }}"
          Write-Host "本次同步类别: $cat"
          python sync_v6_to_v8.py --category $cat --push

      - name: "📝 Job Summary"
        if: always()
        shell: powershell
        run: |
          $cat = "${{ steps.cat.outputs.category }}"
          Write-Host "v6→v8 $cat 同步完成"
