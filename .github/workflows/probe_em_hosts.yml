name: EM Host Pool Probe (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe all EM push2 hosts
        run: |
          python - <<'PYEOF'
          import json, urllib.request, time

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36",
                "Referer": "https://quote.eastmoney.com/"}
          HOSTS = ["https://push2delay.eastmoney.com", "https://push2.eastmoney.com"] +         ["https://%d.push2.eastmoney.com" % i for i in range(1, 13)]
          PATH = ("/api/qt/clist/get?pn=1&pz=5&po=1&np=1&fltt=2&invt=2"
                  "&fs=m:90+t:2&fields=f12,f14,f3")

          print("=== EM push2 host-by-host probe (%d hosts) ===" % len(HOSTS))
          ok, bad = [], []
          for h in HOSTS:
              t = time.time()
              try:
                  req = urllib.request.Request(h + PATH, headers=UA)
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read()
                      j = json.loads(body.decode("utf-8", "replace"))
                      n = len((j.get("data") or {}).get("diff") or [])
                      dt = time.time() - t
                      if n > 0:
                          ok.append(h)
                          print("  OK    %-42s rows=%-4d %.1fs" % (h, n, dt))
                      else:
                          print("  EMPTY %-42s rows=0 rc=%s %.1fs" % (h, j.get("rc"), dt))
              except Exception as e:
                  dt = time.time() - t
                  print("  FAIL  %-42s %s: %s %.1fs" % (h, type(e).__name__, str(e)[:60], dt))
                  bad.append(h)
          print()
          print("SUMMARY: ok=%d fail=%d" % (len(ok), len(bad)))
          print("REACHABLE: %s" % (ok,))
          if ok:
              print(">>> 存在可达 host => 东财全域502 不成立; 扩大 host 轮换可解")
          else:
              print(">>> 14 host 全不可达 => 东财端真故障")
          PYEOF
