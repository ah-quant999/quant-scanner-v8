# 九宝量化 v8.0 — ETF clist 探针（第7版·一次性诊断，验完即删）
#
# 前 6 版已确证（不再重复）：
#   ① pz 被硬截 100（pn 必须翻页，全市场要 17 页）
#   ② fs=m:1+t:9,m:0+t:9 漏深市；b:MK0021..MK0024 才与 akshare 口径一致（total 1619）
#   ③ 502 以「窗口」形式出现（v5 连续 12 次 × 5s 全 502 = 60s 不可用）
#   ④ 生产修复后 19:11 实测：第 1 页 4 轮 × 2 host = 8 个请求全失败 ⇒ 65s 预算不足
#
# 本版要回答**唯一还没验的关键问题**：
#   「pz 截 100」到底是东财的硬限制，还是**我们这组参数**（ut / stat / fields）导致的？
#   若某个参数组合能一次拿全 1619 行 ⇒ 请求数 17 → 1，撞 502 的机会降一个数量级，
#   这才是真正的「一劳永逸」；若所有组合都截 100，则只能靠「长退避 + 多轮」硬扛。
#
# 设计：矩阵 × 独立 runner（每 runner 只发 1 个请求，杜绝顺序污染）。
#   P1..P4 生产现行参数（pz=100,pn=1,ut=旧,stat=1,fields=…) ×4 → 量测**每请求成功率**
#   U1     ut 换 akshare 现行 token + pz=50000 + 去 stat
#   U2     ut 不变 + pz=50000 + 去 fields（东财默认返回全字段）
#   U3     ut 不变 + pz=50000 + 去 fields + 去 stat
#   U4     ut 不变 + pz=50000 + fid=f3 + 去 fields + 去 stat（最贴近 akshare 原形）
#   B1     同 IP 连发 8 次 × 5s（量测「同 IP 突发」是否自身触发 502）
#
# 记录：http / bytes / rc / data.total / len(diff) / 沪市深市分布 / 求和
#   —— data.total 与 len(diff) 不等即为「被截」的硬证据。

name: "🔬 v8 ETF clist 探针v7(矩阵·pz截100归因+每请求成功率)"

on:
  workflow_dispatch: {}

concurrency:
  group: v8_etf_probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "P1_prod_asis"
            host: "https://push2delay.eastmoney.com"
            mode: "single"
            pz: "100"
            pn: "1"
            ut: "old"
            stat: "1"
            fields: "yes"
            fid: "f62"
            reps: "1"
            gap: "0"
          - name: "P2_prod_asis"
            host: "https://push2delay.eastmoney.com"
            mode: "single"
            pz: "100"
            pn: "1"
            ut: "old"
            stat: "1"
            fields: "yes"
            fid: "f62"
            reps: "1"
            gap: "0"
          - name: "P3_prod_asis"
            host: "https://push2delay.eastmoney.com"
            mode: "single"
            pz: "100"
            pn: "1"
            ut: "old"
            stat: "1"
            fields: "yes"
            fid: "f62"
            reps: "1"
            gap: "0"
          - name: "P4_prod_asis"
            host: "https://push2delay.eastmoney.com"
            mode: "single"
            pz: "100"
            pn: "1"
            ut: "old"
            stat: "1"
            fields: "yes"
            fid: "f62"
            reps: "1"
            gap: "0"
          - name: "U1_akshare_ut_pz50000"
            host: "https://push2.eastmoney.com"
            mode: "single"
            pz: "50000"
            pn: "1"
            ut: "akshare"
            stat: "0"
            fields: "yes"
            fid: "f3"
            reps: "1"
            gap: "0"
          - name: "U2_nofields_pz50000"
            host: "https://push2.eastmoney.com"
            mode: "single"
            pz: "50000"
            pn: "1"
            ut: "old"
            stat: "1"
            fields: "no"
            fid: "f62"
            reps: "1"
            gap: "0"
          - name: "U3_nofields_nostat_pz50000"
            host: "https://push2.eastmoney.com"
            mode: "single"
            pz: "50000"
            pn: "1"
            ut: "old"
            stat: "0"
            fields: "no"
            fid: "f62"
            reps: "1"
            gap: "0"
          - name: "U4_fidf3_noall_pz50000"
            host: "https://push2delay.eastmoney.com"
            mode: "single"
            pz: "50000"
            pn: "1"
            ut: "old"
            stat: "0"
            fields: "no"
            fid: "f3"
            reps: "1"
            gap: "0"
          - name: "B1_burst_sameip_8x5s"
            host: "https://push2delay.eastmoney.com"
            mode: "burst"
            pz: "100"
            pn: "1"
            ut: "old"
            stat: "1"
            fields: "yes"
            fid: "f62"
            reps: "8"
            gap: "5"
    steps:
      - name: "🐍 装依赖"
        run: python3 -m pip install --quiet --disable-pip-version-check requests

      - name: "🔬 实测"
        shell: bash
        env:
          CFG_NAME: ${{ matrix.name }}
          CFG_HOST: ${{ matrix.host }}
          CFG_MODE: ${{ matrix.mode }}
          CFG_PZ: ${{ matrix.pz }}
          CFG_PN: ${{ matrix.pn }}
          CFG_UT: ${{ matrix.ut }}
          CFG_STAT: ${{ matrix.stat }}
          CFG_FIELDS: ${{ matrix.fields }}
          CFG_FID: ${{ matrix.fid }}
          CFG_REPS: ${{ matrix.reps }}
          CFG_GAP: ${{ matrix.gap }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time, sys

          UT_OLD = "b2884a393a59ad64002292a3e90d46a5"
          UT_AK  = "bd1d9ddb04089700cf9c27f6f7426281"
          FS_BMK = "b:MK0021,b:MK0022,b:MK0023,b:MK0024"
          FIELDS = "f12,f14,f3,f6,f10,f62"

          name = os.environ["CFG_NAME"]
          url = os.environ["CFG_HOST"].rstrip("/") + "/api/qt/clist/get"
          def build():
              p = {"pn": os.environ["CFG_PN"], "pz": os.environ["CFG_PZ"], "po": "1", "np": "1",
                   "fltt": "2", "invt": "2",
                   "ut": UT_AK if os.environ["CFG_UT"] == "akshare" else UT_OLD,
                   "fid": os.environ["CFG_FID"], "fs": FS_BMK,
                   "_": int(time.time() * 1000)}
              if os.environ["CFG_STAT"] == "1":
                  p["stat"] = "1"
              if os.environ["CFG_FIELDS"] == "yes":
                  p["fields"] = FIELDS
              return p

          import requests
          try:
              requests.packages.urllib3.disable_warnings()
          except Exception:
              pass
          HDR = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)",
                 "Referer": "https://quote.eastmoney.com/"}

          def one():
              r = {"t": time.strftime("%H:%M:%S")}
              t0 = time.time()
              try:
                  resp = requests.get(url, params=build(), timeout=25, verify=False, headers=HDR)
                  r["http"] = resp.status_code
                  r["bytes"] = len(resp.content)
                  try:
                      d = resp.json()
                      data = d.get("data") or {}
                      diff = data.get("diff")
                      rows = diff if isinstance(diff, list) else []
                      r["rc"] = d.get("rc")
                      r["total"] = data.get("total")
                      r["rows"] = len(rows)
                      codes = [str(x.get("f12")) for x in rows if isinstance(x, dict)]
                      r["sh"] = sum(1 for c in codes if c[:1] in ("5", "6"))
                      r["sz"] = sum(1 for c in codes if c[:1] in ("1", "0", "3"))
                      nets = []
                      for x in rows:
                          try:
                              nets.append(float(x.get("f62") or 0.0))
                          except Exception:
                              pass
                      r["sum_yi"] = round(sum(nets) / 1e8, 3)
                  except Exception:
                      r["json"] = False
                      r["head"] = resp.text[:80].replace("\n", " ")
              except Exception as e:
                  r["err"] = "%s: %s" % (type(e).__name__, str(e)[:90])
              r["secs"] = round(time.time() - t0, 1)
              return r

          reps = int(os.environ["CFG_REPS"]); gap = float(os.environ["CFG_GAP"])
          out = []
          for i in range(reps):
              if i:
                  time.sleep(gap)
              out.append(one())
              print("SAMPLE %s [%d/%d] %s" % (name, i + 1, reps, json.dumps(out[-1], ensure_ascii=False)), flush=True)

          ok = sum(1 for x in out if x.get("http") == 200)
          summary = {"cfg": name, "reps": reps, "ok200": ok, "fail": reps - ok}
          good = [x for x in out if x.get("http") == 200 and x.get("rc") == 0]
          if good:
              summary["max_rows"] = max(x.get("rows", 0) for x in good)
              summary["max_total"] = max(x.get("total") or 0 for x in good)
              summary["sample_sh_sz"] = "%s/%s" % (good[0].get("sh"), good[0].get("sz"))
          print("RESULT " + json.dumps(summary, ensure_ascii=False), flush=True)
          print("══════════════ END %s ══════════════" % name, flush=True)
          PYEOF
