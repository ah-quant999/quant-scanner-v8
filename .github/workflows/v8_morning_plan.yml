# 九宝量化 v8.0 — 「盘前预案」卡数据生成器调度（cn runner）
#
# 2026-10-21 主人令：新卡放「暂未上架」顶部，跑真实数据。
# 2026-10-22 主人令「确认两新卡都是日更且有定时任务跟踪」：本链即盘前预案的
#   **真实定时任务**（此前只有 10-21 19:16 一次手动跑，登记表里的 08:40 是空头声明）。
#
# 时点：工作日 07:50 CST（UTC 前一日 23:50；cron 日 0-4 = UTC 周日~周四 = 北京周一~周五）。
#   选 07:50 三条理由：
#     ① 数据就绪：昨夜 19:20 post_close 链产物（AVG_PRICE/THERMO/FINAL_RECOMMEND/
#        SECTOR_LEADERS/DAJIJIN）+ 04:26 ETF + 05:47 SECTOR_RS 此时已全部落 main；
#     ② 避开同 runner 排队：08:25 是双机兜底抓取档（v8_cn_fetch_cloud_selfhosted，
#        同 [self-hosted, cn] 标签），07:50 该 runner 空闲；
#     ③ 指数/成交额为盘前快照（push2delay 盘前返回上一收盘），与「盘前预案」语义一致。
#
# 为什么必须 [self-hosted, cn]：东财 push2delay 域唯独对境内可达（境外托管 runner
#   结构性不可达，见 v8_cn_fetch_cloud_selfhosted.yml 头部血证），本生成器直连该域。
#
# 安全铁律（与 v8_dajijin_fetch.yml / v8_lhb_fetch.yml 同步）：
#   1. 严禁 actions/checkout / rm -rf / git clean -fdx（cn runner 系统级拦截，会挂 job）；
#   2. 严禁 git clone/fetch（cn runner 到 github.com:443 被连接重置），源码同步走 Contents API；
#   3. 单一职责：只产出并推送 data/MORNING_PLAN.js，不动任何其他文件；
#   4. run 块全部 ASCII（cn runner 为 Windows + GBK，中文只出现在 YAML 注释/name 里）。
#
# 空提交保护：v8_build_deploy 的 push.paths 含 data/** ⇒ 每推一次触发全量重建（~8min）。
#   推送前先比对线上 blob（scripts/card_need_push.py），逐字节相同即 SKIP。
name: "📋 v8 盘前预案生成器 (cn runner)"

on:
  schedule:
    - cron: '50 23 * * 0-4'   # 北京 07:50 工作日（UTC 前一日 23:50；0-4=UTC周日~周四=北京周一~周五）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-morning-plan
  cancel-in-progress: false

jobs:
  morning-plan:
    runs-on: [self-hosted, cn]
    # safe-delete 批量删除守卫阈值必须显式设 2000（cn runner 为 Windows，不设则吃默认 50）。
    env:
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 2000
      # cn runner（Windows）默认 GBK —— 脚本打印中文会 UnicodeEncodeError('gbk') 崩链。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    timeout-minutes: 15
    steps:
      - name: "📝 同步源码与数据源（Contents API · 同域，避开 raw 302）"
        shell: powershell
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'ah-quant999/quant-scanner-v8'
          $headers = @{
            'User-Agent'    = 'v8-morning-plan'
            'Accept'        = 'application/vnd.github+json'
            'Authorization' = "Bearer $env:GH_PAT"
          }
          # [ascii] Do NOT use `Accept: application/vnd.github.raw`: it 302-redirects to
          #   raw.githubusercontent.com, which may be wholly unreachable => guaranteed failure.
          # [ascii] Files: generator + push helpers + the 6 data/*.js sources it reads
          #   (missing source => the card silently degrades to "data not ready" — sync them all).
          $files = @(
            'v8/gen_morning_plan.py',
            'scripts/card_need_push.py',
            'scripts/api_put_file.py',
            'scripts/normalize_eol.py',
            'data/AVG_PRICE_DATA.js',
            'data/MARKET_THERMO.js',
            'data/FINAL_RECOMMEND_DATA.js',
            'data/SECTOR_LEADERS.js',
            'data/DAJIJIN_REDUCTION.js',
            'data/IMA_STRONG_STOCK.js'
          )
          foreach ($f in $files) {
            $url = "https://api.github.com/repos/$repo/contents/$f`?ref=main"
            try {
              $r = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 60 -Method Get
              $b64 = ($r.content -replace "\s", "")
              $bytes = [Convert]::FromBase64String($b64)
              $dir = Split-Path $f -Parent
              if ($dir) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
              [System.IO.File]::WriteAllBytes($f, $bytes)
              Write-Host "[ok] fetched $f ($($bytes.Length) bytes)"
            } catch {
              Write-Host "[warn] API fetch failed for $f : $_" -ForegroundColor Yellow
            }
          }
          if (-not (Test-Path 'v8/gen_morning_plan.py')) {
            Write-Host "[fatal] generator not present; chain cannot continue" -ForegroundColor Red
            exit 1
          }

      - name: "📦 安装 requests（缺失才装 · tuna 镜像）"
        shell: powershell
        run: |
          python -c "import requests" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[deps] installing requests"
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple requests
            if ($LASTEXITCODE -ne 0) { Write-Host "[fatal] pip install requests failed" -ForegroundColor Red; exit 1 }
          } else {
            Write-Host "[deps] requests ready"
          }

      - name: "📋 跑 gen_morning_plan.py（产出 data/MORNING_PLAN.js）"
        id: gen
        shell: powershell
        run: |
          # [ascii] weekend gate only — holiday triggers are harmless no-ops (same stance
          #   as v8_cn_fetch_cloud_selfhosted: the card would just carry the last
          #   trading day's data, honestly labeled by its data_date line).
          $dow = (Get-Date).DayOfWeek.value__
          if ($dow -eq 0 -or $dow -ge 6) { Write-Host "[skip] weekend, exit ok"; exit 0 }
          cd $env:GITHUB_WORKSPACE
          python v8/gen_morning_plan.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[fatal] generator returned non-zero (eastmoney unreachable?) — no write, keep online card" -ForegroundColor Red
            echo "::error title=v8-morning-plan(exit=$LASTEXITCODE)::📋 盘前预案生成失败（指数行情抓取失败即整体中止，宁缺毋假）。线上卡将沿用上一版；若连续多日失败请检查 cn runner 网络与 push2delay 可达性。"
            exit 1
          }
          if (-not (Test-Path 'data/MORNING_PLAN.js')) {
            Write-Host "[fatal] no output file" -ForegroundColor Red
            echo "::error title=v8-morning-plan(no-output)::📋 盘前预案未产出 data/MORNING_PLAN.js"
            exit 1
          }
          Write-Host "[ok] data/MORNING_PLAN.js ready"

      - name: "🔍 内容比对（相同则 SKIP，防空提交触发全量重建）"
        id: diff
        shell: powershell
        env:
          GH_PAT: ${{ secrets.V8_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          cd $env:GITHUB_WORKSPACE
          # [ascii] comparison logic lives in repo script scripts/card_need_push.py (locally testable;
          #   avoids the PowerShell here-string column-0 vs YAML block indentation conflict).
          $out = python scripts/card_need_push.py data/MORNING_PLAN.js 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'NEED_PUSH=1') { "need=1" | Out-File -FilePath "_mp_need.txt" -Encoding ascii }
          else { "need=0" | Out-File -FilePath "_mp_need.txt" -Encoding ascii }

      - name: "📤 推送 data/MORNING_PLAN.js（api_put_file.py）"
        if: always()
        shell: powershell
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.V8_GH_TOKEN }}
        run: |
          cd $env:GITHUB_WORKSPACE
          $need = (Get-Content '_mp_need.txt' -ErrorAction SilentlyContinue) -join ''
          if ($need -notmatch 'need=1') {
            Write-Host "[skip] content identical to remote; no push (avoid an empty commit triggering a full rebuild)"
            exit 0
          }
          python scripts/api_put_file.py data/MORNING_PLAN.js "data: morning plan refresh ($(Get-Date -Format 'yyyy-MM-dd HH:mm') CST)"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[warn] push failed (non-blocking; retried next round)" -ForegroundColor Yellow
            echo "::error title=v8-morning-plan(push-failed)::📤 data/MORNING_PLAN.js 推送失败（非阻塞，下一轮补推）。"
            exit 1
          }

# ─────────────────────────────────────────────────────────────────────────────
# 链路备忘（2026-10-22 阿狸咪的工程师）：
#   本链推送 data/MORNING_PLAN.js 后，index.html 的 ?v 由 v8_cache_buster_reconcile
#   （监听 data/** push，15 分钟内兜底）自动对齐，无需本链自理 —— 与
#   v8_dajijin_fetch 同架构。前端「暂未上架」页卡体徽章行显示「📅 数据日 · 已更新」。
# ─────────────────────────────────────────────────────────────────────────────
