# 九宝量化 v8.0 — 量质双擎 · 上线前置点位重放（一次性参考任务）
#
# 2026-10-11 阿狸咪的工程师（主人令「按你建议做吧」）：
#   第一支自研算法「量质双擎」从因子实验室已验证的异常量比因子出发。
#   本工作流跑 scripts/replay_lqsq_top30.py 做上线前置点位重放：全市场过滤后 Top30、
#   T+20 调仓、次开买入扣双边 0.3%；ROE 复合因子不参与回放（point-in-time 不可回溯）。
#   🔴 按 2026-10-11 铁令：回放只作上线前置验证，不进主榜、不作上下架依据。
#
#   产物 raw_data/lqsq_pit_replay.json。仅 workflow_dispatch 手动触发，无常规档、无 cron。

name: "🚀 v8 量质双擎 上线前置点位重放·一次性"

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: v8-lqsq-pit-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: [self-hosted, cn]
    # 全市场 ~5400 只逐只取日 K 700 根（GTimg 前复权，与实盘同通道），预算 200 分钟；
    # 逐只缓存 raw_data/pit_replay_work/（可续跑），中断重跑只补缺。
    timeout-minutes: 200
    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 2000
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: "📥 经 GitHub API 同步源码（唯一可行路线：本 runner 上 git 走 github.com 会被连接重置）"
        id: sync_api
        shell: powershell
        run: |
          $code = @'
          import os, base64, json, hashlib, urllib.request, time
          token = os.environ["GITHUB_TOKEN"]
          REPO = "ah-quant999/quant-scanner-v8"
          H = {"Authorization": "Bearer " + token,
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28"}

          def local_blob_sha(path):
              try:
                  data = open(path, "rb").read()
              except Exception:
                  return None
              h = hashlib.sha1()
              h.update(("blob %d\0" % len(data)).encode())
              h.update(data)
              return h.hexdigest()

          def sha_of(data):
              h = hashlib.sha1()
              h.update(("blob %d\0" % len(data)).encode())
              h.update(data)
              return h.hexdigest()

          def get_json(url, tries=6):
              last = None
              for i in range(tries):
                  try:
                      return json.load(urllib.request.urlopen(
                          urllib.request.Request(url, headers=H), timeout=120))
                  except Exception as e:
                      last = e
                      print("  retry %d: %s" % (i + 1, e), flush=True)
                      time.sleep(min(2 ** i, 20))
              raise SystemExit("API fetch failed: %s (%s)" % (url, last))

          def fetch_blob(sha, tries=6):
              url = "https://api.github.com/repos/%s/git/blobs/%s" % (REPO, sha)
              raw_h = dict(H)
              raw_h["Accept"] = "application/vnd.github.raw"
              last = None
              for i in range(tries):
                  mode = "raw" if i % 2 == 0 else "b64"
                  try:
                      hdr = raw_h if mode == "raw" else H
                      resp = urllib.request.urlopen(
                          urllib.request.Request(url, headers=hdr), timeout=180)
                      body = resp.read()
                      data = body if mode == "raw" else base64.b64decode(
                          json.loads(body.decode())["content"])
                      if sha_of(data) != sha:
                          raise ValueError("sha mismatch (truncated?) got %d bytes" % len(data))
                      return data
                  except Exception as e:
                      last = e
                      print("  blob retry %d [%s]: %s" % (i + 1, mode, e), flush=True)
                      time.sleep(min(2 ** i, 20))
              raise SystemExit("blob fetch failed: %s (%s)" % (sha, last))

          def list_all_blobs(prefixes):
              root = get_json("https://api.github.com/repos/%s/git/trees/main" % REPO)
              if not isinstance(root, dict) or "tree" not in root:
                  return get_json("https://api.github.com/repos/%s/git/trees/main?recursive=1" % REPO).get("tree", [])
              out = []

              def _walk(node, prefix, depth):
                  for e in node.get("tree", []):
                      rel = e.get("path", "")
                      full = prefix + rel
                      if e.get("type") == "blob":
                          out.append({"type": "blob", "path": full, "sha": e.get("sha")})
                      elif e.get("type") == "tree" and depth < 3:
                          if any(full == p.split("/")[0] or full + "/" == p or p.startswith(full + "/")
                                 or full.startswith(p.rstrip("/") + "/") for p in prefixes):
                              sub = get_json("https://api.github.com/repos/%s/git/trees/%s" % (REPO, e.get("sha")))
                              if isinstance(sub, dict) and "tree" in sub:
                                  _walk(sub, full + "/", depth + 1)

              _walk(root, "", 0)
              return out

          _PREF = ("algorithms/", "scripts/", ".github/scripts/")
          want = []
          for e in list_all_blobs(_PREF):
              if e.get("type") != "blob":
                  continue
              p = e["path"]
              if (p.startswith("algorithms/") or p.startswith("scripts/")
                      or p.startswith(".github/scripts/")
                      or ("/" not in p and p.endswith(".py"))):
                  want.append((p, e["sha"]))
          print("files to sync: %d" % len(want), flush=True)

          ok = 0
          skipped = 0
          for p, sha in want:
              if local_blob_sha(p) == sha:
                  ok += 1
                  skipped += 1
                  continue
              data = fetch_blob(sha)
              parent = os.path.dirname(p)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(p, "wb") as f:
                  f.write(data)
              print("  updated %s (%d bytes)" % (p, len(data)), flush=True)
              ok += 1
          print("OK source sync done: %d/%d (unchanged: %d)" % (ok, len(want), skipped), flush=True)
          if ok != len(want):
              raise SystemExit(1)
          '@
          $tmp = Join-Path $env:RUNNER_TEMP "sync_src_v8.py"
          Set-Content -Path $tmp -Value $code -Encoding UTF8
          python $tmp
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: "🐍 Python / 依赖检查（缺才装·清华镜像）"
        shell: powershell
        run: |
          python --version
          python -c "import pandas, numpy, requests, akshare" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "deps missing, installing from tsinghua mirror..."
            python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple akshare pandas numpy requests
          } else { Write-Host "deps ready" }
          exit 0

      - name: "🔬 跑点位重放（脚本自带逐只缓存可续跑 + 结果 Contents API 推 main）"
        shell: bash
        run: |
          python scripts/replay_lqsq_top30.py
