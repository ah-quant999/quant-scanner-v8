        `sys.exit(0 if report["overall"] == "ok" else 2)` 是**按设计**在报告含 fail/warn 项时返回 2。
        实测 run #2321 紧接 12:26:45.72 `[INFO] 已生成 data/HEALTH_CHECK.js`（数据已刷），
        线上 `data/HEALTH_CHECK.js` `updated=2026-09-26 20:30:18` ⇒ **产物确已刷新**，属「假失败标注」。
    fix: >-
      ⛔ 本轮**未落码**（巡监窗口 + 属 workflow 车道）。三种修法与权衡如下，推荐 A：
      · A（最小语义改动·推荐）：对**单命令块**在 `run:` 块首行插 `set +e`（与 `v8_stock_quote_refresh.yml:261`
