# 九宝量化 v8.0 — 盘后算法链（A 采集 → B 选股 → D 汇总 → E 回测 · 批次由闸门判定）
#
# 🔴 2026-09-10 阿狸咪更正（前端「盘前/盘中/盘后 权威划分表」逐条核对）：
#   本链**现已跑在 [self-hosted, cn]**（小九 / 阿狸咪两台 cn 机谁空谁接），**不是** ubuntu-latest。
#   文件名与历史注释里的「云端」是 2026-08 沿革名（当时确实跑 ubuntu-latest），
#   请勿据此判断执行机——以 jobs.<job>.runs-on 为准。
#
# 2026-08-05 23:45 创建：cn 自托管 runner 连续 2 天盘后算法链失败——
#   run#16/#17（08-05 18:30/20:00）双双挂在「经 GitHub API 同步源码」步骤，
#   根因是 cn runner 网络层不稳定（git 走 github.com 被连接重置，GitHub API 同步也超时）。
#   与 v8_cn_fetch_cloud.yml 同理，把算法链迁到 GitHub 云端 ubuntu-latest：
#   - 云端 runner 在 GitHub 内网，checkout/clone 无 safe-delete 钩子、无连接重置问题；
#   - 东财镜像/akshare 可达性已由 probe_v8_cn_cloud.yml 实测（10/11 通，唯一 FAIL 是探针函数名写错）；
#   - cn_fetch 云端版 08-05 17:34 已实测跑通 12 模块，同源数据链路可信。
#
# ⚠️ 保留 v8_algo_run.yml（cn runner）仅作 workflow_dispatch 应急回退，其 cron 已移除
#    （防止双跑：两路都会往 main 推 raw_data，同一产物并发会互相覆盖）。
#
# 2026-08-05 23:45 兼容性要点：
#   - actions/checkout@v4 在云端 ubuntu 是标准操作（无 Windows safe-delete 钩子）；
#   - actions/setup-python 提供 python3；
#   - SKIP_MOOTDX=1：云端无通达信接口，直走 akshare；
#   - V6_SEED 不设（默认 0，v8 已原生化，不依赖 v6 路径 E:\...）；
#   - GITHUB_TOKEN 由云端自动注入，api_push_raw.py 走 Contents API 推送。

name: "☁️ v8 盘后算法链(云端)"

on:
  # 🔴 2026-08-06 21:00 收敛 4→1：GitHub Actions 单 workflow 多条 cron 存在静默失效问题
  #   （cn_fetch_cloud 17→5 收敛后恢复触发；本 workflow 4 条 cron 自创建起 0 次 schedule 触发，
  #    仅 workflow_dispatch 可用）。算法链一次跑完所有产物（候选池/黄金池/三重共识/回测），
  #   只需 18:30 主档成功一次即可；冗余兜底由「本机 WorkBuddy 每30分检查 + dispatch」承担，
  #   不再依赖 GitHub schedule 多条冗余。
  schedule:
    # 2026-08-15 一劳永逸修复：cron 从 1-5 改为每天，内部用 A 股交易日历判断，
    # 非交易日自动跳过，避免周末/节假日无意义覆盖，同时覆盖调休上班日（股市开市）。
    # 2026-08-20 主人令：主档从 18:30 推迟到 19:15 CST，确保全部盘后数据源完整就绪后再跑选股算法。
    # 内部仍用 A 股交易日历 gate，非交易日自动跳过，同时覆盖调休上班日（股市开市）。
    # 🔴 2026-09-10 全面审计更正（阿狸咪）：以下 cron 只是「**唤醒点**」，**不再决定跑哪批**。
    #   跑哪批由唯一决策点 .github/scripts/v8_stage_gate.py 按「缺什么跑什么」内容级判定：
    #   全就绪 → target=NONE 空转（合规、真成功）；幂等、重复唤醒绝不抢跑。
    #   实测 GitHub schedule 不可靠：09-10 前 4 档应触发 4 次，实测只有 1 次（21:07）。
    #   → 真正的调度主力 = 本机「盘后算法链接力推进器」自动化（每小时 :10，16:00-01:00），以下 cron 仅作备份。
    - cron: '40 8 * * *'   # 16:40 CST 唤醒①（批次由闸门定）
    - cron: '10 10 * * *'  # 18:10 CST 唤醒②（批次由闸门定）
    - cron: '0 12 * * *'   # 20:00 CST 唤醒③（批次由闸门定）
    - cron: '0 13 * * *'   # 21:00 CST 唤醒④（批次由闸门定）
    # 🔒 2026-09-10 主人令「一劳永逸·不要一直抢跑」新增「接力触发点」：
    #   21:00 之后原本再无 cron → 若 B 批因 factor_lab_gen 冷启动(50-90min)拖到 22:30 才跑完，
    #   则 D(最终推荐)/E(回测) 永远没人触发，当晚链条断在半路。
    #   这两条只是**触发点**，实跑哪批完全由批次闸门(.github/scripts/v8_stage_gate.py)
    #   按「缺什么跑什么」判定 —— 幂等：产物已就绪则 target=NONE 空转，重复触发不会抢跑。
    - cron: '30 14 * * *'  # 22:30 CST 接力触发（D 若缺则跑）
    - cron: '30 16 * * *'  # 00:30 CST 接力触发（E 若缺则跑；凌晨归属前一交易日）
  repository_dispatch:
    # 2026-09-01 加固：允许本机 WorkBuddy 自动化 / 手动经 API 主动唤醒盘后链，
    #   不再单纯依赖 GitHub schedule（已知静默失效）。types 见下。
    types: [trigger_algo]
  workflow_dispatch:
    # 2026-08-29 补：maharo 数据源已移除（主人令）；新增 force_run 手动输入，供周末/假期审计强制跑。
    inputs:
      force_run:
        description: '强制运行（忽略时间门控，周末/假期审计用）'
        type: boolean
        default: false
      bypass_time_gate:
        description: '绕过选股时间守门(应急:凌晨/盘前补跑用，默认关，勾选即放行)'
        type: boolean
        default: false
      stage:
        # 2026-09-04 dispatch 分批改造（主人令，防风暴查证通过后实施）：与 cn 链
        # v8_algo_run.yml 的 stage 入参对齐——留空=按北京时间小时自动分派，
        # A=采集 B=选股 D=汇总 E=回测，all=全链应急。
        description: '批次(留空=由批次闸门按内容级就绪自动判定，推荐留空)：A=采集 B=选股 D=汇总 E=回测 all=全链应急'
        type: string
        default: ''

permissions:
  contents: write
  # 2026-09-04 探针路由：转派 workflow 需要 actions: write（用 PAT 时由 PAT scope 决定，此处兜底）
  actions: write

# 🔴 2026-08-21 19:2x 一劳永逸根因修复（主人令「核查，一劳永逸式修复」）：
#   本 workflow 此前**没有 concurrency 段** → 算法链失败后自愈派发器
#   （.github/scripts/cloud_dispatcher.py + patrol self_heal）每 1-2 分钟补派一次，
#   实测同时有 11-20 个 run 并发；每个 run 的「经 GitHub API 同步源码」要逐 blob 拉全仓
#   上千文件 → 并发洪流触发 GitHub **secondary rate limit（HTTP 403）**，造成双杀：
#     ① 算法链本身 100% 卡在同步源码步骤 10 分钟超时（今日 134 次 failure，
#        候选池/三重共识/全站精选/最终推荐全部停在昨晚 23:xx）；
#     ② 姊妹 workflow cn_fetch 的 api_push_raw.py 取 main ref 同样吃 403 →
#        收盘数据抓到却推不上 main → 实时数据卡永久停在 14:52（「没有收盘数据」）。
#   加 concurrency：同一时刻最多 1 跑 + 1 排队，API 压力从根上消失。
#   cancel-in-progress: false —— 算法链单轮 20-40 分钟，绝不能被新派发打断（会丢产物）。
concurrency:
  group: v8-algo-cloud
  cancel-in-progress: false

jobs:
  algo:
    # 🟢 2026-09-08 主人令「active-active」：盘后算法链改回 [self-hosted, cn]，
    #   仅 IP 敏感 workflow 用 cn label；lemoncat/alimi 双机互为兜底，避免美国 IP 反爬导致数据失真体检失败。
    #   （历史：2026-08-20 曾改为 ubuntu-latest 防 cn runner 离线；现双机 runner 自启+看门狗兜底，
    #    中国 IP 稳定性已恢复，且境外 runner 偶发 safe-delete/反爬/secondary rate limit 问题更不可控。）
    runs-on: [self-hosted, cn]  # 2026-09-10 更正：这里用的是【共享标签 cn】——任何注册了 self-hosted+cn 的 runner 都会接单 = 双机谁空谁跑（与前端「盘前/盘中/盘后 权威划分表」同口径）。09-09 旧注释所称「固定到 lemoncat-cn 专属 label」与代码不符（代码里从未出现该 label）；且其成因——家里机缺 bash/git——已于 2026-09-09 08:20 消除（Git 2.55 装到 E:\Git，runner 进程内 git / bash 实测均可见，当日 lhb / stock_quote / selfhosted 链全部 success）。
    # 🔴 2026-08-21 22:00 根因修复（主人令「一劳永逸」）：120 分钟不够。
    #   实测对比：15:30 派发那轮因未到 18:00，run_algorithms 把 20+ 个选股脚本全跳过，
    #   step「运行盘后算法链」只用 45-49 分钟；而 18:00 后那轮选股脚本全放行
    #   （calc_crds / build_candidate_pool / calc_stock_rps / generate_top10 /
    #     strategy_four_volume(_60m) / gen_triple_consensus / final_recommend /
    #     auto_run_dn_algorithm / track_h_auto_buy ... 单脚本 subprocess timeout 1800s），
    #   耗时显著更长（今晚 20:26 那轮 step 7 单步已跑 90+ 分钟）。
    #   120 分钟会在收尾推送前被强杀 → 整轮 90 分钟计算成果全丢、最终推荐依旧缺失。
    #   放宽到 200 分钟，留足「计算 + 桥接 + 候选池行情 + 推送」全链余量。
    # 🔴 2026-09-02 主人令「必须每天晚上出数据！放宽限制」：原 200min 在 final_recommend
    #   （run_algorithms 末步）前被强杀 -> FINAL_RECOMMEND 滞留盘前版。GitHub Actions 单 job
    #   硬上限 360min，直接顶满 360，并配套把下方 run_algorithms 步级抬到 320 接住 final_recommend。
    timeout-minutes: 360
    env:
      # 🔴 2026-08-06 00:10 必须保留：云端 runner 默认 UTC，脚本里凡是用朴素 datetime.now()
      #   写的 update_time 会比北京时间慢 8 小时（run#31021842600 实测：lhb_data/candidate/
      #   inst_trade 写成 15:5x，实际是 23:5x），前端「更新于」相对时间会整体错一个时区，
      #   新鲜度守卫在北京 00:00-08:00 还会把当天数据误判成昨天。
      #   显式声明时区后，朴素 now() 即北京时间，与中国节点产出完全一致。
      #   （显式带 tzinfo 的写法不受本变量影响，不会双重偏移。）
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ⛔️ 2026-08-14 主人令永久修复：WorkBuddy safe-delete 批量删除守卫默认阈值 50
      #   （alimi-cn 实测 966 文件，100% 被拦、所有 [self-hosted, cn] workflow 必须显式抬到 2000。
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 2000
      V8_PUSH: "1"
      # 2026-08-29 周末审计：手动 dispatch 带 force_run=true 时置 1，run_algorithms 时间门控直接放行
      V8_FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '' }}
      # 2026-09-02 紧急补：手动 dispatch 带 bypass_time_gate=true 时置 1，绕过「选股须≥18:00 CST」守门(凌晨/盘前应急补跑)
      TIME_GATE_BYPASS: ${{ github.event.inputs.bypass_time_gate == 'true' && '1' || '' }}
      SKIP_MOOTDX: "1"
      # 2026-08-13 修复：云端 runner 必须走腾讯 GTimg 数据源(mootdx/东财在境外不稳定)，
      # 与 scanner.py 的 GITHUB_ACTIONS 自动识别形成双保险，防止 A股活跃股池缺失。
      CLOUD_RUNNER: "true"
      # 🔴 2026-08-20 根因修复：本 workflow 就是 run_algorithms 的 runner，必须允许
      #    api_push_raw.py 推送算法产物（backtest_*/cockpit_backtest* 等），
      #    否则策略回测/LHB_7D 等卡片永远 stale。  # 2026-09-03 驾驶舱回测卡已下线cloud_fetch 不设置。
      PUSH_ALGO_RAW: "1"
      # 2026-08-28 主人令：mahoro 数据源不再跟踪，MAHORO_COOKIE/MAHORO_ACTION/MAHORO_CODE 已移除
      # 外资研投(知识星球) token：与小九本地 data/zsxq_token.json 同值。
      # 设置路径：GitHub 仓库 → Settings → Secrets → Actions → ZSXQ_TOKEN
      ZSXQ_TOKEN: ${{ secrets.ZSXQ_TOKEN }}
      # 🛡 2026-08-19 一劳永逸根因修复：cn runner 默认 GBK 终端，algorithms/* 270 处 print 含 emoji
      # （📅✅❌⚠️🔗💹🌐…）全部会 UnicodeEncodeError crash，整条 19:15 盘后算法链 0 执行，
      # 17 张盘后/选股卡停在 08:27 红卡。PYTHONIOENCODING=utf-8 是 Python 官方做法，
      # 对所有 print/file-open/f-string 一刀切彻底免疫，不需逐脚本 reconfigure。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      # 🔴 2026-08-21 19:2x 一劳永逸根因修复（主人令）：
      #   本 job 的 runs-on 已于 08-20 从 [self-hosted, cn] 改成 ubuntu-latest，
      #   而「经 GitHub API 同步源码（绕开 cn git 墙）」是给被墙的 cn runner 写的遗留方案。
      #   在 GitHub 云端 runner 上 git 直连本来毫无障碍，却仍逐 blob 拉全仓上千文件
      #   （空目录起步 → 本地 sha 全不命中 → 每个文件一次 blob API）：
      #     - 正常时慢（数分钟），逼近 10 分钟 timeout；
      #     - 一旦有并发（今日 11-20 个 run）立刻打爆 secondary rate limit → 全量 403 →
      #       每文件 6 次重试 + 20s 惩罚 → 必然 10 分钟超时 → 算法链 100% 失败。
      #   改为标准 actions/checkout@v4（秒级、0 次 blob API），API 同步只在 checkout
      #   失败时作回退（保留给将来切回 cn 自托管 runner 被墙的场景）。
      - name: "📥 Checkout 源码（云端 git 直连，秒级）"
        id: co
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 回退：仅当上一步 checkout 失败才走 REST API 同步（cn runner 被墙场景）。
      #   2026-08-16 首次引入；blob 下载带 sha 校验防截断，大文件未变则跳过。
      - name: "📥 回退·经 GitHub API 同步源码（仅 checkout 失败时）"
        if: steps.co.outcome == 'failure'
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          cat > "$RUNNER_TEMP/sync_src_v8cloud.py" <<'PYEOF'
          import os, base64, json, hashlib, urllib.request, time, sys
          token = os.environ["GITHUB_TOKEN"]
          REPO = "ah-quant999/quant-scanner-v8"
          H = {"Authorization": "Bearer " + token,
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28"}

          def local_blob_sha(path):
              try:
                  data = open(path, "rb").read()
              except Exception:
                  return None
              h = hashlib.sha1()
              h.update(("blob %d\0" % len(data)).encode())
              h.update(data)
              return h.hexdigest()

          def sha_of(data):
              h = hashlib.sha1()
              h.update(("blob %d\0" % len(data)).encode())
              h.update(data)
              return h.hexdigest()

          def get_json(url, tries=6):
              last = None
              for i in range(tries):
                  try:
                      return json.load(urllib.request.urlopen(
                          urllib.request.Request(url, headers=H), timeout=120))
                  except Exception as e:
                      last = e
                      print("  retry %d: %s" % (i + 1, e), flush=True)
                      time.sleep(min(2 ** i, 20))
              raise SystemExit("API fetch failed: %s (%s)" % (url, last))

          def fetch_blob(sha, tries=6):
              url = "https://api.github.com/repos/%s/git/blobs/%s" % (REPO, sha)
              raw_h = dict(H); raw_h["Accept"] = "application/vnd.github.raw"
              last = None
              for i in range(tries):
                  mode = "raw" if i % 2 == 0 else "b64"
                  try:
                      hdr = raw_h if mode == "raw" else H
                      resp = urllib.request.urlopen(
                          urllib.request.Request(url, headers=hdr), timeout=180)
                      body = resp.read()
                      data = body if mode == "raw" else base64.b64decode(json.loads(body.decode())["content"])
                      if sha_of(data) != sha:
                          raise ValueError("sha mismatch (truncated?) got %d bytes" % len(data))
                      return data
                  except Exception as e:
                      last = e
                      print("  blob retry %d [%s]: %s" % (i + 1, mode, e), flush=True)
                      time.sleep(min(2 ** i, 20))
              raise SystemExit("blob fetch failed: %s (%s)" % (sha, last))

          tree = get_json("https://api.github.com/repos/%s/git/trees/main?recursive=1" % REPO)
          want = []
          for e in tree.get("tree", []):
              if e.get("type") != "blob":
                  continue
              p = e["path"]
              if p.startswith(".git/"):
                  continue
              want.append((p, e["sha"]))
          print("files to sync: %d" % len(want), flush=True)
          ok = 0; skipped = 0
          for p, sha in want:
              lp = os.path.join(".", p)
              if local_blob_sha(lp) == sha:
                  skipped += 1; ok += 1; continue
              try:
                  data = fetch_blob(sha)
              except SystemExit:
                  # 容错：任何文件下载失败都跳过而非整步死掉（非关键文件缺失好过全链阻塞）
                  print("  SKIP failed download: %s" % p, flush=True)
                  ok += 1; continue
              parent = os.path.dirname(lp)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(lp, "wb") as f:
                  f.write(data)
              ok += 1
          print("OK source sync done: %d/%d (unchanged: %d)" % (ok, len(want), skipped), flush=True)
          PYEOF
          python "$RUNNER_TEMP/sync_src_v8cloud.py"

      # 🛡 2026-08-29 统一交易日历中枢：所有下游脚本通过 V8_DATA_DATE 取「数据应属日期」，
      #   根治非交易日跑批把日期错标成「今天」的冒充今日问题。
      # 🛡 2026-09-11 一劳永逸（run#1692 实测坐实）：自托管 runner 的仓库目录属主与
      #   执行步骤用户不一致（实测 D:\actions-runner-v8\_work\quant-scanner-v8\... 属
      #   NT AUTHORITY/NETWORK SERVICE，而步骤跑在 NT AUTHORITY/SYSTEM），git 直接拒绝
      #   一切操作：`fatal: detected dubious ownership in repository` → exit 128。
      #   后果链：链尾「唯一推送」的清单收集第一个 git 命令就 128 → 整步失败 →
      #   B 批 84 分钟成果零推送 → TOP10_DAILY / FINAL_RECOMMEND_DATA /
      #   V8_POOL_TRACKER / BACKTEST_COMPREHENSIVE 四个模块整日停更。
      #   修法：在任何业务步骤之前把工作区加入 git 安全目录白名单（幂等），并当场自证。
      - name: "🔧 修复 git 安全目录（自托管 runner 属主不一致）"
        if: steps.co.outcome == 'success'
        shell: bash
        run: |
          set +e
          git config --system --add safe.directory '*' 2>/dev/null
          git config --global --add safe.directory '*' 2>/dev/null
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git status --porcelain >/dev/null 2>&1; then
            echo "✅ git 可用（safe.directory 已就绪；自托管 runner 属主不一致已绕过）"
          else
            echo "::error title=v8-git-unusable::git 在本机不可用（safe.directory 修复后仍失败）—— 链尾推送必失败，拒绝继续"
            exit 1
          fi

      - name: "🗓 解析数据日期"
        id: data_date
        shell: bash
        run: |
          DATA_DATE=$(python -c "import v8_date; print(v8_date.today_data_date())")
          echo "data_date=$DATA_DATE" >> "$GITHUB_OUTPUT"
          echo "V8_DATA_DATE=$DATA_DATE" >> "$GITHUB_ENV"
          echo "📅 数据日期=$DATA_DATE"

      # 🔴 2026-08-16 根治：原「硬编码 Python 3.12 路径」探测在 alimi-cn runner 上找不到
      #   → 整条算法链在第一步就 exit 1（连续 5 次 failure，大牛股猎手/RPS/四量终极等全部停更）。
      #   数据抓取链 v8_cn_fetch_cloud.yml 早已改回 actions/setup-python@v5 + 3.13 且稳定成功，
      #   证明 setup-python 在当前 cn runner 上可用（旧「无法下载」注释已过时）。直接对齐之。
      - name: "🐍 配置 Python (setup-python 3.13)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 🔴 2026-08-12 第173轮根因修复：本步骤原先「只用清华镜像 + || true 吞失败」，
      #   GitHub 云端 runner 是境外 IP，访问清华镜像会间歇性拿到**空索引**：
      #     ERROR: Could not find a version that satisfies the requirement akshare
      #            (from versions: none)
      #   （run#94 08-12 15:39 真实日志，install 仅 5 秒即快速失败）
      #   → `|| true` 把 pip 失败吞掉 → 末行 import 校验 ModuleNotFoundError → 本步骤
      #   exit 1 → **整条盘后算法链 job 直接 fail，算法一行没跑** → 7 张盘后/选股卡
      #   (市场温度计/六维共振雷达/候选池/机构买卖/三重共识/逆势龙头（已去除 cockpit/allsite/hunter）)
      #   停在上午 09:08 不刷新，逆势龙头更是停在 08-11 17:09。
      #
      #   决定性佐证：同为云端的姊妹 workflow v8_cn_fetch_cloud.yml 用的是**官方 PyPI
      #   （无镜像）**，同一时刻 15:33 success；本 workflow 用清华镜像 15:39 fail。
      #   云端 runner 在 GitHub 内网，官方 pypi.org 才是最快最稳的源，中国镜像只作兜底
      #   （清华/阿里云镜像仍保留给 cn 自托管 runner 的 v8_algo_run.yml / v8_cn_fetch.yml 用）。
      #
      #   策略：官方源优先 → 清华 → 阿里云，每源重试 2 次，逐源做 import 实证校验；
      #   三源全灭才 exit 1（此时确属真故障，必须显式失败而不是被 || true 掩盖）。
      - name: "📦 安装 A股依赖（官方 PyPI 优先 + 双镜像兜底 + 重试）"
        run: |
          CORE="akshare pandas numpy requests baostock"
          ok=0
          for IDX in "https://pypi.org/simple" \
                     "https://pypi.tuna.tsinghua.edu.cn/simple" \
                     "https://mirrors.aliyun.com/pypi/simple"; do
            for TRY in 1 2; do
              echo "=== pip install core [index=$IDX try=$TRY] ==="
              if python -m pip install -q --retries 3 --timeout 60 -i "$IDX" $CORE; then
                if python -c "import akshare, pandas, numpy, requests"; then
                  echo "core deps OK via $IDX (try=$TRY)"
                  ok=1
                  break
                fi
                echo "!! pip 退出码 0 但 import 校验未通过，继续换源/重试"
              fi
              echo "!! [$IDX] 第 $TRY 次安装失败"
            done
            # 注：GitHub 的 run: 默认 `bash -e`，此处用显式 if 而非 `[ ... ] && break`，
            # 避免依赖 `set -e` 对 && 列表首命令失败的豁免语义（易踩坑）。
            if [ "$ok" = "1" ]; then break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::核心依赖安装失败（官方 PyPI / 清华 / 阿里云 各试 2 次全灭）"
            exit 1
          fi
          # mootdx 为可选依赖（本 workflow SKIP_MOOTDX=1 不使用），装不上不阻断
          pip install -q --retries 2 --timeout 40 mootdx \
            || pip install -q --retries 2 --timeout 40 -i https://pypi.tuna.tsinghua.edu.cn/simple mootdx \
            || echo "mootdx 未安装（可选依赖，SKIP_MOOTDX=1 不影响算法链）"
          python -c "import akshare, pandas, numpy, requests; print('deps ready')"

      # 🔒 2026-09-10 主人令「一劳永逸·发现前面错了就该退回拒绝之后执行并紧急报告」：
      #   事故根因：stage 由「CST 小时盲猜」（16/17→A 18/19→B 20→D 21→E）。
      #   21:00 的 E(回测) cron 于 21:07 触发时，完全不管 B(选股)/D(汇总) 跑没跑，
      #   拿凌晨陈旧数据跑回测；而 16:40/18:10/20:00 三轮被闸门静默跳过（假成功）→
      #   整晚只剩一个毫无意义的回测，「最终推荐」被回退。
      #   新逻辑：显式 inputs.stage 优先，否则「缺什么跑什么」；上游未就绪 → 拒绝执行 + 红灯。
      # 🔒 2026-09-10 主人令「一劳永逸·简化优化·不缺档·不抢跑」：
      #   唯一决策点 = .github/scripts/v8_stage_gate.py
      #   （已删：按小时盲猜 stage / 静默闸门V5 / 探针路由 / 独立日历判定 四处历史设计）
      - name: "🔒 批次闸门（日历 + 上游顺序 + 内容级就绪 · 唯一决策点）"
        id: gate
        if: always()
        run: |
          set +e
          EX_STAGE="${{ github.event.inputs.stage || github.event.client_payload.stage || '' }}"
          # force_run / bypass_time_gate 一律只表示「忽略时间门控」，**绝不改变跑哪批**
          #   （跑哪批永远由内容级就绪判定 —— 防止 force 派发重跑 A 批冲掉已到手的龙虎榜）
          FORCE=""
          { [ "${{ github.event.inputs.force_run }}" = "true" ] || [ "${{ github.event.inputs.bypass_time_gate }}" = "true" ]; } && FORCE="--force"
          OUT=$(python .github/scripts/v8_stage_gate.py --root . --explicit-stage "$EX_STAGE" $FORCE)
          echo "$OUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          OK=$(printf '%s' "$OUT" | grep -m1 '^stage_ok=' | cut -d= -f2)
          TGT=$(printf '%s' "$OUT" | grep -m1 '^target_stage=' | cut -d= -f2)
          REASON=$(printf '%s' "$OUT" | grep -m1 '^reason=' | sed 's/^reason=//')
          # 🛡 闸门自身异常必须红灯（否则下游全 skip = 假绿灯，又是"什么都没跑却全绿"）
          if [ -z "$TGT" ] || [ -z "$OK" ]; then
            echo "::error title=v8-stage-gate-crash::批次闸门未产出判定（脚本异常/输出解析失败）—— 拒绝放行，请排查"
            echo "target_stage=NONE" >> "$GITHUB_OUTPUT"
            echo "stage_ok=false"    >> "$GITHUB_OUTPUT"
            echo "proceed=false"     >> "$GITHUB_OUTPUT"
            exit 1
          fi
          {
            echo "## 🔒 v8 批次闸门（唯一决策点）"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 目标批次 | **${TGT}** |"
            echo "| 是否放行 | **${OK}** |"
            echo "| 判定 | ${REASON} |"
            echo ""
            printf '%s\n' "$OUT" | grep -E '^(proceed=|chain_|ready_|cst_hour=)' | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$OK" != "true" ]; then
            echo "::error title=v8-stage-gate-blocked::上游未就绪，已拒绝执行 ${TGT} 批 —— ${REASON}"
            exit 1
          fi
          if [ "${TGT:-NONE}" = "NONE" ]; then
            echo "::notice title=v8-stage-gate-noop::${REASON}"
          fi
          echo "🚦 目标批=${TGT} 放行=${{ steps.gate.outputs.proceed }}（${REASON}）"

      - name: "🧮 运行盘后算法链（写入 raw_data/，推送由链尾统一执行）"
        id: algo
        if: steps.gate.outputs.proceed == 'true'
        # 🔴 2026-08-30 23:3x 抬高步级墙钟 90 → 150（实测 run 33316835316 坐实）：
        #   周末 force_run 全量补算时，本步跑到 70 分钟仍未完成，距 90 分钟限时仅剩
        #   20 分钟——一旦超时被硬杀，后续 bridge / ALGO_TRACK / 兜底推送 / **产物完整性
        #   闸门** 全部 skipped，整轮算法白跑（这正是「推送步拖死 job」的同构问题，
        #   见批次 H 对 7 个 workflow 的统一修法）。
        #   job 级共 200 分钟，抬到 150 后仍给后续 5 步留足 50 分钟余量，不会挤占。
        # 🔴 2026-09-02 主人令「放宽限制」：原 150min 步级墙在 final_recommend 前掐断
        #   （run_algorithms 内部 final_recommend 是末步，subprocess timeout 1800s；实测前面选股
        #   脚本占 90-120min 后余量不足 -> final_recommend 被强杀）。抬到 320min，前面 120min
        #   + final 30min 仍富余；job 级已同步顶满 360min 接住本步 + 后续 bridge/推送/?v/闸门。
        timeout-minutes: 320
        run: |
          set +e
          # 🔴 2026-09-02 主人令「分批跑」：schedule 触发按 CST 小时分派 stage。
          # 🔴 2026-09-04 dispatch 分批改造（主人令，防风暴查证通过后实施）：
          #   此前 dispatch/repository_dispatch 一律跑全链 9-12h——slot_scheduler 兜底派发
          #   每轮都是全链（job 360min 上限大概率被掐断白跑，FINAL_RECOMMEND 曾拖到 05:37）。
          #   现改为：inputs.stage 显式指定优先（all=全链应急，repository_dispatch 可带
          #   client_payload.stage）；未指定时 schedule 与 dispatch/repo_dispatch 一律按
          #   CST 小时进批。不新增任何派发者（slot_scheduler/patrol 节拍与三重防风暴
          #   闸门不变），只改派发产物的 run 形态（9-12h 全链 → 1-2h 批次）。
          #   22/23 及夜间小时不进批（防 20:00 D 批漂移到 23:0x 后按小时误进 E 批、
          #   当晚 final_recommend 丢失），仍全链兜底。
          # 🔒 2026-09-10 主人令「一劳永逸·发现前面错了就该退回拒绝之后执行并紧急报告」：
          #   原「按 CST 小时盲猜 stage」已废弃 —— 21:00 的 E cron 不管 B/D 跑没跑就用陈旧数据跑回测。
          #   现 stage 由 gate step（.github/scripts/v8_stage_gate.py）判定：
          #     显式 inputs.stage 优先；否则「缺什么跑什么」；上游未就绪则 gate 已红灯退出、本步不执行。
          STAGE="${{ steps.gate.outputs.target_stage }}"
          HH=$(python -c "import datetime as d;print((d.datetime.now(d.timezone.utc)+d.timedelta(hours=8)).hour)")
          echo "🎯 event=${GITHUB_EVENT_NAME} CST=${HH:-?} → stage=${STAGE:-ALL}（闸门：${{ steps.gate.outputs.reason }}）"
          if [ "$STAGE" = "ALL" ]; then STAGE=""; fi   # 显式全链应急
          if [ -n "$STAGE" ]; then
            python algorithms/run_algorithms.py --stage "$STAGE"
          else
            python algorithms/run_algorithms.py
          fi
          ALGO_EXIT=$?
          echo "algo exit: ${ALGO_EXIT}"
          # 🛡 2026-08-28 一劳永逸：原写法只 echo 不留存，退出码随风消散。
          #   现写入 GITHUB_ENV 供链尾闸门 step 展示。
          #   注意：退出码**不能**作为成败判据——run_algorithms 内部对每个脚本
          #   continue-on-error，脚本失败时退出码往往仍是 0。真正的成败判定
          #   交由链尾「产物完整性闸门」按数据(update_time)说了算。
          echo "ALGO_EXIT=${ALGO_EXIT}" >> "$GITHUB_ENV"
          # run_algorithms 内部每个脚本 continue-on-error，整体退出码不代表全失败；
          # 但推送是否落地是唯一可靠判据（2026-08-22 实证：final_recommend 23:34 已生成，
          # 建 tree 422 推送失败被 exit 0 吞掉 → job 假 success → 线上 FINAL_RECOMMEND 停 08-20）。
          # 显式再跑一次 api_push_raw（来源驱动增量、幂等），严格退出码：
          # 推送失败即让 job 失败，dispatch_guard 才能感知并重试，杜绝假 success。
          # 2026-08-22 来源驱动：git status 收集本次 changed 作清单，避免与 run_algorithms
          # 内部 step_push 重复全量 848 扫描（与 api_push_raw PUSH_FILES 配合，422 根治闭环）。
          # 2026-09-03 派发风暴去重（B·小九接手）：算法链盘后产物同理剥时间戳比对，仅时间戳变的伪变更不进 PUSH_FILES
          #   脚本失败则回退原 git status 清单（安全优先，绝不漏推真数据）
          echo "ℹ️ 推送已统一收敛到链尾「📤 唯一推送」步（一次链只推一次，避免 Pages 构建风暴）"

      # 🛡 2026-08-18 主人紧急令根治：算法链收尾前先做 4 件事，确保 data/*.js 与 HEALTH_CHECK.js
      #   必刷新——bridge_raw_data 防 raw_data 内部改名断点（如 triple_resonance_history → triple_history），
      #   update_v8 重生成 data/*.js，v8_health_check 刷新 HEALTH_CHECK.js。
      - name: "🔗 桥接 raw_data 内部改名（bridge_raw_data.py）"
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python algorithms/bridge_raw_data.py || true

      # 2026-08-08 修复：算法链产出 candidate.json 后，立即刷新候选池行情，
      # 避免 runner 状态卡 CANDIDATE_QUOTES 长期显示「空」。
      - name: "📈 刷新候选池行情（CANDIDATE_QUOTES）"
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python cloud_fetch_v8.py --only CANDIDATE_QUOTES || true

      - name: "📤 唯一推送（本链只此一处推送 data/ 与 raw_data/，严格退出码）"
        if: steps.gate.outputs.proceed == 'true'
        run: |
          # 2026-08-22 根因⑪收口：去掉 || true —— 推送失败必须让 job 失败，
          # 否则「算法链算完但推送 422 失败」永远被假 success 掩盖。
          # 2026-08-22 来源驱动增量：只推本次 changed，避免全量 848 扫描。
          # 2026-09-03 派发风暴去重（B·小九接手）：算法链盘后产物同理剥时间戳比对，仅时间戳变的伪变更不进 PUSH_FILES
          #   脚本失败则回退原 git status 清单（安全优先，绝不漏推真数据）
          # 🛡 2026-09-11 一劳永逸（run#1692 实证）：原写法把「清单不可得」误判成「无变更」。
          #   自托管 runner 上 git 属主冲突 → dedup 脚本与回退 git status 双双失败 →
          #   脚本被 `-e` 立刻终止（exit 128），**B 批 84 分钟成果零推送**。
          #   现三态严格区分：
          #     ① 拿到清单（且非空）→ 增量推送
          #     ② 确认无变更        → 跳过（合规空转）
          #     ③ 清单不可得        → **绝不跳过**，交 api_push_raw 全量来源驱动
          #        （它与远端 tree 逐 blob 比对，完全不依赖本地 git）
          MANIFEST=""; MANIFEST_OK=0
          if MANIFEST=$(python .github/scripts/dedup_fetch_manifest.py raw_data/ data/ 2>/dev/null); then
            MANIFEST_OK=1
          elif MANIFEST=$(git status --porcelain raw_data/ data/ 2>/dev/null | awk '{print $2}' | tr '\n' ','); then
            MANIFEST_OK=1
          fi
          if [ "$MANIFEST_OK" = "1" ] && [ -n "$MANIFEST" ]; then
            echo "📋 本次变更清单: ${MANIFEST:0:200}"
            PUSH_FILES="$MANIFEST" python api_push_raw.py
          elif [ "$MANIFEST_OK" = "1" ]; then
            echo "ℹ️ 确认无 raw_data/data 变更，跳过推送"
          else
            echo "⚠️ 变更清单不可得（本地 git 不可用）→ 全量来源驱动推送（api_push_raw 自行与远端 tree 比对，不依赖 git）"
            python api_push_raw.py
          fi

      # 🔴 2026-08-15 防覆盖铁律修复：run_algorithms 刚重写 data/ALGO_TRACK.js（带新时间戳），
      #   但 index.html 的 ?v 不会自动跟着变 → CDN 吐旧 ALGO_TRACK 副本。
      #   此步只在算法链收尾重算 ALGO_TRACK.js 的 ?v 并推送 index.html（Contents API，避开 cn git 墙）。
      #   只改 ALGO_TRACK 一项，不碰 COMMODITY 等（避免用陈旧本地文件覆盖 build/deploy 已对齐的 ?v）。
      - name: "🔄 同步 ALGO_TRACK 缓存戳 ?v 并推送 index.html"
        if: steps.gate.outputs.proceed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, re, hashlib, base64, json, urllib.request
          TOK = os.environ["GITHUB_TOKEN"]
          REPO = "ah-quant999/quant-scanner-v8"
          API = "https://api.github.com/repos/" + REPO
          H = {"Authorization": "Bearer " + TOK, "Content-Type": "application/json", "Accept": "application/vnd.github+json"}
          ROOT = "."
          idx = os.path.join(ROOT, "index.html")
          html = open(idx, encoding="utf-8").read()
          p = os.path.join(ROOT, "data", "ALGO_TRACK.js")
          # ★ 2026-08-16 审计修复：必须与 build/reconcile 的 ?v 计算逐字符一致——
          #   ① 取原始字节（非 read().encode()，避免 Windows CRLF→LF 归一化致 sha 偏移）；
          #   ② 中性化 republish_time 构建时间戳（_write_js 每次注入，否则 ?v 随构建时刻漂）。
          #   否则写出的 ?v 与 reconcile 算出的不一致 → ALGO_TRACK 缓存戳失配 → CDN 吐旧副本。
          if os.path.exists(p):
              _b = open(p, "rb").read()
              _neutral = re.sub(rb'"republish_time"\s*:\s*"[^"]*"', b'"republish_time":""', _b)
              t = hashlib.sha1(_neutral).hexdigest()[:10]
          else:
              t = ""
          if not t:
              print("ALGO_TRACK.js 缺失，跳过")
              raise SystemExit(0)
          new = re.sub(r'(ALGO_TRACK\.js)\?v=\w+', r'\1?v=' + t, html)
          if new == html:
              print("ALGO_TRACK ?v 已是最新，无需推送")
          else:
              open(idx, "w", encoding="utf-8").write(new)
              meta = json.loads(urllib.request.urlopen(urllib.request.Request(API + "/contents/index.html?ref=main", headers=H)).read())
              body = json.dumps({"message": "chore: 算法链后同步 ALGO_TRACK ?v（防覆盖）", "content": base64.b64encode(new.encode()).decode(), "sha": meta["sha"]}).encode()
              req = urllib.request.Request(API + "/contents/index.html", data=body, headers=H, method="PUT")
              print("push index.html ALGO_TRACK ?v:", urllib.request.urlopen(req).getcode(), "v=", t)
          PY

      # 🛡 2026-08-28 一劳永逸（主站审计 P0-1 根治）：链尾「产物完整性闸门」
      #
      #  背景——2026-08-28 实测「跑一半没人知道」：
      #    本 workflow 全部 step 绿、job success，但核心选股产物实际停在昨晚/前天：
      #      CANDIDATE(候选池)   停 08-26 22:36 → 1.9 天（选股链上游）
      #      CRDS(逆势龙头)      停 08-27 19:53
      #      STOCK_RPS(相对强度)  停 08-27 19:58
      #      FINAL_RECOMMEND     停 08-27 21:02
      #    而 TOP10 / 三重共识 / 四量 却已刷新 → 典型「上游不动、下游全停」。
      #
      #  三重叠加根因：
      #    ① run_algorithms.py 对每个脚本 continue-on-error，单脚本失败只打一行
      #       「⚠️ 退出码 N」，无人看、无汇总、无告警；
      #    ② 本 workflow 用 `set +e` + `echo "algo exit: $?"` 显式丢弃退出码；
      #    ③ 整条链没有任何「产物是否真产出了」的校验环节。
      #
      #  修复：链尾按**文件内容里的 update_time** 校验核心产物是否本交易日产出。
      #  ⚠️ 刻意不用文件 mtime —— actions/checkout 会把所有文件 mtime 重置为
      #     checkout 时刻，未更新的文件 mtime 同样「新」，用 mtime 会 100% 误判新鲜。
      #
      #  缺失/陈旧 → exit 1 → job 显式失败 → 既有告警链路（runner_health_alert /
      #    v8_ops_watch）可见；同时写 $GITHUB_STEP_SUMMARY + raw_data/algo_chain_report.json，
      #    让主人一眼看到断在哪一环，而不是对着全绿的 job 发呆。
      # ============================================================
      #  2026-09-08 一劳永逸（主人令「一劳永逸式修复」·C 收敛版·阿狸咪暗灯审计跟进）
      #    ── 算法链「结构一致性」机器校验，作为收尾硬性闸门 ──
      #  背景：阿狸咪夜班只读审计发现 4 个「暗灯」（体检 freshness_status.json 扫不到）+ 6 类
      #    系统性漏洞，根因之一是 run_algorithms 的 ORDER/STAGES 双表靠人工同步、极易漏挂，
      #    漏挂一个即 import 即崩（09-08 P0 教训：gen_lhb_7d 漏挂 ORDER）。
      #  本步骤在每次全链跑完做机器校验：
      #    ① STAGES↔ORDER 双表一致（不一致 → exit 1，防 P0 回潮）
      #    ② 无孤儿脚本（声明在 ORDER 但 DATA_SOURCES 无映射 / 反之 → 告警）
      #    ③ 无数据断链（raw 有更新但 data/*.js 未重建 → 告警）
      #    ④ 无映射悬空（DATA_SOURCES 声明但 data/*.js 缺失 → 告警）
      #  失败即 job 失败，告警链路可见，杜绝「漏挂/断链」类暗灯再悄悄上线。
      # ============================================================
      - name: "🛡 机器校验（结构一致性 + 数据失真体检）"
        if: steps.gate.outputs.proceed == 'true'
        run: |
          # 两个只读校验合并为一步：任一不过 → 本步红（退出码非 0），告警链路可见。
          #   ① verify_chain_consistency.py  STAGES↔ORDER 双表一致 / 孤儿 / 断链 / 悬空
          #   ② verify_data_sanity.py        旧装新 / 数值越界 / 整表空
          RC=0
          python algorithms/verify_chain_consistency.py || RC=1
          python algorithms/verify_data_sanity.py --no-baseline || RC=1
          if [ "$RC" != "0" ]; then
            echo "::error::机器校验未通过（结构不一致 或 数据失真），详见上方报告"
          fi
          exit $RC

      # ============================================================
      #  2026-09-10 主人令「假成功必须杜绝」·结果问责（一劳永逸）
      #   背景（09-10 实证）：盘后 15:47~18:57 六轮 workflow 全部 success，
      #   实测一步没跑（runner 时区被忽略 → 闸门误判「6-15 点无效时段」静默跳过）。
      #   本步骤把「静默跳过 / 跑完无产出」从"绿色成功"变成**可见告警或红灯**：
      #     · 非交易日 / 盘中档 / 三模块已新鲜 / A·E 批 → notice（合规，不算失败）
      #     · 交易日盘后档：链没跑 或 跑了但三模块仍不新鲜 → ::error + exit 1
      #       （这正是假成功 —— 必须红，不能再让"什么都没产出"的 run 绿灯放过）
      #   凌晨 00:00-05:59 属回填窗口（产物可能刚产出、日期是今天），放宽到任意时刻。
      #   只读 data/*.js，绝不改数据。
      # ============================================================
      - name: "🛡 结果问责（按目标批次 + 产物完整性 · 杜绝假成功）"
        if: always()
        run: |
          set +e
          TGT="${{ steps.gate.outputs.target_stage }}"
          OK="${{ steps.gate.outputs.stage_ok }}"
          PROCEED="${{ steps.gate.outputs.proceed }}"
          OUTCOME="${{ steps.algo.outcome }}"
          KIND="${{ steps.gate.outputs.chain_kind }}"
          DAY="${{ steps.gate.outputs.chain_day }}"
          HHMM=$(python -c "import datetime as d;print((d.datetime.now(d.timezone.utc)+d.timedelta(hours=8)).strftime('%H:%M'))")
          # 就绪复核：与批次闸门**同一判据同源代码**（v8_stage_gate.py --recheck），
          #   绝不在链尾另写一套新鲜度规则 —— 两套规则必然漂移（历史教训）。
          CHK=$(python .github/scripts/v8_stage_gate.py --root . --recheck --today "$DAY" 2>/dev/null)
          B_FRESH=$(printf '%s' "$CHK" | grep -m1 '^ready_B=' | cut -d= -f2)
          D_FRESH=$(printf '%s' "$CHK" | grep -m1 '^ready_D=' | cut -d= -f2)
          RC=0

          echo "问责输入: 目标批=${TGT:-?} 闸门放行=${OK:-?} 执行标志=${PROCEED:-?} 算法步骤=${OUTCOME:-?} 数据日=${DAY:-?}(${KIND:-?}) CST=${HHMM} B三模块=${B_FRESH:-?} D最终推荐=${D_FRESH:-?}"
          { echo "### 🛡 盘后算法链结果问责"; echo ""; echo "| 项 | 值 |"; echo "|---|---|";
            echo "| 目标批次 | **${TGT:-?}** |"; echo "| 闸门放行 | ${OK:-?} |";
            echo "| 执行标志 proceed | ${PROCEED:-?} |"; echo "| 算法链结果 | ${OUTCOME:-?} |";
            echo "| 数据日 | ${DAY:-?} (${KIND:-?}) |"; echo "| 当前 CST | ${HHMM} |";
            echo "| B 批三模块 | ${B_FRESH:-?} |"; echo "| D 批最终推荐 | ${D_FRESH:-?} |"; } >> "$GITHUB_STEP_SUMMARY"

          if [ "${KIND:-none}" = "none" ]; then
            echo "::notice title=v8-algo-holiday::休市日（无 T+1 需求），不跑算法链（合规）"; exit 0
          fi
          if [ "$OK" != "true" ]; then
            echo "::error title=v8-algo-gate-blocked::上游未就绪，本批已被批次闸门拒绝执行（目标 ${TGT}）——这不是成功"; exit 1
          fi
          if [ -z "$TGT" ]; then
            echo "::error title=v8-algo-no-gate::批次闸门未产出判定（脚本异常）—— 不能当成功，请排查"; exit 1
          fi
          if [ "${TGT:-NONE}" = "NONE" ]; then
            echo "::notice title=v8-algo-noop-ok::各批产物均已就绪或未到起点，本轮空转（合规）"; exit 0
          fi

          # ① 按目标批次问责
          case "$TGT" in
            B|ALL)
              [ "$B_FRESH" = "3/3" ] || { echo "::error title=v8-algo-stale::${TGT} 批跑完但选股三模块仍非本数据日盘后产出（${B_FRESH}，执行=${OUTCOME:-?}）—— 假成功，必须排查"; RC=1; } ;;
            D)
              [ "$D_FRESH" = "1/1" ] || { echo "::error title=v8-algo-stale::D 批跑完但 FINAL_RECOMMEND 仍非本数据日盘后产出（${D_FRESH}，执行=${OUTCOME:-?}）—— 假成功，必须排查"; RC=1; } ;;
            A|E)
              [ "${OUTCOME:-none}" = "success" ] || { echo "::error title=v8-algo-failed::${TGT} 批执行未成功（${OUTCOME:-?}）"; RC=1; } ;;
          esac

          # ② 产物完整性（raw_data 源头层，选股/汇总/回测/全链适用；A 采集批不产这些，跳过）
          case "$TGT" in
            B|D|E|ALL)
              python algorithms/verify_chain_outputs.py --date "$DAY" || { echo "::error::产物完整性闸门未通过（raw_data 源头层有陈旧/缺失），详见上方报告"; RC=1; } ;;
          esac

          if [ "$RC" = "0" ]; then
            echo "::notice title=v8-algo-ok::${TGT} 批完成，产物核验通过（执行=${OUTCOME:-?}）"
          fi
          exit $RC
