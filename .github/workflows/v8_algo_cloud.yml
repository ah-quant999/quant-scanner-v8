# 九宝量化 v8.0 — 盘后算法链（云端 ubuntu-latest）
#
# 2026-08-05 23:45 创建：cn 自托管 runner 连续 2 天盘后算法链失败——
#   run#16/#17（08-05 18:30/20:00）双双挂在「经 GitHub API 同步源码」步骤，
#   根因是 cn runner 网络层不稳定（git 走 github.com 被连接重置，GitHub API 同步也超时）。
#   与 v8_cn_fetch_cloud.yml 同理，把算法链迁到 GitHub 云端 ubuntu-latest：
#   - 云端 runner 在 GitHub 内网，checkout/clone 无 safe-delete 钩子、无连接重置问题；
#   - 东财镜像/akshare 可达性已由 probe_v8_cn_cloud.yml 实测（10/11 通，唯一 FAIL 是探针函数名写错）；
#   - cn_fetch 云端版 08-05 17:34 已实测跑通 12 模块，同源数据链路可信。
#
# ⚠️ 保留 v8_algo_run.yml（cn runner）仅作 workflow_dispatch 应急回退，其 cron 已移除
#    （防止双跑：两路都会往 main 推 raw_data，同一产物并发会互相覆盖）。
#
# 2026-08-05 23:45 兼容性要点：
#   - actions/checkout@v4 在云端 ubuntu 是标准操作（无 Windows safe-delete 钩子）；
#   - actions/setup-python 提供 python3；
#   - SKIP_MOOTDX=1：云端无通达信接口，直走 akshare；
#   - V6_SEED 不设（默认 0，v8 已原生化，不依赖 v6 路径 E:\...）；
#   - GITHUB_TOKEN 由云端自动注入，api_push_raw.py 走 Contents API 推送。

name: "☁️ v8 盘后算法链(云端)"

on:
  # 🔴 2026-08-06 21:00 收敛 4→1：GitHub Actions 单 workflow 多条 cron 存在静默失效问题
  #   （cn_fetch_cloud 17→5 收敛后恢复触发；本 workflow 4 条 cron 自创建起 0 次 schedule 触发，
  #    仅 workflow_dispatch 可用）。算法链一次跑完所有产物（候选池/黄金池/三重共识/回测），
  #   只需 18:30 主档成功一次即可；冗余兜底由「本机 WorkBuddy 每30分检查 + dispatch」承担，
  #   不再依赖 GitHub schedule 多条冗余。
  schedule:
    # 2026-08-15 一劳永逸修复：cron 从 1-5 改为每天，内部用 A 股交易日历判断，
    # 非交易日自动跳过，避免周末/节假日无意义覆盖，同时覆盖调休上班日（股市开市）。
    - cron: '30 10 * * *'  # 18:30 CST 每天触发，内部交易日历 gate
  workflow_dispatch:
    inputs:
      mahoro_action:
        description: 'maharo 刷新动作: none / send-code(发码到邮箱) / verify(用码登录)'
        type: string
        required: false
        default: 'none'
      mahoro_code:
        description: 'maharo 验证码（verify 时使用，留空则发码）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  algo:
    runs-on: [self-hosted, cn]
    timeout-minutes: 120
    env:
      # 🔴 2026-08-06 00:10 必须保留：云端 runner 默认 UTC，脚本里凡是用朴素 datetime.now()
      #   写的 update_time 会比北京时间慢 8 小时（run#31021842600 实测：lhb_data/candidate/
      #   inst_trade 写成 15:5x，实际是 23:5x），前端「更新于」相对时间会整体错一个时区，
      #   新鲜度守卫在北京 00:00-08:00 还会把当天数据误判成昨天。
      #   显式声明时区后，朴素 now() 即北京时间，与中国节点产出完全一致。
      #   （显式带 tzinfo 的写法不受本变量影响，不会双重偏移。）
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ⛔️ 2026-08-14 主人令永久修复：WorkBuddy safe-delete 批量删除守卫默认阈值 50
      #   （alimi-cn 实测 966 文件，100% 被拦、所有 [self-hosted, cn] workflow 必须显式抬到 1000。
      CODEBUDDY_SAFE_DELETE_BULK_THRESHOLD: 1000
      V8_PUSH: "1"
      SKIP_MOOTDX: "1"
      # 2026-08-13 修复：云端 runner 必须走腾讯 GTimg 数据源(mootdx/东财在境外不稳定)，
      # 与 scanner.py 的 GITHUB_ACTIONS 自动识别形成双保险，防止 A股活跃股池缺失。
      CLOUD_RUNNER: "true"
      # 🔴 2026-08-06 22:15 新增：MAHORO 投行信号需要登录 cookie（本地 data/.mahoro_cookies.txt 被
      #   .gitignore 屏蔽，云端 checkout 无 cookie → fetch_maharo_signals 每次都跳过 → 数据停更 7 天）。
      #   通过 GitHub repo secret 注入，云端每天真实拉取。cookie 失效时更新该 secret 即可。
      #   设置路径：GitHub 仓库 → Settings → Secrets and variables → Actions → MAHORO_COOKIE
      MAHORO_COOKIE: ${{ secrets.MAHORO_COOKIE }}
      # 2026-08-10 新增：云端代发 mahoro 验证码 / 代登录用的动作开关（本机无法解析 data.maharo.cn）
      MAHORO_ACTION: ${{ github.event.inputs.maharo_action }}
      MAHORO_CODE: ${{ github.event.inputs.maharo_code }}
      # 观澜台(知识星球) token：与小九本地 data/zsxq_token.json 同值。
      # 设置路径：GitHub 仓库 → Settings → Secrets → Actions → ZSXQ_TOKEN
      ZSXQ_TOKEN: ${{ secrets.ZSXQ_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 Checkout 源码（云端无需 safe-delete 钩子规避）"
        # 🔴 2026-08-14 主人令永久修复：与 v8_cn_fetch_cloud 同款问题——
        #   actions/checkout@v4 默认 git clean -ffdx 在 Windows self-hosted runner 上
        #   被 WorkBuddy safe-delete 守卫按 50 文件阈值拦截（alimi-cn 实测 966 文件），
        #   导致 checkout 100% 失败。加 clean: false 跳过批量清理，直接复用/覆盖 worktree。
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: "🐍 配置 Python（本机 Python 3.12，避免 actions/setup-python 从 github.com 下载超时）"
        run: |
          # 2026-08-15 根因修复：alimi-cn 自托管 runner 无法从 github.com 下载 Python 安装包
          # （setup-python 的缓存未命中时会去 actions/python-versions 下载，连接超时导致整链失败）。
          # 改用本机已安装的 Python 3.12，直接注入 PATH，不依赖网络下载。
          PY_CANDIDATES=(
            "/c/Users/HH20210606/AppData/Local/Programs/Python/Python312/python.exe"
            "C:/Users/HH20210606/AppData/Local/Programs/Python/Python312/python.exe"
          )
          PYTHON_EXE=""
          for p in "${PY_CANDIDATES[@]}"; do
            if [ -x "$p" ]; then
              PYTHON_EXE="$p"
              break
            fi
          done
          if [ -z "$PYTHON_EXE" ]; then
            echo "::error::未找到本机 Python 3.12，候选路径: ${PY_CANDIDATES[*]}"
            exit 1
          fi
          echo "PYTHON_EXE=$PYTHON_EXE"
          "$PYTHON_EXE" --version
          "$PYTHON_EXE" -m pip --version
          # 暴露给后续 step
          PY_DIR=$(dirname "$PYTHON_EXE")
          echo "$PY_DIR" >> "$GITHUB_PATH"
          echo "$PY_DIR/Scripts" >> "$GITHUB_PATH"
          echo "PYTHON=$PYTHON_EXE" >> "$GITHUB_ENV"

      # 🔴 2026-08-12 第173轮根因修复：本步骤原先「只用清华镜像 + || true 吞失败」，
      #   GitHub 云端 runner 是境外 IP，访问清华镜像会间歇性拿到**空索引**：
      #     ERROR: Could not find a version that satisfies the requirement akshare
      #            (from versions: none)
      #   （run#94 08-12 15:39 真实日志，install 仅 5 秒即快速失败）
      #   → `|| true` 把 pip 失败吞掉 → 末行 import 校验 ModuleNotFoundError → 本步骤
      #   exit 1 → **整条盘后算法链 job 直接 fail，算法一行没跑** → 7 张盘后/选股卡
      #   (市场温度计/六维共振雷达/候选池/机构买卖/三重共识/全站精选/逆势龙头)
      #   停在上午 09:08 不刷新，逆势龙头更是停在 08-11 17:09。
      #
      #   决定性佐证：同为云端的姊妹 workflow v8_cn_fetch_cloud.yml 用的是**官方 PyPI
      #   （无镜像）**，同一时刻 15:33 success；本 workflow 用清华镜像 15:39 fail。
      #   云端 runner 在 GitHub 内网，官方 pypi.org 才是最快最稳的源，中国镜像只作兜底
      #   （清华/阿里云镜像仍保留给 cn 自托管 runner 的 v8_algo_run.yml / v8_cn_fetch.yml 用）。
      #
      #   策略：官方源优先 → 清华 → 阿里云，每源重试 2 次，逐源做 import 实证校验；
      #   三源全灭才 exit 1（此时确属真故障，必须显式失败而不是被 || true 掩盖）。
      - name: "📦 安装 A股依赖（官方 PyPI 优先 + 双镜像兜底 + 重试）"
        run: |
          CORE="akshare pandas numpy requests baostock"
          ok=0
          for IDX in "https://pypi.org/simple" \
                     "https://pypi.tuna.tsinghua.edu.cn/simple" \
                     "https://mirrors.aliyun.com/pypi/simple"; do
            for TRY in 1 2; do
              echo "=== pip install core [index=$IDX try=$TRY] ==="
              if pip install -q --retries 3 --timeout 60 -i "$IDX" $CORE; then
                if python -c "import akshare, pandas, numpy, requests"; then
                  echo "core deps OK via $IDX (try=$TRY)"
                  ok=1
                  break
                fi
                echo "!! pip 退出码 0 但 import 校验未通过，继续换源/重试"
              fi
              echo "!! [$IDX] 第 $TRY 次安装失败"
            done
            # 注：GitHub 的 run: 默认 `bash -e`，此处用显式 if 而非 `[ ... ] && break`，
            # 避免依赖 `set -e` 对 && 列表首命令失败的豁免语义（易踩坑）。
            if [ "$ok" = "1" ]; then break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::核心依赖安装失败（官方 PyPI / 清华 / 阿里云 各试 2 次全灭）"
            exit 1
          fi
          # mootdx 为可选依赖（本 workflow SKIP_MOOTDX=1 不使用），装不上不阻断
          pip install -q --retries 2 --timeout 40 mootdx \
            || pip install -q --retries 2 --timeout 40 -i https://pypi.tuna.tsinghua.edu.cn/simple mootdx \
            || echo "mootdx 未安装（可选依赖，SKIP_MOOTDX=1 不影响算法链）"
          python -c "import akshare, pandas, numpy, requests; print('deps ready')"

      - name: "📅 交易日历 gate"
        id: trading
        run: |
          python algorithms/check_trading_day.py

      - name: "🧮 运行盘后算法链 → raw_data/ → 推送"
        if: steps.trading.outputs.is_trading_day == 'true'
        run: |
          set +e
          python algorithms/run_algorithms.py
          echo "algo exit: $?"
          # run_algorithms 内部每个脚本 continue-on-error，整体退出码不代表全失败；
          # 推送交由下一步兜底执行，这里不因非零退出码而 fail。
          exit 0

      # 2026-08-08 修复：算法链产出 candidate.json 后，立即刷新候选池行情，
      # 避免 runner 状态卡 CANDIDATE_QUOTES 长期显示「空」。
      - name: "📈 刷新候选池行情（CANDIDATE_QUOTES）"
        if: steps.trading.outputs.is_trading_day == 'true'
        run: |
          python cloud_fetch_v8.py --only CANDIDATE_QUOTES || true

      - name: "📤 兜底推送（若上一步未推）"
        if: steps.trading.outputs.is_trading_day == 'true'
        run: |
          python api_push_raw.py || true
