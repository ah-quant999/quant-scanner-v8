# 九宝量化 v8.0 — 盘中算法追踪轻量重算（云端 ubuntu-latest）
#
# 2026-08-20 主人令「一劳永逸」：动量共识筛选属于盘后选股策略，
#   已迁到 19:15 CST 盘后算法链（v8_algo_cloud.yml → v8_build_deploy.yml），
#   避免盘中 09:28 等时间点用未完整数据提前计算。
# 本 workflow 仅保留：
#   ① 盘中每 2h 真跑 gen_algo_track.py（三算法追踪入池：四量终极/板块龙头/大牛股猎手）
#   ② dispatcher 兜底：v8_dispatch_fetch.py 加 intraday_lite 子命令，时间窗 09:30-15:00 CST
#
# 推送：仅 workflow_dispatch 可用；内容未变（?v 已是最新）则跳过推送。
# cron 设计：UTC 1,3,5,7 = CST 09:00, 11:00, 13:00, 15:00（盘中交易时段每 2h 一次）。

name: "☁️ v8 盘中算法追踪(轻量)"

on:
  schedule:
    # ⏰ 2026-08-19 一劳永逸：cron UTC 1/3/5/7 = CST 09:00/11:00/13:00/15:00，盘中每 2h 触发
    # 周末/节假日由 workflows 内部跳过（仓内交易日历 gate，与 v8_algo_cloud.yml 同套）
    - cron: '0 1,3,5,7 * * 1-5'
  workflow_dispatch:
    inputs:
      note:
        description: '备注（可选）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  algo_track_lite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 朴素 now() 即北京时间（与云端中国节点产出一致，新鲜度守卫时间对齐）
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V8_PUSH: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 checkout（云端 git 可靠）"
        uses: actions/checkout@v4

      - name: "🐍 配置 Python (setup-python 3.13)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 2026-08-20 主人令：动量共识筛选已迁到盘后 19:15 算法链（v8_algo_cloud.yml），
      #   盘中不再重复跑，避免 09:28 等时间点基于未完整数据刷新。
      #   脚本入口已加 check_stock_picking_ready() 双保险，任何手动触发在 18:00 前都会直接退出。

      - name: "📊 三算法追踪入池（gen_algo_track）"
        # 🔴 2026-08-19 一劳永逸补齐：盘中每 2h 重算四量终极/板块龙头/大牛股猎手追踪
        # 写入 raw_data/algo_track.json（git tracked，下一步 api_push_raw 推），保证盘中卡片不过期
        run: |
          set +e
          python algorithms/gen_algo_track.py
          echo "gen_algo_track exit: $?"
          exit 0

      - name: "🔄 重生成 data/ALGO_TRACK.js 并更新 index.html ?v 缓存戳"
        # ALGO_TRACK.js 由 update_v8.py 的 _make_js 从原始 raw_data 重生，
        # 流水线单一写者原则防止双写竞态击穿 ?v 防覆盖铁律（2026-08-15 根因修复）。
        # 不传 --category：默认 build() 内部读 raw_data/*.json 全量重生，盘中每 2h 漂移可控（<5min）。
        # 注：MOMENTUM_FILTER.js 已迁到盘后 19:15 算法链，本 workflow 不再碰。
        run: |
          python update_v8.py || echo "update_v8 warned, continue"

      - name: "🩺 刷新 HEALTH_CHECK.js"
        continue-on-error: true
        run: |
          python v8_health_check.py || true

      - name: "📤 推送变更到 main（git push，全套 data/*.js + raw_data/*.json 自动）"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "v8-intraday-bot"
          git config user.email "v8-intraday-bot@users.noreply.github.com"
          # 🛡 安全：先从索引移除敏感文件，防止 git add -A 重新提交已跟踪的密钥
          git rm --cached --ignore-unmatch \
            data/.mahoro_cookies.txt data/.github_pat.txt data/zsxq_token.json \
            data/.wc_jwt_cache.json data/.neodata_token data/zszxq_token.json 2>/dev/null || true
          git add -A
          # 仅有变更时提交（无变更 = noop）
          if git diff --cached --quiet; then
            echo "⏭️ 无任何变更，跳过推送"
            exit 0
          fi
          msg="chore: 盘中算法追踪轻量刷新 $(date +%H:%M)"
          git commit -m "$msg"
          # 🛡 并发 push 互踩加固（2026-08-30 全量跑批实测暴露 non-fast-forward）
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ pushed: $msg"; exit 0
            fi
            echo "⚠️ push 被拒（并发互踩），fetch+rebase 后重试 ($i/3)"
            git fetch origin main && git rebase FETCH_HEAD || { git rebase --abort || true; exit 1; }
          done
          echo "❌ 3 次重试后仍失败"; exit 1
