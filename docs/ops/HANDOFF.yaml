  - id: stockquote-cachebuster-noop
    priority: P2
    owner: shared
    status: todo
    what: >-
      `v8_stock_quote_refresh.yml` 的「更新 index.html 缓存戳」步**长期静默空跑并输出误导性告警**：
      每轮日志逐字 `new STOCK_QUOTE.js sha10 = f50a66ab93` →（`#142` @13:47 CST）
      `⚠️ index.html 中未找到 STOCK_QUOTE.js?v= 引用，可能已被外链替换；跳过 ?v 更新`。
      🔴 **真根因（本轮定位）**：该步经 **Contents API** 读 `index.html`，而 `index.html` 现为
      **1,341,429 B > 1 MB** ⇒ Contents API 的 `content` 字段**恒为空字符串**
      （实测 `size=1341429 / len(content_field)=0 / encoding=none`）⇒ 正则 `re.subn` 永远返回 n=0
      ⇒ 命中 `n==0` 分支打印上述**误判**（文件里明明有引用：`{name:'STOCK_QUOTE',
      url:'data/STOCK_QUOTE.js?v=1790056383'}`）。与 `handoff-ai-entry-file` 同族的「大文件读不到」陷阱。
      ℹ️ 附带事实：`index.html` 现存 **109 处 `?v=`**，其中 **108 处共享同一单调 unix 秒令牌**
      `1790056383`（仅 `IPO_DATA.js` 为 `1790031455`）⇒ 全站缓存戳由**构建期**统一管理；
      该步若真生效，反而会写入「内容 sha10」与既有「unix 令牌」口径打架。
    fix: >-
