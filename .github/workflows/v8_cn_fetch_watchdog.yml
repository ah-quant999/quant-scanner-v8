# 九宝量化 v8.0 — 数据抓取云端看门狗（自愈·兜底）
#
# 🔴 2026-09-01 根因修复（一劳永逸）：
#   主 workflow v8_cn_fetch_cloud.yml 的 5 条 cron 长期被 GitHub schedule 高负载整段漏触发
#   （实测 2026-09-01 全天 0 次 schedule 触发，而 08-31 正常）。单靠 workflow 内置 cron 不可靠。
#   本看门狗不依赖"准点"，而是**基于状态（线上数据是否陈旧）**自愈：
#     - 每 30 分（交易日 08:00-17:30 CST）跑一次轻量检查；
#     - 拉取线上 data/HEALTH_CHECK.js，取最新 last_update 与当前 CST 比较；
#     - 若处于交易时段且对应类别数据陈旧（盘中>35min / 盘前盘后>60min），
#       直接在云端用 gh workflow run 派发 v8_cn_fetch_cloud.yml（category 自适应）。
#   全云端（ubuntu-latest），小九机仅在云端连续失败时才作人工后备，不依赖其定时。
#   与主 workflow 的 cron 互为冗余：只要任意一条触发，数据就不会长时间空窗。

name: "🐕 v8 数据抓取看门狗(云端自愈)"

on:
  # 🔴 2026-09-10 一劳永逸修复（主人令·午休窗口）：09-09 误删 schedule，导致看门狗整日哑火——
  #    上午 5 次云端 run 被 cancelled 且零兜底 → 数据空窗近 30 分钟（09-10 上午事故）。
  #    现恢复 GitHub cron 自唤起（每 15 分，与 WorkBuddy 唤起器 2d9121c8 互为冗余，任一方掉线都自恢复），
  #    数据陈旧（盘中>35min）即自动补派云端/小九 cn 兜底。时段：交易日 08:07-15:52 CST（UTC 00:07-07:52），
  #    与 20 分主派发错峰（:07/:22/:37/:52），避免并发互相踩踏。
  schedule:
    # 🔴 2026-09-21（本批）小九 · 结构性变更：本链被 GitHub schedule 静默注销，
    #   按 v8_stock_quote_refresh.yml 09-07 已验证做法把单条多点 cron 拆为两条显式行，
    #   语义等价（{7,22} ∪ {37,52} = {7,22,37,52}），条目数 1→2 强制重新注册。
    #   见 HANDOFF.yaml::intraday-chain-cron-deregistered。
    - cron: '7,22 0-7 * * 1-5'    # 每 15 分前半（:07 :22）
    - cron: '37,52 0-7 * * 1-5'   # 每 15 分后半（:37 :52）
  # 🔴 保留手动入口：WorkBuddy 唤起器 2d9121c8 每 15 分也可主动触发（双保险）。
  workflow_dispatch:
    inputs:
      force_category:
        description: '强制派发类别（留空=按陈旧度自适应）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: write   # 用于 gh workflow run 派发主抓取

concurrency:
  group: v8-cn-fetch-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 自检数据新鲜度并兜底派发
        env:
          GH_TOKEN: ${{ github.token }}
          # dispatch 入参经 env 传入探针脚本（run 块内零表达式字面量，体积恒小）
          V8_FORCE_CATEGORY: ${{ github.event.inputs.force_category }}
        run: |
          # 🔴 2026-11-09 一劳永逸：探针逻辑抽到 .github/scripts/v8_watchdog_probe.py（369 行），
          #   本 run 块只剩一行调用。根治 GitHub「Exceeded max expression length 21000」——
          #   原 27.8KB run 块内嵌表达式定界符+320行脚本，被 GitHub 表达式扫描器整块误吞 ⇒ 每次推送
          #   全仓连坐 Invalid workflow file（11-09 实证 5 连坐，含双机纯数据推送）。
          python3 .github/scripts/v8_watchdog_probe.py
