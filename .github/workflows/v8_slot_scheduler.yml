# v8 档期兜底调度器（云端）
#
# 用途：GitHub Actions schedule cron 存在静默丢触发问题，本工作流每 20 分钟主动检查
# 盘前/盘中/盘后档期是否被成功覆盖，只补缺口、不盲轮询，避免 runner/限流风暴。
# 本工作流本身由 GitHub cron 触发，同时由 WorkBuddy 自动化每 20 分钟派发一次作为
# 双保险（WorkBuddy 调度更可靠，不受 GHA cron 静默失效影响）。
#
# 调度策略（只监督、不跑数据）：
#   - 盘前 08:25 / 盘中 09:00-15:30 每 30 分 / 盘后 17:20
#   - 任一档位在窗口内无成功 v8_cn_fetch_cloud run → 派发对应 category
#   - 18:00 后若 post_close 已就绪且 v8_algo_cloud 今日尚未成功 → 派发算法链
# 🔧 2026-09-09：本工作流现为休眠兜底，实际盘中单源由「云端按铃(alimi_bell)」每 20 分承担。
name: "🕒 v8 档期兜底调度器(云端)"

on:
  # 🔴 2026-09-09 一劳永逸根治「GHA schedule 静默丢触发 + 双源互踢」：本 workflow 原靠 GitHub
  #   schedule cron 自触发，但今天只跑 1 次就哑→盘中轮缺口无人补。现删除 schedule 块。
  #   盘中单源已统一收口到「云端按铃(alimi_bell)」每 20 分直接 dispatch v8_cn_fetch_cloud
  #   （独立唤起器 id 195d8839 经查自动化注册表不存在→悬空，故本 slot scheduler 改为休眠兜底，
  #    不再被自动唤起）。缺口补齐逻辑本体不变（仍只补缺口、自带 15 分钟冷却 + 同版本失败熔断
  #    防风暴），仅保留为手动/应急入口。
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: v8-slot-scheduler
  cancel-in-progress: true

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: "🛰️ 运行档期兜底调度器"
        shell: bash
        run: |
          python .github/scripts/v8_slot_scheduler.py
