  - id: lhb-push-only-arg-noop-out-dir-unpushed
    title: "v8_lhb_fetch 的 `--only lhb` 是**不存在的参数**（实为无 PUSH_FILES 的全量回退推送）；且 `out/` 不在任何推送面 ⇒ 该链产物结构性永远落不了地"
    priority: P1
    owner: shared
    status: done
    closed_by: thermo-lhb-push-fix-1017  # 已被同轮 thermo-lhb-push-fix-1017 根治（fetch_lhb落点 out/→raw_data/ + 工作流 Contents API 直推三件套）；线上 2026-10-17 已验证生效
    scope: workflow
    created: "2026-09-26 17:37"
    what: >-
      `v8_lhb_fetch.yml` 推送步的**自述意图**（文件第 127-128 行注释）是「以 `api_push_raw.py --only lhb` 限定
      只推送 `lhb_result.json` + `lhb_seats.json`」。实测该意图的**两个前提全部不成立**：
      ① **`api_push_raw.py` 根本没有 `--only` 参数**：全文 1,437 行内 `--only` 命中 **0 次**，
        `argparse` / `add_argument` / `sys.argv` / `parse_args` 命中**全 0**，脚本侧无任何 argv 解析
        ⇒ `--only lhb` 被**静默忽略**，该句实为「不带 `PUSH_FILES` 时的**全量回退推送**」
        （`walk_raw()` 遍历整个 `raw_data/` + `walk_extra()` 的固定 `data/*.js` 白名单）。
      ② **`out/` 不在任何推送面**：`walk_raw()` 只 `os.walk("raw_data")`；`walk_extra()` 是**固定白名单**
        （13 个 `data/*.js`）；`out` 只出现在 `_remote_tree_paths` 的 **SKIP 剪枝**里
        ⇒ `out/lhb_result.json` / `out/lhb_history.json` **无论推送成功与否都不可能入仓**。
    impact: >-
      · 该链的**产物契约是空头**：`algorithms/fetch_lhb.py` 写 `out/lhb_result.json`（L454）与
        `out/lhb_history.json`（L493），而这两条路径永远推不出去 ⇒「抓到也入不了仓」是**结构性**的，非偶发。
      · 每次 `v8_lhb_fetch` 真跑都会发起**一次全量推送**（实测 run#31：`🚀 并发推送启动：5572 个文件 /
        并发 6 / 软闸 720s`）⇒ 单次约 4400+ 次 Contents/Blobs 写请求，与 `cn-fetch-api-quota-403-exhausted`
        同源：本链是**新增的配额大户**，会加剧 `user ID 293579813` 的 5000/h 主限与二级限速。
      · 全量推送在 720s 软闸内**必然跑不完**（实测第一波 4426/5572）⇒ 每次真跑**必然** `rc=9`；
        与 `cn-singleflight-ps51-pipe-pipe-parse-fail-lhb-push` 的 (D) 项（rc=9 被误判为失败而二次全量）
        叠加后 = 「每次真跑 → 两轮全量 → 一次 403 硬失败」。
    evidence: >-
      ① `GET /contents/api_push_raw.py?ref=main`（blob `2dd6645caaa2`，88,529 B，1,437 行）正则实测：
        `--only` = **0 次**；`argparse` / `add_argument` / `sys.argv` / `parse_args` = **全 0 次**；
        `lhb` = 1 次且位于**注释**内（L655 / L689 / L1084 的退役说明）。
      ② 推送面实测（同文件）：`def walk_raw()` L514（`os.walk("raw_data")` L551）；
        `def walk_extra()` L622（固定 `extra = [...]` 白名单，13 个 `data/*.js`）；
        `out` 仅在 L882 `SKIP = ("backup","docs","raw_data/kline_cache","legacy_v6","out", …)` 出现
        ⇒ 属**被剪枝**而非被推送。
      ③ 入仓实测：`GET /commits?path=out/lhb_result.json` = **0 笔**、`path=out/lhb_history.json` = **0 笔**；
        反证 `out/lhb_seats.json` 有 5 笔，但**全部落在 2026-09-12 / 2026-09-15**（人工补录口径），此后未再更新。
      ④ run#31（id `36230767013`，`workflow_dispatch`，runner `alimi-cn`）推送步日志逐字：
        `🚀 并发推送启动：5572 个文件 / 并发 6 / 软闸 720s`
        `📊 并发推送收工：耗时 720s / 未变化 272 / 防倒退 18 / 待更新 4426 / 失败 15`
        `⚠️ 本轮触发总时长软闸：仅提交已完成部分（4426 个文件），退出码 9 —— 非假成功，下轮派发自动续推`
        ⇒ 证明「第一句 `--only lhb`」就是全量推送，且**必然**触发软闸。
      ⑤ 需求侧反证（是否为孤儿链）：`algorithms/run_algorithms.py` 的 A 批**已含** `fetch_lhb.py`
        （`"fetch_lhb.py": 2400` 与 `"fetch_sector_rs.py","fetch_lhb.py"`）；线上真身 `data/LHB_DATA.js`
        与 `raw_data/lhb_history.json` 的提交**全部来自 `v8 cn fetch` 链**（09-24 19:06Z / 09-26 16:58）
        ⇒ 独立 `v8_lhb_fetch` 链与其 `out/` 产物疑似**重复且无消费方**（待 owner 确认后判生死）。
    fix: >-
      本轮**未改**（属设计变更、跨链影响，须 owner 裁定），仅登记。可选方向（按代价递增）：
      （a）**最小**：把推送步的 `python api_push_raw.py --only lhb` 短路为
        `Write-Host "[skip] lhb push step disabled until scoped-push lands"` —— 立即止住
        「每跑一次烧 4400+ 写请求」；代价是产物仍不入仓（与现状等价，因为本来也入不了）。
      （b）在 `api_push_raw.py` 里**真正实现** `--only <group>`（需定义 group→路径集映射，并把 `out/` 纳入该 group），
        影响所有调用方，须回归验证。
      （c）若确认该链与其产物**无消费方**（见 evidence ⑤），按「无生产者/无消费者」退役该链（对齐 `LHB_7D` 退役先例）。
      ⚠️ 三条路都**不要**用 `git add -f out/…` 之类旁路：本仓 `out/` 属 SKIP 面，人为加白会与
        `_remote_tree_paths` 的剪枝口径打架。
    verify_how: >-
      ① 判「本条已生效」的硬判据 = **推送步不再发起全量推送**：下一档 `v8_lhb_fetch` 真跑日志中不再出现
        `🚀 并发推送启动：5xxx 个文件`（出现即仍是全量），且不再出现 `raw_data/kline_cache/*.json 本轮上传失败`。
      ② 若走方向（b）：`GET /commits?path=out/lhb_result.json` 由 **0 笔**变 **≥1 笔**。
      ③ 若走方向（c）：`GET /actions/workflows` 内该 workflow 消失（或被显式标注退役），且 HANDOFF 本项转 done。
      ④ 一切判据只取远端 API 真身（`GET /contents/<path>?ref=<sha>`、`GET /commits?path=`），禁读本机 clone。
    not_verify_how: >-
      · ❌ 禁以「run 结论 success」判生效 —— 该步 `continue-on-error: true` ⇒ 恒绿（同族假绿）。
      · ❌ 禁以「提交里出现 lhb 相关文件」判生效 —— 全量推送本就会带上 `raw_data/` 下所有 lhb 文件，
        那是**全量推送的副产品**，不是本项被修复。
      · ❌ 禁把 `raw_data/lhb_seats.json` 当本链产物 —— 推送面里没有它的**生产者**；
        `fetch_lhb.py` 是它的**读者**（`SEATS_PATH = ../out/lhb_seats.json`）。
