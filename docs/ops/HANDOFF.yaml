  - id: rawdata-md-crlf-flip
    priority: P2
    owner: shared
    status: pending-verify
    what: >-
      `raw_data/` 下两个**多行 markdown** 被某条链静默改写行尾 LF→CRLF（正文零变化）：
      `raw_data/ima_strong_stock_full.md` 5504 B → 5632 B（+128 CRLF）、
      `raw_data/chan_buy_point_full.md` +115/−115。
      首现提交 `fabb6e6434`（2026-09-24 04:04:59Z = **12:04:59 CST**，github-actions[bot]，
      message 形如 `v8 cn fetch: 2026-09-24 12:00`）。
      ⚠️ 该 message 由 `api_push_raw.py:668` 硬编码、**多条链共用** ⇒ 本条**不归因**到具体 workflow。
      🔎 推定机制（置信 ~85%，未定责）：本仓 `core.autocrlf=true` + `.gitattributes`
      **对 `raw_data/*.md` 无任何规则** ⇒ 该族属性 unspecified，Windows checkout 后
      工作树为 CRLF；而走 GitHub API 逐文件上传的推送器读的是**工作树字节**（绕过 git
      clean filter）⇒ CRLF 落库。旁证：同批 16 个 `raw_data/*.json` 均只 `+1/−1`
      （它们有 `raw_data/*.json text eol=lf` 规则，且多为单行），**唯有两个 .md 全行 diff**。
      已排除：`fetch_ima_strong_stock.py` **只读**快照（L641/L647 读模式），
      其写盘仅 `raw_data/ima_strong_stock.json` + `data/IMA_STRONG_STOCK.js` ⇒ 非本文件元凶。
    impact: >-
      · 功能性**暂无影响**：线上 `data/IMA_STRONG_STOCK.js` 仍 `detail_channel=full-snapshot` /
        `sample_coverage.reconciled=true` / `len(stocks)=56`（解析器对 CRLF 容错）。
      · 🔴 破坏快照的**字节保真契约**：`raw_data/ima_strong_stock_full.md` 是自动化 149ad8ff
        经 ima 连接器取回的**全文原文**，其全部价值前提是「逐字节 == 源方原文」；
        行尾翻转后该文件字节已不等于源方原文。
      · ⚠️ 会打死该自动化的**推送守卫**：`push_snapshot.py` 断言
        `remote_md == fetched_md` 才推；远端现为 CRLF、连接器取回为 LF ⇒
        一旦 ima 通道恢复，任何快照刷新（含**新篇**）都会 abort。
      · 附带：每次翻转产生 128 行幻影 diff（噪声），掩盖真实改动、干扰 `fix(eol)` 类排查。
    fix: >-
      建议（**本轮未执行**，因 .gitattributes 属跨机共享策略、且推定机制未 100% 定责，
      留 owner=shared 由双机拍板）：在 `.gitattributes` 「数据文件锁 LF」段追加一行窄规则
