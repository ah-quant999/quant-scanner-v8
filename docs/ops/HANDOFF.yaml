        改为只把被捕获的命令包成 `cmd || _v8_rc=$?`（`||` 列表豁免 `-e`，且不改早段命令的 `-e` 保护）。
      · B：把命令改写成 `if ! cmd; then …; fi`（结构最清晰，改动面最大）。
      · C（须与 A/B 同做）：给 `v8_health_check.py` 加 `--exit-zero`，让「报告里有 fail 项」不再冒充
        「本步执行失败」—— 否则 `soft_13` 仍会每档被标 failure，细粒度 annotation 依旧死。
      🔴 为何不在本轮直接改：29 处中含**推送步**（soft_10 / soft_14）与 6 处多命令块
      ⇒ 机械化插入会改变早段命令的失败语义（本仓铁律「不要造成踩踏」）；且本项为巡监轮发现。
    evidence: >-
