<!DOCTYPE 
html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>九宝量化 v8.0</title>
<style>
  :root{
    --bg:#0a0e17; --bg2:#0e1422; --card:#131b2e; --card2:#172238;
    --border:#243150; --border2:#2e3d63;
    --txt:#e6edf7; --sub:#93a4c4; --dim:#5f7099;
    --cyan:#38bdf8; --purple:#a78bfa; --gold:#fbbf24; --pink:#f472b6;
    --up:#f4495d; --down:#1fd17b;
    --lock:#5f7099;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.5}
  a{color:var(--cyan);text-decoration:none}

  header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0e1626,#0a0e17);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:16px}
  .logo{font-weight:800;font-size:18px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .admin-badge{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px}
  .admin-badge b{color:var(--gold)}
  .btn{cursor:pointer;border:1px solid var(--border2);background:var(--card2);color:var(--txt);padding:5px 12px;border-radius:8px;font-size:12px;transition:.15s}
  .btn:hover{border-color:var(--cyan);color:var(--cyan)}

  nav{position:sticky;top:48px;z-index:49;display:flex;gap:4px;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto}
  .tab{flex:0 0 auto;padding:12px 18px;cursor:pointer;color:var(--sub);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
  .tab.locked{color:var(--lock)}
  .tab.locked .lk{font-size:11px}
  .tab.admin-only{display:none}

  main{padding:22px 20px 60px;max-width:1320px;margin:0 auto}
  section{display:none;animation:fade .25s ease}
  section.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .sec-head h2{font-size:20px;font-weight:800}
  /* 选股策略四子页 */
  .st-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .st-tab{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg2);color:var(--sub);transition:.15s}
  .st-tab:hover{border-color:var(--cyan);color:var(--txt)}
  .st-tab.active{background:linear-gradient(135deg,#13243f,#0e2747);border-color:var(--cyan);color:#fff;box-shadow:0 0 0 1px rgba(56,189,248,.35)}
  .st-pane{display:none}
  .st-pane.active{display:block}
  .sec-head .tag{font-size:12px;color:var(--dim)}

  .grid{display:grid;gap:16px}
  .g-2{grid-template-columns:repeat(2,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-5{grid-template-columns:repeat(5,1fr)}
  @media(max-width:1080px){.g-2,.g-3,.g-4,.g-5{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
  .card h3{font-size:14px;color:var(--sub);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;line-height:1.4}
  .card h3 .ic{font-size:16px;line-height:1}
  .card h3 .fresh{font-size:11px;color:var(--dim);font-weight:400;white-space:nowrap}
  .card .fresh{font-size:11px;color:var(--dim);font-weight:400}

  /* 实时数据卡片：走势图 + 标题行数字 */
  .rt-card h3{justify-content:space-between;flex-wrap:wrap;gap:6px 10px}
  .rt-summary{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .rt-summary b{font-size:14px}
  .rt-summary small{font-weight:400;color:var(--sub);font-size:12px}
  .rt-spark{width:100%;height:78px;display:block;margin-top:4px}

  .quote{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
  .quote .price{font-size:32px;font-weight:800}
  .quote .meta{color:var(--sub);font-size:13px}

  .flow-row{display:flex;align-items:center;gap:10px;padding:3px 0;border-bottom:1px dashed var(--border)}
  .flow-row:last-child{border:0}
  .flow-name{width:96px;color:var(--sub);font-size:13px;flex:0 0 auto}
  .flow-bar{flex:1;height:4px;background:var(--bg2);border-radius:0;overflow:hidden;position:relative}
  .flow-fill{height:100%;border-radius:0}
  .flow-val{width:88px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;flex:0 0 auto}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--dim);font-weight:600;font-size:12px}
  tbody tr:hover{background:var(--card2)}
  .up{color:var(--up);font-weight:700}
  .down{color:var(--down);font-weight:700}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;border:1px solid var(--border2)}
  .pill.buy{color:var(--up);border-color:var(--up)}
  .pill.sell{color:var(--down);border-color:var(--down)}

  .qbox{display:flex;gap:8px;margin-bottom:14px}
  .qbox input{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--txt);padding:9px 12px;border-radius:9px;font-size:14px}

  .etf-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12px}
  .etf-row:last-child{border:0}
  .etf-row span{color:var(--sub)}
.etf-row .pct{width:46px;text-align:right;font-weight:600}
.etf-row .pct.up{color:#c62828}
.etf-row .pct.down{color:#2e7d32}
.etf-row .subtotal{font-size:11px;color:var(--dim);padding:6px 0 0;border-top:1px solid var(--border);margin-top:4px;display:flex;justify-content:space-between}
.etf-spark{display:inline-block;width:16px;height:4px;border-radius:2px;margin-left:4px;vertical-align:middle}
  .etf-row b{font-variant-numeric:tabular-nums}

  /* ===== 涨停热力矩阵（暗色主题） ===== */
  .limit-up-content{overflow-x:auto;font-size:11px;line-height:1.5}
  .limit-up-content table{width:100%;min-width:460px;border-collapse:separate;border-spacing:0}
  .limit-up-content th{padding:5px 3px;text-align:center;font-weight:500;color:var(--dim);font-size:10px;border-bottom:1px solid var(--border2);white-space:nowrap}
  .limit-up-content th:first-child{text-align:left;padding-left:6px}
  .limit-up-content td{padding:4px 3px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
  .limit-up-content td:first-child{text-align:left;padding-left:6px;color:var(--txt);font-weight:600}
  .limit-up-content .lu-total{color:var(--gold);font-weight:700}
  .limit-up-content .lu-trend{font-size:12px;font-weight:700}
  .limit-up-content .lu-ignite{box-shadow:inset 0 0 0 2px var(--gold);border-radius:4px}
  .limit-up-legend{display:flex;gap:8px;font-size:10px;color:var(--dim);margin-top:8px;flex-wrap:wrap;align-items:center}
  .limit-up-legend span{padding:2px 6px;border-radius:3px}
  .limit-up-legend .lu-legend-ignite{border:2px solid var(--gold);padding:1px 6px}
  .limit-up-analysis{font-size:12px;line-height:1.7;margin-bottom:10px;padding:8px 10px;background:var(--bg2);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;color:var(--sub)}
  .limit-up-analysis b{color:var(--txt)}
  .lu-h0{background:transparent;color:var(--dim)}
  .lu-h1{background:rgba(198,40,40,.12);color:#ff8a80}
  .lu-h2{background:rgba(198,40,40,.28);color:#ff5252;font-weight:600}
  .lu-h3{background:rgba(198,40,40,.48);color:#fff;font-weight:700}
  .lu-h4{background:rgba(198,40,40,.68);color:#fff;font-weight:700}
  .lu-h5{background:rgba(198,40,40,.88);color:#fff;font-weight:700}

  /* ===== 板块资金三合一（v6 风格暗色移植） ===== */
  .sf-block{border-radius:12px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--border)}
  .sf-block:last-child{margin-bottom:0}
  .sf-block-hot{background:linear-gradient(135deg,rgba(24,95,165,.18),rgba(56,189,248,.08));border-left:4px solid #38bdf8}
  .sf-block-close{background:linear-gradient(135deg,rgba(153,60,29,.14),rgba(251,191,36,.06));border-left:4px solid #fb923c}
  .sf-block-trend{background:linear-gradient(135deg,rgba(83,74,183,.16),rgba(167,139,250,.08));border-left:4px solid #a78bfa}
  .sf-block-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .sf-block-hot .sf-block-title{color:#7dd3fc}
  .sf-block-close .sf-block-title{color:#fdba74}
  .sf-block-trend .sf-block-title{color:#c4b5fd}
  .sf-block-icon{font-size:18px;line-height:1}
  .sf-net-big{text-align:center;margin-bottom:10px;padding:10px;background:var(--card2);border-radius:8px}
  .sf-net-big .n{font-size:28px;font-weight:900}
  .sf-net-big .u{font-size:14px;margin-left:4px}
  .sf-net-big .lbl{font-size:12px;color:var(--dim);margin-left:6px}
  .sf-line{font-size:14px;line-height:1.9;margin-bottom:8px}
  .sf-line b{font-weight:700}
  .sf-tagline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .sf-tag{font-size:13px;padding:4px 9px;border-radius:4px}
  .sf-tag-in{background:rgba(244,73,93,.14);color:#ff8a95}
  .sf-tag-out{background:rgba(31,209,123,.14);color:#7ee0a0}
  .sf-tag-new{background:rgba(56,189,248,.14);color:#7dd3fc}
  .sf-tag-rotate{background:rgba(251,191,36,.14);color:#fcd34d}
  .sf-tag-rebound{background:rgba(251,146,60,.14);color:#fdba74}
  .sf-caution{padding:9px 11px;background:rgba(251,191,36,.10);border-left:3px solid #fbbf24;border-radius:0 8px 8px 0;margin-bottom:10px;font-size:14px;line-height:1.8;color:#fde68a}
  .sf-rotate-table{width:100%;font-size:13px;border-collapse:collapse;line-height:1.7}
  .sf-rotate-table td{padding:5px 7px;border:1px solid var(--border)}
  .sf-rotate-table tr:first-child td{background:var(--bg2);color:var(--dim);font-weight:600}
  .sf-trend-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sf-trend-card{background:var(--card2);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
  .sf-trend-head{padding:8px 10px;font-size:13px;font-weight:700;text-align:center;color:#fff}
  .sf-trend-head-5{background:#534ab7}
  .sf-trend-head-10{background:#0d8a9c}
  .sf-trend-head-20{background:#7e57c2}
  .sf-trend-head-60{background:#5c6bc0}
  .sf-trend-cols{display:flex;font-size:13px;line-height:1.9}
  .sf-trend-col{flex:1;padding:8px;min-width:0}
  .sf-trend-col:first-child{border-right:1px solid var(--border)}
  .sf-trend-col .col-title{font-weight:700;margin-bottom:5px}
  .sf-trend-col .col-in{color:var(--up)}
  .sf-trend-col .col-out{color:var(--down)}
  .sf-trend-row2{display:flex;justify-content:space-between;white-space:nowrap;overflow:hidden;padding:3px 0}
  .sf-trend-row2 span:first-child{overflow:hidden;text-overflow:ellipsis;padding-right:4px}
  @media(max-width:1200px){.sf-trend-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:700px){.sf-trend-grid{grid-template-columns:1fr}}

  .fib{position:relative;height:54px;background:var(--bg2);border-radius:10px;margin-top:8px}
  .fib .node{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);opacity:.7}
  .fib .node span{position:absolute;top:-2px;left:6px;font-size:11px;color:var(--gold);white-space:nowrap}
  .fib .now{position:absolute;top:0;bottom:0;width:3px;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

  /* 图表 */
  .chart{position:relative;height:140px;display:flex;align-items:flex-end;gap:4px;padding-top:20px}
  .bar{flex:1;border-radius:4px 4px 0 0;position:relative;min-width:6px}
  .bar .lbl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--dim);white-space:nowrap}
  .bar .tip{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--txt);white-space:nowrap}
  .ad-chart{height:160px;display:flex;flex-direction:column;gap:3px}
  .ad-row{flex:1;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--dim)}
  .ad-date{width:40px;text-align:right}
  .ad-bars{flex:1;display:flex;gap:2px;height:100%;align-items:center;position:relative}
  .ad-bars>div{height:100%;border-radius:2px}

  /* ===== 完整周历（calendar.html 同源 · V8_CAL 数据） ===== */
  .v8cal-week-label{font-size:12px;color:var(--sub);margin:7px 0 3px;padding-left:4px;font-weight:600}
  .v8cal-headrow{margin-bottom:4px}
  .v8cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
  .v8cal-head{font-size:12px;color:var(--sub);text-align:center;padding:8px 0;font-weight:700;background:var(--card);border-radius:4px}
  .v8cal-day{background:var(--card);border:1px solid var(--border);border-radius:6px;min-height:80px;padding:8px;display:flex;flex-direction:column;gap:3px;position:relative}
  .v8cal-day.today{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
  .v8cal-day-num{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:4px}
  .v8cal-day.dim{opacity:.4}
  .v8cal-event{font-size:11px;line-height:1.4;padding:3px 6px;border-radius:3px;display:flex;align-items:center;gap:3px}
  .v8cal-event .ck{font-size:10px;color:#0d6e2a;background:#a5d6a7;padding:0 3px;border-radius:2px;font-weight:700}
  .v8cal-event.imp{background:rgba(198,40,40,.15);color:#ff8a80;border-left:3px solid #c62828}
  .v8cal-event.cb{background:rgba(21,101,192,.15);color:#64b5f6;border-left:3px solid #1565c0}
  .v8cal-event.data{background:rgba(245,127,23,.15);color:#ffb74d;border-left:3px solid #f57f17}
  .v8cal-event.data2{background:rgba(67,160,71,.15);color:#81c784;border-left:3px solid #43a047}
  .v8cal-event.fomc{background:rgba(156,39,176,.15);color:#ce93d8;border-left:3px solid #9c27b0}
  .v8cal-event.us{background:rgba(66,165,245,.15);color:#90caf9;border-left:3px solid #42a5f5}
  .v8cal-event.hk{background:rgba(239,83,80,.15);color:#ef9a9a;border-left:3px solid #ef5350}
  .v8cal-event.tw{background:rgba(255,152,0,.15);color:#ffcc80;border-left:3px solid #ff9800}
  .v8cal-event.a50{background:rgba(233,30,99,.15);color:#f48fb1;border-left:3px solid #e91e63}
  .v8cal-event.ipo{background:rgba(103,52,183,.15);color:#b39ddb;border-left:3px solid #673ab7}
  .v8cal-event.option{background:rgba(0,131,143,.15);color:#4dd0e1;border-left:3px solid #00838f}
  .v8cal-event.future{background:rgba(29,111,66,.15);color:#81c784;border-left:3px solid #1d6f42}
  .v8cal-event.appl{background:rgba(55,71,79,.15);color:#90a4ae;border-left:3px solid #37474f}
  .v8cal-event.sg{background:rgba(142,36,170,.15);color:#ce93d8;border-left:3px solid #8e24aa}
  .v8cal-event.kr{background:rgba(0,172,193,.15);color:#80deea;border-left:3px solid #00acc1}
  .v8cal-legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .v8cal-legend-item{border-radius:8px;padding:12px 14px;font-size:13px;border-left:5px solid;backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:flex-start;gap:6px;line-height:1.6;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .v8cal-legend-item .lname{font-weight:800;color:var(--txt);font-size:14px;display:flex;align-items:center;gap:8px}
  .v8cal-legend-item .lrest{color:var(--sub);font-size:12px;line-height:1.65}
  .v8cal-legend-item .lt{font-weight:800;color:var(--txt);margin-bottom:4px;display:flex;align-items:center;gap:8px;font-size:14px}
  .v8cal-legend-item .ld{color:var(--sub);line-height:1.65;font-size:12px}
  .v8cal-legend-item .swatch{width:16px;height:16px;border-radius:4px;flex-shrink:0}
  .v8cal-li{list-style:none;padding:0;margin:0;font-size:11px;color:var(--txt);line-height:1.7}
  .v8cal-li li{padding-left:10px;position:relative}
  .v8cal-li li::before{content:'·';position:absolute;left:2px;color:var(--dim);font-weight:700}
  .v8cal-li.col2{column-count:2;column-gap:14px;margin-top:8px}
  .v8cal-li.col2 li{break-inside:avoid}

  /* 旧日历兼容（保留 modal 用） */
  .cal-month{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:10px}

  .mask{position:fixed;inset:0;background:rgba(4,8,16,.78);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
  .mask.show{display:flex}
  .modal{background:var(--card2);border:1px solid var(--border2);border-radius:16px;max-width:520px;width:100%;padding:22px;max-height:86vh;overflow:auto}
  .modal h3{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .modal .close{margin-left:auto;cursor:pointer;color:var(--sub);font-size:22px;line-height:1}
  .mev{padding:10px 0;border-bottom:1px dashed var(--border);display:flex;gap:10px}
  .mev:last-child{border:0}
  .mev .e{font-size:18px;flex:0 0 auto}
  .mev .mt{font-weight:700}
  .mev .md{font-size:12px;color:var(--sub)}

  .lockmask{position:fixed;inset:0;background:rgba(4,8,16,.9);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
  .lockmask.show{display:flex}
  .lockcard{background:var(--card2);border:1px solid var(--border2);border-radius:16px;padding:28px;width:340px;text-align:center}
  .lockcard .lk{font-size:40px}
  .lockcard h3{margin:10px 0 4px;font-size:18px}
  .lockcard p{color:var(--sub);font-size:13px;margin-bottom:16px}
  .lockcard input{width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--txt);padding:11px 12px;border-radius:9px;font-size:15px;text-align:center;margin-bottom:12px;letter-spacing:2px}
  .lockcard .err{color:var(--up);font-size:12px;min-height:16px;margin-bottom:8px}
  .lockcard .btn{width:100%;background:var(--cyan);color:#04121f;border-color:var(--cyan);font-weight:700}

  .kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .kv:last-child{border:0}
  .kv .k{color:var(--sub)}
  .status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
  .s-ok{background:var(--down);box-shadow:0 0 6px var(--down)}
  .s-warn{background:var(--gold);box-shadow:0 0 6px var(--gold)}
  .s-err{background:var(--up);box-shadow:0 0 6px var(--up)}
  .s-off{background:var(--dim)}
  .logic-h{font-weight:700;margin:14px 0 6px;color:var(--cyan)}
  .logic-p{color:var(--sub);font-size:13px;line-height:1.7}
  .code{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--gold);margin:8px 0;overflow:auto}
  .note{font-size:12px;color:var(--dim);margin-top:10px}

  /* ===== 打新速览 v8 ===== */
  .ipo-sec{margin-bottom:16px}
  .ipo-sec:last-child{margin-bottom:0}
  .ipo-sec-title{font-size:13px;font-weight:800;color:var(--cyan);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
