# 九宝量化 v8.0 — 盘中算法追踪轻量重算（云端 ubuntu-latest）
#
# 2026-08-20 主人令「一劳永逸」：动量共识筛选属于盘后选股策略，
#   已迁到 19:15 CST 盘后算法链（v8_algo_cloud.yml → v8_build_deploy.yml），
#   避免盘中 09:28 等时间点用未完整数据提前计算。
# 本 workflow 仅保留：
#   ① 盘中每 2h 真跑 gen_algo_track.py（三算法追踪入池：四量终极/RPS/CRDS）
#   ② dispatcher 兜底：v8_dispatch_fetch.py 加 intraday_lite 子命令，时间窗 09:30-15:00 CST
#
# 推送：仅 workflow_dispatch 可用；内容未变（?v 已是最新）则跳过推送。
# cron 设计：UTC 1,3,5,7 = CST 09:00, 11:00, 13:00, 15:00（盘中交易时段每 2h 一次）。

name: "☁️ v8 盘中算法追踪(轻量)"

on:
  schedule:
    # ⏰ 2026-08-19 一劳永逸：cron UTC 1/3/5/7 = CST 09:00/11:00/13:00/15:00，盘中每 2h 触发
    # 周末/节假日由 workflows 内部跳过（仓内交易日历 gate，与 v8_algo_cloud.yml 同套）
    - cron: '0 1,3,5,7 * * 1-5'
  workflow_dispatch:
    inputs:
      note:
        description: '备注（可选）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trading: ${{ steps.t.outputs.trading }}
    steps:
      - id: t
        shell: bash
        run: |
          TH=$(TZ=Asia/Shanghai date +%-H); TM=$(TZ=Asia/Shanghai date +%-M)
          TR=0
          if { [ "$TH" -eq 9 ] && [ "$TM" -ge 25 ]; } || [ "$TH" -eq 10 ] || { [ "$TH" -eq 11 ] && [ "$TM" -le 30 ]; } || [ "$TH" -eq 13 ] || [ "$TH" -eq 14 ]; then TR=1; fi
          echo "trading=$([ "$TR" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "🕒 当前北京时间 ${TH}:${TM} → 交易时段=$([ "$TR" -eq 1 ] && echo YES || echo NO)"
  algo_track_lite:
    needs: [gate]
    # 🛡 2026-09-03 交易时段优先级闸门（盘中风暴一劳永逸根治）：
    #   盘中(09:25-11:30 / 13:00-14:59)算法重算排队，只放行 09:00 盘前 / 15:00 盘后两档，
    #   避免与 intraday 抓取抢 CI。其余时段照常每 2h 轻量重算四量终极/RPS/CRDS 追踪。
    if: needs.gate.outputs.trading != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 朴素 now() 即北京时间（与云端中国节点产出一致，新鲜度守卫时间对齐）
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V8_PUSH: "1"
      # 🔴 2026-09-16 阿狸咪的工程师：本 workflow 是**轻量**环境（不装 requirements.txt ⇒ 无 pandas），
      #   而 update_v8.py 会级联到 run_experiment_cards（gen_strong_breakout 需 pandas 取 K 线）。
      #   拿不到 K 线时脚本会守住「拒绝发布虚假回测」闸门并抛错，导致整个 update_v8 中断、
      #   当晚 ALGO_TRACK 不重生、推送步骤被 skip（实测 run 35095625053，09-11~09-16 每晚一红）。
      #   本 workflow 自述「动量共识筛选已迁到盘后 19:15 算法链，盘中不再重复跑」⇒ 按契约跳过实验卡，
      #   实验卡由云端构建（装了 requirements.txt）负责重算。
      V8_SKIP_EXPERIMENT_CARDS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: "📥 checkout（云端 git 可靠）"
        uses: actions/checkout@v4

      - name: "🐍 配置 Python (setup-python 3.13)"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 2026-08-20 主人令：动量共识筛选已迁到盘后 19:15 算法链（v8_algo_cloud.yml），
      #   盘中不再重复跑，避免 09:28 等时间点基于未完整数据刷新。
      #   脚本入口已加 check_stock_picking_ready() 双保险，任何手动触发在 18:00 前都会直接退出。

      - name: "📊 三算法追踪入池（gen_algo_track）"
        # 🔴 2026-08-19 一劳永逸补齐：盘中每 2h 重算四量终极/CRDS追踪
        # 写入 raw_data/algo_track.json（git tracked，下一步 api_push_raw 推），保证盘中卡片不过期
        run: |
          # 🔴 2026-09-08 主人令「禁止假 success」：原 set +e + echo + 无条件 exit 0
          #    会让 gen_algo_track 崩溃也显示绿色 → ALGO_TRACK 停更无人知。
          #    改为捕获真实退出码，非零即让 job 变红。
          # 🔴 2026-09-16 阿狸咪的工程师「假 success 回归」修复：
          #   2026-09-08 e190e5fc39 为补退出码捕获，把真正的调用行**误删**——
          #   `rc=$?` 取的是本 shell 上一条命令（新 shell 恒为 0）⇒ 本步骤恒定绿、
          #   脚本从未执行。下面这行与 09-03 版原文等价。
          rc=0
          python algorithms/gen_algo_track.py || rc=$?
          echo "gen_algo_track exit: $rc"
          if [ "$rc" != "0" ]; then
            echo "::error::gen_algo_track.py 失败（exit=$rc），ALGO_TRACK 未刷新"
            exit 1
          fi

      - name: "🔄 重生成 data/ALGO_TRACK.js 并更新 index.html ?v 缓存戳"
        # ALGO_TRACK.js 由 update_v8.py 的 _make_js 从原始 raw_data 重生，
        # 流水线单一写者原则防止双写竞态击穿 ?v 防覆盖铁律（2026-08-15 根因修复）。
        # 不传 --category：默认 build() 内部读 raw_data/*.json 全量重生，盘中每 2h 漂移可控（<5min）。
        # 注：MOMENTUM_FILTER.js 已迁到盘后 19:15 算法链，本 workflow 不再碰。
        run: |
          # 🔴 2026-09-08 主人令「禁止假 success」：update_v8 失败 = data/*.js 没重建 = 旧 JS 上线，必须红
          python update_v8.py || { echo "::error::update_v8.py 失败，data/*.js 未重建"; exit 1; }

      - name: "🩺 刷新 HEALTH_CHECK.js"
        # 🔴 2026-09-08 主人令「禁止假 success」：删 continue-on-error + || true。
        #    体检脚本跑挂 = 监控失效，必须可见。
        run: |
          python v8_health_check.py || { echo "::error::v8_health_check.py 失败，健康面板未刷新"; exit 1; }

      - name: "📤 推送变更到 main（git push，全套 data/*.js + raw_data/*.json 自动）"
        # 🔴 2026-09-16 阿狸咪的工程师 · 修「体检红灯把本链产物一并吞掉」（D6）：
        #   上一步 `python v8_health_check.py || { …; exit 1; }` 是主人 2026-09-08「禁止假 success」
        #   令立的硬失败（体检脚本跑挂 = 监控失效，必须可见）——**那行一字不动**。
        #   但 v8_health_check.py 退出码语义是 `sys.exit(0 if report["overall"]=="ok" else 2)`，
        #   于是「体检跑完、结论非 ok（有 stale 卡）」与「脚本自身崩溃」被同一个 exit 1 混为一谈，
        #   `||` 分支把后续步骤全 skip ⇒ 本链刚算出的产物一条都推不上去。
        #   实测 run 35105177952（09-16 21:56）：「三算法追踪入池」「重生成 data/ALGO_TRACK.js」
        #   两步均 success，本步被 skip ⇒ 当晚 data/ALGO_TRACK.js 未刷新（D1/D2 修复成果被吞）。
        #   修法：只给本推送步加 !cancelled() —— 硬失败/红灯完全不改（可见性不降、不造任何假 success），
        #   但推送在体检失败后仍必须执行（数据新鲜优先于告警颜色）。用 !cancelled() 而非 always()，
        #   以免 job 被 cancel 时还去推半成品。
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "v8-intraday-bot"
          git config user.email "v8-intraday-bot@users.noreply.github.com"
          # 🛡 安全：先从索引移除敏感文件，防止 git add -A 重新提交已跟踪的密钥
          git rm --cached --ignore-unmatch \
            data/.mahoro_cookies.txt data/.github_pat.txt data/zsxq_token.json \
            data/.wc_jwt_cache.json data/.neodata_token data/zszxq_token.json 2>/dev/null || true
          # 🔴 2026-09-10 阿狸咪根因修复（主人令「全面审计瘦身」）：同上，git add -A 前先摘缓存索引
          git rm -r --cached --ignore-unmatch --quiet \
            algorithms/__pycache__ algorithms/_opt_kline_cache \
            raw_data/_tdx_cache 2>/dev/null || true
          find raw_data -maxdepth 1 -name '*.bak' -print0 2>/dev/null \
            | xargs -0 -r git rm --cached --ignore-unmatch --quiet 2>/dev/null || true
          git add -A
          # 仅有变更时提交（无变更 = noop）
          if git diff --cached --quiet; then
            echo "⏭️ 无任何变更，跳过推送"
            exit 0
          fi
          msg="chore: 盘中算法追踪轻量刷新 $(date +%H:%M)"
          git commit -m "$msg"
          # 🛡 并发 push 互踩加固（2026-08-30 全量跑批实测暴露 non-fast-forward）
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ pushed: $msg"; exit 0
            fi
            echo "⚠️ push 被拒（并发互踩），fetch+rebase 后重试 ($i/3)"
            git fetch origin main && git rebase FETCH_HEAD || { git rebase --abort || true; exit 1; }
          done
          echo "❌ 3 次重试后仍失败"; exit 1
