# ⏱️ v8 数据新鲜度守门（每小时）— 2026-08-16 从本机 WorkBuddy 自动化迁移至云端
# 原「数据新鲜度自动值守」（automation-1784448887937）：guard_v8_freshness.py 检查 data/*.js 新鲜度，
# CORE 过期 dispatch 云端补抓（category=heal）。云端化后全自动、不耗 WorkBuddy token。
name: "⏱️ v8 数据新鲜度守门(每小时)"

on:
  schedule:
    - cron: '0 * * * *'     # 每小时（UTC，对应 CST 每整点）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: v8-freshness-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V8_GITHUB_TOKEN: ${{ secrets.V8_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🩺 新鲜度检查（guard_v8_freshness.py）"
        id: freshness
        continue-on-error: true
        run: |
          python guard_v8_freshness.py 2>&1 | tee freshness_out.txt
          echo "FRESH_EXIT=$?"

      # 🛡 2026-08-18 主人紧急令根治：旧版只 grep "CORE"，对 WARN（48h 阈值如 TRIPLE_HISTORY/
      #   SH_FIB/SZ_FIB/CANDIDATE/GOLD_POOL 等）只记录不自愈 → 这就是「4 天没跑没发现」的根因之一。
      #   修复：检测到任何 CORE 或 WARN stale → 直接 dispatch cn_fetch category=heal，
      #   让云端 fetch 把全套 raw_data 抓一遍 → bridge_raw_data → update_v8 → data/*.js 刷新。
      #   30 分钟去抖锁由 cn_fetch 内部自愈的 _load_heal_lock 保证不会雪崩。
      - name: "🔧 CORE/WARN 过期 → 云端补抓（category=heal）"
        run: |
          if grep -qE "(核心数据过期|次要数据过期)" freshness_out.txt 2>/dev/null; then
            echo "🔧 检测到 CORE/WARN 过期，dispatch v8_cn_fetch_cloud.yml category=heal"
            gh workflow run v8_cn_fetch_cloud.yml -f category=heal || true
          else
            echo "✅ 无 CORE/WARN 过期（FROZEN 仅记录不擅自伪造）"
          fi

      - name: "📊 摘要"
        if: always()
        run: |
          echo "## ⏱️ v8 数据新鲜度 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> $GITHUB_STEP_SUMMARY
          tail -20 freshness_out.txt >> $GITHUB_STEP_SUMMARY || true
