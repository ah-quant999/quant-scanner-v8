# [step0 同步源码 L38]          #    该域可能整域不可用 ⇒ 必失败。contents API 的 JSON+base64 全程同域 api.github.com。
# [step1 跑脚本   L62]          if (-not (Test-Path 'raw_data/us_hk_map.json')) { Write-Host "[warn] 未产出 raw；本链停止" }
# [step2 重建     L80]          if (-not (Test-Path 'data/US_HK_MAP.js')) { Write-Host "[warn] 未产出 data；本链停止" }
# [step3 内容比对 L96]          # 比对逻辑放仓内脚本 scripts/us_hk_map_need_push.py（可本机实测、避免 PowerShell
# [step3 内容比对 L97]          # here-string 的 `'@` 必须顶格 与 YAML 块缩进 的冲突，那会让整份 workflow 解析失败）。
# [step4 推送     L118]         if ($need -notmatch 'need=1') { Write-Host "[skip] 内容与线上一致，不推送（避免空提交触发全量重建）" }
# [step5 推送     L138]         if ($need -notmatch 'need=1') { Write-Host "[skip] 内容与线上一致，不推送（避免空提交触发全量重建）" }
