# ⚖️ v8 股债性价比温度计刷新（云端真数据链）
# v8/gen_eqbond_attraction.py → data/EQBOND_ATTRACTION.js → workflow_run 唤起 Pages 部署
name: "⚖️ v8 股债性价比 refresh (cloud)"

on:
  workflow_dispatch:
  schedule:
    # 19:20 CST = UTC 11:20，交易日盘后估值/利率均已定型
    - cron: '20 11 * * 1-5'
  # GHA schedule 在本仓多次实证静默漂移；挂主抓取链做可靠兜底
  workflow_run:
    workflows:
      - "🇨🇳 v8 中国数据抓取(云端)"
      - "🇨🇳 v8 中国数据抓取(云端·hosted兜底)"
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: v8-eqbond-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      TZ: Asia/Shanghai
      PYTHONIOENCODING: utf-8

    steps:
      - name: "📥 checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🐍 setup python + deps"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "📦 install"
        run: |
          python -m pip install --quiet akshare==1.20.42 pandas requests xlrd openpyxl

      - name: "🧮 生成 EQBOND_ATTRACTION.js"
        run: |
          python v8/gen_eqbond_attraction.py
          test -s data/EQBOND_ATTRACTION.js
          echo "✅ data/EQBOND_ATTRACTION.js: $(wc -c < data/EQBOND_ATTRACTION.js) bytes"

      - name: "📤 推送数据 + 同步 index.html 缓存戳"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, re, json, base64, hashlib, time, urllib.request, urllib.error
          TOK = os.environ["GITHUB_TOKEN"]
          REPO = "ah-quant999/quant-scanner-v8"
          API = "https://api.github.com/repos/" + REPO
          H = {"Authorization": "Bearer " + TOK, "Content-Type": "application/json",
               "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}

          def api(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, headers=H, method=method)
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)

          raw = open("data/EQBOND_ATTRACTION.js", "rb").read()
          if not raw:
              raise SystemExit("empty data refuse push")
          sha10 = hashlib.sha1(raw).hexdigest()[:10]

          def get_file(path):
              return api("GET", API + "/contents/" + path)

          def put_file(path, payload, retries=5):
              url = API + "/contents/" + path
              for i in range(retries):
                  try:
                      cur = get_file(path)
                      payload["sha"] = cur["sha"]
                      api("PUT", url, payload)
                      return True
                  except urllib.error.HTTPError as e:
                      if e.code in (409, 422) and i < retries - 1:
                          time.sleep(2 + i)
                          continue
                      raise
              return False

          put_file("data/EQBOND_ATTRACTION.js", {
              "message": "v8 EQBOND_ATTRACTION: 股债性价比真数据刷新 %s" % sha10,
              "content": base64.b64encode(raw).decode(),
              "branch": "main",
          })
          print("pushed data/EQBOND_ATTRACTION.js", sha10)

          ex = get_file("index.html")
          if ex.get("encoding") == "base64":
              html = base64.b64decode(ex["content"]).decode("utf-8")
          else:
              blob = api("GET", API + "/git/blobs/" + ex["sha"])
              html = base64.b64decode(blob["content"]).decode("utf-8")

          new_html, n = re.subn(r'(data/EQBOND_ATTRACTION\.js\?v=)([a-f0-9]+)',
                                lambda m: m.group(1) + sha10, html)
          if n == 0:
              print("WARN index.html 未找到 EQBOND_ATTRACTION.js?v=")
          elif new_html == html:
              print("index.html ?v 已是", sha10)
          else:
              put_file("index.html", {
                  "message": "chore(cache): EQBOND_ATTRACTION.js?v=%s" % sha10,
                  "content": base64.b64encode(new_html.encode("utf-8")).decode(),
                  "branch": "main",
              })
              print("index.html ?v →", sha10)
          PY
