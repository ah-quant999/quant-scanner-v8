      net_5d/10d/20d/60d 并写真实窗口天数（满窗才出数）；稀疏记录从此无权出数（P0 连续性闸门拒出）。
      三处配套修正：① 板块名→BK 代码映射由被阻断的 clist(push2/push2delay，本机 RemoteDisconnected)
      改用 searchapi suggest（实测可达，token 用公开 D43BF722...），结果缓存 raw_data/sector_bk_codes.json；
