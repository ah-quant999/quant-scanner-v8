        训练出的「看着红也不管」正是主人反复禁止的失效模式。
      · **CI 分钟浪费 + 部署延迟**：每档都要跑完整个生成链后才在最后一步被拦下。
      · ⚠️ 与「假红」不同：**这不是误报**——data 层那 3 项**确实**陈旧；病根在①（数据侧被顶旧）与②（产物停更），
        闸门行为本身是正确的。因此**正解是修数据侧根因，不是放宽闸门**（放宽会真的把陈旧数据推上线）。
