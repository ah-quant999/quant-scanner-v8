# 九宝量化 v8.0 — 实时风险温度计（GitHub 云端 ubuntu-latest）
#
# 抓取 USDJPY / VIX / 10Y日债 / USDCNH 等全球宏观指标，
# 写入 raw_data/risk_gauge.json，由 build_deploy 自动构建为 data/RISK_GAUGE.js。
#
# 2026-08-03：新增，支持 workflow_run 触发下游 build_deploy。

name: "🌍 v8 实时风险温度计"

on:
  schedule:
    # UTC 00:00-08:00 每30分钟 = 北京时间 08:00-16:00 每30分钟
    - cron: '*/30 0-8 * * 1-5'
    # 晚间 11:00-14:00 UTC = 北京时间 19:00-22:00，覆盖美股开盘情绪
    - cron: '0 11-14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-risk-gauge
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: "🌡️ 抓取全球宏观风险指标"
        run: python fetch_risk_gauge.py

      - name: "📤 推送 raw_data/risk_gauge.json"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "v8-cloud-bot"
          git config user.email "v8-bot@users.noreply.github.com"
          git add raw_data/risk_gauge.json
          if git diff --cached --quiet; then
            echo "无变化，跳过推送"
            exit 0
          fi
          git commit -m "v8 risk gauge: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          REPO="https://x-access-token:${GIT_TOKEN}@github.com/ah-quant999/quant-scanner-v8.git"
          for i in 1 2 3; do
            if git push "$REPO" HEAD:main; then
              echo "✅ 已推送风险温度计数据"; exit 0
            fi
            echo "⚠️ push 被拒，rebase 后重试 ($i/3)"
            git fetch "$REPO" main && git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          echo "❌ 3 次重试后仍失败"; exit 1
