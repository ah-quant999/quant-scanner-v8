# 九宝量化 v8.0 — 盘中准点档调度器（14 档 · 跑 GitHub ubuntu-latest）
#
# 🔴🔴 2026-11-20 10:45 小九 单链化重构（主人令「10点20了主站还在9点45」·连续多日盘中延迟根因）：
#   【实测】当日云端主力 9 档 dispatch 全部 cancelled（同组新 dispatch 顶掉旧 run），云端盘中
#   从未真正执行；数据全靠 12min 超时后的 selfhosted 兜底续命 → 每档延迟 15-25 分钟。
#   【修法】① 守卫在途探测扩为 selfhosted+云端双链（原只查云端，selfhosted 在跑时误判无在途
#   → 派云端 → 顶掉正在写 main 的 selfhosted，10:14 档 selfhosted 即被 10:22 档顶杀实证）；
#   ② cn runner 在线（单位机 7:45-17:45 覆盖全部盘中档）时直派 selfhosted 为唯一主力，
#   离线才回落云端；③ 轮询超时不再派兜底（老「超时→兜底→顶掉在跑」路径删除），长跑交给
#   守卫避让；④ 每档顺手派 v8_intraday_snapshot（快照链 schedule 同样日间失灵，
#   SECTOR_FUND_FLOW_INTRADAY 卡 11-19 14:49 实证）。
#
# 🔴 2026-09-10 CN runner2号机更正：本调度器**已不再跑在 [self-hosted, cn]**，改 GitHub 托管 ubuntu-latest。
#   根因：共享标签 [self-hosted, cn] 会让 14 档落到家里机（违反双机分时），且机器忙/离线时档位
#   排队积压、错时执行（实测 09-10 的 15:29 / 16:23 / 17:22 / 18:01 / 19:03 / 19:29 / 19:45 / 20:04
#   这 8 个 schedule run 全部晚于 15:05，被守卫判「迟到档」丢弃）。本 job 零产物、纯调度，
#   不需要中国 IP → 用 GitHub 托管更稳。
#
# 🔴 2026-09-09 主人令「盘中 20 分钟单源闭环（升级版·接力赛模型）」：
#   根因：原盘中由 WorkBuddy 自动化「云端按铃」(1787141452867) 每 20 分 dispatch 易导致
#   多源齐发 + api_push_raw 防倒退守卫互踢、半截 JSON；尤其CN runner1号机偶尔下线时CN runner2号机兜底
#   仍要抢按铃节奏 → 真正的"风暴根因"。
#   新模型：
#     - 盘中 14 档（9:40/10:00/.../15:00 CST，跳午休 11:30-13:00）由本 workflow 统一调度。
#     - 每档先 dispatch 云端 v8_cn_fetch_cloud（category=intraday，云端抓中国源主力）。
#     - 实时轮询云端 run 状态（最多 12 分钟，每 30s 探测），成功即结束；超时/失败转兜底。
#     - gh api 查 run 状态：成功 → 本档结束；失败/超时/无 run → dispatch
#       v8_cn_fetch_cloud_selfhosted（CN runner1号机 cn IP 兜底，同 runner 不出海）。
#     - 接力赛：云端抓 8-10min + CN runner1号机 10min 后检查 + 失败CN runner1号机兜底（cn IP 直连）→ 一档 20-25min。
#   优点：
#     ① 单源（CN runner1号机 GHA cron 14 档）+ 接力赛（云端失败CN runner1号机兜底）→ 不再双源互踢。
#     ② 同 concurrency group v8-cn-fetch-cloud（含云端主力+CN runner1号机应急+hosted 兜底+CN runner2号机按铃）
#        互斥排队不互杀，api_push_raw 防倒退守卫稳定。
#     ③ CN runner2号机盘中按铃阈值放宽到 60 分钟（CN runner1号机正常时永不触发，整台机掉才兜底）。
#     ④ 与现状 cron 完全解耦：本 yml 是新加，v8_cn_fetch_cloud.yml 盘中 cron 已删，
#        纯依赖本 yml 与CN runner2号机按铃（兜底）。
#
# 工作日窗口（CN runner1号机 cn runner 在线时段 7:45-17:45）：
#   CST  9:40  10:00  10:20  10:40  11:00  11:20  11:40  13:00  13:20  13:40  14:00  14:20  14:40  15:00
#   UTC  1:40  2:00   2:20   2:40   3:00   3:20   3:40   5:00   5:20   5:40   6:00   6:20   6:40   7:00
#   注：UTC 4:00-4:59 是午休（11:30-12:30 CST 跳过，A股午休无数据；13:00 CST = UTC 5:00）
#   🔴 2026-09-21 补首档 09:31 CST（= UTC 1:31）⇒ 开盘 09:30 起即有覆盖，原 09:30-09:40 真空消除。
#
# 🔴 反踩踏铁律：
#   - 本 workflow **不直接跑抓取**，只 dispatch + 检查 + 兜底 dispatch，零产物输出。
#   - 不写 raw_data/、不写 data/、不 git push → 不会有 api_push_raw 互踢。
#   - 三层 dispatch 全走同 group v8-cn-fetch-cloud 互斥排队。

name: "🇨🇳 v8 盘中准点档调度器(CN runner1号机 self-hosted cn 主力)"

on:
  workflow_dispatch:

permissions:
  # 🔴 2026-09-10 修正：原写 `actions: read` → 用 GITHUB_TOKEN dispatch 其他 workflow 会 403
  #    （对照 v8_cn_fetch_watchdog.yml / v8_slot_scheduler.yml / v8_freshness_watch.yml
  #      / v8_algo_cloud.yml 全为 actions: write，本 yml 原是唯一异类）
  #    dispatch 需要 actions: write；本 yml 不写盘、不 push，故 contents 保持 read。
  contents: read
  actions: write

# 🔴 2026-09-10 实测修正（Bug ④ 架构死锁）：本 yml **移出** v8-cn-fetch-cloud 组。
#   原因：本 job 占组长达 20 分钟（dispatch + sleep 10min + 检查 + 兜底），
#   而它 dispatch 出去的 v8_cn_fetch_cloud / _selfhosted 又同属该组 → 被调度者
#   必须排队等本 job 让出组 → 本 job 10 分钟后检查时对方还在 queued → 误判失败
#   → 触发兜底 → 兜底同样排队 → 死锁。
#   实测证据：run 34430728891 跑到 sleep 结束时被外力 cancelled（02:46→02:56），
#   check/兜底两步全部 skipped，一档 20 分钟白跑。
#
#   本 yml 零产物（不写 raw_data/、不写 data/、不 git push），与被调度者没有资源竞争，
#   互斥毫无必要。改独立组 v8-cn-fetch-slot：
#     - cancel-in-progress: true → 上一档若卡住，新档接管，避免 14 档逐档堆积。
concurrency:
  group: v8-cn-fetch-slot
  # 🔴 2026-11-19 15:10 根治（主人令「都收盘了主站还是13:40数据」· 小九）：
  #   上面 11-04 的 cancel-in-progress:true 设计基于「调度器 dispatch 前必查云端在途」，
  #   但精准调度器的新鲜度兜底（>25min 无 success 即补派）打破了这个假设：
  #   兜底查到最新 run=cancelled 不算覆盖 → 补派 → 顶掉在跑档 → 在跑档变 cancelled
  #   → 兜底再补派 → 无限互杀循环（实测 14:29-14:47 五连杀，云端生成器 14 点后零成功
  #   = 主站卡 13:40 根因）。改 false：档间排队不互杀，配合调度器 dedupe 足够安全。
  cancel-in-progress: false

jobs:
  intraday_slot:
    # 🛡 2026-11-19 push 僵尸免疫：GitHub 对改触发器的 workflow 有已知怪癖——push 后
    #    可能以 event=push 拉起本链且零 job 直接 failure（实测 #989/#990，连未改本文件
    #    的账本 push 也中招）。push 触发一律空转跳过，不产生失败噪音、不污染调度器 dedupe。
    if: github.event_name != 'push'
    # 🔴 2026-09-10 一劳永逸修复（盘中混乱根因①）：原 runs-on: [self-hosted, cn] 本以为能
    #    "固定CN runner1号机单位机"，但 [self-hosted, cn] 是【标签集合】而非专属标签——任何注册了
    #    self-hosted + cn 的 runner 都会被接单。实测 09-10 全天 14 档有 11 档落在 alimi-cn
    #    （家里机），违反双机分时铁律；且机器忙碌/离线时档位会排队积压、错时执行
    #    （15:29 / 17:22 / 19:03 / 20:04 这些盘后时刻的 schedule run 即由此而来）。
    #    本 job 是纯调度器：只做 dispatch + 轮询 + 兜底派发，零数据、零写盘、零 push，
    #    不需要中国 IP、不需要任何自托管机 → 改 GitHub 托管 ubuntu-latest，更快更稳。
    runs-on: ubuntu-latest
    # 🛡 2026-09-09 一档最多 20 分钟：dispatch + sleep 10min + 查状态 + 兜底 dispatch
    #   （兜底 job 自己 75min timeout），本 yml 只跑前 20 分钟的"调度+检查"段
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      # 🔴 2026-09-10 一劳永逸修复（盘中混乱根因②）：三重守卫。
      #   同并发组 GitHub 只保留 1 个 pending，新派发会把上一档 pending 顶掉
      #   → 09-10 实测 26 个 run 被 cancelled（大多从未启动）。守卫不通过就整档安静退出。
      - name: "🛡 三重守卫（交易日 / 时间窗 / 云端在途）"
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          DOW=$(TZ=Asia/Shanghai date '+%u')
          HHMM=$(TZ=Asia/Shanghai date '+%H%M' | sed 's/^0*//'); HHMM=${HHMM:-0}
          echo "本档时间: $(TZ=Asia/Shanghai date '+%F %T') CST (dow=$DOW hhmm=$HHMM)"
          GO=true; WHY=""
          if [ "$DOW" -ge 6 ]; then GO=false; WHY="非交易日(dow=$DOW)"; fi
          # 🔴 2026-09-21 CN runner2号机的工程师：上界 1505 -> 1510。
          #   实测（09-21 全天日志）：schedule 1-3 分钟延迟下 15:00 档平稳落窗，但**任一档
          #   延迟 >5 分钟即被上界整档丢弃**（09-18 实测有 19:24/19:47/19:58 等晚 4h 以上的档）。
          #   放宽到 15:10：给收盘档 5 分钟余量；A 股 15:00 收盘后 15:05-15:10 抓到的仍是
          #   当日收盘价，**不是过期数据** ⇒ 上界放宽零数据风险，只有「盘后多抓一次」的成本。
          #   对比下界（放行 09:29 反而抓非开盘数据）——两者不对称，故**只放宽上界、不动下界**。
          if [ "$GO" = "true" ] && { [ "$HHMM" -lt 932 ] || [ "$HHMM" -gt 1510 ]; }; then
            GO=false; WHY="迟到档/窗外（$HHMM 不在 09:32-15:10）"
          fi
          if [ "$GO" = "true" ]; then
            # 🛡 零解析依赖（2026-09-10 最终版）：直接按状态向 GitHub 查，服务端过滤；
            #    取值只用 grep/cut（POSIX 必带），不用 python/jq —— 解析器一旦失败就会静默放行。
            # 🔴 2026-11-20 10:45 小九（主人令「10点20了主站还在9点45」根因修复·守卫补盲）：
            #    在途探测原「只查 v8_cn_fetch_cloud」——今日实测 10:14 selfhosted 兜底正在跑
            #    （数据正在产出），10:22 档守卫没查 selfhosted → 误判无在途 → 派云端 → 同组
            #    把正在写 main 的 selfhosted 顶掉（当日云端 9 连杀 + selfhosted 被顶 1 次，
            #    盘中数据全靠 12min 超时兜底续命）。扩为双链在途探测，任一在途即让位。
            INFLIGHT_TS=""; INFLIGHT_ID=""; INFLIGHT_ST=""
            for WFCHK in v8_cn_fetch_cloud_selfhosted.yml v8_cn_fetch_cloud.yml; do
              for ST in in_progress queued pending; do
                curl -sS -o /tmp/q.json -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/ah-quant999/quant-scanner-v8/actions/workflows/$WFCHK/runs?status=$ST&per_page=1" 2>/dev/null
                T=$(grep -o '"created_at":"[^"]*"' /tmp/q.json 2>/dev/null | head -1 | cut -d'"' -f4)
                if [ -n "$T" ]; then
                  INFLIGHT_TS="$T"; INFLIGHT_ST="$ST"
                  INFLIGHT_ID=$(grep -o '"id":[0-9]*' /tmp/q.json 2>/dev/null | head -1 | cut -d: -f2)
                  break 2
                fi
              done
            done
            if [ -n "$INFLIGHT_TS" ]; then
              AGE=$(( ( $(date -u +%s) - $(date -u -d "$INFLIGHT_TS" +%s) ) / 60 )) 2>/dev/null
              echo "云端在途: run#$INFLIGHT_ID 状态=$INFLIGHT_ST 起始 $INFLIGHT_TS (龄 ${AGE}min)"
              # 算不出龄时保守按"在途"处理（已确认确有在途 run，绝不叠加第二个 pending）
              if [ -z "$AGE" ] || [ "$AGE" -lt 30 ]; then
                GO=false; WHY="云端在途（run#$INFLIGHT_ID，龄 ${AGE}min）→ 本档跳过，绝不制造第二个 pending"
              else
                # 🔴 2026-09-10 CN runner2号机修 bug：原注释写「本档不派发」但代码没置 GO=false → 实际仍会派发，
                #    与注释矛盾，且是「同一档叠第二个 pending」的隐患。补齐守卫，与注释/设计一致。
                GO=false; WHY="云端疑似卡死（run#$INFLIGHT_ID 已 ${AGE}min 未完成）→ 本档不派发，交 v8_cn_fetch_watchdog(>45min) 兜底"
                echo "::warning title=云端疑似卡死::run#$INFLIGHT_ID 已 ${AGE}min 未完成，本档不派发，交由 v8_cn_fetch_watchdog(>45min) 兜底"
              fi
            else
              echo "云端无在途 run ✅"
            fi
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          if [ "$GO" = "true" ]; then
            echo "✅ 守卫放行，本档正常派发"
          else
            echo "⏭ 守卫拦截，本档安静退出：$WHY"
            echo "::notice title=盘中档跳过::$WHY"
          fi

      # 🔴 2026-11-20 10:45 小九（单链化根治·结构重排）：runner 在线探测前移到 dispatch 之前
      #   （原在 check_cloud 之后、fallback 之前——单链化后 dispatch 目标本身取决于探测结果）。
      - name: "CN runner 在线探测（周末/双机下线时回落云端主力，灭红 run 洪水）"
        id: check_cn_runner
        # [甲护栏 2026-11-08 最低风险·纯新增] 派发 cn 兜底前先查 [self-hosted, cn] runner 是否在线。
        #   根因：周末无 CN runner 在线时，外部自动化/看门狗绕过守卫直派 selfhosted -> 排队层瞬时失败 -> 70 红 run 洪水。
        #   探测失败默认 online=true（宁可派发也不漏兜底），只有明确查到无在线 cn runner 才跳过。
        if: steps.guard.outputs.go == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="https://api.github.com/repos/ah-quant999/quant-scanner-v8"
          ONLINE="true"
          HTTP_CODE=$(curl -sS -o /tmp/cn_runners.json -w "%{http_code}" -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$REPO/actions/runners?per_page=100")
          if [ "$HTTP_CODE" = "200" ]; then
            BOTH=$(jq -r '[.runners[]? | select(.status=="online") | select(([.labels[]?.name] | index("cn") != null and index("self-hosted") != null))] | length' /tmp/cn_runners.json 2>/dev/null)
            if [ "${BOTH:-0}" = "0" ]; then
              ONLINE="false"
            fi
          fi
          echo "online=$ONLINE" >> "$GITHUB_OUTPUT"
          if [ "$ONLINE" = "false" ]; then
            echo "info: 无 CN 自托管 runner 在线（周末/双机下线属预期）-> 回落云端主力"
          else
            echo "ok: 查到在线 CN runner -> 本档派 cn 主力"
          fi

      - name: "🚀 dispatch 盘中主力 v8_cn_fetch_cloud_selfhosted（cn IP 直连·单链化）"
        id: dispatch_cn
        # 🔴 2026-11-20 10:45 小九（主人令「10点20了主站还在9点45」·单链化根治）：
        #   当日实测：云端主力 9 档 dispatch 全部 cancelled（同并发组新 dispatch 顶掉旧 run，
        #   「1 running + 1 pending」语义下 cancel-in-progress:false 也保不住），云端盘中从未
        #   真正执行，数据全靠 12 分钟超时后的 selfhosted 兜底续命 → 每档延迟 15-25 分钟（连续多日，
        #   正是主人「盘中更新很晚才刷出来」的慢性根因）。
        #   治本：盘中档**单链化**——cn runner 在线（单位机 7:45-17:45 覆盖全部盘中档）时直派
        #   selfhosted（中国 IP 直连中国源，不再绕道云端）；cn runner 离线才回落云端主力。
        #   每档只派一条链 + 守卫双链在途探测 ⇒ 同组互杀从结构上消失。
        if: steps.guard.outputs.go == 'true' && steps.check_cn_runner.outputs.online == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO="https://api.github.com/repos/ah-quant999/quant-scanner-v8"
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_cn.json -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$REPO/actions/workflows/v8_cn_fetch_cloud_selfhosted.yml/dispatches" \
            -d '{"ref":"main","inputs":{"category":"intraday"}}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ cn 主力 dispatch OK (204) → CN runner cn IP 直连中国源（单链化）"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ cn 主力 dispatch 失败 HTTP=$HTTP_CODE body=$(cat /tmp/dispatch_cn.json)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=v8-intraday-dispatch-fail::盘中档 cn 主力 dispatch 失败(HTTP=$HTTP_CODE)，本档数据可能缺失，请立即排查"
          fi

      - name: "☁️ cn runner 离线时回落云端主力 v8_cn_fetch_cloud（保底路径）"
        id: dispatch_cloud
        if: steps.guard.outputs.go == 'true' && steps.check_cn_runner.outputs.online != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO="https://api.github.com/repos/ah-quant999/quant-scanner-v8"
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_cloud.json -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$REPO/actions/workflows/v8_cn_fetch_cloud.yml/dispatches" \
            -d '{"ref":"main","inputs":{"category":"intraday"}}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ 云端回落 dispatch OK (204)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 云端回落 dispatch 失败 HTTP=$HTTP_CODE body=$(cat /tmp/dispatch_cloud.json)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=v8-intraday-dispatch-fail::盘中档云端回落 dispatch 失败(HTTP=$HTTP_CODE)，本档数据可能缺失"
          fi

      - name: "⏳ 实时轮询本档 run 状态（最多 12 分钟，每 30s 探测）"
        id: check_cn
        # 🔴 2026-11-20 单链化：轮询对象随 dispatch 目标（cn 主力 / 云端回落）。
        if: steps.dispatch_cn.outputs.ok == 'true' || steps.dispatch_cloud.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_WF: ${{ steps.dispatch_cn.outputs.ok == 'true' && 'v8_cn_fetch_cloud_selfhosted.yml' || 'v8_cn_fetch_cloud.yml' }}
        shell: bash
        run: |
          set +e
          echo "档期起点: $(TZ=Asia/Shanghai date '+%F %T') CST, 开始实时轮询 $CHAIN_WF ..."
          REPO="ah-quant999/quant-scanner-v8"
          DONE=0
          for i in $(seq 1 24); do
            sleep 30
            STATUS=$(curl -sS -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$CHAIN_WF/runs?per_page=3" \
              | python -c "
            import sys, json, datetime
            try:
                d = json.load(sys.stdin)
            except Exception:
                print('PARSE_FAIL')
                sys.exit(0)
            now = datetime.datetime.now(datetime.timezone.utc)
            for r in d.get('workflow_runs', []):
                c = r.get('created_at', '')
                if not c:
                    continue
                try:
                    ts = datetime.datetime.fromisoformat(c.replace('Z', '+00:00'))
                except Exception:
                    continue
                if (now - ts).total_seconds() / 60 < 30:
                    print(r.get('status'), r.get('conclusion'))
                    break
            else:
                print('NONE')
            " 2>/dev/null)
            echo "  轮询#$i: [$STATUS] @ $(TZ=Asia/Shanghai date '+%H:%M:%S')"
            case "$STATUS" in
              "completed success")
                echo "✅ 本档已完成 @ $(TZ=Asia/Shanghai date '+%F %T') CST"
                echo "run_status=success" >> "$GITHUB_OUTPUT"; DONE=1; break ;;
              completed\ *)
                echo "⚠️ 本档 run 终态异常: $STATUS"
                echo "run_status=$STATUS" >> "$GITHUB_OUTPUT"; DONE=1; break ;;
            esac
          done
          if [ "$DONE" = "0" ]; then
            # 🔴 2026-11-20 单链化：>12min 长跑不干预不告警——它就是本档唯一生产链，等它自然
            #    完成；守卫双链在途探测会让下一档自动避让，绝不再叠派顶掉（11-20 前「超时→
            #    派兜底→顶掉在跑 run」的老路径已删除）。
            echo "⏳ 轮询 12 分钟仍在跑 → 不干预，等它自然完成（下档守卫自动避让）"
            echo "run_status=still_running" >> "$GITHUB_OUTPUT"
          fi
          echo "档期检查点: $(TZ=Asia/Shanghai date '+%F %T') CST"

      - name: "📸 派发板块资金日内快照 v8_intraday_snapshot（独立组·零互杀）"
        id: snapshot_cn
        # 🔴 2026-11-20 10:45 小九：快照链自己的 10 分钟 schedule 也在「GitHub 日间失灵」家族
        #   （今日 09:52 后零 schedule run，全靠 cn_fetch 内 dispatcher 偶发续命），SECTOR_FUND_FLOW_INTRADAY
        #   卡 11-19 14:49（主力净额分时卡整日无增量）。快照写盘文件与抓取链不相交 + 独立并发组
        #   cancel-in-progress:true 幂等去重 ⇒ 每档顺手派发一次，无损安全，顺手把日间失灵兜住。
        if: steps.guard.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REPO="https://api.github.com/repos/ah-quant999/quant-scanner-v8"
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_snap.json -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$REPO/actions/workflows/v8_intraday_snapshot.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$HTTP_CODE" = "204" ]; then
            echo "✅ snapshot dispatch OK (204)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ snapshot dispatch 失败 HTTP=$HTTP_CODE body=$(cat /tmp/dispatch_snap.json)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "📝 档期状态汇总"
        if: always()
        shell: bash
        run: |
          {
            echo "## 盘中准点档·本档总结"
            echo "- 档期: \`$(TZ=Asia/Shanghai date '+%F %T')\` CST"
            echo "- 守卫: \`go=${{ steps.guard.outputs.go }}\`（false = 本档按设计跳过，非故障）"
            echo "- cn runner 在线: \`${{ steps.check_cn_runner.outputs.online }}\`"
            echo "- cn 主力 dispatch: \`${{ steps.dispatch_cn.outcome }}\`"
            echo "- 云端回落 dispatch: \`${{ steps.dispatch_cloud.outcome }}\`"
            echo "- 本档 run 轮询: \`${{ steps.check_cn.outputs.run_status }}\`"
            echo "- 快照 dispatch: \`${{ steps.snapshot_cn.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔴 2026-09-09 主人令「软失败但强制 ::error:: 告警」（对齐 09-08 消费层软失败策略）：
      #   本 yml 不写盘、只 dispatch，失败也不阻断——但必须显式 annotation 让主人一眼可见
      - name: "📢 软失败汇总告警（不阻断 job，但强制 annotation）"
        if: always()
        shell: bash
        env:
          V8_DISPATCH_CN: ${{ steps.dispatch_cn.outcome }}
          V8_DISPATCH_CLOUD: ${{ steps.dispatch_cloud.outcome }}
          V8_CHECK_CN: ${{ steps.check_cn.outcome }}
          V8_SNAPSHOT_CN: ${{ steps.snapshot_cn.outcome }}
        run: |
          FAILED=""
          for sid in dispatch_cn dispatch_cloud check_cn snapshot_cn; do
            eval "v=\"\${V8_${sid^^}:-}\""
            if [ "$v" = "failure" ] || [ "$v" = "cancelled" ]; then
              FAILED="$FAILED $sid"
            fi
          done
          if [ -n "$FAILED" ]; then
            N=$(echo $FAILED | wc -w)
            echo "::error title=v8-intraday-slot-softfail::盘中准点档调度器软失败步（不阻断 job，但本档数据可能未刷新，请检查）：$FAILED"
            {
              echo "## ⚠️ 本档软失败 ${N} 项"
              echo ""
              echo "盘中准点档调度器失败步："
              echo ""
              for s in $FAILED; do echo "- \`$s\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ 本档无软失败"
          fi
