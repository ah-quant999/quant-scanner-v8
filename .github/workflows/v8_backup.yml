# 九宝量化 v8 — 每日自动备份 (23:00 CST)
# cron: 0 15 * * * (= 23:00 CST)。主人 23 点睡前核对当天 raw_data 健康度。
# raw_data 由 git 历史 + Pages 回溯只是兜底，主动备份更稳。
#
# 📦 v6 备份保留策略（2026-08-07 主人令）：v6 历史备份（九宝量化v6.0_*.tar.gz /
#   shared/九宝量化v6.0_*）在 v8 连续稳定运行满一周、且主人明确确认前，禁止任何清理/
#   备份任务删除；删除前必须征求主人同意（下周末再确认）。v6 备份位于本地，云端清理
#   不触及，本 workflow 仅做策略断言 + 落 HANDOVER_LOG，防误改。
#
# 本 workflow 不只备份，还承担【每日审计】职责（主人 2026-08-06 确立）：
#   ① 与单位机小九交接：检查当天 HANDOVER_小九_YYYY-MM-DD.md 是否存在
#   ② 当天修改审核通过防覆盖：拉今天 origin/main 全部人工 commit，关键词必须在交接文档中命中
#   ③ 运维页/逻辑详解页对齐：align_logic_ops.py
#   ④ 卡片徽章统一：verify_card_badges.py
# 漂移均不阻断备份（continue-on-error），仅告警 + 落 HANDOVER_LOG.jsonl。

name: "☁️ v8 每日自动备份 (23:00)"

on:
  schedule:
    - cron: '0 15 * * *'    # 23:00 CST — 每天
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-cloud-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 备份 raw_data 关键文件
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p backup
          tar -czf "backup/raw_data_backup_$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M').tar.gz" \
            raw_data/*.json 2>/dev/null
          echo "✅ raw_data 关键文件已备份"

      - name: "🛡️ 推送当天所有修改（防覆盖安全网）"
        continue-on-error: true
        run: |
          git config user.name "v8-backup-bot" 2>/dev/null || true
          git config user.email "bot@quant-scanner.local" 2>/dev/null || true
          # 仅提交「已跟踪文件的改动 + 当天备份包」，不扫入未跟踪的实验残留
          git add -u
          git add backup/raw_data_backup_*.tar.gz 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(v8): 每日安全网推送当天修改 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" 2>/dev/null || true
            # 🛡 并发 push 互踩加固（对齐 v8_risk_gauge 范本）
            for i in 1 2 3; do
              if git push origin HEAD:main; then
                echo "✅ 当天修改已推送入库（防覆盖）"; break
              fi
              echo "⚠️ push 被拒，fetch+rebase 后重试 ($i/3)"
              git fetch origin main && git rebase FETCH_HEAD || { git rebase --abort || true; break; }
            done
          else
            echo "无待推送修改"
          fi

      - name: 提交备份到 main
        continue-on-error: true
        run: |
          git add backup/raw_data_backup_*.tar.gz 2>/dev/null || true
          git commit -m "backup: v8 每日自动备份 $(TZ=Asia/Shanghai date '+%Y-%m-%d')" 2>/dev/null || echo "无新备份"
          # 🛡 并发 push 互踩加固
          for i in 1 2 3; do
            if git push origin HEAD:main 2>/dev/null; then echo "✅ 备份已推送"; break; fi
            echo "⚠️ 推送被拒或无新内容，fetch+rebase 后重试 ($i/3)"
            git fetch origin main && git rebase FETCH_HEAD || { git rebase --abort || true; break; }
          done

      - name: "📦 v6 备份保留策略断言（主人令：v8 稳定一周前不删）"
        continue-on-error: true
        run: |
          echo "── v6 备份保留策略（2026-08-07 主人令）──"
          echo "v6 历史备份（九宝量化v6.0_*.tar.gz / shared/九宝量化v6.0_*）保留中："
          echo "  · v8 连续稳定运行满一周且主人确认前，禁止任何清理任务删除 v6 备份；"
          echo "  · 删除前必须征求主人同意（下周末再确认）。"
          python3 - <<'PY'
          import os, json
          # 防御性断言：确保仓库内不会出现被 weekly_cleanup 误判的 v6/旧备份残留
          suspicious = [f for f in os.listdir('.') if f.startswith('九宝量化v6') or f.startswith('backup_2026')]
          if suspicious:
              print("⚠️ 检测到仓库内疑似 v6/旧备份残留：", suspicious, "— 请人工确认非误入")
          else:
              print("✅ 仓库内无 v6/旧备份残留（v6 备份在本地，云端清理不触及，策略仅做断言）")
          rec = {"time":"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')","mode":"v6_retention_guard",
                 "policy":"keep_until_v8_stable_1week_and_owner_confirms","local_v6_backups_preserved":True}
          try:
              with open("HANDOVER_LOG.jsonl","a",encoding="utf-8") as fh:
                  fh.write(json.dumps(rec, ensure_ascii=False)+"\n")
          except Exception as e:
              print("写日志跳过:", e)
          PY

      - name: "🎯 v8 每日审计（与小九交接 + 防覆盖 + 运维页对齐 + 卡片徽章）"
        continue-on-error: true
        run: |
          echo "── ① 与单位机小九交接 + 当天修改审核通过防覆盖 ──"
          python3 verify_daily_audit.py || echo "⚠️ 每日审计发现漂移（见上方输出），已记录至 HANDOVER_LOG，不影响备份完成"
          echo ""
          echo "── ② 运维页/逻辑详解页 与 workflow 调度对齐校验 ──"
          python3 align_logic_ops.py || echo "⚠️ 运维页/逻辑详解页对齐发现漂移（见上方输出），已记录至 HANDOVER_LOG，不影响备份完成"
          echo ""
          echo "── ③ 全站「更新于」卡片徽章统一校验 ──"
          python3 verify_card_badges.py || echo "⚠️ 卡片徽章校验发现漂移（见上方输出），已记录至 HANDOVER_LOG，不影响备份完成"

      - name: "📝 写日志"
        run: |
          echo "{\"time\":\"$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')\",\"mode\":\"v8_cloud_backup\",\"host\":\"GitHubActions\",\"success\":true}" >> HANDOVER_LOG.jsonl
          echo "✅ 备份完成"