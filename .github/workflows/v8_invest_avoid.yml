name: "🛡️ 投资避雷针 consolidate (cloud)"
# 🔴 2026-11-04 一劳永逸根治：原 INVEST_AVOID 由 v8_morning_plan.yml 在 [self-hosted, cn] 跑，
#   该 cn 自托管机自 2026-11-02 起宕机 ⇒ 投资避雷针卡冻在 11-02 15:16。
#   gen_invest_avoid.py 纯读本地 data/*.js、不抓网、仅 stdlib，完全可在 GitHub 托管 ubuntu-latest 跑
#   （与 v8_algo_cloud 同款根治：把 cn 单点故障移出关键数据链）。
#   拆出独立云端工作流 ⇒ 与 cn 解耦，卡体每日可靠刷新。
#   上游 6 源（DAJIJIN/SUSPENSION/MARKET_REGIME/RISK_GAUGE/MACRO_BRIEF/MARKET_ALERTS）
#   仍由 cn_fetch 产出；若 cn 宕机导致某源滞后，本卡会如实标注各源 update_time（绝不伪造）。
on:
  schedule:
    - cron: '55 23 * * *'   # 北京 07:55 每日（UTC 前一日 23:55；盘前微调档）
    # 🔴 2026-11-18 一劳永逸修复（主人令「更新时间不对」）：卡面徽章标「盘后」但数据停在盘中 13:41
    #   —— 07:55 档被 GitHub 调度静默漂移到 13:41 才跑（盘中），与「盘后微调」口径矛盾。
    #   根因级修法：补收盘定稿档（北京 15:35，收盘后微调），收盘价/停牌/ST/公告当日口径齐了再 consolidate；
    #   前端徽章同步改 auto（按真实 update_time 自动归类盘前/盘中/盘后，不再硬编码）。
    - cron: '35 7 * * 1-5'  # 北京 15:35 交易日盘后定稿（UTC 07:35）
  # 🔴 2026-11-19 一劳永造根治（主人令「盘后没和其他今日事件一起更新」）：
  #   GitHub schedule 本仓实证大面积漂移/哒火（07:55 档漂到 12:59、15:35 盘后档当日未触发）： cron 不能作盘后必跑唯一保证。
  #   改用 workflow_run：上游 cn 数据抓取任一链 completed 即触发 consolidate（六源刷新完紧跟重算），盘后 cn_fetch 完成→本卡盘后自动定稿。
  #   原 schedule 保留作冗余兜底；workflow_dispatch 保留供人工补跑。
  workflow_run:
    workflows:
      - "🇨🇳 v8 中国数据抓取(云端)"
      - "🇨🇳 v8 中国数据抓取(云端·CN runner1号机应急)"
      - "🇨🇳 v8 中国数据抓取(云端·hosted兜底)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-invest-avoid
  cancel-in-progress: false

jobs:
  invest-avoid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: "🧭 跑 gen_invest_avoid.py（产出 data/INVEST_AVOID.js）"
        run: python v8/gen_invest_avoid.py
      - name: "📤 推送 data/INVEST_AVOID.js（变化才推）"
        run: |
          git config user.name "v8-bot"
          git config user.email "bot@quant-scanner-v8.local"
          if git diff --quiet data/INVEST_AVOID.js; then
            echo "INVEST_AVOID 内容无变化，跳过推送"
          else
            git add data/INVEST_AVOID.js
            git commit -m "v8 invest_avoid: cloud consolidate $(date +'%Y-%m-%d %H:%M')"
            git fetch origin main
            git rebase origin/main || true
            git push || echo "push 被其他链抢先（数据已更新），跳过"
          fi
